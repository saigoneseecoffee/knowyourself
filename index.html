ip":"Giao việc chăm sóc khách quen, xử lý khách không hài lòng, kèm người mới, hoặc giữ tinh thần nhóm sau ca khó."},"CL":{"hi":"Bạn phân tích tốt, nhìn xa và hay nghĩ ra cách làm tốt hơn. Rủi ro: nghĩ nhiều mà làm chậm, hoặc chê ý tưởng trước khi thử.","lo":"Bạn ít dành thời gian phân tích hay lên kế hoạch dài, thường tập trung vào việc trước mắt.","tip":"Giao việc xem số liệu bán hàng, đề xuất cải tiến quy trình, lên kế hoạch khuyến mãi, hoặc góp ý món theo mùa."}}},"en":{"how":"Your highest domain shows the way you most naturally add value; a low score is not a weakness, just a way you use less. Use it to match tasks to strengths and pair people who complement each other.","dims":{"TT":{"hi":"You work hard, on time and to standard, and people can count on you. Risk: taking on too much, or focusing on finishing without asking if it is needed.","lo":"You rely less on getting tasks done yourself and tend to add value through people or ideas.","tip":"Give them prep, opening/closing, inventory, and keeping ticket times on track during rushes."},"AH":{"hi":"You are confident, persuasive, and get others on board. Risk: talking over quieter people or pushing guests too hard.","lo":"You rarely step up to persuade or lead and tend to let others speak first.","tip":"Give them introducing new items, suggesting add-ons to guests, filming social media videos, or running the pre-shift huddle."},"QH":{"hi":"You read people's feelings, build trust, and hold the team together. Risk: carrying others' emotions and avoiding hard conversations.","lo":"You focus less on building relationships and tend to add value through tasks or ideas.","tip":"Give them regulars, unhappy guests, mentoring new hires, or lifting team spirit after a tough shift."},"CL":{"hi":"You analyze well, look ahead, and think of better ways to do things. Risk: overthinking and acting slowly, or dismissing ideas before trying them.","lo":"You spend less time on analysis or long-term plans and tend to focus on what is in front of you.","tip":"Give them sales numbers to review, process improvements, promo planning, or input on seasonal items."}}}},"via":{"vi":{"how":"Nhóm phẩm chất có điểm cao nhất là thế mạnh tự nhiên của bạn. Hãy tìm cách dùng nó mỗi ca làm; điểm thấp không phải điểm yếu, chỉ là phẩm chất bạn ít dùng hơn.","dims":{"TR":{"hi":"Bạn tò mò, học nhanh và hay nghĩ ra cách làm tốt hơn; đồng nghiệp hay hỏi ý bạn. Rủi ro: nghĩ nhiều, góp ý dài khi ca đang bận.","lo":"Bạn thích làm theo cách đã quen và ít khi tự đi tìm cái mới để học.","tip":"Mỗi tuần học một điều mới về món hoặc đồ uống (một loại hạt cà phê, một công thức) và chia sẻ ngắn với nhóm."},"DG":{"hi":"Bạn dám nói thẳng khi thấy sai và theo việc khó đến cùng. Rủi ro: nói quá thẳng, làm người khác thấy bị chê.","lo":"Bạn thường chọn im lặng hoặc nhường người khác lên tiếng khi có chuyện khó.","tip":"Lần tới thấy một việc chưa ổn (vệ sinh, quy trình), hãy nói với quản lý ca kèm một gợi ý sửa cụ thể."},"NA":{"hi":"Bạn tử tế, quan tâm khách và đồng nghiệp, tạo không khí ấm áp. Rủi ro: ôm việc giúp người khác đến mức kiệt sức.","lo":"Bạn tập trung vào công việc nhiều hơn là chăm chút quan hệ với mọi người.","tip":"Mỗi ca, chủ động hỏi thăm một đồng nghiệp hoặc nhớ tên, món quen của một khách quen."},"CB":{"hi":"Bạn công bằng, giữ lời và là người nhóm tin cậy. Rủi ro: khó chịu khi quy tắc bị linh động, dù có lý do chính đáng.","lo":"Bạn ít để ý đến chuyện chia việc, chia công có đều hay không.","tip":"Khi chia việc dọn dẹp hay nhận tip chung, hãy đề xuất một cách chia rõ ràng để cả nhóm cùng thấy hợp lý."},"TĐ":{"hi":"Bạn bình tĩnh, biết tha thứ và kiểm soát được bản thân, ít khi bốc đồng. Rủi ro: quá dè dặt, chậm ra quyết định khi cần nhanh.","lo":"Bạn phản ứng nhanh theo cảm xúc và đôi khi làm trước nghĩ sau.","tip":"Khi bực với khách hoặc đồng nghiệp, hít sâu ba hơi và đếm đến năm trước khi trả lời."},"SV":{"hi":"Bạn biết ơn, lạc quan và thấy ý nghĩa trong việc phục vụ, giúp cả nhóm có tinh thần. Rủi ro: dễ bỏ qua vấn đề thật vì muốn nhìn mặt tích cực.","lo":"Bạn nhìn công việc thực tế, chủ yếu là việc cần làm hơn là ý nghĩa đằng sau.","tip":"Cuối mỗi ca, ghi lại một khoảnh khắc tốt (một khách cảm ơn, một ly làm đẹp) để thấy giá trị việc mình làm."}}},"en":{"how":"Your highest group is your natural strength. Look for ways to use it every shift; a low score is not a weakness, just a strength you use less often.","dims":{"TR":{"hi":"You are curious, learn fast and spot better ways of doing things; coworkers ask your opinion. Risk: overthinking or giving long input when the shift is busy.","lo":"You prefer familiar ways of working and rarely go looking for new things to learn.","tip":"Learn one new thing about the menu each week (a coffee bean, a recipe) and share it briefly with the team."},"DG":{"hi":"You speak up when something is wrong and see hard tasks through. Risk: being so blunt that others feel criticized.","lo":"You usually stay quiet or let others speak up when things get difficult.","tip":"Next time something isn't right (cleanliness, a process), tell the shift lead along with one concrete fix."},"NA":{"hi":"You are kind, care about guests and coworkers, and create a warm vibe. Risk: taking on so much for others that you burn out.","lo":"You focus more on the work itself than on building relationships.","tip":"Each shift, check in with one coworker, or remember a regular's name and usual order."},"CB":{"hi":"You are fair, keep your word, and the team trusts you. Risk: getting frustrated when rules bend, even for good reasons.","lo":"You pay less attention to whether work and credit are shared evenly.","tip":"When splitting closing duties or shared tips, suggest a clear system so everyone sees it as fair."},"TĐ":{"hi":"You are calm, forgiving and self-controlled, rarely impulsive. Risk: being too cautious and slow to decide when speed matters.","lo":"You react quickly on feeling and sometimes act before thinking.","tip":"When a guest or coworker annoys you, take three deep breaths and count to five before you answer."},"SV":{"hi":"You are grateful, optimistic and find meaning in serving people, which lifts team spirit. Risk: glossing over real problems to stay positive.","lo":"You see work practically, mostly as tasks to get done rather than something with deeper meaning.","tip":"At the end of each shift, note one good moment (a guest's thanks, a drink you nailed) to see the value of your work."}}}},"eq":{"vi":{"how":"Mỗi kỹ năng cho biết bạn đang dùng cảm xúc tốt đến đâu khi làm việc với khách và đồng nghiệp. EQ luyện được, nên hãy chọn kỹ năng thấp nhất để tập trước.","dims":{"SA":{"hi":"Bạn biết rõ mình đang vui, mệt hay căng thẳng và vì sao, nên ít bị cảm xúc dắt đi. Rủi ro: hiểu mình nhưng chưa chắc đã nói ra hay xử lý.","lo":"Bạn thường chỉ nhận ra cảm xúc của mình sau khi nó đã ảnh hưởng đến việc làm.","tip":"Giữa ca, tự hỏi nhanh: \"Mình đang cảm thấy gì, mức 1 đến 10?\" và đặt tên cho cảm xúc đó."},"SM":{"hi":"Bạn giữ bình tĩnh khi quán đông hay khách khó tính, làm việc đều tay. Rủi ro: nén cảm xúc quá lâu rồi mệt mỏi.","lo":"Khi áp lực, cảm xúc của bạn dễ lộ ra qua lời nói hoặc cách làm việc.","tip":"Chọn một câu \"nút dừng\" như \"Để em kiểm tra lại cho anh/chị\" để có vài giây bình tĩnh trước khi xử lý."},"SO":{"hi":"Bạn đọc được tâm trạng khách và đồng nghiệp qua nét mặt, giọng nói. Rủi ro: để tâm trạng người khác ảnh hưởng mình quá nhiều.","lo":"Bạn tập trung vào việc trước mắt và đôi khi không để ý người khác đang khó chịu hay vội.","tip":"Khi khách bước vào, quan sát ba giây: họ đang vội, đang thư giãn hay đang bực? Rồi điều chỉnh cách chào."},"RM":{"hi":"Bạn góp ý khéo, hòa giải tốt và giúp nhóm làm việc ăn ý. Rủi ro: né va chạm, ngại nói điều khó nghe.","lo":"Bạn thấy khó khi phải góp ý hoặc gỡ rối mâu thuẫn trong nhóm.","tip":"Khi góp ý, dùng công thức: khen một điều cụ thể, nêu một điều cần sửa, rồi cùng đề xuất cách làm."}}},"en":{"how":"Each skill shows how well you use emotions when working with guests and coworkers. EQ can be trained, so start practicing your lowest skill first.","dims":{"SA":{"hi":"You know when you're happy, tired or stressed and why, so emotions rarely steer you. Risk: understanding yourself but not acting on it or saying it.","lo":"You tend to notice your feelings only after they have already affected your work.","tip":"Mid-shift, ask yourself: \"What am I feeling, 1 to 10?\" and give the feeling a name."},"SM":{"hi":"You stay calm during rushes and with difficult guests, and keep a steady pace. Risk: holding feelings in too long and wearing yourself out.","lo":"Under pressure, your feelings tend to show in your words or the way you work.","tip":"Pick a \"pause line\" like \"Let me double-check that for you\" to buy a few calm seconds before you respond."},"SO":{"hi":"You read guests' and coworkers' moods from faces and tone. Risk: letting other people's moods affect you too much.","lo":"You focus on the task in front of you and sometimes miss that someone is upset or in a hurry.","tip":"When a guest walks in, watch for three seconds: rushed, relaxed or annoyed? Then adjust your greeting."},"RM":{"hi":"You give feedback tactfully, smooth over conflicts and help the team click. Risk: avoiding conflict and holding back hard truths.","lo":"Giving feedback or sorting out team conflicts feels hard for you.","tip":"When giving feedback: praise one specific thing, name one thing to fix, then agree on how to do it together."}}}},"grit":{"vi":{"how":"Grit gồm đam mê bền (giữ một hướng lâu dài) và kiên trì (không bỏ cuộc khi khó). Điểm này giúp biết bạn hợp với việc cần gắn bó lâu, như học pha chế hay lên vị trí quản lý.","dims":{"PA":{"hi":"Bạn giữ một mục tiêu lâu dài và không dễ đổi hướng, như theo nghề pha chế nhiều năm. Rủi ro: bám mục tiêu cũ dù hoàn cảnh đã đổi.","lo":"Bạn thích thử nhiều thứ và hứng thú dễ chuyển sang điều mới.","tip":"Viết ra một mục tiêu 6 tháng ở quán (ví dụ: làm được latte art, lên trưởng ca) và xem lại mỗi tháng."},"PE":{"hi":"Bạn không bỏ cuộc khi gặp khó, làm việc đến xong dù ca dài hay việc lặp lại. Rủi ro: cố quá sức, ngại xin giúp.","lo":"Khi việc khó hoặc kéo dài, bạn dễ nản và muốn chuyển sang việc khác.","tip":"Chia việc khó thành bước nhỏ (ví dụ học 5 món mỗi tuần) và đánh dấu từng bước đã xong."}}},"en":{"how":"Grit combines lasting passion (keeping one direction long-term) and perseverance (not quitting when it's hard). It shows how well you fit work that takes time, like mastering the bar or growing into a lead role.","dims":{"PA":{"hi":"You keep one long-term goal and don't switch easily, like building a barista career over years. Risk: holding on to an old goal after things change.","lo":"You like trying many things, and your interest moves easily to something new.","tip":"Write down one 6-month goal at the café (e.g. pour latte art, become shift lead) and review it every month."},"PE":{"hi":"You don't give up when things get hard and finish the job, even on long shifts or repetitive tasks. Risk: pushing too hard and not asking for help.","lo":"When a task is hard or drags on, you lose steam and want to move on.","tip":"Break hard tasks into small steps (e.g. learn 5 drinks a week) and check off each one as you go."}}}},"appr":{"vi":{"how":"Điểm cao nhất là cách bạn thấy mình được trân trọng nhất (theo mô hình của Chapman và White). Quản lý nên ghi nhận bạn bằng 1–2 ngôn ngữ cao nhất, vì cách khác có thể không chạm tới bạn.","dims":{"LK":{"hi":"Bạn thấy được trân trọng nhất qua lời khen cụ thể và lời cảm ơn. Rủi ro: dễ nản khi làm tốt mà không ai nói gì.","lo":"Lời khen với bạn là dễ chịu, nhưng không phải điều làm bạn thấy được ghi nhận nhất.","tip":"Khen đích danh trong group chat của quán: \"Cảm ơn An đã xử lý khéo bàn khách khó tối qua\". Nói rõ việc gì, đừng chỉ \"giỏi lắm\"."},"TG":{"hi":"Bạn thấy được trân trọng khi quản lý dành thời gian riêng, lắng nghe và hỏi ý bạn. Rủi ro: thấy bị bỏ rơi khi quản lý quá bận.","lo":"Bạn không cần nhiều thời gian riêng với quản lý để thấy mình được coi trọng.","tip":"Hẹn 10 phút cà phê riêng sau ca, hỏi bạn ấy nghĩ gì về menu hay quy trình, và thật sự lắng nghe."},"GD":{"hi":"Bạn thấy được trân trọng khi có người xắn tay phụ lúc bận. Rủi ro: thấy khó chịu khi người khác chỉ nói mà không làm.","lo":"Bạn quen tự xoay xở và không coi việc được phụ giúp là cách ghi nhận chính.","tip":"Giờ cao điểm, vào quầy rửa ly hay ra món cùng bạn ấy, hoặc nhận đổi ca giúp khi bạn ấy có việc riêng."},"QU":{"hi":"Bạn thấy được trân trọng qua món quà nhỏ hiểu ý mình. Điều quan trọng là sự chu đáo, không phải giá trị món quà.","lo":"Quà cáp không phải điều làm bạn thấy mình được ghi nhận nhất.","tip":"Tặng ly đồ uống bạn ấy thích nhất sau ca dài, hoặc một phiếu quà nhỏ kèm vài chữ cảm ơn viết tay."},"TX":{"hi":"Bạn thấy được trân trọng qua cử chỉ thân thiện như đập tay, vỗ vai và không khí vui. Rủi ro: thấy xa cách ở nơi làm việc quá nghiêm.","lo":"Bạn thích giữ khoảng cách và không cần cử chỉ thân thiện để thấy được ghi nhận.","tip":"Đập tay hay giơ ngón cái khi bạn ấy xử lý xong lượt khách đông. Chỉ dùng cử chỉ bạn ấy thoải mái, luôn tôn trọng ranh giới."}}},"en":{"how":"Your highest score is how you feel most appreciated (based on Chapman and White's model). A manager should recognize you in your top 1–2 languages, since other ways may not land.","dims":{"LK":{"hi":"You feel most valued through specific praise and thanks. Risk: losing motivation when good work goes unmentioned.","lo":"Praise is nice for you, but it is not what makes you feel most recognized.","tip":"Praise them by name in the team group chat: \"Thanks An for handling that tough table so well last night.\" Say what they did, not just \"good job\"."},"TG":{"hi":"You feel valued when your manager gives you one-on-one time, listens and asks your opinion. Risk: feeling ignored when the manager is too busy.","lo":"You don't need much one-on-one time with your manager to feel valued.","tip":"Set up a 10-minute coffee chat after their shift, ask what they think about the menu or a process, and really listen."},"GD":{"hi":"You feel valued when someone rolls up their sleeves and helps during a rush. Risk: getting frustrated by people who talk but don't pitch in.","lo":"You are used to handling things yourself and don't see help as the main form of recognition.","tip":"During a rush, jump in to wash cups or run food with them, or cover their shift when they have something personal."},"QU":{"hi":"You feel valued through a small gift that shows someone knows you. It's the thought that counts, not the price.","lo":"Gifts are not what makes you feel most recognized.","tip":"Give them their favorite drink on the house after a long shift, or a small gift card with a handwritten thank-you."},"TX":{"hi":"You feel valued through friendly gestures like high-fives, a pat on the back and a fun vibe. Risk: feeling distant in a very formal workplace.","lo":"You prefer some personal space and don't need friendly gestures to feel recognized.","tip":"High-five or give a thumbs-up after they get through a big rush. Only use gestures they are comfortable with, and always respect boundaries."}}}},"riasec":{"vi":{"how":"Ba chữ có điểm cao nhất, xếp từ mạnh nhất, là mã Holland của bạn (ví dụ SEA: Xã hội, Kinh doanh, Nghệ thuật). Chữ đầu nói nhiều nhất về việc bạn thích; dùng mã này để chọn vị trí hợp trong quán.","dims":{"R":{"hi":"Bạn thích làm bằng tay, với máy móc và dụng cụ, thấy kết quả cụ thể. Rủi ro: thấy chán với việc giấy tờ hoặc nói chuyện nhiều.","lo":"Bạn ít hứng thú với việc tay chân, máy móc hơn là các loại việc khác.","tip":"Hợp: bếp, pha chế, vận hành và vệ sinh máy espresso, bảo trì thiết bị, chuẩn bị nguyên liệu."},"I":{"hi":"Bạn thích tìm hiểu vì sao, phân tích và thử nghiệm. Rủi ro: mải tìm hiểu mà chậm việc khi quán đông.","lo":"Bạn thích làm ngay hơn là ngồi phân tích hay nghiên cứu.","tip":"Hợp: thử và chuẩn hóa công thức, kiểm soát chất lượng, theo dõi số liệu bán hàng, tìm nguồn nguyên liệu."},"A":{"hi":"Bạn thích sáng tạo, trình bày đẹp và có cá tính riêng. Rủi ro: thấy gò bó với công thức và quy trình cố định.","lo":"Bạn thoải mái làm theo cách có sẵn hơn là tự sáng tạo cái mới.","tip":"Hợp: sáng tạo món mới, latte art, trình bày món, trang trí quầy, chụp ảnh và làm nội dung mạng xã hội."},"S":{"hi":"Bạn thích phục vụ, giúp đỡ và hướng dẫn người khác. Rủi ro: khó từ chối, dễ mệt vì lo cho mọi người.","lo":"Bạn thích tập trung vào việc của mình hơn là giao tiếp với khách liên tục.","tip":"Hợp: phục vụ bàn, đón khách, chăm sóc khách quen, đào tạo nhân viên mới."},"E":{"hi":"Bạn thích thuyết phục, dẫn dắt và đạt mục tiêu bán hàng. Rủi ro: muốn làm nhanh mà bỏ qua chi tiết hoặc ý kiến người khác.","lo":"Bạn ít thích việc bán hàng, thuyết phục hay dẫn dắt người khác.","tip":"Hợp: trưởng ca, gợi ý món và bán thêm, tổ chức sự kiện, làm việc với đối tác giao hàng."},"C":{"hi":"Bạn thích trật tự, con số rõ ràng và làm đúng quy trình. Rủi ro: lúng túng khi phải xoay xở việc bất ngờ.","lo":"Bạn thấy bó buộc với việc sổ sách, số liệu và quy trình chi tiết.","tip":"Hợp: thu ngân, kiểm kho và đặt hàng, đối soát doanh thu cuối ngày, lập lịch ca, giữ checklist mở và đóng quán."}}},"en":{"how":"Your three highest letters, strongest first, form your Holland code (e.g. SEA: Social, Enterprising, Artistic). The first letter says the most about what you enjoy; use the code to find roles that fit at the café.","dims":{"R":{"hi":"You like hands-on work with tools and machines and seeing concrete results. Risk: getting bored with paperwork or lots of talking.","lo":"Hands-on and mechanical work interests you less than other kinds of work.","tip":"Fits: kitchen, bar, running and cleaning the espresso machine, equipment upkeep, prep work."},"I":{"hi":"You like figuring out why, analyzing and experimenting. Risk: digging into details and slowing down during a rush.","lo":"You prefer jumping in to analyzing or researching.","tip":"Fits: testing and standardizing recipes, quality control, tracking sales numbers, sourcing ingredients."},"A":{"hi":"You like creating, presenting things beautifully and adding your own style. Risk: feeling boxed in by fixed recipes and routines.","lo":"You are comfortable following set ways rather than creating something new.","tip":"Fits: new menu items, latte art, plating, counter decor, photos and social media content."},"S":{"hi":"You like serving, helping and teaching others. Risk: finding it hard to say no and getting worn out caring for everyone.","lo":"You prefer focusing on your own tasks over constant guest interaction.","tip":"Fits: serving tables, greeting guests, looking after regulars, training new staff."},"E":{"hi":"You like persuading, leading and hitting sales goals. Risk: moving fast and skipping details or others' input.","lo":"Selling, persuading or leading others appeals to you less.","tip":"Fits: shift lead, recommending and upselling items, running events, working with delivery partners."},"C":{"hi":"You like order, clear numbers and following the process. Risk: feeling thrown when things change unexpectedly.","lo":"Bookkeeping, numbers and detailed procedures feel confining to you.","tip":"Fits: cashier, inventory and ordering, end-of-day cash reconciliation, shift scheduling, opening and closing checklists."}}}},"motiv":{"vi":{"how":"Chiều cao nhất là động lực chính của bạn; đa số người là kết hợp của hai chiều. Khi cần thuyết phục ai, hãy nói theo động lực của họ, không phải của bạn.","dims":{"AC":{"hi":"Bạn có động lực khi tự đặt mục tiêu và thấy việc xong tốt. Rủi ro: sốt ruột khi người khác chậm, khó giao việc.","lo":"Bạn ít bị thúc đẩy bởi thử thách cá nhân; điều khác quan trọng với bạn hơn.","tip":"Với người này: giao mục tiêu rõ, để họ tự chọn cách làm, cho họ thấy kết quả bằng con số."},"AF":{"hi":"Bạn cần không khí thân thiện và quan hệ tốt; bạn kết nối cả nhóm. Rủi ro: né góp ý thẳng để giữ hòa khí.","lo":"Bạn làm tốt một mình và không cần nhiều giao lưu ở chỗ làm.","tip":"Với người này: hỏi thăm trước khi vào việc, góp ý riêng và nhẹ nhàng, cho làm việc theo cặp hoặc nhóm."},"SE":{"hi":"Bạn cần sự ổn định và rõ ràng; bạn làm chắc tay, ít sai sót. Rủi ro: ngại thay đổi, dễ chạnh lòng khi bị phê bình.","lo":"Bạn khá tự tin, chịu được thay đổi và góp ý.","tip":"Với người này: báo trước thay đổi, chia việc thành bước nhỏ, khen kỹ năng của họ và góp ý riêng."},"IN":{"hi":"Bạn thích dẫn dắt, được nể trọng và thuyết phục người khác. Rủi ro: lấn át người khác, quá coi trọng vị thế.","lo":"Bạn không cần đứng đầu hay nổi bật để thấy có động lực.","tip":"Với người này: giao vai trò trưởng ca hoặc phụ trách, cho trình bày ý tưởng, ghi công trước nhóm."}}},"en":{"how":"Your highest area is your main motivation; most people are a mix of two. When you need to persuade someone, speak to their motivation, not yours.","dims":{"AC":{"hi":"You are driven by setting your own goals and seeing work done well. Risk: impatience when others are slow, trouble delegating.","lo":"Personal challenge is not your main driver; other things matter more to you.","tip":"With this person: give clear goals, let them choose how, and show results in numbers."},"AF":{"hi":"You need a friendly atmosphere and good relationships; you bring the team together. Risk: avoiding direct feedback to keep the peace.","lo":"You work well on your own and don't need much socializing at work.","tip":"With this person: check in before getting to work, give feedback privately and gently, pair them with others."},"SE":{"hi":"You need stability and clear expectations; you are careful and make few mistakes. Risk: resisting change, taking criticism hard.","lo":"You are fairly confident and handle change and feedback well.","tip":"With this person: announce changes early, break work into small steps, praise their skills and give feedback privately."},"IN":{"hi":"You like to lead, be respected and persuade others. Risk: talking over others, caring too much about status.","lo":"You don't need to lead or stand out to feel motivated.","tip":"With this person: give a shift-lead or ownership role, let them present ideas, credit them in front of the team."}}}},"frazzle":{"vi":{"how":"Cộng hai phần để có tổng điểm. 0–9: rất thoải mái. 10–29: bình thường, thỉnh thoảng giận nhưng thường có lý do. 30–39: cờ vàng, căng thẳng và nóng giận đang cao. 40–48: cờ đỏ, nên tìm người tư vấn hoặc người đáng tin để nói chuyện sớm. Đây là bài tự đánh giá để tham khảo, không phải chẩn đoán.","dims":{"ST":{"hi":"Bạn đang chịu nhiều áp lực từ môi trường: quyết định gấp, ít được hỏi ý kiến, lương, cấp trên hoặc giấy tờ.","lo":"Môi trường hiện tại không gây nhiều áp lực cho bạn.","tip":"Ghi ra 1–2 nguồn áp lực lớn nhất và nói chuyện với quản lý về điều có thể thay đổi được."},"AN":{"hi":"Khi bực, bạn dễ phản ứng ra ngoài: nói thẳng, mắng lại hoặc mất bình tĩnh.","lo":"Bạn giữ được bình tĩnh và ít khi phản ứng gay gắt.","tip":"Khi thấy nóng lên, tạm rời quầy vài phút, hít thở rồi mới nói; góp ý lỗi của người khác ở chỗ riêng."}}},"en":{"how":"Add both parts for your total. 0–9: very relaxed. 10–29: normal, you get angry sometimes but usually for a reason. 30–39: yellow flag, stress and anger are running high. 40–48: red flag, talk to a counselor or someone you trust soon. This is a self-check for reflection, not a diagnosis.","dims":{"ST":{"hi":"You are under a lot of pressure from your environment: quick decisions, not being asked, pay, bosses or paperwork.","lo":"Your current environment is not putting much pressure on you.","tip":"Write down your 1–2 biggest sources of pressure and talk with your manager about what can change."},"AN":{"hi":"When upset, you tend to react outwardly: speaking sharply, telling people off or losing your temper.","lo":"You stay calm and rarely react harshly.","tip":"When you feel heated, step away for a few minutes and breathe before speaking; point out others' mistakes in private."}}}}};

ổi.","S"],["Tôi kiên nhẫn và biết lắng nghe.","S"],["Tôi giúp đồng đội một cách lặng lẽ.","S"],["Tôi cần thời gian để quen với thay đổi.","S"],["Tôi kiểm tra kỹ chi tiết trước khi xong việc.","C"],["Tôi thích làm theo quy trình rõ ràng.","C"],["Tôi cần dữ liệu và lý do trước khi quyết định.","C"],["Tôi khó chịu khi việc làm cẩu thả.","C"],["Tôi thích được giao trách nhiệm và tự quyết.","D"],["Khi có sự cố, tôi xử lý ngay thay vì chờ.","D"],["Tôi không ngại tranh luận để bảo vệ quan điểm của mình.","D"],["Tôi thích mục tiêu khó và kết quả rõ ràng.","D"],["Tôi sốt ruột khi mọi việc diễn ra quá chậm.","D"],["Khi nhóm lúng túng, tôi thường là người đứng ra cầm trịch.","D"],["Tôi dễ bắt chuyện với khách lạ.","I"],["Tôi thích làm việc cùng mọi người hơn làm một mình.","I"],["Tôi hay kể chuyện vui để cả nhóm cười.","I"],["Tôi lạc quan, thường nhìn mặt tích cực của vấn đề.","I"],["Tôi thích những ca đông vui, nhiều người qua lại.","I"],["Tôi hay rủ đồng nghiệp đi ăn uống sau giờ làm.","I"],["Tôi thích làm việc lâu dài với một nhóm quen thuộc.","S"],["Tôi giữ được bình tĩnh khi gặp khách khó tính.","S"],["Tôi làm việc đều tay, ổn định từ đầu đến cuối ca.","S"],["Tôi thích biết trước lịch làm để sắp xếp cuộc sống.","S"],["Tôi sẵn lòng nhận thêm việc để đồng đội đỡ vất vả.","S"],["Tôi ngại làm mất lòng người khác.","S"],["Tôi thích có hướng dẫn bằng văn bản rõ ràng.","C"],["Tôi đo, cân, đếm cẩn thận để mọi thứ chính xác.","C"],["Tôi đặt nhiều câu hỏi để hiểu đúng yêu cầu.","C"],["Tôi thích làm một việc thật đúng hơn làm nhiều việc vội vàng.","C"],["Tôi để ý những lỗi nhỏ mà người khác bỏ qua.","C"],["Tôi suy nghĩ kỹ và lên kế hoạch trước khi bắt tay vào làm.","C"]],"belbin":[["Tôi hay nghĩ ra cách làm mới khi nhóm bị bí.","PL"],["Tôi thích giải những vấn đề khó, không theo lối mòn.","PL"],["Tôi giỏi tìm người, tìm mối, tìm cơ hội bên ngoài.","RI"],["Tôi nhiệt tình nhất lúc khởi đầu một việc mới.","RI"],["Tôi giỏi giao đúng việc cho đúng người.","CO"],["Tôi giúp nhóm thống nhất   else if(t.kind==="riasec")summary=order.slice(0,3).join("");

function tables(){

  const o=e.target.closest(".opt");
  if(o){const t=T().find(x=>x.id===cur);const q=+o.dataset.q,v=+o.dataset.v;(answers[t.id]=answers[t.id]||{})[q]=v;ls.set("hs2_ans",answers);
    o.parentNode.querySelectorAll(".opt").forEach(b=>b.classList.toggle("on",b===o));$("#q"+q).classList.remove("miss");$("#err").textContent="";
    $("#cnt").textContent=fmt(t$().answered,{a:Object.keys(answers[t.id]).length,n:t.items.length});return}
  if(e.target.id==="submit"){const S=t$(),t=T().find(x=>x.id===cur),a=answers[t.id]||{};
    if(!$("#pname").value.trim()){$("#err").textContent=S.needName;$("#pname").focus();return}
    const miss=t.items.map((_,i)=>i).filter(i=>a[i]===undefined);
    if(miss.length){miss.forEach(i=>$("#q"+i).classList.add("miss"));$("#err").textContent=fmt(S.missing,{n:miss.length});$("#q"+miss[0]).scrollIntoView({behavior:"smooth",block:"center"});return}
    done[t.id]=1;ls.set("hs2_done",done);chips();showResult(t,true);$("#res").scrollIntoView({behavior:"smooth",block:"start"});return}
  if(e.target.id==="copy"){copyText();return}
  if(e.target.id==="resave"){const t=T().find(x=>x.id===cur);if(t)saveResult(t);return}
  if(e.target.id==="csv"){downloadCsv();return}
  if(e.target.id==="sync"){syncSheet();return}
  const pr=e.target.closest("[data-person]");if(pr)showPerson(pr.dataset.person);
});
document.addEventListener("input",e=>{
  if(e.target.id==="pname")ls.set("hs_who",{n:$("#pname").value});
  if(e.target.id==="filter"){ls.set("hs_filter",e.target.value);const pos=e.target.selectionStart;renderResults();const f=$("#filter");f.focus();f.setSelectionRange(pos,pos)}
});
$("#pname").addEventListener("change",()=>{
  const w=ls.get("hs_lastname",""),n=$("#pname").value.trim();
  if(w&&n&&w!==n){answers={};done={};ls.set("hs2_ans",answers);ls.set("hs2_done",done);render()}
  ls.set("hs_lastname",n);
});
$("#pname").value=(ls.get("hs_who",{})||{}).n||"";
render();

if(window.claude&&window.claude.use)(async()=>{
  try{
    [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(user){isOwn=await user.isOwner().catch(()=>false);isAdmin=isOwn||await user.canEdit().catch(()=>false)}
    if(db){
      if(isAdmin)mode="admin";
      else{uid=user?await user.id().catch(()=>null):null;const cw=user?await user.can("data.write").catch(()=>null):null;mode=uid&&cw!==false?"self":"none"}
    }
    if(db&&isAdmin){
      db.collection("people").onSnapshot(s=>{people={};s.docs.forEach(d=>people[d.id]=d.data());if(cur==="results")renderResults()},()=>{});
      if(isOwn)db.collection("subs").onSnapshot(s=>{subs={};s.docs.forEach(d=>subs[d.id]=d.data());if(cur==="results")renderResults()},()=>{});
    }
    if(!isAdmin&&cur==="results")cur="mbti";
    render();
  }catch(e){}
})();
</script>

</body>
</html>
