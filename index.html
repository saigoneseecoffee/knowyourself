["tt02","TT","TT","Đơn $13.40, khách đưa tờ $20. Bạn thối lại bao nhiêu?",["$6.60","$7.60","$6.40","$6.70"],"The order is $13.40 and the customer pays with a $20 bill. How much change do you give?",["$6.60","$7.60","$6.40","$6.70"],"",""],
["tt03","TT","TT","Đơn $24.00, khách có mã giảm 10%. Khách trả bao nhiêu trước thuế?",["$21.60","$22.40","$23.76","$14.00"],"The order is $24.00 and the customer has a 10% off code. How much do they pay before tax?",["$21.60","$22.40","$23.76","$14.00"],"",""],
["tt04","TT","TT","Đầu ca két có $150. POS báo bán tiền mặt $286.75. Cuối ca đếm được $431.75. Két thế nào?",["Thiếu $5.00","Đủ, không chênh","Dư $5.00","Thiếu $15.00"],"The drawer started with $150. The POS shows $286.75 in cash sales. At the end you count $431.75. What is the drawer?",["Short $5.00","Even, no difference","Over $5.00","Short $15.00"],"",""],
["tt05","TT","TT","Khách mua 3 ly, mỗi ly $5.75, trả bằng tờ $20. Bạn thối lại bao nhiêu?",["$2.75","$3.25","$2.25","$14.25"],"A customer buys 3 drinks at $5.75 each and pays with a $20 bill. How much change do you give?",["$2.75","$3.25","$2.25","$14.25"],"",""],
["tt06","TT","TT","Đơn $18.00, khách chọn tip 15% trên máy. Tiền tip là bao nhiêu?",["$2.70","$1.80","$3.00","$2.15"],"The order is $18.00 and the customer picks a 15% tip on the screen. How much is the tip?",["$2.70","$1.80","$3.00","$2.15"],"",""],
["tt07","TT","TT","Nhóm 4 người muốn chia đều hóa đơn $34.00. Mỗi người trả bao nhiêu?",["$8.50","$8.00","$9.00","$7.50"],"A group of 4 wants to split a $34.00 bill evenly. How much does each person pay?",["$8.50","$8.00","$9.00","$7.50"],"",""],
["tt08","TT","TT","Giả sử thuế là 7%. Đơn $10.00 trước thuế thì tổng cộng là bao nhiêu?",["$10.70","$10.07","$17.00","$10.77"],"Suppose tax is 7%. A $10.00 order comes to how much in total?",["$10.70","$10.07","$17.00","$10.77"],"",""],
["tt09","TT","TT","Khách đã trả tiền mặt cho 1 ly $6.25 thì quán hết nguyên liệu làm món đó, khách không muốn đổi món. Bạn hoàn lại bao nhiêu?",["$6.25","$10.00","$3.75","Không hoàn, đưa phiếu lần sau"],"A customer paid cash for a $6.25 drink, then you run out of an ingredient and they don't want something else. How much do you refund?",["$6.25","$10.00","$3.75","No refund, give a voucher"],"",""],
["tt10","TT","TT","Trong két có 3 tờ $20, 4 tờ $10, 7 tờ $5 và 12 tờ $1. Tổng cộng bao nhiêu?",["$147","$137","$157","$142"],"The drawer has three $20 bills, four $10s, seven $5s and twelve $1s. What is the total?",["$147","$137","$157","$142"],"",""],
["tt11","TT","TT","Đơn $37.85, khách đưa tờ $50. Bạn thối lại bao nhiêu?",["$12.15","$13.15","$12.25","$22.15"],"The order is $37.85 and the customer pays with a $50 bill. How much change do you give?",["$12.15","$13.15","$12.25","$22.15"],"$50.00 − $37.85 = $12.15. Đếm lại từ $37.85 lên $50 để kiểm tra trước khi đưa tiền.","$50.00 − $37.85 = $12.15. Count up from $37.85 to $50 to double-check before handing it over."],
["tt12","TT","TT","Đơn catering $64.30, khách trả bằng tờ $100. Bạn thối lại bao nhiêu?",["$35.70","$36.70","$35.30","$45.70"],"A catering order is $64.30 and the customer pays with a $100 bill. How much change do you give?",["$35.70","$36.70","$35.30","$45.70"],"$100.00 − $64.30 = $35.70. Khi trừ phần cent, 100 − 30 = 70 cent, rồi nhớ trừ 1 ở phần đô.","$100.00 − $64.30 = $35.70. For the cents, 100 − 30 = 70, then remember to take 1 off the dollars."],
["tt13","TT","TT","Quán có khuyến mãi mua 2 tặng 1. Khách mua 3 ly cùng giá $5.75. Khách trả bao nhiêu trước thuế?",["$11.50","$17.25","$5.75","$12.50"],"The café runs a buy 2, get 1 free deal. A customer buys 3 drinks at $5.75 each. How much do they pay before tax?",["$11.50","$17.25","$5.75","$12.50"],"Mua 2 tặng 1 nghĩa là chỉ tính tiền 2 ly: 2 × $5.75 = $11.50. Ly thứ ba miễn phí.","Buy 2, get 1 means you charge for 2 drinks only: 2 × $5.75 = $11.50. The third one is free."],
["tt14","TT","TT","Mua 2 tặng 1, ly được tặng là ly rẻ nhất. Khách lấy 3 ly giá $6.50, $6.00 và $5.25. Khách trả bao nhiêu trước thuế?",["$12.50","$11.25","$17.75","$11.75"],"Buy 2, get 1 free, and the free drink is the cheapest one. A customer gets drinks at $6.50, $6.00 and $5.25. How much do they pay before tax?",["$12.50","$11.25","$17.75","$11.75"],"Ly rẻ nhất ($5.25) được miễn phí, nên tính 2 ly còn lại: $6.50 + $6.00 = $12.50.","The cheapest drink ($5.25) is free, so charge the other two: $6.50 + $6.00 = $12.50."],
["tt15","TT","TT","Combo 1 ly Salted Cream Coffee và 1 bánh tart trứng giá $8.75. Mua lẻ thì ly $6.50, bánh $3.25. Khách lấy combo tiết kiệm được bao nhiêu?",["$1.00","$0.75","$1.25","$9.75"],"A combo of 1 Salted Cream Coffee and 1 egg tart is $8.75. Bought separately, the drink is $6.50 and the tart $3.25. How much does the customer save with the combo?",["$1.00","$0.75","$1.25","$9.75"],"Mua lẻ: $6.50 + $3.25 = $9.75. Tiết kiệm: $9.75 − $8.75 = $1.00.","Separately: $6.50 + $3.25 = $9.75. Savings: $9.75 − $8.75 = $1.00."],
["tt16","TT","TT","Nhân viên được giảm 25%. Đơn của bạn đồng nghiệp là $14.80. Sau giảm giá còn bao nhiêu?",["$11.10","$3.70","$12.30","$11.80"],"Staff get 25% off. A coworker's order is $14.80. How much is it after the discount?",["$11.10","$3.70","$12.30","$11.80"],"25% của $14.80 là $3.70 (14.80 ÷ 4). Còn lại $14.80 − $3.70 = $11.10, tức là trả 75%.","25% of $14.80 is $3.70 (14.80 ÷ 4). What's left is $14.80 − $3.70 = $11.10, which is 75% of the price."],
["tt17","TT","TT","Đơn $22.50. Khách quẹt thẻ và ký tổng cộng $27.00, phần dư là tip. Khách tip bao nhiêu phần trăm?",["20%","15%","18%","25%"],"The order is $22.50. The customer pays by card with a total of $27.00, and the extra is the tip. What percent did they tip?",["20%","15%","18%","25%"],"Tip = $27.00 − $22.50 = $4.50. Lấy $4.50 ÷ $22.50 = 0,2, tức là 20%.","Tip = $27.00 − $22.50 = $4.50. Then $4.50 ÷ $22.50 = 0.2, which is 20%."],
["tt18","TT","TT","Nhóm 3 người chia đều hóa đơn $42.00, mỗi người tự cộng thêm tip 15% trên phần của mình. Mỗi người trả bao nhiêu?",["$16.10","$14.00","$15.40","$16.80"],"A group of 3 splits a $42.00 bill evenly, and each adds a 15% tip on their share. How much does each person pay?",["$16.10","$14.00","$15.40","$16.80"],"Mỗi phần: $42.00 ÷ 3 = $14.00. Tip 15%: $14.00 × 0,15 = $2.10. Mỗi người trả $14.00 + $2.10 = $16.10.","Each share: $42.00 ÷ 3 = $14.00. A 15% tip is $14.00 × 0.15 = $2.10. Each pays $14.00 + $2.10 = $16.10."],
["tt19","TT","TT","Đơn $18.60. Khách đưa $10 tiền mặt và muốn trả phần còn lại bằng thẻ. Bạn quẹt thẻ bao nhiêu?",["$8.60","$9.60","$8.40","$28.60"],"The order is $18.60. The customer gives $10 in cash and wants to pay the rest by card. How much do you charge to the card?",["$8.60","$9.60","$8.40","$28.60"],"Phần còn lại: $18.60 − $10.00 = $8.60. Trên POS, ghi đúng $10 là tiền mặt và $8.60 là thẻ (split tender) để cuối ca két khớp.","The rest is $18.60 − $10.00 = $8.60. On the POS, enter $10 as cash and $8.60 as card (split tender) so the drawer balances at the end."],
["tt20","TT","TT","Thẻ quà tặng của khách còn $25.00. Đơn $17.35 trả hết bằng thẻ này. Thẻ còn lại bao nhiêu?",["$7.65","$8.65","$7.75","$42.35"],"A customer's gift card has $25.00 on it. The $17.35 order is paid fully with the card. What is the remaining balance?",["$7.65","$8.65","$7.75","$42.35"],"Số dư mới: $25.00 − $17.35 = $7.65. Báo khách số dư còn lại để họ biết.","New balance: $25.00 − $17.35 = $7.65. Tell the customer the remaining balance."],
["tt21","TT","TT","Thẻ quà tặng chỉ còn $4.80. Đơn $11.25. Sau khi dùng hết thẻ, khách còn phải trả bao nhiêu?",["$6.45","$5.45","$6.55","$16.05"],"The gift card only has $4.80 left. The order is $11.25. After using the whole card, how much does the customer still owe?",["$6.45","$5.45","$6.55","$16.05"],"Dùng hết $4.80 trên thẻ, phần còn lại $11.25 − $4.80 = $6.45 trả bằng tiền mặt hoặc thẻ khác.","Use all $4.80 on the card; the remaining $11.25 − $4.80 = $6.45 is paid by cash or another card."],
["tt22","TT","TT","Đầu ca bạn đếm két: 2 tờ $20, 5 tờ $10, 8 tờ $5, 20 tờ $1 và 1 cuộn quarter còn nguyên. Tổng cộng bao nhiêu?",["$160","$150","$170","$157.50"],"At the start of your shift you count the drawer: two $20s, five $10s, eight $5s, twenty $1s and one full roll of quarters. What is the total?",["$160","$150","$170","$157.50"],"$40 + $50 + $40 + $20 = $150 tiền giấy. Một cuộn quarter là 40 đồng = $10. Tổng $160. Nếu tiền đầu ca chuẩn khác số này thì báo quản lý trước khi bán.","Bills: $40 + $50 + $40 + $20 = $150. A quarter roll is 40 coins = $10. Total $160. If this doesn't match the set starting cash, tell the manager before you start selling."],
["tt23","TT","TT","Bạn nhận từ quản lý 2 cuộn quarter, 3 cuộn dime và 1 cuộn nickel. Tổng là bao nhiêu?",["$37.00","$27.00","$39.50","$35.00"],"The manager gives you 2 rolls of quarters, 3 rolls of dimes and 1 roll of nickels. What is the total?",["$37.00","$27.00","$39.50","$35.00"],"Cuộn quarter $10, cuộn dime $5, cuộn nickel $2, cuộn penny $0.50. Vậy 2 × $10 + 3 × $5 + $2 = $37.00.","A quarter roll is $10, dime roll $5, nickel roll $2, penny roll $0.50. So 2 × $10 + 3 × $5 + $2 = $37.00."],
["tt24","TT","TT","Đầu ca két có $200. POS báo bán tiền mặt $312.40 và có 1 lần hoàn tiền mặt $6.25. Cuối ca đếm được $505.15. Két thế nào?",["Thiếu $1.00","Thiếu $7.25","Dư $1.00","Đủ, không chênh"],"The drawer started with $200. The POS shows $312.40 in cash sales and one cash refund of $6.25. At the end you count $505.15. What is the drawer?",["Short $1.00","Short $7.25","Over $1.00","Even, no difference"],"Tiền đáng lẽ có: $200 + $312.40 − $6.25 = $506.15. Đếm được $505.15, nên thiếu $1.00. Quên trừ tiền hoàn sẽ ra sai là thiếu $7.25.","Expected: $200 + $312.40 − $6.25 = $506.15. You counted $505.15, so it's short $1.00. Forgetting the refund gives the wrong answer of short $7.25."],
["tt25","TT","TT","Bạn bấm nhầm món trên POS, khách CHƯA thanh toán. Cách đúng để sửa là gì?",["Void (xóa) món bấm nhầm rồi bấm lại món đúng","Thanh toán xong rồi làm refund","Giảm giá 100% cho món bấm nhầm","Để vậy, ghi chú cho quản lý cuối ca"],"You rang up the wrong item on the POS and the customer has NOT paid yet. What's the right way to fix it?",["Void the wrong item, then ring up the right one","Take payment, then do a refund","Give the wrong item a 100% discount","Leave it and leave a note for the manager"],"Void dùng khi chưa thu tiền: món bị xóa khỏi đơn, không ảnh hưởng doanh thu. Refund chỉ dùng khi khách đã trả tiền. Giảm giá 100% làm sai báo cáo.","A void is for before payment: the item is removed and sales aren't affected. A refund is only for after the customer has paid. A 100% discount makes the reports wrong."],
["tt26","TT","TT","Khách trả bằng thẻ, sau đó xin hoàn tiền vì ly bị làm sai và không muốn làm lại. Bạn hoàn tiền thế nào?",["Hoàn về đúng thẻ khách đã dùng, qua POS","Lấy tiền mặt trong két đưa khách cho nhanh","Hoàn vào một thẻ quà tặng mới cho khách","Đưa khách phiếu giảm giá cho lần sau"],"A customer paid by card, then asks for a refund because the drink was wrong and they don't want a remake. How do you refund it?",["Refund to the same card they used, through the POS","Give them cash from the drawer to save time","Load the amount onto a new gift card for them","Give them a discount coupon for their next visit"],"Tiền hoàn phải trả về đúng phương thức khách đã dùng. Đưa tiền mặt cho giao dịch thẻ sẽ làm két thiếu và sổ sách lệch.","Refunds go back to the original payment method. Giving cash for a card sale leaves the drawer short and the books off."],
["tt27","TT","TT","Bạn cần thối $0.37 tiền xu. Cách nào đúng số tiền VÀ dùng ít đồng xu nhất?",["1 quarter, 1 dime, 2 penny","1 quarter, 2 nickel, 2 penny","3 dime, 1 nickel, 2 penny","1 quarter, 1 dime, 1 nickel"],"You need to give $0.37 in coins. Which is the right amount AND uses the fewest coins?",["1 quarter, 1 dime, 2 pennies","1 quarter, 2 nickels, 2 pennies","3 dimes, 1 nickel, 2 pennies","1 quarter, 1 dime, 1 nickel"],"25 + 10 + 1 + 1 = 37 cent, chỉ 4 đồng. Hai cách kế tiếp cũng đúng 37 cent nhưng tốn 5 và 6 đồng; cách cuối là 40 cent, sai tiền.","25 + 10 + 1 + 1 = 37 cents with only 4 coins. The next two also make 37 cents but use 5 and 6 coins; the last is 40 cents, the wrong amount."],
["tt28","TT","TT","Khách đưa tờ $100 nhưng giấy trơn láng, soi đèn không thấy hình chìm (watermark) và dải bảo an. Bạn làm gì?",["Lịch sự chưa nhận tờ tiền, gọi quản lý kiểm tra, không buộc tội khách","Nhận luôn cho nhanh vì đang đông, cuối ca báo quản lý sau","Đánh dấu bằng bút thử tiền, bút không đổi màu thì nhận","Lớn tiếng nói là tiền giả để các khách khác cùng biết"],"A customer hands you a $100 bill that feels slick, and when you hold it to the light there's no watermark or security strip. What do you do?",["Politely hold off on taking it, call the manager to check, and don't accuse the customer","Take it to keep the line moving and tell the manager at the end of the shift","Mark it with a counterfeit pen and take it if the pen doesn't change color","Loudly announce it's fake so other customers know too"],"Tiền thật có giấy hơi nhám, có watermark và dải bảo an khi soi đèn. Nếu nghi ngờ, gọi quản lý xử lý theo quy định; giữ bình tĩnh và an toàn, không tranh cãi hay buộc tội.","Real bills feel slightly rough and show a watermark and security strip against the light. If in doubt, call the manager to handle it per policy; stay calm and safe, don't argue or accuse."],
["tt29","TT","TT","Đơn $8.65, khách đưa tờ $20. Cách đếm thối tiền kiểu đếm lên nào đúng?",["1 dime → $8.75, 1 quarter → $9, $1 → $10, $10 → $20","1 nickel → $8.70, 1 quarter → $8.95, $1 → $9.95, $10 → $19.95","$10 → $18.65, $1 → $19.65, 1 quarter → $19.90","1 dime → $8.75, 1 quarter → $9, $10 → $19"],"The order is $8.65 and the customer gives a $20. Which way of counting up the change is correct?",["1 dime → $8.75, 1 quarter → $9, $1 → $10, $10 → $20","1 nickel → $8.70, 1 quarter → $8.95, $1 → $9.95, $10 → $19.95","$10 → $18.65, $1 → $19.65, 1 quarter → $19.90","1 dime → $8.75, 1 quarter → $9, $10 → $19"],"Đếm lên bắt đầu từ số tiền đơn và cộng dần đến đúng tờ khách đưa ($20). Tổng thối: $0.10 + $0.25 + $1 + $10 = $11.35 = $20 − $8.65.","Counting up starts at the order total and adds until you reach the bill the customer gave ($20). Change: $0.10 + $0.25 + $1 + $10 = $11.35 = $20 − $8.65."],
["tt30","TT","TT","Đơn $30.00. Quản lý dặn: giảm 10% trước, rồi trừ thêm coupon $5. Khách trả bao nhiêu trước thuế?",["$22.00","$22.50","$27.00","$25.00"],"The order is $30.00. The manager says: take 10% off first, then subtract a $5 coupon. How much does the customer pay before tax?",["$22.00","$22.50","$27.00","$25.00"],"Giảm 10%: $30.00 − $3.00 = $27.00. Trừ coupon: $27.00 − $5.00 = $22.00. Làm ngược thứ tự (trừ $5 trước rồi giảm 10%) sẽ ra $22.50, nên phải đúng thứ tự.","10% off: $30.00 − $3.00 = $27.00. Coupon: $27.00 − $5.00 = $22.00. Doing it in the other order ($5 first, then 10%) gives $22.50, so the order matters."],
["ct01","CT","CT","Một mẻ phin 250 g cho khoảng 770 ml cốt. Nếu mỗi ly dùng 45 ml cốt, một mẻ đủ cho khoảng bao nhiêu ly?",["17 ly","12 ly","15 ly","25 ly"],"One 250 g phin batch makes about 770 ml of concentrate. If each drink uses 45 ml, about how many drinks does one batch make?",["17 drinks","12 drinks","15 drinks","25 drinks"],"",""],
["ct02","CT","CT","Đơn catering 24 ly, mỗi ly cần 40 ml cốt. Một mẻ phin cho khoảng 770 ml cốt. Cần pha ít nhất mấy mẻ?",["2 mẻ","1 mẻ","3 mẻ","4 mẻ"],"A catering order is 24 drinks, each needing 40 ml of concentrate. One phin batch makes about 770 ml. What is the fewest batches you need?",["2 batches","1 batch","3 batches","4 batches"],"",""],
["ct03","CT","CT","1 fl oz bằng khoảng 30 ml. Công thức ghi 2 oz cốt. Bạn đong bao nhiêu ml?",["60 ml","30 ml","45 ml","120 ml"],"1 fl oz is about 30 ml. The recipe says 2 oz of concentrate. How many ml do you measure?",["60 ml","30 ml","45 ml","120 ml"],"",""],
["ct04","CT","CT","Công thức kem muối: 500 ml kem tươi với 5 g muối. Bạn chỉ còn 300 ml kem tươi. Cần bao nhiêu gam muối?",["3 g","5 g","2 g","4 g"],"The salted cream recipe is 500 ml heavy cream with 5 g salt. You only have 300 ml of cream. How many grams of salt do you need?",["3 g","5 g","2 g","4 g"],"",""],
["ct05","CT","CT","Ly 16 oz dùng 2 oz cốt. Làm ly 24 oz cùng tỉ lệ thì cần bao nhiêu oz cốt?",["3 oz","2.5 oz","4 oz","2 oz"],"A 16 oz drink uses 2 oz of concentrate. For a 24 oz drink at the same ratio, how many oz do you need?",["3 oz","2.5 oz","4 oz","2 oz"],"",""],
["ct06","CT","CT","1 lb bằng khoảng 454 g. Một túi cà phê 5 lb nặng khoảng bao nhiêu kg?",["Khoảng 2,3 kg","Khoảng 1,1 kg","Khoảng 5 kg","Khoảng 11 kg"],"1 lb is about 454 g. About how many kg is a 5 lb bag of coffee?",["About 2.3 kg","About 1.1 kg","About 5 kg","About 11 kg"],"",""],
["ct07","CT","CT","Mỗi mẻ phin dùng 250 g cà phê. Một túi 1 kg pha được mấy mẻ?",["4 mẻ","2 mẻ","3 mẻ","5 mẻ"],"Each phin batch uses 250 g of coffee. How many batches does a 1 kg bag make?",["4 batches","2 batches","3 batches","5 batches"],"",""],
["ct08","CT","CT","1 lít kem tươi đánh ra đủ phủ khoảng 40 ly. Sự kiện cần 100 ly, cần ít nhất bao nhiêu lít kem?",["2,5 lít","2 lít","3 lít","4 lít"],"1 liter of cream makes enough topping for about 40 drinks. An event needs 100 drinks. How many liters do you need at least?",["2.5 liters","2 liters","3 liters","4 liters"],"",""],
["ct09","CT","CT","1 gallon bằng khoảng 3,8 lít. Mỗi ly dùng 190 ml sữa. Một gallon sữa làm được khoảng bao nhiêu ly?",["20 ly","15 ly","25 ly","38 ly"],"1 gallon is about 3.8 liters. Each drink uses 190 ml of milk. About how many drinks does one gallon make?",["20 drinks","15 drinks","25 drinks","38 drinks"],"",""],
["ct10","CT","CT","Trà pha sẵn theo tỉ lệ 1 phần cốt trà với 3 phần nước. Muốn có 2 lít trà thì cần bao nhiêu cốt trà?",["500 ml","250 ml","667 ml","750 ml"],"Tea is mixed 1 part tea concentrate to 3 parts water. To make 2 liters of tea, how much concentrate do you need?",["500 ml","250 ml","667 ml","750 ml"],"",""],
["ct11","CT","CT","Công thức 12 ly dùng 360 ml sữa đặc. Đơn catering 30 ly thì cần bao nhiêu ml sữa đặc?",["900 ml","720 ml","1.080 ml","1.200 ml"],"A recipe for 12 drinks uses 360 ml of condensed milk. For a 30-drink catering order, how many ml do you need?",["900 ml","720 ml","1,080 ml","1,200 ml"],"Mỗi ly: 360 ÷ 12 = 30 ml. 30 ly: 30 × 30 = 900 ml.","Per drink: 360 ÷ 12 = 30 ml. For 30 drinks: 30 × 30 = 900 ml."],
["ct12","CT","CT","Sáng nay pha 3 mẻ phin, mỗi mẻ khoảng 770 ml cốt. Bán 60 ly, mỗi ly 35 ml cốt. Còn lại khoảng bao nhiêu cốt?",["210 ml","110 ml","310 ml","770 ml"],"This morning you brewed 3 phin batches of about 770 ml concentrate each. You sold 60 drinks using 35 ml each. About how much concentrate is left?",["210 ml","110 ml","310 ml","770 ml"],"Pha được 3 × 770 = 2.310 ml. Đã dùng 60 × 35 = 2.100 ml. Còn 2.310 − 2.100 = 210 ml.","Brewed 3 × 770 = 2,310 ml. Used 60 × 35 = 2,100 ml. Left: 2,310 − 2,100 = 210 ml."],
["ct13","CT","CT","Mỗi ngày quán pha 3 mẻ phin 250 g, mở 6 ngày. Một tuần cần bao nhiêu kg cà phê bột?",["4,5 kg","0,75 kg","1,5 kg","7,5 kg"],"The café brews 3 phin batches of 250 g a day and is open 6 days a week. How many kg of ground coffee are needed for the week?",["4.5 kg","0.75 kg","1.5 kg","7.5 kg"],"Số mẻ: 3 × 6 = 18 mẻ. Cà phê: 18 × 250 g = 4.500 g = 4,5 kg (1 kg = 1.000 g).","Batches: 3 × 6 = 18. Coffee: 18 × 250 g = 4,500 g = 4.5 kg (1 kg = 1,000 g)."],
["ct14","CT","CT","Công thức ghi 2 tbsp (muỗng canh) bột, nhưng bạn chỉ có muỗng tsp (muỗng cà phê). Cần bao nhiêu tsp?",["6 tsp","4 tsp","3 tsp","8 tsp"],"The recipe says 2 tbsp of powder, but you only have a teaspoon. How many tsp do you need?",["6 tsp","4 tsp","3 tsp","8 tsp"],"1 tbsp = 3 tsp, nên 2 tbsp = 2 × 3 = 6 tsp.","1 tbsp = 3 tsp, so 2 tbsp = 2 × 3 = 6 tsp."],
["ct15","CT","CT","1 cup (8 fl oz) bằng khoảng 240 ml. Công thức ghi 2,5 cup sữa. Bạn đong khoảng bao nhiêu ml?",["600 ml","480 ml","500 ml","750 ml"],"1 cup (8 fl oz) is about 240 ml. The recipe says 2.5 cups of milk. About how many ml do you measure?",["600 ml","480 ml","500 ml","750 ml"],"2,5 × 240 ml = 600 ml. 480 ml chỉ là 2 cup.","2.5 × 240 ml = 600 ml. 480 ml is only 2 cups."],
["ct16","CT","CT","Kem tươi về theo hộp 1 quart. Công thức cần nửa gallon kem. Bạn mở mấy hộp?",["2 hộp","1 hộp","4 hộp","8 hộp"],"Heavy cream comes in 1-quart cartons. The recipe needs half a gallon of cream. How many cartons do you open?",["2 cartons","1 carton","4 cartons","8 cartons"],"1 gallon = 4 quart, nên nửa gallon = 2 quart = 2 hộp.","1 gallon = 4 quarts, so half a gallon = 2 quarts = 2 cartons."],
["ct17","CT","CT","1 gallon bằng khoảng 3,8 lít. Bình cold brew 2 gallon chứa khoảng bao nhiêu lít?",["7,6 lít","3,8 lít","5,8 lít","9,1 lít"],"1 gallon is about 3.8 liters. About how many liters does a 2-gallon cold brew container hold?",["7.6 liters","3.8 liters","5.8 liters","9.1 liters"],"2 × 3,8 lít = 7,6 lít. Cộng 2 với 3,8 (ra 5,8) là phép tính sai.","2 × 3.8 liters = 7.6 liters. Adding 2 and 3.8 (5.8) is the wrong operation."],
["ct18","CT","CT","1 lb bằng khoảng 454 g. Công thức syrup cần 680 g đường. Khoảng bao nhiêu lb?",["Khoảng 1,5 lb","Khoảng 0,68 lb","Khoảng 3 lb","Khoảng 2 lb"],"1 lb is about 454 g. A syrup recipe needs 680 g of sugar. About how many lb is that?",["About 1.5 lb","About 0.68 lb","About 3 lb","About 2 lb"],"680 ÷ 454 ≈ 1,5 lb. Đổi gam sang lb thì chia cho 454, không nhân.","680 ÷ 454 ≈ 1.5 lb. To go from grams to pounds, divide by 454, don't multiply."],
["ct19","CT","CT","Cold brew pha theo tỉ lệ 1:10 cà phê với nước, tính theo khối lượng. Dùng 500 g cà phê thì cần bao nhiêu nước?",["5.000 g (khoảng 5 lít)","500 g (khoảng 500 ml)","1.500 g (khoảng 1,5 lít)","50.000 g (khoảng 50 lít)"],"Cold brew is made at 1:10 coffee to water by weight. With 500 g of coffee, how much water do you need?",["5,000 g (about 5 liters)","500 g (about 500 ml)","1,500 g (about 1.5 liters)","50,000 g (about 50 liters)"],"1:10 nghĩa là nước nặng gấp 10 lần cà phê: 500 × 10 = 5.000 g. 1 g nước ≈ 1 ml, nên khoảng 5 lít.","1:10 means 10 times as much water as coffee by weight: 500 × 10 = 5,000 g. 1 g of water ≈ 1 ml, so about 5 liters."],
["ct20","CT","CT","Ly chuẩn (100% ngọt) dùng 30 ml syrup. Khách chọn mức đường 50%. Bạn cho bao nhiêu syrup?",["15 ml","10 ml","20 ml","30 ml"],"A standard drink (100% sweet) uses 30 ml of syrup. The customer picks 50% sugar. How much syrup do you add?",["15 ml","10 ml","20 ml","30 ml"],"50% của 30 ml = 30 × 0,5 = 15 ml. Mức đường tính theo phần trăm lượng syrup chuẩn.","50% of 30 ml = 30 × 0.5 = 15 ml. Sugar level is a percent of the standard syrup amount."],
["ct21","CT","CT","Ly 16 oz, đá chiếm khoảng 6 oz chỗ trong ly. Còn chỗ cho khoảng bao nhiêu oz nước uống?",["10 oz","16 oz","22 oz","6 oz"],"In a 16 oz cup, ice takes up about 6 oz of space. About how many oz of liquid will fit?",["10 oz","16 oz","22 oz","6 oz"],"Đá chiếm chỗ trong ly: 16 − 6 = 10 oz. Vì vậy công thức ly đá phải tính phần đá, nếu không ly sẽ tràn.","Ice takes up room in the cup: 16 − 6 = 10 oz. That's why iced recipes account for ice, or the cup overflows."],
["ct22","CT","CT","1 fl oz bằng khoảng 30 ml. Ly 12 oz chứa khoảng bao nhiêu ml?",["360 ml","120 ml","240 ml","480 ml"],"1 fl oz is about 30 ml. About how many ml does a 12 oz cup hold?",["360 ml","120 ml","240 ml","480 ml"],"12 × 30 ml = 360 ml. (240 ml là 8 oz, 480 ml là 16 oz.)","12 × 30 ml = 360 ml. (240 ml is 8 oz, 480 ml is 16 oz.)"],
["ct23","CT","CT","Mua 2.000 g xoài, sau khi gọt vỏ và bỏ hột chỉ dùng được 60%. Mỗi ly cần 80 g xoài. Làm được bao nhiêu ly?",["15 ly","25 ly","10 ly","16 ly"],"You buy 2,000 g of mango, and after peeling and pitting only 60% is usable. Each drink needs 80 g. How many drinks can you make?",["15 drinks","25 drinks","10 drinks","16 drinks"],"Phần dùng được: 2.000 × 0,6 = 1.200 g. Số ly: 1.200 ÷ 80 = 15. Tính 2.000 ÷ 80 = 25 là quên trừ phần bỏ đi.","Usable: 2,000 × 0.6 = 1,200 g. Drinks: 1,200 ÷ 80 = 15. 2,000 ÷ 80 = 25 forgets the waste."],
["ct24","CT","CT","Mua 5 kg trái cây, sau khi sơ chế còn 3,5 kg dùng được. Tỉ lệ thu hồi (yield) là bao nhiêu?",["70%","30%","75%","35%"],"You buy 5 kg of fruit and after prep 3.5 kg is usable. What is the yield percentage?",["70%","30%","75%","35%"],"Yield = phần dùng được ÷ phần mua = 3,5 ÷ 5 = 0,7 = 70%. 30% là phần hao hụt, không phải yield.","Yield = usable ÷ purchased = 3.5 ÷ 5 = 0.7 = 70%. 30% is the waste, not the yield."],
["ct25","CT","CT","Mức par kem muối cho ca chiều là 2 lít. Trong tủ còn 600 ml. Bạn cần làm thêm bao nhiêu?",["1,4 lít","2,6 lít","2 lít","1,6 lít"],"The salted cream par for the afternoon shift is 2 liters. There's 600 ml in the fridge. How much more do you make?",["1.4 liters","2.6 liters","2 liters","1.6 liters"],"Par là lượng cần có đầu ca. Làm thêm = par − đang có = 2.000 − 600 = 1.400 ml = 1,4 lít.","Par is how much you should have at the start of the shift. Make = par − on hand = 2,000 − 600 = 1,400 ml = 1.4 liters."],
["ct26","CT","CT","Sữa yến mạch về hộp 32 fl oz (khoảng 946 ml). Ca này cần khoảng 2,5 lít. Bạn mở ít nhất mấy hộp?",["3 hộp","2 hộp","4 hộp","5 hộp"],"Oat milk comes in 32 fl oz cartons (about 946 ml). This shift needs about 2.5 liters. What's the fewest cartons to open?",["3 cartons","2 cartons","4 cartons","5 cartons"],"2.500 ÷ 946 ≈ 2,6 hộp, nên phải làm tròn lên 3 hộp. 2 hộp chỉ khoảng 1,9 lít, không đủ.","2,500 ÷ 946 ≈ 2.6 cartons, so round up to 3. Two cartons are only about 1.9 liters, not enough."],
["ct27","CT","CT","Mỗi chai syrup 750 ml. Đơn catering 50 ly, mỗi ly 20 ml syrup. Cần chuẩn bị ít nhất mấy chai?",["2 chai","1 chai","3 chai","4 chai"],"Each syrup bottle is 750 ml. A 50-drink catering order uses 20 ml of syrup per drink. What's the fewest bottles to have ready?",["2 bottles","1 bottle","3 bottles","4 bottles"],"Cần 50 × 20 = 1.000 ml. 1.000 ÷ 750 ≈ 1,3 chai, làm tròn lên 2 chai.","You need 50 × 20 = 1,000 ml. 1,000 ÷ 750 ≈ 1.3 bottles, so round up to 2."],
["ct28","CT","CT","Lần đầu làm một món mới theo thẻ công thức. Cách đúng là gì?",["Đọc hết thẻ trước, chuẩn bị đủ đồ, rồi làm đúng thứ tự từng bước","Làm theo trí nhớ món gần giống, đọc thẻ khi bí","Làm các bước dễ trước, bước khó để sau","Chỉ xem ảnh ly thành phẩm rồi ước lượng"],"You're making a new drink from its recipe card for the first time. What's the right way?",["Read the whole card first, get everything ready, then follow the steps in order","Make it from memory of a similar drink and check the card if stuck","Do the easy steps first and leave the hard ones for later","Just look at the photo of the finished drink and eyeball it"],"Đọc hết thẻ giúp bạn biết cần dụng cụ, nguyên liệu gì và không bỏ sót bước. Thứ tự bước ảnh hưởng đến vị và lớp của ly (ví dụ kem phủ sau cùng).","Reading the whole card tells you which tools and ingredients you need so you don't miss a step. Step order affects taste and layers (for example, the cream topping goes last)."],
["ct29","CT","CT","Thẻ công thức ghi 1 oz syrup. Bạn đong bằng gì cho đúng?",["Jigger, mặt 1 oz, rót ngang miệng","1 muỗng canh (tbsp), đong ngang miệng","Rót thẳng từ chai, ước chừng bằng mắt","1 muỗng cà phê (tsp), đong ngang miệng"],"The recipe card says 1 oz of syrup. What do you measure it with?",["A jigger, using the 1 oz side, filled to the rim","One tablespoon, filled level to the top","A free pour from the bottle, judged by eye","One teaspoon, filled level to the top"],"1 fl oz = 2 tbsp = 6 tsp, nên 1 muỗng canh chỉ được nửa oz. Jigger đong chuẩn và nhanh, giúp mọi ly có vị giống nhau.","1 fl oz = 2 tbsp = 6 tsp, so one tablespoon is only half an ounce. A jigger is accurate and fast, so every drink tastes the same."],
["ct30","CT","CT","Thẻ công thức ghi đun nước sôi 100°C. Nhiệt kế của quán chỉ có °F. Nước phải đạt bao nhiêu?",["212°F (100°C)","100°F (38°C)","180°F (82°C)","200°F (93°C)"],"The recipe card says to boil water at 100°C. The café thermometer only reads °F. What temperature should the water reach?",["212°F (100°C)","100°F (38°C)","180°F (82°C)","200°F (93°C)"],"Nước sôi ở 100°C = 212°F (ở mực nước biển). Công thức đổi: °F = °C × 9/5 + 32 = 100 × 1,8 + 32 = 212.","Water boils at 100°C = 212°F (at sea level). Formula: °F = °C × 9/5 + 32 = 100 × 1.8 + 32 = 212."],
["fc01","FC","FC","Một ly bán $6.00. Tổng chi phí nguyên liệu, ly, nắp và ống hút là $1.20. Food cost của ly này là bao nhiêu?",["20%","12%","15%","25%"],"A drink sells for $6.00. Ingredients, cup, lid and straw cost $1.20 in total. What is this drink's food cost?",["20%","12%","15%","25%"],"",""],
["fc02","FC","FC","Một hộp sữa đặc 1.284 g giá khoảng $5.40. Mỗi ly dùng 30 g. Tiền sữa đặc cho mỗi ly khoảng bao nhiêu?",["$0.13","$0.03","$0.30","$1.30"],"A 1,284 g carton of condensed milk costs about $5.40. Each drink uses 30 g. About how much condensed milk goes into each drink?",["$0.13","$0.03","$0.30","$1.30"],"",""],
["fc03","FC","FC","Mỗi tuần quán dùng khoảng 18 gallon sữa. Trong tủ còn 5 gallon. Odeko giao mỗi tuần 1 lần và bạn muốn dư thêm 3 gallon phòng hờ. Nên đặt bao nhiêu gallon?",["16 gallon","13 gallon","18 gallon","21 gallon"],"The café uses about 18 gallons of milk a week. There are 5 gallons in the fridge. Odeko delivers once a week and you want 3 extra gallons as a buffer. How many gallons should you order?",["16 gallons","13 gallons","18 gallons","21 gallons"],"",""],
["fc04","FC","FC","Cà phê nhập giá 720.000 VND/kg. Giả sử 25.000 VND = $1. Mỗi kg giá bao nhiêu đô?",["$28.80","$18.00","$36.00","$2.88"],"Imported coffee costs 720,000 VND per kg. Suppose 25,000 VND = $1. How much is that per kg in dollars?",["$28.80","$18.00","$36.00","$2.88"],"",""],
["fc05","FC","FC","1 kg cà phê giá $28.80 pha được 4 mẻ, mỗi mẻ 770 ml cốt. Mỗi ly dùng 45 ml cốt. Tiền cà phê mỗi ly khoảng bao nhiêu?",["$0.42","$0.29","$0.72","$1.20"],"1 kg of coffee costs $28.80 and makes 4 batches of 770 ml concentrate each. Each drink uses 45 ml. About how much coffee cost goes into each drink?",["$0.42","$0.29","$0.72","$1.20"],"",""],
["fc06","FC","FC","Mục tiêu food cost đồ uống là 20%. Một ly có chi phí $1.40 thì nên bán ít nhất bao nhiêu?",["$7.00","$5.60","$6.00","$2.80"],"The drink food cost target is 20%. If a drink costs $1.40 to make, what is the lowest price to charge?",["$7.00","$5.60","$6.00","$2.80"],"",""],
["fc07","FC","FC","Đầu tuần có 12 gallon sữa, nhập thêm 18 gallon, cuối tuần còn 6 gallon. Theo POS, các món đã bán dùng hết 21 gallon. Hao hụt là bao nhiêu gallon?",["3 gallon","6 gallon","21 gallon","0 gallon"],"You started the week with 12 gallons of milk, received 18 more and ended with 6. The POS says drinks sold used 21 gallons. How many gallons were wasted?",["3 gallons","6 gallons","21 gallons","0 gallons"],"",""],
["fc08","FC","FC","Matcha giá $77 cho 500 g. Mỗi ly dùng 4 g. Tiền matcha mỗi ly khoảng bao nhiêu?",["$0.62","$0.15","$0.31","$1.54"],"Matcha costs $77 for 500 g. Each drink uses 4 g. About how much matcha cost goes into each drink?",["$0.62","$0.15","$0.31","$1.54"],"",""],
["fc09","FC","FC","Ống hút boba giá $39.75 cho 1.600 cái. Mỗi cái khoảng bao nhiêu?",["Khoảng 2,5 cent","Khoảng 25 cent","Khoảng 40 cent","Dưới 1 cent"],"Boba straws cost $39.75 for 1,600. About how much is each one?",["About 2.5 cents","About 25 cents","About 40 cents","Less than 1 cent"],"",""],
["fc10","FC","FC","Trong tủ còn nhiều sữa hết hạn vào ngày mai. Cách nào giảm hao hụt tốt nhất?",["Đưa ra trước để dùng trước, và báo người đặt hàng giảm lượng lần sau","Đổ bỏ hết hôm nay cho chắc, và tuần sau vẫn đặt số lượng như cũ","Để dùng thêm vài ngày sau hạn, vì sữa thường để được lâu hơn","Để nguyên chỗ cũ và mở sữa mới nhất trước cho đồ uống ngon hơn"],"There's a lot of milk in the fridge that expires tomorrow. What's the best way to cut waste?",["Move it to the front to use first, and tell whoever orders to buy less next time","Pour it all out today to be safe, and order the same amount again next week","Keep using it for a few days past the date, since milk usually lasts longer","Leave it where it is and open the newest milk first so drinks taste fresher"],"",""],
["fc11","FC","FC","Salted Cream Coffee bán $6.50, chi phí làm 1 ly (nguyên liệu và bao bì) là $1.30. Mỗi ly quán còn lại bao nhiêu đô để trả lương, tiền thuê và lời (contribution margin)?",["$5.20","$7.80","$1.30","$4.20"],"Salted Cream Coffee sells for $6.50 and one drink costs $1.30 to make (ingredients and packaging). How many dollars does each drink leave for wages, rent and profit (contribution margin)?",["$5.20","$7.80","$1.30","$4.20"],"Contribution margin = giá bán − chi phí ly: $6.50 − $1.30 = $5.20. Đây là số đô thật sự mỗi ly mang về.","Contribution margin = price − drink cost: $6.50 − $1.30 = $5.20. It's the actual dollars each drink brings in."],
["fc12","FC","FC","Ly A bán $6.00, chi phí $1.20 (food cost 20%). Ly B bán $8.00, chi phí $2.40 (food cost 30%). Bán 1 ly, ly nào mang về nhiều đô hơn?",["Ly B, còn lại $5.60 mỗi ly","Ly A, vì food cost % thấp hơn","Hai ly như nhau","Ly A, còn lại $5.80 mỗi ly"],"Drink A sells for $6.00 and costs $1.20 (20% food cost). Drink B sells for $8.00 and costs $2.40 (30% food cost). Per drink sold, which one brings in more dollars?",["Drink B, leaving $5.60 per drink","Drink A, because its food cost % is lower","They're the same","Drink A, leaving $5.80 per drink"],"Ly A còn $6.00 − $1.20 = $4.80, ly B còn $8.00 − $2.40 = $5.60. Food cost % thấp chưa chắc lời nhiều đô hơn, nên xem cả hai con số khi so menu mix.","Drink A leaves $6.00 − $1.20 = $4.80 and drink B leaves $8.00 − $2.40 = $5.60. A lower food cost % doesn't always mean more dollars, so look at both numbers when comparing menu mix."],
["fc13","FC","FC","1 kg cà phê $28.80 pha được 4 mẻ, mỗi mẻ 770 ml cốt. Nếu mỗi ly bạn rót dư 5 ml cốt, mỗi ngày 100 ly, thì 30 ngày quán mất khoảng bao nhiêu tiền cà phê?",["Khoảng $140","Khoảng $14","Khoảng $47","Khoảng $1,400"],"1 kg of coffee costs $28.80 and makes 4 batches of 770 ml concentrate. If you over-pour 5 ml of concentrate per drink, 100 drinks a day, about how much coffee money is lost in 30 days?",["About $140","About $14","About $47","About $1,400"],"Cốt giá $28.80 ÷ 3.080 ml ≈ $0.0094/ml. Dư 5 ml × 100 ly × 30 ngày = 15.000 ml ≈ $140. Vài ml mỗi ly cộng lại thành nhiều tiền, nên luôn đong đúng.","Concentrate costs $28.80 ÷ 3,080 ml ≈ $0.0094 per ml. 5 ml × 100 drinks × 30 days = 15,000 ml ≈ $140. A few ml per drink adds up, so always measure."],
["fc14","FC","FC","Ly nhựa giá $0.14, nắp $0.06, ống hút boba ($39.75 cho 1.600 cái). Tiền bao bì cho 1 ly trà sữa khoảng bao nhiêu?",["Khoảng $0.22","Khoảng $0.20","Khoảng $0.09","Khoảng $2.25"],"A plastic cup costs $0.14, a lid $0.06 and a boba straw ($39.75 for 1,600). About how much packaging goes into one milk tea?",["About $0.22","About $0.20","About $0.09","About $2.25"],"Ống hút ≈ $39.75 ÷ 1.600 ≈ $0.025. Tổng $0.14 + $0.06 + $0.025 ≈ $0.22. Bao bì là một phần của chi phí mỗi ly, đừng quên khi tính food cost.","The straw is about $39.75 ÷ 1,600 ≈ $0.025. Total $0.14 + $0.06 + $0.025 ≈ $0.22. Packaging is part of each drink's cost, so don't leave it out of food cost."],
["fc15","FC","FC","Matcha loại A giá $77 cho túi 500 g. Loại B (cùng chất lượng) giá $42 cho túi 250 g. Loại nào rẻ hơn tính theo gram?",["Túi 500 g, khoảng $0.15/g","Túi 250 g, vì tổng tiền ít hơn","Như nhau, cùng khoảng $0.15/g","Túi 250 g, khoảng $0.14/g"],"Matcha A costs $77 for a 500 g bag. Matcha B (same quality) costs $42 for a 250 g bag. Which is cheaper per gram?",["The 500 g bag, about $0.15/g","The 250 g bag, because the total is lower","They're the same, about $0.15/g","The 250 g bag, about $0.14/g"],"So nhà cung cấp phải chia ra giá mỗi đơn vị: $77 ÷ 500 = $0.154/g, $42 ÷ 250 = $0.168/g. Tổng tiền ít hơn không có nghĩa là rẻ hơn.","Compare suppliers by unit price: $77 ÷ 500 = $0.154/g and $42 ÷ 250 = $0.168/g. A smaller bill doesn't mean a cheaper product."],
["fc16","FC","FC","1 gallon sữa (128 fl oz) giá $5.12. Mỗi ly latte dùng 8 oz sữa. Tiền sữa mỗi ly là bao nhiêu?",["$0.32","$0.64","$0.04","$0.16"],"A gallon of milk (128 fl oz) costs $5.12. Each latte uses 8 oz of milk. How much milk cost goes into each latte?",["$0.32","$0.64","$0.04","$0.16"],"Giá mỗi oz = $5.12 ÷ 128 = $0.04. Nhân 8 oz = $0.32. Luôn đổi giá mua sỉ ra giá mỗi oz hoặc mỗi gram trước, rồi nhân với lượng trong công thức.","Price per oz = $5.12 ÷ 128 = $0.04. Times 8 oz = $0.32. Always turn the bulk price into a price per oz or gram, then multiply by the recipe amount."],
["fc17","FC","FC","Một ly bán $6.00 nhưng chi phí đã tăng lên $1.50. Nếu giữ giá $6.00 và muốn food cost về lại 20%, chi phí mỗi ly phải giảm bao nhiêu?",["$0.30","$1.20","$0.50","$0.05"],"A drink sells for $6.00 but its cost has risen to $1.50. If the price stays at $6.00 and you want food cost back at 20%, how much must the cost per drink come down?",["$0.30","$1.20","$0.50","$0.05"],"20% của $6.00 là $1.20. Chi phí hiện tại $1.50 nên phải giảm $1.50 − $1.20 = $0.30 (đổi nhà cung cấp, bớt hao hụt, đong chuẩn), hoặc phải tăng giá.","20% of $6.00 is $1.20. The cost is $1.50, so it must drop by $1.50 − $1.20 = $0.30 (cheaper supplier, less waste, exact portions), or the price has to go up."],
["fc18","FC","FC","Đầu tuần đếm được 3.200 ly 16 oz, trong tuần nhận thêm 2.000 ly, cuối tuần đếm còn 1.900 ly. Tuần này đã dùng bao nhiêu ly?",["3.300 ly","5.200 ly","1.300 ly","7.100 ly"],"At the start of the week you counted 3,200 16 oz cups, received 2,000 more during the week and counted 1,900 at the end. How many cups were used this week?",["3,300 cups","5,200 cups","1,300 cups","7,100 cups"],"Lượng dùng = tồn đầu + nhận − tồn cuối: 3.200 + 2.000 − 1.900 = 3.300. So con số này với số ly bán trên POS để thấy hao hụt.","Usage = starting count + received − ending count: 3,200 + 2,000 − 1,900 = 3,300. Compare it with drinks sold on the POS to find shrink."],
["fc19","FC","FC","Khi kiểm kho, bạn thấy 7 hộp sữa đặc chưa mở và 1 hộp đã dùng khoảng một nửa. Bạn ghi vào phiếu kiểm kho thế nào?",["7,5 hộp","7 hộp","8 hộp","7 hộp, hộp đã mở không cần ghi"],"During inventory you find 7 unopened cartons of condensed milk and 1 carton about half used. What do you write on the count sheet?",["7.5 cartons","7 cartons","8 cartons","7 cartons, opened ones don't count"],"Hộp đã mở vẫn là hàng tồn, ghi theo phần còn lại (ước lượng hoặc cân). Bỏ qua hay làm tròn lên sẽ làm sai số lượng đã dùng và food cost.","An opened carton is still stock, so count the part left (estimate or weigh it). Skipping it or rounding up throws off usage and food cost."],
["fc20","FC","FC","Quán dùng khoảng 400 ly mỗi ngày. Hàng giao sau 3 ngày kể từ lúc đặt, và quán muốn giữ thêm 400 ly phòng hờ. Còn bao nhiêu ly thì phải đặt hàng?",["1.600 ly","1.200 ly","400 ly","2.800 ly"],"The café uses about 400 cups a day. Deliveries arrive 3 days after ordering, and the café wants 400 extra cups as a buffer. At how many cups left should you reorder?",["1,600 cups","1,200 cups","400 cups","2,800 cups"],"Điểm đặt hàng = lượng dùng trong thời gian chờ hàng + phòng hờ: 400 × 3 + 400 = 1.600. Đặt trễ hơn thì dễ hết hàng trước khi xe tới.","Reorder point = usage during the lead time + buffer: 400 × 3 + 400 = 1,600. Order later than that and you may run out before the truck comes."],
["fc21","FC","FC","Sữa đặc mua theo thùng 6 hộp. Par của quán là 24 hộp, hiện còn 9 hộp. Cần đặt ít nhất bao nhiêu thùng để đủ par?",["3 thùng","2 thùng","15 thùng","4 thùng"],"Condensed milk comes in cases of 6 cartons. The par is 24 cartons and you have 9. What's the fewest cases to order to reach par?",["3 cases","2 cases","15 cases","4 cases"],"Cần 24 − 9 = 15 hộp. 15 ÷ 6 = 2,5 nên phải đặt 3 thùng (18 hộp); 2 thùng chỉ được 12 hộp, chưa đủ par.","You need 24 − 9 = 15 cartons. 15 ÷ 6 = 2.5, so order 3 cases (18 cartons); 2 cases is only 12, short of par."],
["fc22","FC","FC","Odeko vừa giao cream mới. Trong tủ còn cream cũ chưa hết hạn. Bạn xếp thế nào?",["Cream cũ để phía trước, cream mới xếp phía sau","Cream mới để phía trước cho dễ lấy","Để chung lộn xộn, hộp nào cũng được","Đổ cream cũ sang hộp mới cho gọn"],"Odeko just delivered new cream. There's older cream in the fridge that hasn't expired. How do you stock it?",["Older cream in front, new cream behind it","New cream in front so it's easy to grab","Mix them together, any carton is fine","Pour the old cream into the new cartons"],"FIFO (nhập trước, dùng trước): hàng cũ dùng trước nên ít bị hết hạn phải đổ bỏ. Hàng bị đổ bỏ là tiền mất, làm food cost tăng.","FIFO (first in, first out): older stock gets used first, so less expires and gets thrown out. Every carton poured out is money lost and raises food cost."],
["fc23","FC","FC","Bạn pha sai một ly và phải làm lại. Vì sao vẫn phải ghi ly đó vào sổ hao hụt/remake?",["Để biết hao hụt thật và tìm nguyên nhân để sửa","Để trừ tiền ly đó vào lương người pha sai","Để có số liệu khai thuế cuối năm cho quán","Không cần ghi vì chỉ là 1 ly, ít tiền"],"You made a drink wrong and had to remake it. Why should it still go in the waste/remake log?",["To know the real loss and find the cause so it can be fixed","To take the cost out of the barista's paycheck","To have numbers for the café's year-end taxes","No need, it's only one drink and costs little"],"Nguyên liệu đã dùng mà không có doanh thu. Nếu không ghi, kiểm kho sẽ lệch mà không ai biết vì sao. Sổ remake cho thấy lỗi lặp lại (đọc ticket, công thức) để huấn luyện lại.","The ingredients were used with no sale. Unlogged, inventory comes up short and nobody knows why. The remake log shows repeat mistakes (reading tickets, recipes) so they can be retrained."],
["fc24","FC","FC","Quản lý cho một khách quen 1 ly miễn phí. Bạn xử lý ly này trên POS thế nào?",["Bấm món vào POS rồi dùng chức năng Comp, ghi lý do","Pha luôn, ly miễn phí thì không cần bấm vào POS","Bấm như bình thường rồi bỏ tiền túi mình vào két","Bấm thành món rẻ nhất trên menu cho nhanh"],"The manager gives a regular a free drink. How do you handle it on the POS?",["Ring up the drink and use the POS comp function with a reason","Just make it; there's no need to ring a free drink into the POS","Ring it up normally and put your own money in the drawer","Ring it in as the cheapest item on the menu to save time"],"Comp phải có trên POS để số ly bán khớp với nguyên liệu đã dùng và quản lý biết đã cho bao nhiêu. Pha mà không bấm sẽ trông như hàng bị mất.","Comps must be on the POS so drinks sold match ingredients used and the manager can see how much was given away. A drink made but not rung in looks like missing stock."],
["fc25","FC","FC","Sáng nay bạn thấy 2 gallon sữa bị chua dù chưa tới hạn. Bạn làm gì?",["Bỏ đi, ghi vào sổ hư hỏng (món, số lượng, lý do, ngày) và báo quản lý","Bỏ đi, không cần ghi sổ vì sữa hư không phải lỗi của bạn","Cứ dùng tiếp, vì ngày in trên hộp vẫn chưa tới hạn","Trộn với sữa mới để vị chua bớt rõ hơn nhiều"],"This morning you find 2 gallons of milk have gone sour before the date. What do you do?",["Throw it out, log it on the spoilage sheet (item, amount, reason, date) and tell the manager","Throw it out; there's no need to log it since the spoilage wasn't your fault","Keep using it, since the date printed on the carton hasn't passed yet","Mix it into the fresh milk so the sour taste is a lot less noticeable"],"Sổ hư hỏng giúp thấy nguyên nhân (tủ không đủ lạnh, giao hàng lỗi) và đòi lại tiền nhà cung cấp nếu được. Không ghi thì kiểm kho lệch và lỗi cứ lặp lại.","The spoilage log shows the cause (warm fridge, bad delivery) and backs up a credit from the supplier. Unlogged, the count comes up short and the problem keeps happening."],
["fc26","FC","FC","Tuần này pha 28 mẻ cốt, mỗi mẻ 770 ml, đầu tuần không còn cốt, cuối tuần còn 1.100 ml. POS báo bán 420 ly, mỗi ly 45 ml cốt. Cốt bị hụt khoảng bao nhiêu?",["1.560 ml","2.660 ml","460 ml","21.560 ml"],"This week you made 28 batches of 770 ml concentrate, started with none and ended with 1,100 ml. The POS shows 420 drinks at 45 ml each. About how much concentrate is unaccounted for?",["1,560 ml","2,660 ml","460 ml","21,560 ml"],"Đã dùng = 28 × 770 − 1.100 = 20.460 ml. Theo POS phải dùng 420 × 45 = 18.900 ml. Chênh 1.560 ml, gần 2 mẻ, do rót dư, đổ bỏ hoặc ly không bấm.","Used = 28 × 770 − 1,100 = 20,460 ml. The POS says 420 × 45 = 18,900 ml. The gap is 1,560 ml, about 2 batches, from over-pouring, waste or drinks not rung in."],
["fc27","FC","FC","Đầu tháng tồn kho đồ uống $1,200, trong tháng mua $2,800, cuối tháng tồn $1,000. Doanh thu đồ uống $15,000. Food cost tháng này là bao nhiêu?",["20%","26,7%","18,7%","6,7%"],"Drink inventory was $1,200 at the start of the month, purchases were $2,800 and ending inventory is $1,000. Drink sales were $15,000. What is food cost for the month?",["20%","26.7%","18.7%","6.7%"],"Chi phí đã dùng = $1,200 + $2,800 − $1,000 = $3,000. $3,000 ÷ $15,000 = 20%. Chỉ lấy tiền mua chia doanh thu là sai, vì phải tính cả tồn kho.","Cost used = $1,200 + $2,800 − $1,000 = $3,000. $3,000 ÷ $15,000 = 20%. Dividing only purchases by sales is wrong, because inventory changes count."],
["fc28","FC","FC","Mỗi tuần quán đổ bỏ khoảng 3 gallon sữa hết hạn, mỗi gallon $5.12. Trong 4 tuần quán mất bao nhiêu tiền?",["$61.44","$15.36","$20.48","$184.32"],"The café pours out about 3 gallons of expired milk a week at $5.12 a gallon. How much money is lost over 4 weeks?",["$61.44","$15.36","$20.48","$184.32"],"3 gallon × $5.12 × 4 tuần = $61.44. Thấy hao hụt đều mỗi tuần thì nên giảm lượng đặt hàng hoặc chỉnh par.","3 gallons × $5.12 × 4 weeks = $61.44. Steady weekly waste means the order or par should be lowered."],
["fc29","FC","FC","Cách nào giúp chi phí mỗi ly giống nhau dù ai đứng bar?",["Đong bằng dụng cụ chuẩn (cân, jigger, pump) đúng theo công thức","Rót bằng mắt, vì người quen tay rót sẽ đều","Để mỗi người tự chỉnh lượng theo khẩu vị","Rót nhiều hơn công thức một chút cho khách vui"],"What keeps the cost of each drink the same no matter who is on bar?",["Measure with standard tools (scale, jigger, pump) per the recipe","Eyeball it, since experienced hands pour consistently anyway","Let each barista adjust the amounts to their own taste","Pour a bit more than the recipe to keep customers happy"],"Portion control: đong đúng thì mỗi ly có cùng chi phí và cùng vị. Rót bằng mắt thường dư vài ml mỗi ly, cộng lại thành nhiều tiền mỗi tháng.","Portion control: measuring gives every drink the same cost and taste. Eyeballing usually adds a few ml per drink, which adds up to real money each month."],
["fc30","FC","FC","Nhà cung cấp tăng giá matcha từ $77 lên $88 cho 500 g. Mỗi ly dùng 4 g. Chi phí mỗi ly matcha tăng khoảng bao nhiêu?",["Khoảng $0.09","Khoảng $0.70","Khoảng $11","Khoảng $0.02"],"The supplier raises matcha from $77 to $88 per 500 g. Each drink uses 4 g. About how much does the cost per matcha drink go up?",["About $0.09","About $0.70","About $11","About $0.02"],"Tăng $11 cho 500 g, tức $0.022/g. × 4 g ≈ $0.09 mỗi ly. Khi giá nhập đổi, tính lại chi phí mỗi ly để xem food cost còn đạt mục tiêu không.","The increase is $11 per 500 g, or $0.022 per gram. × 4 g ≈ $0.09 per drink. When a supplier price changes, recost the drink to check it still hits the food cost target."],
["ut01","UT","UT","Bạn đứng ca một mình, đang pha 3 ly đã nhận thì có khách mới bước tới quầy. Việc nên làm trước tiên là gì?",["Chào khách mới và báo sẽ nhận order ngay sau khi xong mấy ly này","Bỏ dở 3 ly để nhận order khách mới ngay","Pha xong cả 3 ly rồi mới nhìn lên chào khách mới","Chỉ tay về phía kiosk, không nói gì và làm tiếp"],"You are alone on shift, making 3 drinks already ordered, when a new customer walks up. What should you do first?",["Greet them and say you'll take their order as soon as these drinks are done","Stop the 3 drinks halfway and take the new customer's order right away","Finish all 3 drinks first, then look up and greet the new customer","Point them toward the kiosk without saying anything and keep working"],"",""],
["ut02","UT","UT","Khách quay lại quầy nói ly cà phê quá ngọt, đã uống khoảng 1/3. Bạn nên làm gì?",["Xin lỗi, hỏi khách muốn ngọt cỡ nào rồi làm lại ly mới","Giải thích đây là công thức chuẩn của quán, không đổi được","Thêm đá vào ly của khách cho bớt ngọt","Đề nghị giảm 10% nếu khách muốn mua thêm ly khác"],"A customer comes back and says their coffee is too sweet. They've drunk about a third. What should you do?",["Apologize, ask how sweet they'd like it and remake the drink","Explain this is the café's standard recipe and can't be changed","Add some extra ice to their cup so it tastes less sweet","Offer them 10% off if they'd like to buy another drink"],"",""],
["ut03","UT","UT","Một đơn online Square vào lúc 2:05. Một khách tại quầy order lúc 2:07. Pha đơn nào trước?",["Đơn online, vì vào trước","Khách tại quầy, vì khách đang đứng chờ","Đơn nào ít ly hơn","Đơn nào nhiều tiền hơn"],"An online Square order came in at 2:05. A walk-in ordered at 2:07. Which do you make first?",["The online order, because it came in first","The walk-in, because they're standing there","Whichever has fewer drinks","Whichever is worth more"],"",""],
["ut04","UT","UT","Còn 10 phút nữa là đóng cửa lúc 8 giờ tối. Một khách vào order 4 ly. Bạn làm gì?",["Nhận order và pha bình thường, vì quán vẫn đang mở","Nói quán đã ngưng nhận order vì sắp tới giờ đóng cửa","Chỉ nhận 1 hoặc 2 ly để kịp đóng cửa đúng giờ","Bảo khách lần sau order online, vì giờ đã quá trễ"],"It's 10 minutes before the 8 pm closing time. A customer orders 4 drinks. What do you do?",["Take the order and make it as usual, since the café is still open","Tell them you've stopped taking orders since it's almost closing","Only take 1 or 2 of the drinks so you can close up on time","Tell them to order online next time, since it's too late now"],"",""],
["ut05","UT","UT","Một khách nói đã lấy nhầm ly của người khác và đã uống. Cả hai khách đang đứng ở quầy. Bạn làm gì?",["Xin lỗi, làm lại ly đúng cho cả hai, và gọi tên rõ ràng hơn khi trả ly","Bảo hai khách đổi ly cho nhau, vì ly nào cũng pha đúng rồi","Để hai khách tự giải quyết với nhau, vì đó không phải lỗi của bạn","Từ chối làm lại vì khách đã uống rồi, và gọi order tiếp theo"],"A customer took and drank someone else's drink. Both customers are at the counter. What do you do?",["Apologize, remake the right drinks for both and call names more clearly at pickup","Ask them to swap drinks with each other, since both were made correctly","Let the two of them sort it out themselves, since it wasn't your mistake","Refuse to remake anything since it was already drunk, and call the next order"],"",""],
["ut06","UT","UT","Máy POS bị treo giữa giờ đông. Bạn làm gì?",["Báo quản lý, chuyển sang kiosk hoặc ghi order bằng tay theo quy trình, và báo khách sẽ chờ lâu hơn","Cứ khởi động lại POS cho tới khi chạy, và bảo khách đứng chờ mà không giải thích gì","Bảo khách quay lại sau và khóa quầy thu ngân cho tới khi POS chạy lại","Nhận tiền mặt và pha luôn mà không ghi lại đơn, để hàng chờ đi nhanh"],"The POS freezes during a rush. What do you do?",["Tell the manager, switch to the kiosk or write orders by hand per the procedure, and let customers know there's a wait","Keep restarting the POS until it works, and ask customers to wait without explaining anything","Tell customers to come back later and close the register until the POS starts working again","Take cash and make drinks without recording the sales, so the line keeps moving quickly"],"",""],
["ut07","UT","UT","Một khách phàn nàn lớn tiếng trước mặt các khách khác. Bạn làm gì?",["Giữ bình tĩnh, lắng nghe, xin lỗi và đưa cách giải quyết; nếu căng thì gọi quản lý","Cãi lại cho rõ để các khách khác thấy quán không có lỗi","Phớt lờ, cứ phục vụ khách khác cho tới khi khách tự bình tĩnh","Bảo khách ra khỏi quán ngay để không làm phiền các khách khác"],"A customer is complaining loudly in front of other customers. What do you do?",["Stay calm, listen, apologize and offer a fix; call the manager if it escalates","Argue back firmly so the other customers see the café isn't at fault","Ignore them and keep serving others until they calm down on their own","Tell them to leave right away so they stop upsetting the other guests"],"",""],
["ut08","UT","UT","Đang đông khách thì sữa bị đổ ra sàn sau quầy. Bạn làm gì?",["Lau ngay hoặc đặt biển cảnh báo trơn trượt, vì trơn ngã rất nguy hiểm","Để cuối ca rồi lau một lần cho tất cả chỗ đổ","Phủ khăn giấy lên và làm tiếp cho tới khi bớt khách","Bước né cẩn thận và nhắc đồng nghiệp coi chừng trong lúc làm"],"During a rush, milk spills on the floor behind the counter. What do you do?",["Wipe it up right away or put out a wet-floor sign, because slips are dangerous","Leave it until the end of the shift and clean all the spills at once","Cover it with paper towels and keep going until the rush slows down","Step around it carefully and tell coworkers to watch out while you work"],"",""],
["ut09","UT","UT","Giữa giờ đông, máy đá hết đá. Bạn làm gì?",["Báo ngay đồng đội hoặc quản lý, lấy đá dự phòng, và báo khách nếu phải chờ","Làm đồ uống không đá mà không hỏi khách, để hàng chờ đi nhanh","Lặng lẽ cho ít đá vào mọi ly để đá dự phòng đủ dùng tới khi máy ra đá lại","Ngưng bán đồ lạnh mà không báo ai, chỉ bán đồ nóng trong lúc này"],"In the middle of a rush, the ice machine runs out. What do you do?",["Tell a coworker or manager right away, get backup ice and let customers know if there's a wait","Make drinks with no ice without asking customers, so the line keeps moving fast","Quietly put less ice in every drink so the backup lasts until the machine refills","Stop selling cold drinks without telling anyone, and only offer hot drinks for now"],"",""],
["ut10","UT","UT","Một khách quen xin giảm giá vì tuần nào cũng tới, nhưng quán không có chương trình đó. Bạn làm gì?",["Cảm ơn khách, giải thích hiện chưa có chương trình, và báo quản lý nếu khách muốn","Tự ý giảm 20% vì khách quen, rồi báo quản lý sau cũng được","Nói thẳng là không có giảm giá rồi quay sang khách kế, không cảm ơn","Cho ly này miễn phí để khách vui, rồi ghi chú lại trên hóa đơn"],"A regular asks for a discount because they come every week, but there's no such program. What do you do?",["Thank them, explain there's no program right now, and pass it to the manager if they'd like","Give them 20% off on your own since they're a regular, and tell the manager later","Tell them flatly there are no discounts and turn to the next customer without thanks","Ring up their drink for free this time so they stay happy, and note it on the receipt"],"",""],
["ut11","UT","UT","9:05 sáng, có một đơn online đặt lúc 9:00 hẹn lấy lúc 9:45. Quầy đang có 3 khách tại chỗ chờ. Bạn làm thế nào?",["Pha cho khách đang chờ trước, rồi canh giờ pha đơn online để xong đúng 9:45","Pha đơn online ngay vì nó vào trước khách đang chờ","Pha đơn online ngay rồi để sẵn trên kệ chờ tới 9:45","Chờ khách online tới quầy rồi mới bắt đầu pha đơn đó"],"It's 9:05 am. An online order placed at 9:00 is scheduled for pickup at 9:45. Three walk-ins are waiting. What do you do?",["Serve the waiting walk-ins first, then time the online order to be ready at 9:45","Make the online order now since it came in before the walk-ins","Make the online order now and leave it on the shelf until 9:45","Wait until the online customer arrives before starting their order"],"Đơn hẹn giờ thì xếp theo giờ lấy, không theo giờ đặt. Pha quá sớm thì đá tan, đồ uống mất ngon; chờ khách tới mới pha thì khách phải đợi.","Scheduled orders go by pickup time, not order time. Made too early, the ice melts and the drink suffers; started only when they arrive, the customer waits."],
["ut12","UT","UT","Giờ đông có 3 ticket liền nhau đều là Salted Cream Coffee đá, một ly ghi \"ít ngọt\". Cách nào nhanh mà vẫn đúng?",["Pha 3 ly cùng lúc theo công thức, chỉnh riêng ly ít ngọt và ghi tên từng ly","Pha chung một bình lớn rồi chia đều ra 3 ly","Pha cả 3 ly giống nhau cho nhanh, lần này bỏ qua ghi chú ít ngọt","Pha từng ly một, xong hẳn ly này mới bắt đầu ly kia"],"In a rush you get 3 tickets in a row, all iced Salted Cream Coffee, one marked \"less sweet\". What's fast and still correct?",["Make all 3 together per the recipe, adjust the less-sweet one and label each with a name","Mix one big pitcher of the drink and split it evenly into the 3 cups","Make all 3 the same to save time and skip the less-sweet note this once","Make them one at a time, starting each only after the last one is done"],"Gom món giống nhau (batching) giúp nhanh hơn, nhưng mỗi ly vẫn phải đúng công thức và đúng ghi chú của khách. Ghi tên lên ly để trả không nhầm.","Batching the same drinks is faster, but each cup still follows the recipe and the customer's note. Label cups with names so pickup doesn't get mixed up."],
["ut13","UT","UT","Đang có 12 ly chờ pha. Khách mới hỏi: \"Bao lâu thì có?\" Bạn trả lời sao?",["Nói thật thời gian ước tính, ví dụ \"khoảng 10 đến 15 phút\", để khách tự quyết","Nói \"một xíu thôi\" cho khách yên tâm, dù thật ra sẽ lâu hơn","Nói \"không biết, tùy đang có bao nhiêu đơn\"","Không trả lời, tập trung pha tiếp các ly đang chờ"],"There are 12 drinks in the queue. A new customer asks, \"How long will it be?\" What do you say?",["Give an honest estimate, like \"about 10 to 15 minutes\", so they can decide","Say \"just a minute\" so they don't worry, even though it will be longer","Say \"I don't know, it depends on how many orders there are\"","Don't answer and stay focused on making the drinks in the queue"],"Báo thời gian thật lúc order giúp khách bớt khó chịu hơn là hứa nhanh rồi bắt chờ lâu. Khách gấp có thể chọn món nhanh hơn hoặc quay lại sau.","An honest wait time at ordering upsets people less than a quick promise followed by a long wait. A customer in a hurry can pick something faster or come back."],
["ut14","UT","UT","Khách lấy đơn online quay lại nói túi thiếu 1 ly. Bạn làm gì?",["Xem ticket, xin lỗi, pha ngay ly thiếu trước và ghi lại lỗi","Nhắc khách lần sau kiểm tra túi trước khi đi, vậy là xong","Bảo khách liên hệ Square để xin hoàn tiền, vì đây là đơn online","Hỏi khách có chắc không, rồi bắt khách chờ quản lý quyết"],"An online pickup customer comes back saying one drink was missing from the bag. What do you do?",["Check the ticket, apologize, make the missing drink first and note the mistake","Remind them to check their bag before leaving next time, and leave it there","Tell them to contact Square for a refund, since it was an online order","Ask if they're sure, then have them wait until the manager decides"],"Ticket xác nhận đơn có những gì. Lỗi của quán thì sửa ngay, ưu tiên ly đó vì khách đã chờ một lần rồi. Ghi lại để biết khâu đóng túi bị sót.","The ticket confirms what was ordered. It's the café's mistake, so fix it now and put that drink first since they already waited once. Note it so the bagging step gets checked."],
["ut15","UT","UT","Khách order cà phê đá nhưng nhận ly nóng do bạn bấm nhầm. Đang có 5 ly chờ. Ly làm lại xếp ở đâu?",["Làm ngay ly tiếp theo, xin lỗi khách và ghi vào sổ remake","Xếp cuối hàng như một order mới","Đổ đá vào ly nóng cho nguội rồi đưa lại khách","Bảo khách ra kiosk bấm lại order cho đúng"],"A customer ordered an iced coffee but got a hot one because you rang it wrong. There are 5 drinks in the queue. Where does the remake go?",["Make it next, apologize and log it as a remake","At the back of the line like any new order","Pour ice into the hot drink to cool it and hand it back","Ask them to go reorder correctly at the kiosk"],"Khách đã chờ một lần vì lỗi của quán, nên remake được làm ngay. Đổ đá vào ly nóng làm loãng và sai công thức. Ghi sổ remake để tính hao hụt.","The customer already waited because of the café's mistake, so remakes go next. Ice in a hot drink waters it down and isn't the recipe. Log it so the waste is counted."],
["ut16","UT","UT","Một khách đẩy xe em bé order 2 ly và 2 bánh tart, khó cầm hết. Bạn làm gì?",["Hỏi khách có muốn bạn mang ra bàn hoặc lấy khay/túi giùm không","Đặt hết lên quầy, để khách tự xoay xở cách cầm","Gợi ý lần sau khách order ít hơn cho dễ cầm","Đưa hết vào tay khách thật nhanh để hàng đi tiếp"],"A customer with a stroller orders 2 drinks and 2 egg tarts and can't carry it all. What do you do?",["Ask if they'd like you to bring it to their table or give them a tray or bag","Set everything on the counter and let them work out how to carry it","Suggest they order less next time so it's easier to carry","Hand it all to them quickly so the line keeps moving"],"Một chút giúp đỡ (mang ra bàn, đưa khay, mở cửa) giúp tránh đổ đồ nóng và làm khách nhớ quán. Hỏi trước để khách chọn cách họ thấy tiện.","A little help (bringing it over, a tray, holding the door) prevents hot spills and makes customers remember you. Ask first so they choose what works for them."],
["ut17","UT","UT","Một khách đang giận và quay video bạn bằng điện thoại. Bạn làm gì?",["Giữ bình tĩnh, nói chuyện lịch sự như bình thường, giải quyết vấn đề và gọi quản lý","Giật điện thoại hoặc lấy tay che camera để ngừng quay","Cãi lại cho rõ để video có cả lời giải thích của bạn","Từ chối phục vụ cho tới khi khách cất điện thoại và xin lỗi"],"An angry customer is filming you on their phone. What do you do?",["Stay calm, speak politely as usual, work on the problem and call the manager","Grab the phone or cover the camera with your hand to stop the video","Argue back firmly so your side of the story is on the video too","Refuse to serve them until they put the phone away and apologize"],"Bạn không kiểm soát được việc khách quay, nhưng kiểm soát được cách mình cư xử. Bình tĩnh và lịch sự là cách tốt nhất cho cả bạn và quán. Không chạm vào khách hay đồ của khách.","You can't control the filming, but you can control how you act. Calm and polite is the best outcome for you and the café. Never touch the customer or their phone."],
["ut18","UT","UT","Một khách order ở kiosk chọn \"trả tại quầy\", lấy ly rồi đi ra mà chưa trả tiền. Bạn làm gì?",["Không đuổi theo; báo quản lý và ghi lại order, giờ và mô tả khách","Chạy theo ra bãi xe để đòi lại tiền","Lấy tiền túi mình bù vào két cho khớp","Không nói với ai, lần này bỏ qua vì chỉ là một ly"],"A customer orders at the kiosk choosing \"pay at counter\", takes the drink and walks out without paying. What do you do?",["Don't chase; tell the manager and log the order, time and a description","Run after them into the parking lot so you can get the money","Pay for it out of your own pocket so the drawer comes out even","Tell no one and just let it go this time, since it's only one drink"],"An toàn của bạn quan trọng hơn một ly nước, nên không đuổi theo. Báo quản lý và ghi lại để két và kiểm kho khớp, và để quản lý xem lại cách nhận order chưa trả tiền.","Your safety matters more than a drink, so don't chase. Tell the manager and write it down so the drawer and inventory reconcile and the manager can review unpaid-order handling."],
["ut19","UT","UT","Giờ đông, điện thoại quán reo. Bạn đang đứng quầy một mình. Bạn làm gì?",["Bắt máy, chào ngắn, nhờ khách giữ máy hoặc chỉ order online, rồi quay lại quầy","Phớt lờ suốt giờ đông và tắt chuông cho khỏi bị phân tâm","Bắt máy và nói chuyện lâu trong khi khách ở quầy đứng chờ","Rút dây điện thoại tới hết giờ đông rồi cắm lại sau"],"During a rush the café phone rings. You're alone at the counter. What do you do?",["Answer, greet briefly, ask them to hold or point them to online ordering, then return","Ignore it for the whole rush and turn the ringer off so it won't distract you","Answer and have a long chat while the customers at the counter wait","Unplug the phone for the rest of the rush and plug it back in later"],"Cuộc gọi có thể là khách đặt catering hay hỏi đơn, nên vẫn bắt máy. Nhưng khách đứng trước mặt được ưu tiên, nên giữ cuộc gọi thật ngắn.","The call may be catering or an order question, so pick up. But the guest in front of you comes first, so keep the call short."],
["ut20","UT","UT","2 giờ chiều, bánh tart trứng vừa bán hết. Bạn làm gì?",["Báo khách hết, gợi ý món khác, và tắt (86) món đó trên POS, kiosk và online","Chỉ báo khách tại quầy, để nguyên kiosk và menu online","Cứ nhận order rồi hoàn tiền sau nếu khách hỏi","Bảo khách chờ, vì chiều nay sẽ có mẻ bánh mới"],"At 2 pm the egg tarts just sold out. What do you do?",["Tell customers, suggest something else, and 86 the item on the POS, kiosk and online","Tell counter customers only, and leave the kiosk and online menu as they are","Keep taking orders anyway and refund anyone who asks about it later","Tell customers to wait, since a new batch will come out this afternoon"],"Bánh tart nướng mỗi sáng nên hết là hết trong ngày. Phải 86 trên mọi kênh, nếu không khách vẫn đặt được qua kiosk hoặc online rồi phải hoàn tiền và mất lòng.","Egg tarts are baked each morning, so sold out means done for the day. 86 it on every channel, or kiosk and online customers will still order it and need refunds."],
["ut21","UT","UT","Kiosk tự order bị lỗi, màn hình đứng. Quầy đang khá đông. Bạn làm gì trước?",["Đặt bảng \"Vui lòng order tại quầy\", hướng khách tới quầy và báo quản lý","Bỏ quầy để tắt mở lại kiosk ngay, dù đang giữa giờ đông","Để khách tự bấm màn hình tới khi kiosk tự chạy lại","Ngưng nhận mọi order ở quầy cho tới khi kiosk chạy lại"],"The self-order kiosk errors out and the screen freezes. The counter is fairly busy. What do you do first?",["Put up a \"Please order at the counter\" sign, direct people to the counter and tell the manager","Leave the counter to restart the kiosk right away, even in the middle of the rush","Let customers keep tapping the screen until it starts working again on its own","Stop taking all orders at the counter until the kiosk is working again"],"Khách cần biết order ở đâu ngay lập tức, nên báo bằng bảng và lời nói trước. Quản lý sẽ lo sửa kiosk khi bớt đông; quầy vẫn bán bình thường.","Customers need to know where to order right away, so a sign and a word come first. The manager can fix the kiosk when it slows down; the counter keeps selling."],
["ut22","UT","UT","Tài xế giao hàng tới nói: \"Lấy đơn cho Linh.\" Có 2 túi ghi tên Linh trên kệ. Bạn làm gì?",["So mã đơn trên app tài xế với ticket trước khi đưa túi","Đưa túi tên Linh nào xong trước, vì túi đó chờ lâu nhất","Đưa cả 2 túi cho chắc là tài xế có đúng đơn","Để tài xế mở xem cả 2 túi rồi tự chọn"],"A delivery driver says, \"Pickup for Linh.\" There are 2 bags labeled Linh on the shelf. What do you do?",["Check the order number on the driver's app against the ticket first","Give them whichever Linh bag was finished first, since it's oldest","Give them both bags so they're sure to have the right order","Let the driver look inside both bags and pick the one they think"],"Trùng tên rất thường gặp. So mã đơn trên app tài xế với ticket mới chắc đúng người, tránh mất đơn và phải làm lại.","Duplicate names are common. Matching the order number on the driver's app with the ticket makes sure the right order leaves, avoiding a lost order and a remake."],
["ut23","UT","UT","Giờ đông, khi nào bạn nên lau và xả vòi đánh sữa (steam wand)?",["Sau mỗi lần đánh sữa, kể cả khi đang đông","Chỉ một lần, khi hết giờ đông","Cuối ca, lúc vệ sinh máy","Khi thấy sữa khô bắt đầu bám"],"During a rush, when should you wipe and purge the steam wand?",["After every time you steam milk, even in a rush","Only once, after the rush is over","At closing, during the full clean","Whenever dried milk starts to build up"],"Sữa bám trên vòi khô lại rất nhanh, dễ nghẹt và là chỗ vi khuẩn phát triển. Xả và lau bằng khăn riêng ngay sau mỗi lần đánh chỉ mất vài giây.","Milk on the wand dries fast, clogs it and lets bacteria grow. Purging and wiping with its own cloth after every use takes only seconds."],
["ut24","UT","UT","Bạn đứng bar, hàng chờ đã 8 người, đồng nghiệp đang xếp hàng trong kho. Bạn làm gì?",["Gọi đồng nghiệp ra và nói rõ việc, ví dụ \"bạn đứng quầy giúp mình\"","Cố làm một mình để không làm gián đoạn việc xếp kho","Chờ đồng nghiệp tự thấy đông rồi ra","Nhắn tin than với quản lý là phải làm một mình"],"You're on bar, the line is 8 deep, and your coworker is stocking in the back. What do you do?",["Call your coworker up and name the task, like \"you take register\"","Push through alone so you don't interrupt their stocking","Wait for them to notice the line and come out","Text the manager to complain about being alone"],"Xếp kho có thể chờ, khách thì không. Nhờ giúp sớm và nói rõ việc giúp đồng đội vào việc ngay, không phải đoán.","Stocking can wait; customers can't. Asking early and naming the task gets your coworker working right away without guessing."],
["ut25","UT","UT","Vừa hết giờ đông. Việc nên làm trước khi nghỉ tay là gì?",["Châm lại ly, nắp, đá, sữa và lau bar để sẵn sàng đợt sau","Nghỉ giải lao trước, quay lại rồi mới dọn bar","Chỉ đếm tiền trong két, để quầy bar nguyên như vậy","Để dồn tới cuối ca rồi dọn một lần cho xong"],"The rush just ended. What should you do before taking a breather?",["Restock cups, lids, ice and milk, and wipe down the bar for the next wave","Take your break first and clean up the bar after you come back","Count the cash drawer and leave the bar as it is for now","Leave the reset for one big clean at the end of the shift"],"Reset ngay sau giờ đông giúp đợt khách tiếp theo không bị thiếu đồ và quầy luôn sạch. Để dồn tới cuối ca thì đợt đông sau sẽ rối hơn.","Resetting right after a rush means the next wave doesn't hit an empty, messy bar. Leaving it until close makes the next rush harder."],
["ut26","UT","UT","Bạn trả ly cà phê nóng cho một khách đang bế em bé. Cách nào an toàn nhất?",["Đậy nắp chặt, đặt ly lên quầy và nói \"cẩn thận, nóng\"","Đưa thẳng vào tay khách, với qua người em bé cho nhanh","Mở nắp sẵn để khách dễ uống","Đưa ly qua quầy thật nhanh để khách khỏi phải chờ"],"You're handing a hot coffee to a customer holding a baby. What's safest?",["Secure the lid, set the cup on the counter and say \"careful, it's hot\"","Hand it straight to them, reaching over the baby to save time","Take the lid off first so it's easier for them to sip","Pass it over the counter quickly so they don't have to wait"],"Đồ uống nóng có thể gây bỏng nặng, nhất là với trẻ nhỏ. Nắp chặt, đặt ly xuống quầy và nhắc nóng để khách tự cầm khi sẵn sàng.","Hot drinks can cause serious burns, especially to small children. A secure lid, setting it down and a heads-up let the customer pick it up when ready."],

document.addEventListener("click",e=>{
  const lg=e.target.closest("[data-lang]");if(lg){lang=lg.dataset.lang;ls.set("hs_lang",lang);render();return}
  const tab=e.target.closest("[data-tab]");
  if(tab){if(tab.dataset.tab!=="skill")pr={on:false};cur=tab.dataset.tab;ls.set("hs_tab",cur);openPerson=null;render();window.scrollTo({top:0});return}
  const pv=e.target.closest("[data-pv]");
  if(pv){if(!pr.on||pr.pick!==null)return;pr.pick=+pv.dataset.pv;pr.n++;if(pr.pick===pr.perm.indexOf(0))pr.ok++;render();const x=$(".pexp");if(x)x.scrollIntoView({behavior:"smooth",block:"nearest"});return}
  const ptp=e.target.closest("[data-ptopic]");if(ptp){pracStart(ptp.dataset.ptopic);render();window.scrollTo({top:0});return}
  if(e.target.id==="sprac"){pracStart();render();window.scrollTo({top:0});return}
  if(e.target.id==="pnext"){pr.i++;pr.lap=false;if(pr.i>=pr.order.length){pr.order=shuf(pr.order);pr.i=0;pr.lap=true}pr.pick=null;pr.perm=shuf([0,1,2,3]);render();window.scrollTo({top:0});return}
  if(e.target.id==="pexit"){pr={on:false};render();window.scrollTo({top:0});return}
  const so=e.target.closest(".sopt");
  if(so){if(done.skill||!skillSt.start)return;const q=+so.dataset.sq,v=+so.dataset.sv;(answers.skill=answers.skill||{})[q]=v;ls.set("hs2_ans",answers);
    so.parentNode.querySelectorAll(".sopt").forEach(b=>b.classList.toggle("on",b===so));$("#q"+q).classList.remove("miss");$("#err").textContent="";skillWarn=false;
    $("#cnt").textContent=fmt(t$().answered,{a:Object.keys(answers.skill).length,n:SKN});return}
  if(e.target.id==="sstart"){if(!$("#pname").value.trim()){$("#err").textContent=t$().needName;$("#pname").focus();return}
    pr={on:false};skillSt={start:Date.now(),draw:skillDraw()};ls.set("hs2_skill",skillSt);syncSkill();answers.skill={};ls.set("hs2_ans",answers);render();window.scrollTo({top:0});return}
  if(e.target.id==="ssubmit"){const a=answers.skill||{},miss=[...Array(SKN).keys()].filter(i=>a[i]===undefined);
    if(!$("#pname").value.trim()){$("#err").textContent=t$().needName;$("#pname").focus();return}
    if(miss.length&&!skillWarn){skillWarn=true;miss.forEach(i=>$("#q"+i).classList.add("miss"));$("#err").textContent=fmt(SKL[lang].unanswered,{n:miss.length});return}
    finishSkill(false);return}
  const o=e.target.closest(".opt");
  if(o){const t=T().find(x=>x.id===cur);const q=+o.dataset.q,v=+o.dataset.v;(answers[t.id]=answers[t.id]||{})[q]=v;ls.set("hs2_ans",answers);
    o.parentNode.querySelectorAll(".opt").forEach(b=>b.classList.toggle("on",b===o));$("#q"+q).classList.remove("miss");$("#err").textContent="";
    $("#cnt").textContent=fmt(t$().answered,{a:Object.keys(answers[t.id]).length,n:t.items.length});return}
  if(e.target.id==="submit"){const S=t$(),t=T().find(x=>x.id===cur),a=answers[t.id]||{};
    if(!$("#pname").value.trim()){$("#err").textContent=S.needName;$("#pname").focus();return}
    const miss=t.items.map((_,i)=>i).filter(i=>a[i]===undefined);
    if(miss.length){miss.forEach(i=>$("#q"+i).classList.add("miss"));$("#err").textContent=fmt(S.missing,{n:miss.length});$("#q"+miss[0]).scrollIntoView({behavior:"smooth",block:"center"});return}
    done[t.id]=1;ls.set("hs2_done",done);chips();showResult(t,true);$("#res").scrollIntoView({behavior:"smooth",block:"start"});return}
  if(e.target.id==="copy"){copyText();return}
  if(e.target.id==="resave"){const t=T().find(x=>x.id===cur);if(t)saveResult(t);return}
  if(e.target.id==="csv"){downloadCsv();return}
  if(e.target.id==="sync"){syncSheet();return}
  const pe=e.target.closest("[data-person]");if(pe)showPerson(pe.dataset.person);
});
document.addEventListener("input",e=>{
  if(e.target.id==="pname")ls.set("hs_who",{n:$("#pname").value});
  if(e.target.id==="filter"){ls.set("hs_filter",e.target.value);const pos=e.target.selectionStart;renderResults();const f=$("#filter");f.focus();f.setSelectionRange(pos,pos)}
});
$("#pname").addEventListener("change",()=>{
  const w=ls.get("hs_lastname",""),n=$("#pname").value.trim();
  if(w&&n&&w!==n){answers={};done={};skillSt={};pr={on:false};ls.set("hs2_ans",answers);ls.set("hs2_done",done);ls.set("hs2_skill",skillSt);syncSkill();render()}
  ls.set("hs_lastname",n);
});
$("#pname").value=(ls.get("hs_who",{})||{}).n||"";
render();
if(skillSt.start&&!done.skill&&skillLeft()<=0)finishSkill(true);

if(window.claude&&window.claude.use)(async()=>{
  try{
    [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(user){isOwn=await user.isOwner().catch(()=>false);isAdmin=isOwn||await user.canEdit().catch(()=>false)}
    if(db){
      if(isAdmin)mode="admin";
      else{uid=user?await user.id().catch(()=>null):null;const cw=user?await user.can("data.write").catch(()=>null):null;mode=uid&&cw!==false?"self":"none"}
    }
    if(db&&isAdmin){
      db.collection("people").onSnapshot(s=>{people={};s.docs.forEach(d=>people[d.id]=d.data());if(cur==="results")renderResults()},()=>{});
      if(isOwn)db.collection("subs").onSnapshot(s=>{subs={};s.docs.forEach(d=>subs[d.id]=d.data());if(cur==="results")renderResults()},()=>{});
    }
    if(!isAdmin&&cur==="results")cur="mbti";
    render();
  }catch(e){}
})();
</script>

</body>
</html>
