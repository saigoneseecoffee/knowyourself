["qd31","QT","DU","Theo luật Massachusetts, poster về dị ứng thực phẩm phải được dán ở đâu?",["Ở khu vực nhân viên làm việc","Ở cửa sổ ngoài tiệm","Trong nhà vệ sinh khách","Không cần dán, chỉ cần để trong tủ hồ sơ"],"Under Massachusetts rules, where must the food allergy awareness poster be displayed?",["In the staff work area","In the front window","In the customer restroom","Nowhere, it just goes in the files"],"Luật Massachusetts (105 CMR 590) yêu cầu dán poster nhận biết dị ứng thực phẩm ở khu vực nhân viên, để ai cũng nhớ cách xử lý đơn dị ứng.","Massachusetts rules (105 CMR 590) require a food allergy awareness poster in the staff area so everyone remembers how to handle allergy orders."],
["qd32","QT","DU","Theo luật Massachusetts, ai trong quán bắt buộc phải hoàn thành khóa đào tạo Allergen Awareness (nhận biết dị ứng)?",["Người quản lý giữ chứng chỉ Certified Food Protection Manager","Chỉ nhân viên đứng quầy thu ngân, không phải quản lý","Tất cả nhân viên mới trong tuần đầu đi làm","Không ai cả, khóa này chỉ là tự chọn ở Massachusetts"],"Under Massachusetts rules, who in the shop must complete allergen awareness training?",["The Certified Food Protection Manager","Only the cashiers, not the manager","Every new hire during their first week","No one; it's optional in Massachusetts"],"Ở Massachusetts, người giữ chứng chỉ Certified Food Protection Manager phải học khóa Allergen Awareness được bang chấp thuận, và chứng nhận phải treo ở quán. Nhân viên khác vẫn nên học để phục vụ khách dị ứng an toàn.","In Massachusetts, the Certified Food Protection Manager must complete a state-approved allergen awareness course, and the certificate must be posted. Other staff should still learn it to serve allergic guests safely."],
["qd33","QT","DU","Bạn đã rắc đậu phộng lên ly thì khách mới nói bị dị ứng đậu phộng, bảo bạn \"hớt topping ra là được\". Bạn làm gì?",["Bỏ ly đó, pha ly mới bằng dụng cụ sạch, không có đậu phộng","Hớt sạch đậu phộng bằng muỗng sạch rồi đưa khách như khách yêu cầu","Khuấy đều cho đậu phộng chìm xuống đáy rồi đưa ly","Đưa ly đó kèm ống hút riêng và nhắc khách đừng uống phần đáy"],"You've already sprinkled peanuts on a drink when the guest says they're allergic and tells you \"just scoop it off\". What do you do?",["Throw that drink out and make a new one with clean tools, no peanuts","Scoop the peanuts off with a clean spoon and serve it as the guest asked","Stir so the peanuts sink to the bottom, then serve it","Serve it with a separate straw and tell them to skip the bottom"],"Hớt topping ra vẫn còn mảnh và bụi đậu phộng trong ly. Món đã dính chất gây dị ứng phải làm lại từ đầu bằng dụng cụ sạch.","Scooping off the topping still leaves peanut bits and dust in the drink. A drink that touched an allergen must be remade from scratch with clean tools."],
["qd34","QT","DU","Khách dị ứng mè hỏi về đồ uống. Món nào bạn phải kiểm tra kỹ trước khi trả lời?",["Sữa mè đen","Cà phê đen pha phin nguyên chất","Trà lài đá không đường","Nước suối đóng chai"],"A guest with a sesame allergy asks about drinks. Which item must you check carefully before answering?",["Black sesame milk","Plain phin black coffee","Unsweetened iced jasmine tea","Bottled spring water"],"Mè (vừng) là chất gây dị ứng chính thứ 9 theo luật Mỹ từ năm 2023. Món Việt hay dùng mè trong đồ uống, chè và bánh, nên kiểm tra công thức và nhãn trước khi trả lời.","Sesame became the 9th major allergen under US law in 2023. Vietnamese drinks, desserts and pastries often use sesame, so check the recipe and labels before answering."],
["qt47","QT","NH","Nhận hàng, bạn thấy một hộp đồ hộp bị phồng ở hai đầu. Bạn làm gì?",["Từ chối nhận hộp đó","Nhận nhưng dùng trước","Ấn cho xẹp rồi cất","Nhận nếu còn hạn"],"While receiving, you see a can with bulging ends. What do you do?",["Reject it","Accept it and use it first","Press it flat and store it","Accept it if it's not expired"],"Hộp phồng, móp ở mí, rỉ hoặc rò có thể chứa vi khuẩn gây ngộ độc nặng. Phải từ chối hoặc loại bỏ.","Bulging, dented-seam, rusty or leaking cans can carry dangerous bacteria. Reject or discard them."],
["qt48","QT","NH","Hàng đông lạnh giao tới có nhiều tinh thể đá lớn và vết nước đông trên thùng. Điều đó cho thấy gì?",["Hàng có thể đã rã đông rồi đông lại, nên từ chối","Hàng còn rất tươi và đông kỹ, nên nhận","Đá bám bình thường do xe lạnh, nên nhận","Thùng bị ướt trên đường, chỉ cần lau khô"],"Frozen goods arrive with large ice crystals and frozen liquid stains on the box. What does that mean?",["They may have thawed and refrozen, so reject them","They are extra fresh and well frozen, so accept them","It's normal frost from the truck, so accept them","The box just got wet on the way, so dry it off"],"Tinh thể đá lớn và vết nước đông là dấu hiệu hàng bị rã đông rồi đông lại, đã nằm trong vùng nguy hiểm. Không nhận.","Large ice crystals and frozen liquid stains are signs of thawing and refreezing, meaning the food spent time in the danger zone. Reject it."],
["qt49","QT","NH","Bạn thấy phân chuột ở góc kho. Bạn làm gì?",["Báo quản lý ngay để gọi dịch vụ diệt côn trùng chuyên nghiệp, và kiểm tra hàng có bị nhiễm","Tự xịt thuốc diệt côn trùng mua ở siêu thị quanh góc kho, rồi dùng hàng như bình thường","Quét sạch phân, lau sàn và không nói gì để mọi người khỏi lo","Đặt bẫy và chờ tới khi thấy chuột thật rồi mới báo quản lý"],"You find mouse droppings in a corner of the storage room. What do you do?",["Tell the manager right away so a licensed pest control company is called, and check food for contamination","Spray store-bought insecticide around the corner yourself, then keep using the food as normal","Sweep up the droppings, wipe the floor and say nothing so nobody worries about it","Set a trap and wait until you actually see a mouse before telling the manager about it"],"Dấu hiệu chuột, gián phải báo ngay. Chỉ dịch vụ diệt côn trùng có giấy phép mới được dùng thuốc trong quán. Đồ bị chuột chạm vào phải bỏ.","Report signs of pests right away. Only licensed pest control operators should apply pesticides. Throw away any food pests may have touched."],
["qt50","QT","NH","Cách tốt nhất để ngăn côn trùng vào quán là gì?",["Đóng kín cửa, bịt khe hở, đổ rác đúng giờ và giữ quán sạch","Để cửa sau mở cho thoáng và xịt thuốc côn trùng ở cửa","Để bánh thừa trên quầy qua đêm, sáng hôm sau dọn một lần","Chỉ xịt thuốc mỗi tháng một lần và bớt dọn dẹp giữa các lần"],"What is the best way to keep pests out of the café?",["Keep doors closed, seal gaps, take trash out on time and keep everything clean","Prop the back door open for fresh air and spray insecticide by the door","Leave leftover pastries on the counter overnight, then clean up in the morning","Just spray insecticide once a month and skip the extra cleaning in between"],"Ngăn côn trùng bằng cách không cho chúng vào (cửa, khe hở), không để thức ăn và nước cho chúng, và giữ vệ sinh. Đó là cách phòng hiệu quả hơn diệt.","Keep pests out (doors, gaps), deny them food and water, and keep everything clean. Prevention works better than spraying."],
["qc23","QT","NH","Nhận hộp trái cây cắt sẵn (đồ TCS), nhiệt kế đo được 48°F (9°C). Bạn làm gì?",["Từ chối, đồ TCS lạnh phải nhận ở 41°F (5°C) trở xuống","Nhận rồi cho vào tủ lạnh ngay cho lạnh lại là được","Nhận miễn là còn trong hạn sử dụng","Nhận nhưng ghi chú để lần sau nhắc nhà cung cấp"],"Pre-cut fruit (a TCS food) arrives and your thermometer reads 48°F (9°C). What do you do?",["Reject it, cold TCS food must be received at 41°F (5°C) or lower","Accept it and put it in the fridge right away to cool it down","Accept it as long as it's still within the use-by date","Accept it but leave a note to remind the supplier next time"],"Đồ TCS lạnh nhận vào phải ở 41°F (5°C) trở xuống. Nóng hơn nghĩa là đã nằm trong vùng nguy hiểm, vi khuẩn có thể đã sinh sôi, cho vào tủ lạnh không làm mất vi khuẩn.","Cold TCS food must be received at 41°F (5°C) or lower. Warmer means it has been in the danger zone and bacteria may have grown, and chilling it now doesn't remove them."],
["qc24","QT","NH","Đo nhiệt độ hàng lạnh đóng gói hút chân không khi nhận, bạn làm thế nào?",["Kẹp đầu nhiệt kế giữa hai gói, không đâm thủng gói","Đâm nhiệt kế xuyên qua gói","Sờ tay xem có lạnh không","Đo nhiệt độ không khí trong xe giao hàng"],"How do you check the temperature of vacuum-packed cold food when receiving it?",["Place the probe between two packages without puncturing them","Push the probe through the package","Feel it with your hand to see if it's cold","Check the air temperature in the delivery truck"],"Với hàng đóng gói kín, kẹp que đo giữa hai gói (hoặc gấp gói quanh que đo) để không làm thủng bao bì. Sờ tay hay đo không khí không cho biết nhiệt độ của đồ ăn.","For sealed packages, put the probe between two packages (or fold a package around it) so you don't puncture them. Touch or air temperature doesn't tell you the food's temperature."],
["qc25","QT","NH","Hàng giao tới gồm sữa, kem, đồ đông lạnh và mấy thùng đường, ly giấy. Cất cái nào trước?",["Hàng lạnh và đông lạnh trước, đồ khô sau","Đồ khô trước vì nhiều thùng","Ly giấy trước cho gọn quầy","Thứ nào gần cửa thì cất trước"],"A delivery has milk, cream, frozen items and boxes of sugar and paper cups. What goes away first?",["Cold and frozen items first, dry goods after","Dry goods first since there are more boxes","Paper cups first to clear the counter","Whatever is closest to the door"],"Kiểm hàng xong phải cất ngay, hàng lạnh và đông lạnh trước để không nằm lâu trong vùng nguy hiểm. Dán nhãn ngày và xếp theo FIFO.","Inspect and put deliveries away right away, cold and frozen items first so they don't sit in the danger zone. Date them and stock by FIFO."],
["qc26","QT","NH","Thùng bánh giao tới bị ướt sũng, có vết nước loang và góc bị rách. Bạn làm gì?",["Từ chối, bao bì ướt, rách là dấu hiệu hàng có thể bị nhiễm bẩn","Nhận rồi lau khô thùng bằng khăn giấy trước khi cất","Nhận miễn là bánh bên trong nhìn còn đẹp","Nhận rồi để gần quạt cho khô rồi mới cất"],"A case of pastries arrives soaking wet, water-stained, with a torn corner. What do you do?",["Reject it, wet or torn packaging means the food may be contaminated","Accept it and dry off the box with paper towels before storing it","Accept it as long as the pastries inside still look fine","Accept it and set it by a fan to dry before putting it away"],"Bao bì ướt, có vết nước, rách hay rò rỉ cho thấy hàng có thể bị nước bẩn, côn trùng hay vi khuẩn xâm nhập. Không nhận.","Wet, water-stained, torn or leaking packaging means dirty water, pests or germs may have gotten in. Reject it."],
["qc27","QT","NH","Lúc nhận hàng, bạn thấy một hộp kem phô mai đã qua ngày \"use by\" in trên hộp. Bạn làm gì?",["Từ chối hộp đó","Nhận và dùng trong hôm nay","Nhận nếu ngửi chưa hôi","Nhận rồi giảm giá món"],"While receiving, you see a tub of cream cheese past the \"use by\" date printed on it. What do you do?",["Reject that tub","Accept it and use it today","Accept it if it doesn't smell bad","Accept it and discount the item"],"Hàng quá hạn \"use by\" hoặc \"expiration\" phải từ chối. Không thể dựa vào mùi để biết an toàn, vì nhiều vi khuẩn gây bệnh không làm đổi mùi.","Reject items past their \"use by\" or expiration date. Smell doesn't prove safety, because many harmful bacteria don't change the smell."],
["qc28","QT","NH","Mở thùng hàng vừa giao, bạn thấy vài con gián con và vỏ trứng gián bên trong. Bạn làm gì?",["Từ chối, không đem thùng vào kho, và báo quản lý","Đập hết gián nhìn thấy rồi nhận thùng","Giữ lại đồ trong túi kín, chỉ bỏ thùng giấy","Xịt thuốc côn trùng lên thùng rồi đem cất"],"You open a delivered box and find some baby cockroaches and egg cases inside. What do you do?",["Reject it, keep the box out of storage, and tell the manager","Kill the roaches you can see, then accept the box","Keep the sealed bags inside and just throw out the box","Spray insecticide on the box, then put it in storage"],"Hàng có côn trùng hay dấu hiệu côn trùng phải từ chối. Đem vào kho là mang gián vào quán. Không tự xịt thuốc lên hàng.","Reject deliveries with pests or signs of pests. Bringing them into storage brings pests into the café. Never spray pesticide on deliveries yourself."],
["qc29","QT","NH","Một bạn nhân viên mang chè tự nấu ở nhà vào, muốn bán ở quầy. Có được không?",["Không, đồ bán cho khách phải từ nguồn được cấp phép và kiểm tra","Được, nếu bạn đó nấu trong bếp nhà sạch sẽ và đeo găng","Được, nếu dán nhãn \"tự làm\" và ghi đủ thành phần","Được, nếu giữ lạnh dưới 41°F và bán hết trong ngày"],"A coworker brings in homemade chè (sweet soup) and wants to sell it at the counter. Is that allowed?",["No, food sold to customers must come from an approved, inspected source","Yes, if they cooked it in a clean home kitchen wearing gloves","Yes, if it's labeled \"homemade\" with all ingredients listed","Yes, if it's kept below 41°F and sold out the same day"],"Đồ ăn bán trong quán phải từ nhà cung cấp được cơ quan y tế cấp phép, kiểm tra, hoặc do chính quán làm. Đồ nấu ở nhà không được bán.","Food sold in the café must come from suppliers approved and inspected by health authorities, or be made in the café. Home-cooked food can't be sold."],
["qc30","QT","NH","Bạn từ chối một thùng hàng hư lúc nhận. Bước tiếp theo đúng là gì?",["Để riêng thùng đó, nói lý do với tài xế và ghi lại trên hóa đơn hoặc phiếu trả hàng","Bỏ thẳng thùng đó vào thùng rác sau quán cho gọn, khỏi ghi chép","Để chung với hàng tốt trong kho rồi tính với nhà cung cấp sau","Cứ ký nhận đủ trên hóa đơn rồi gọi nhà cung cấp xin đổi sau"],"You reject a damaged case during receiving. What is the right next step?",["Set it aside, tell the driver why, and record it on the invoice or credit slip","Throw it straight in the dumpster to keep things tidy, no paperwork","Put it in storage with the good stock and sort it out with the supplier later","Sign for the full order on the invoice and call the supplier for a swap later"],"Hàng bị từ chối để riêng, không cất chung với hàng tốt. Ghi rõ lý do trên hóa đơn và có chữ ký để quán được trả tiền lại.","Keep rejected items apart from good stock. Write the reason on the invoice and get a signature so the café gets credit."],
["qc31","QT","NH","Quán nên hẹn giờ giao sữa, kem từ Odeko vào lúc nào là tốt nhất?",["Giờ vắng khách, khi có người rảnh để kiểm và cất hàng ngay","Đúng giờ cao điểm buổi sáng, để sữa tới đúng lúc cần nhất","Lúc quán đã đóng cửa, để hàng ngoài cửa sáng hôm sau cất","Bất kỳ lúc nào tài xế tiện, dù không ai rảnh để kiểm hàng"],"When is the best time to schedule Odeko's milk and cream deliveries?",["During slow hours, when someone is free to check and put it away right away","Right in the morning rush, so the milk arrives when it's needed most","After closing, with the order left at the door to put away next morning","Whenever is easiest for the driver, even if nobody is free to check it"],"Nhận hàng cần người kiểm nhiệt độ, bao bì, hạn dùng và cất ngay. Giờ đông khách thì hàng dễ bị bỏ quên ngoài vùng nhiệt độ an toàn.","Receiving needs someone to check temperatures, packaging and dates and put items away right away. During a rush, deliveries get left out of safe temperatures."],
["qc32","QT","NH","Chương trình kiểm soát côn trùng tổng hợp (IPM) dựa trên những việc nào?",["Chặn đường vào, không để thức ăn và chỗ trú, làm việc với công ty diệt côn trùng có giấy phép","Xịt thuốc diệt côn trùng định kỳ mỗi tuần, kể cả khi chưa thấy dấu hiệu nào","Đặt bẫy keo khắp quầy pha chế và kệ đồ ăn để bắt hết côn trùng bò qua","Nuôi mèo trong kho để bắt chuột, chỉ gọi công ty diệt côn trùng khi thấy chuột"],"An integrated pest management (IPM) program is based on what?",["Deny pests access, deny them food and shelter, and work with a licensed pest control operator","Spray pesticide every week on a set schedule, even when no pests have been seen","Set glue traps all over the bar and food shelves to catch anything that crawls by","Keep a cat in storage for rodents and call pest control only after seeing one"],"IPM gồm 3 việc: không cho côn trùng vào, không cho chúng thức ăn, nước và chỗ trú, và làm việc với công ty diệt côn trùng có giấy phép. Phòng là chính, thuốc là cuối cùng.","IPM has 3 parts: keep pests out, deny them food, water and shelter, and work with a licensed pest control operator. Prevention comes first, chemicals last."],
["qc33","QT","NH","Dấu hiệu nào sau đây cho thấy quán có thể có gián?",["Mùi dầu hôi nồng và phân như hạt tiêu đen","Vết gặm ở góc bao bì đồ ăn","Ổ làm bằng giấy vụn và vải","Vết chân và vết đuôi trên lớp bụi"],"Which sign suggests the café may have cockroaches?",["A strong oily smell and droppings like black pepper","Gnaw marks on the corners of food packages","Nests made of shredded paper and fabric","Small tracks and tail marks in the dust"],"Gián để lại mùi dầu hôi, phân như hạt tiêu đen và vỏ trứng màu nâu. Vết gặm, ổ giấy vụn và vết chân là dấu hiệu của chuột.","Roaches leave a strong oily smell, droppings like black pepper and brown egg cases. Gnaw marks, shredded-paper nests and tracks point to rodents."],
["qc34","QT","NH","Bạn thấy một bao đường trong kho bị gặm thủng một lỗ. Bạn làm gì với bao đường?",["Bỏ cả bao và báo quản lý","Bỏ phần đường gần lỗ, dùng phần còn lại","Dán băng keo lỗ thủng rồi dùng","Đổ sang hộp mới rồi dùng"],"You find a bag of sugar in storage with a gnawed hole in it. What do you do with the sugar?",["Throw out the whole bag and tell the manager","Throw out the sugar near the hole and use the rest","Tape the hole and keep using it","Pour it into a new container and use it"],"Đồ bị chuột hay côn trùng chạm vào là bị nhiễm bẩn toàn bộ, không thể dùng phần còn lại. Bỏ cả bao, kiểm tra hàng xung quanh và báo để gọi dịch vụ diệt côn trùng.","Food touched by rodents or insects is contaminated throughout, so none of it can be used. Throw out the bag, check nearby items, and report it so pest control can be called."],
["qc35","QT","NH","Thùng rác lớn ngoài quán (dumpster) phải được giữ thế nào?",["Nắp đậy kín, đóng lại sau khi đổ rác, khu xung quanh sạch","Mở nắp để rác khô và bớt mùi","Để sát cửa sau cho đổ rác nhanh","Chỉ đóng nắp khi trời mưa, còn lại để mở"],"How should the outdoor dumpster be kept?",["With tight lids kept closed after use, and the area around it clean","With the lid left open so the trash dries out and smells less","Right next to the back door so trash is quick to take out","Closed only when it rains, and left open the rest of the time"],"Thùng rác mở nắp và khu rác dơ thu hút chuột, ruồi, gián. Nắp phải đậy kín, khu thùng rác sạch và để xa cửa ra vào quán.","Open dumpsters and messy trash areas draw rodents, flies and roaches. Keep lids closed, the area clean and the dumpster away from the café's doors."],
["qc36","QT","NH","Cửa sau mở ra vào nhiều lần để nhận hàng, đổ rác, và ruồi bay vào. Cách nào giúp ngăn côn trùng ở cửa này?",["Cửa tự đóng, ron chặn khe dưới cửa và màn gió hoặc lưới chắn","Chặn cửa mở suốt ca cho thoáng, dễ nhận hàng và đổ rác","Treo đèn thật sáng ngay trên cửa sau để thấy côn trùng bay vào","Đặt khay đồ ăn thừa ngoài cửa để dụ ruồi ở bên ngoài"],"The back door opens often for deliveries and trash, and flies get in. What helps keep pests out at this door?",["A self-closing door, a door sweep for the bottom gap, and an air curtain or screen","Prop the door open all shift for fresh air and easier deliveries and trash runs","Hang a bright light right above the back door so you can spot the bugs coming in","Leave food scraps outside the door to keep the flies busy out there instead"],"Côn trùng vào qua cửa và khe hở. Cửa tự đóng, ron chặn khe dưới cửa, màn gió (air curtain) và lưới chắn giúp không cho chúng vào.","Pests come in through doors and gaps. Self-closing doors, door sweeps, air curtains and screens keep them out."],
["qc37","QT","NH","Nếu quán có giữ thuốc diệt côn trùng, phải cất ở đâu?",["Trong bao bì gốc, ở khu riêng có khóa, xa đồ ăn và dụng cụ","Trên kệ trên cùng trong kho đồ ăn, chỗ nhân viên không làm đổ được","Đổ sang chai nhỏ có dán nhãn để ở quầy bar cho tiện dùng","Dưới bồn rửa tay cạnh xà phòng, đóng nắp thật chặt"],"If the café keeps any pesticide, where must it be stored?",["In its original container, in a separate locked area away from food and utensils","On the top shelf of the food storage room, where staff can't knock it over","Poured into a small labeled bottle kept at the bar so it's handy when needed","Under the handwashing sink next to the soap, with the cap closed tightly"],"Thuốc diệt côn trùng để trong bao bì gốc, cất khóa ở khu riêng, xa đồ ăn, dụng cụ và đồ đóng gói. Việc dùng thuốc nên để công ty có giấy phép làm.","Keep pesticides in their original containers, locked in a separate area away from food, utensils and packaging. Leave applying them to a licensed company."],
["qc38","QT","NH","Sau khi nhận hàng, bạn để lại thùng giấy rỗng chất trong kho. Vì sao không nên?",["Thùng giấy là chỗ gián trú và đẻ trứng","Thùng giấy làm kho lạnh và ẩm hơn","Thùng giấy làm hàng xung quanh mau hết hạn","Thùng giấy bốc mùi làm đường bị vón cục"],"After receiving, you leave empty cardboard boxes stacked in storage. Why is that a bad idea?",["Cardboard gives roaches a place to hide and lay eggs","Cardboard makes the storage room colder and damp","Cardboard makes the stock around it expire faster","Cardboard gives off fumes that make the sugar clump"],"Thùng giấy và đồ bừa bộn là chỗ trú lý tưởng cho gián và chuột. Lấy hàng ra, gấp thùng và đem ra khu tái chế ngay.","Cardboard and clutter give roaches and rodents shelter. Unpack, break down the boxes and take them out to recycling right away."]
