<style>
/* Layout: one narrow column; sticky header with name + scrollable test chips; test card below; owner-only results sheet */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --ink:#17201c; --muted:#5d6a63; --line:#d9e0db;
  --jade:#1d6b57; --jade-soft:#e2efe9; --lacquer:#b23a2e; --gold:#a8771c; --gold-soft:#f6ecd8;
  --display:"Lora",Georgia,serif; --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#1a2320; --ink:#e7ede9; --muted:#9aa8a1; --line:#2c3833;
  --jade:#5fc2a4; --jade-soft:#1f3a32; --lacquer:#ef7b6d; --gold:#e0b25a; --gold-soft:#3a2f1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#1a2320; --ink:#e7ede9; --muted:#9aa8a1; --line:#2c3833;
  --jade:#5fc2a4; --jade-soft:#1f3a32; --lacquer:#ef7b6d; --gold:#e0b25a; --gold-soft:#3a2f1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font-family:var(--display);font-weight:600;font-size:1.35rem;margin:0;text-wrap:balance}
.brand span{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--jade);font-weight:600}
.who{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-top:8px}
.who input{width:100%;font:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.who input:focus,button:focus-visible,.opt:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:10px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font:inherit;font-size:.85rem;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--jade);border-color:var(--jade);color:var(--bg)}
.chip .ok{color:var(--jade);font-weight:700;margin-left:4px}
.chip.on .ok{color:var(--bg)}
.chip.res{border-color:var(--gold);color:var(--gold)}
.chip.res.on{background:var(--gold);color:var(--bg)}
.intro{margin:18px 0 6px}
.intro .num{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.intro h2{font-family:var(--display);font-weight:600;font-size:1.6rem;line-height:1.2;margin:2px 0 6px;text-wrap:balance}
.intro p{margin:0 0 6px;color:var(--muted);max-width:62ch}
.scale{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--muted);margin:10px 0 4px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:8px}
.q.miss{border-color:var(--lacquer)}
.q p{margin:0 0 8px;display:flex;gap:8px}
.q p b{color:var(--muted);font-weight:500;min-width:1.6em;font-variant-numeric:tabular-nums}
.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.opt{font:inherit;font-weight:600;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opt.on{background:var(--jade);border-color:var(--jade);color:var(--bg)}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.btn{font:inherit;font-weight:600;padding:11px 18px;border-radius:8px;border:1px solid var(--jade);background:var(--jade);color:var(--bg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--jade)}
.err{color:var(--lacquer);font-size:.9rem}
.result{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.result h3{font-family:var(--display);font-weight:600;font-size:1.25rem;margin:0 0 4px}
.big{font-family:var(--display);font-size:2.2rem;font-weight:600;color:var(--jade);line-height:1.1}
.bar{margin-top:12px}
.bar .lab{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:.95rem}
.bar .lab em{font-style:normal;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.track{height:8px;background:var(--jade-soft);border-radius:4px;margin:4px 0;overflow:hidden}
.fill{height:100%;background:var(--jade);border-radius:4px}
.bar.top .fill{background:var(--gold)}
.bar p{margin:0;font-size:.88rem;color:var(--muted)}
.status{font-size:.88rem;color:var(--muted);margin-top:12px}
.status.good{color:var(--jade)}
.note{font-size:.82rem;color:var(--muted);margin-top:20px;border-top:1px solid var(--line);padding-top:12px}
.sheetwrap{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;font-size:.85rem;min-width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg);position:sticky;top:0}
td:first-child,th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
th:first-child{background:var(--bg);z-index:2}
td.empty{color:var(--line)}
tr.person{cursor:pointer}
tr.person:hover td{background:var(--jade-soft)}
.pill{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:999px;background:var(--gold-soft);color:var(--gold);font-weight:600;margin-left:6px}
.detail{margin-top:14px}
.detail h4{margin:14px 0 2px;font-size:1rem}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.toolbar input{flex:1 1 160px;font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.empty-state{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px;margin-top:14px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .5s ease}}
@media (max-width:420px){.opt{height:44px}}
</style>
<style>
.who{grid-template-columns:minmax(0,1fr) auto}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.lang button{font:inherit;font-size:.85rem;font-weight:600;padding:0 12px;border:0;background:transparent;color:var(--muted);cursor:pointer;min-height:40px}
.lang button.on{background:var(--jade);color:var(--bg)}
.explain{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.explain h4{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:0 0 6px}
.explain .lead{margin:0 0 10px;color:var(--ink)}
.explain .flag{background:var(--gold-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:.92rem;margin:0 0 12px}
.explain .item{margin:12px 0 0}
.explain .item b{display:block;color:var(--jade);font-weight:600}
.explain .item p{margin:2px 0 0;font-size:.95rem}
.explain .item p em{font-style:normal;font-weight:600;color:var(--muted)}
</style>

    <div class="brand"><h1 id="apptitle">Hồ sơ nhân sự</h1><span>Saigonesee</span></div>

<script>
/* GitHub Pages: dán URL Web App của Google Apps Script vào đây để kết quả tự lưu vào Google Sheet */
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbxPgs-eQ-rpaJlwISQYiV2FIxAGQsSo6ZrRuRnZj2PmrK5RXNLMjsQ_PENXqjvPdTyQ/exec";
const SHEET_ID="1MX9qsupqhNMaz96kVfq9sVZZ_8-OAXSma2sepQC0WMQ",SHEET_URL="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/edit";

const META={"vi":{"mbti":{"short":"16 kiểu","name":"16 kiểu tính cách","about":"Bạn lấy năng lượng từ đâu, tiếp nhận thông tin ra sao, quyết định bằng gì và thích làm việc có kế hoạch hay linh hoạt.","dims":{"E":["Hướng ngoại (E) – Hướng nội (I)"],"S":["Thực tế (S) – Trực giác (N)"],"T":["Lý trí (T) – Cảm xúc (F)"],"J":["Nguyên tắc (J) – Linh hoạt (P)"]}},"big5":{"short":"Big Five","name":"Big Five (OCEAN)","about":"Năm chiều tính cách được nghiên cứu nhiều nhất. Mỗi chiều là một thang, không có đúng hay sai.","dims":{"O":["Cởi mở","Thích cái mới, sáng tạo, tò mò. Thấp: thích cách làm quen thuộc, thực tế."],"C":["Tận tâm","Chuẩn bị kỹ, làm đến nơi đến chốn. Đây là chiều dự báo hiệu quả công việc tốt nhất."],"E":["Hướng ngoại","Năng động, thích giao tiếp. Thấp: trầm, làm tốt việc cần tập trung."],"A":["Dễ chịu","Cảm thông, hợp tác, sẵn lòng giúp. Thấp: thẳng thắn, cạnh tranh."],"N":["Nhạy cảm cảm xúc","Dễ lo lắng, tâm trạng thay đổi. Thấp: điềm tĩnh dưới áp lực."]}},"hexaco":{"short":"Trung thực","name":"Trung thực – Khiêm tốn (HEXACO)","about":"Chiều thứ sáu của mô hình HEXACO: mức độ chân thành, công bằng, không tham và khiêm tốn. Hữu ích với vị trí giữ tiền, giữ chìa khóa.","dims":{"S":["Chân thành","Không nịnh, không giả vờ để được việc."],"F":["Công bằng","Không lợi dụng, không gian lận dù không ai biết."],"G":["Không tham","Ít bị cuốn theo tiền bạc, địa vị, đồ sang."],"M":["Khiêm tốn","Không tự cho mình hơn người hay xứng đáng đặc quyền."]},"overall":"Trung thực – Khiêm tốn"},"ennea":{"short":"Enneagram","name":"Enneagram (9 kiểu)","about":"Chín kiểu người theo động lực và nỗi sợ sâu bên trong. Kiểu cao nhất là kiểu chính, kiểu thứ hai là nét phụ.","dims":{"1":["Số 1 · Người cầu toàn","Muốn mọi thứ đúng chuẩn. Cần: tiêu chuẩn rõ, được ghi nhận sự chỉn chu."],"2":["Số 2 · Người giúp đỡ","Muốn được cần đến. Cần: lời cảm ơn, được nhắc chăm sóc bản thân."],"3":["Số 3 · Người thành đạt","Muốn thành công, được công nhận. Cần: mục tiêu, bảng thành tích."],"4":["Số 4 · Người cá tính","Muốn được là chính mình. Cần: việc có chất riêng, được hiểu."],"5":["Số 5 · Người quan sát","Muốn hiểu sâu. Cần: thông tin đầy đủ, thời gian riêng."],"6":["Số 6 · Người trung thành","Muốn an toàn. Cần: sự ổn định, quản lý đáng tin."],"7":["Số 7 · Người vui vẻ","Muốn trải nghiệm. Cần: việc đa dạng, không khí vui."],"8":["Số 8 · Người thủ lĩnh","Muốn tự chủ, mạnh mẽ. Cần: quyền quyết, nói thẳng."],"9":["Số 9 · Người hòa giải","Muốn yên ổn. Cần: môi trường hòa thuận, được hỏi ý kiến."]}},"disc":{"short":"DISC","name":"DISC (phong cách giao tiếp)","about":"Bốn kiểu hành vi trong giao tiếp. Biết kiểu của mình và của người kia để nói chuyện cho trúng.","dims":{"D":["D · Quyết đoán","Nhanh, thẳng, hướng kết quả. Nói với họ: ngắn gọn, vào việc, đưa lựa chọn."],"I":["I · Lôi cuốn","Nhiệt tình, thích giao lưu. Nói với họ: thân thiện, khen trước mọi người."],"S":["S · Kiên định","Điềm tĩnh, chung thủy, cần ổn định. Nói với họ: báo trước thay đổi, kiên nhẫn."],"C":["C · Cẩn thận","Chính xác, theo quy trình. Nói với họ: số liệu, lý do, hướng dẫn bằng văn bản."]}},"belbin":{"short":"Vai trò nhóm","name":"Vai trò trong nhóm (kiểu Belbin)","about":"Chín vai trò một người hay đảm nhận khi làm việc nhóm. Nhóm tốt cần đủ các vai, không cần ai cũng giống nhau.","dims":{"PL":["Người sáng tạo","Nghĩ ra cách mới khi nhóm bí. Giao: món mới, giải vấn đề khó."],"RI":["Người tìm nguồn lực","Giỏi kết nối, tìm cơ hội. Giao: tìm đối tác, sự kiện, khuyến mãi."],"CO":["Người điều phối","Giao đúng việc, đúng người. Giao: xếp ca, trưởng ca."],"SH":["Người thúc đẩy","Kéo nhóm chạy nhanh. Giao: giờ cao điểm, mục tiêu gấp."],"ME":["Người đánh giá","Cân nhắc khách quan. Giao: xem xét kế hoạch, chọn nhà cung cấp."],"TW":["Người đồng đội","Giữ không khí hòa thuận. Giao: kèm người mới, hòa giải."],"IMP":["Người thực thi","Biến ý tưởng thành việc làm được. Giao: quy trình, mở/đóng quán."],"CF":["Người hoàn thiện","Bắt lỗi người khác bỏ sót. Giao: kiểm kho, kiểm chất lượng."],"SP":["Chuyên gia","Giỏi sâu một mảng. Giao: pha chế chính, bếp chính, kỹ thuật."]}},"situ":{"short":"Lãnh đạo tình huống","name":"Lãnh đạo theo tình huống","about":"Dành cho người quản lý hoặc trưởng ca. Cho biết bạn hay dẫn dắt theo kiểu nào. Người giỏi đổi kiểu theo độ sẵn sàng của từng nhân viên.","dims":{"S1":["Chỉ đạo","Chỉ rõ từng bước, kiểm tra sát. Hợp với người mới, chưa biết việc."],"S2":["Huấn luyện","Vừa chỉ vừa giải thích, động viên. Hợp với người đang học, còn lúng túng."],"S3":["Hỗ trợ","Hỏi ý kiến, khích lệ, cùng giải quyết. Hợp với người giỏi nhưng thiếu tự tin."],"S4":["Ủy quyền","Giao hẳn, ít can thiệp. Hợp với người giỏi và tự giác."]}},"goleman":{"short":"6 kiểu lãnh đạo","name":"6 phong cách lãnh đạo (Goleman)","about":"Sáu cách dẫn dắt khác nhau. Người lãnh đạo hiệu quả dùng được nhiều kiểu, nhất là Định hướng, Gắn kết, Dân chủ và Huấn luyện.","dims":{"CH":["Chỉ huy","Ra lệnh, làm ngay. Hợp lúc khủng hoảng; dùng lâu làm nhóm mất tinh thần."],"DH":["Định hướng","Vẽ mục tiêu lớn, để người khác tự chọn cách đi. Kiểu hiệu quả nhất trong đa số tình huống."],"GK":["Gắn kết","Đặt con người lên trước, giữ tinh thần nhóm. Hợp khi nhóm vừa trải qua căng thẳng."],"DC":["Dân chủ","Hỏi ý kiến cả nhóm. Hợp khi cần sự đồng thuận và ý tưởng mới."],"TD":["Dẫn đầu bằng tốc độ","Làm mẫu với chuẩn cao. Hợp với nhóm giỏi; dễ làm người khác kiệt sức."],"HL":["Huấn luyện","Giúp nhân viên phát triển lâu dài. Hợp với người muốn tiến bộ."]}},"tki":{"short":"Xử lý xung đột","name":"Cách xử lý xung đột (kiểu Thomas-Kilmann)","about":"Năm cách phản ứng khi bất đồng. Không cách nào luôn đúng; quan trọng là biết mình hay dùng cách nào và lúc nào nên đổi.","dims":{"CT":["Cạnh tranh","Bảo vệ ý mình đến cùng. Tốt khi cần quyết nhanh; dễ làm mất lòng."],"HT":["Hợp tác","Tìm cách cả hai cùng thắng. Tốt nhất cho chuyện quan trọng, nhưng tốn thời gian."],"TH":["Thỏa hiệp","Mỗi bên nhường một chút. Nhanh, công bằng, nhưng không ai thật sự hài lòng."],"NT":["Né tránh","Để vấn đề lắng xuống. Tốt với chuyện nhỏ; chuyện lớn sẽ tích tụ."],"NB":["Nhượng bộ","Chiều theo người khác để giữ quan hệ. Tốt khi mình sai; dùng nhiều sẽ bị thiệt."]}},"strengths":{"short":"Thế mạnh","name":"Bốn nhóm thế mạnh","about":"Dựa trên bốn nhóm thế mạnh mà Gallup dùng. Cho biết bạn tạo giá trị chủ yếu bằng cách nào.","dims":{"TT":["Thực thi","Làm cho việc xong, đúng hạn, đúng chuẩn. Là xương sống của ca làm."],"AH":["Ảnh hưởng","Thuyết phục, khởi xướng, kéo người khác theo. Hợp bán hàng, dẫn nhóm."],"QH":["Xây dựng quan hệ","Gắn kết mọi người, hiểu cảm xúc. Hợp chăm sóc khách, kèm người mới."],"CL":["Tư duy chiến lược","Phân tích, nhìn xa, nghĩ ý tưởng. Hợp lên kế hoạch, cải tiến."]}},"via":{"short":"Phẩm chất","name":"Phẩm chất nổi bật (kiểu VIA)","about":"Sáu nhóm phẩm chất tốt mà khoa học tâm lý tích cực dùng. Phẩm chất cao nhất là thứ bạn nên dùng nhiều nhất mỗi ngày.","dims":{"TR":["Trí tuệ","Tò mò, ham học, hay được hỏi lời khuyên."],"DG":["Dũng cảm","Dám nói điều đúng, kiên trì đến cùng."],"NA":["Nhân ái","Tử tế, biết yêu thương, giữ quan hệ thân thiết."],"CB":["Công bằng","Đối xử công bằng, là thành viên đáng tin của nhóm."],"TĐ":["Tiết độ","Biết tha thứ, tự kiểm soát, không bốc đồng."],"SV":["Hướng thượng","Biết ơn, lạc quan, thấy ý nghĩa trong việc mình làm."]}},"eq":{"short":"EQ","name":"Trí tuệ cảm xúc (EQ)","about":"Bốn kỹ năng cảm xúc theo mô hình của Goleman. EQ học được và luyện được, khác với tính cách.","dims":{"SA":["Tự nhận thức","Biết mình đang cảm thấy gì và vì sao."],"SM":["Tự quản lý","Giữ bình tĩnh, không để cảm xúc làm hỏng việc."],"SO":["Nhận thức xã hội","Đọc được cảm xúc của khách và đồng nghiệp."],"RM":["Quản lý quan hệ","Góp ý khéo, hòa giải, làm việc nhóm tốt."]},"overall":"EQ chung"},"grit":{"short":"Bền bỉ","name":"Độ bền bỉ (Grit)","about":"Đam mê và kiên trì với mục tiêu dài hạn, dựa trên nghiên cứu của Angela Duckworth. Hữu ích để biết ai sẽ gắn bó và theo được việc khó.","dims":{"PA":["Đam mê bền","Giữ một mục tiêu lâu dài, không dễ đổi hướng."],"PE":["Kiên trì","Không bỏ cuộc khi gặp khó, làm đến xong."]},"overall":"Grit chung"},"appr":{"short":"Ghi nhận","name":"5 ngôn ngữ ghi nhận ở nơi làm việc","about":"Mỗi người cảm thấy được trân trọng theo một cách khác nhau. Khen sai cách thì người nhận không thấy được khen.","dims":{"LK":["Lời khen","Khen cụ thể, nhắn tin cảm ơn, khen trước nhóm nếu họ thích."],"TG":["Thời gian riêng","Ngồi nói chuyện riêng, hỏi ý kiến, ăn cùng nhóm."],"GD":["Giúp một tay","Phụ họ lúc đông, xắn tay làm cùng, cho thêm công cụ."],"QU":["Quà nhỏ","Thưởng, phiếu quà, đồ uống, món quà hiểu ý họ."],"TX":["Thân thiện","Đập tay, vỗ vai, bắt tay chúc mừng, không khí vui."]}},"riasec":{"short":"Sở thích nghề","name":"Sở thích nghề nghiệp (Holland RIASEC)","about":"Sáu nhóm sở thích nghề. Ba chữ cao nhất tạo thành mã Holland của bạn, giúp xếp người vào đúng vị trí.","dims":{"R":["R · Kỹ thuật","Thích làm bằng tay, máy móc. Hợp: bếp, pha chế, bảo trì."],"I":["I · Nghiên cứu","Thích tìm hiểu, phân tích. Hợp: công thức, kiểm soát chất lượng, số liệu."],"A":["A · Nghệ thuật","Thích sáng tạo, trình bày. Hợp: món mới, trang trí, nội dung mạng xã hội."],"S":["S · Xã hội","Thích phục vụ, giúp người. Hợp: phục vụ, chăm sóc khách, đào tạo."],"E":["E · Kinh doanh","Thích bán, dẫn dắt. Hợp: quản lý ca, bán hàng, sự kiện."],"C":["C · Nghiệp vụ","Thích trật tự, con số. Hợp: thu ngân, kho, sổ sách."]}},"motiv":{"short":"Động lực","name":"Điều gì tạo động lực cho bạn","about":"Bốn kiểu động lực trong công việc: thành tựu, quan hệ, an toàn và ảnh hưởng. Biết động lực của mình và của người khác giúp giao tiếp, thuyết phục và giao việc hiệu quả hơn.","dims":{"AC":["Thành tựu","Cần làm tốt, thích tự đặt thử thách và tự kiểm soát việc của mình."],"AF":["Quan hệ","Cần quan hệ tốt với đồng nghiệp, thích giao lưu và tránh xung đột."],"SE":["An toàn","Cần cảm thấy công việc ổn định, thích làm chắc tay, dễ chạnh lòng khi bị phê bình."],"IN":["Ảnh hưởng","Muốn được nể trọng, thích dẫn dắt, tranh luận và giữ vị thế."]}},"frazzle":{"short":"Căng thẳng","name":"Mức căng thẳng và nóng giận (Frazzle Factor)","about":"16 câu về áp lực bạn đang chịu và cách bạn phản ứng khi giận. Chấm từ 0 đến 3 theo mức thường xuyên. Tổng tối đa 48 điểm.","overall":"Tổng điểm","dims":{"ST":["Căng thẳng","Áp lực từ công việc hoặc việc học: quyết định gấp, không được hỏi ý kiến, lương, cấp trên, giấy tờ."],"AN":["Nóng giận","Cách bạn phản ứng khi bực: mắng lại, nói lời làm đau, mất bình tĩnh."]}}},"en":{"mbti":{"short":"16 Types","name":"16 Personality Types","about":"Where you get your energy, how you take in information, how you make decisions, and whether you prefer to work with a plan or stay flexible.","dims":{"E":["Extraversion (E) – Introversion (I)"],"S":["Sensing (S) – Intuition (N)"],"T":["Thinking (T) – Feeling (F)"],"J":["Judging (J) – Perceiving (P)"]}},"big5":{"short":"Big Five","name":"Big Five (OCEAN)","about":"The five most widely researched personality traits. Each one is a scale, with no right or wrong answer.","dims":{"O":["Openness","Likes new things, creative, curious. Low: prefers familiar, practical ways of doing things."],"C":["Conscientiousness","Prepares well and follows through. This is the trait that best predicts job performance."],"E":["Extraversion","Energetic and sociable. Low: quiet, does well at work that needs focus."],"A":["Agreeableness","Caring, cooperative, happy to help. Low: blunt, competitive."],"N":["Emotional Sensitivity","Worries easily, moods shift. Low: stays calm under pressure."]}},"hexaco":{"short":"Honesty","name":"Honesty–Humility (HEXACO)","about":"The sixth trait in the HEXACO model: how sincere, fair, modest and free of greed someone is. Useful for roles that handle cash or hold the keys.","dims":{"S":["Sincerity","Doesn't flatter or fake things to get what they want."],"F":["Fairness","Doesn't take advantage or cheat, even when no one would know."],"G":["Greed Avoidance","Not easily driven by money, status or luxury."],"M":["Modesty","Doesn't see themselves as better than others or entitled to special treatment."]},"overall":"Honesty–Humility"},"ennea":{"short":"Enneagram","name":"Enneagram (9 types)","about":"Nine types of people based on their deepest motivations and fears. Your highest score is your main type; the second highest is a secondary trait.","dims":{"1":["Type 1 · The Perfectionist","Wants things done right. Needs: clear standards, recognition for careful work."],"2":["Type 2 · The Helper","Wants to be needed. Needs: thanks, and reminders to take care of themselves."],"3":["Type 3 · The Achiever","Wants success and recognition. Needs: goals, a scoreboard."],"4":["Type 4 · The Individualist","Wants to be true to themselves. Needs: work with a personal touch, to be understood."],"5":["Type 5 · The Observer","Wants to understand deeply. Needs: complete information, time alone."],"6":["Type 6 · The Loyalist","Wants to feel safe. Needs: stability, a manager they can trust."],"7":["Type 7 · The Enthusiast","Wants new experiences. Needs: variety, a fun atmosphere."],"8":["Type 8 · The Challenger","Wants independence and strength. Needs: authority to decide, straight talk."],"9":["Type 9 · The Peacemaker","Wants peace. Needs: a harmonious workplace, to be asked for their opinion."]}},"disc":{"short":"DISC","name":"DISC (communication style)","about":"Four styles of behavior when communicating. Know your style and the other person's so your message lands.","dims":{"D":["D · Dominance","Fast, direct, results-focused. With them: keep it short, get to the point, give options."],"I":["I · Influence","Enthusiastic and social. With them: be friendly, praise them in front of others."],"S":["S · Steadiness","Calm, loyal, needs stability. With them: give advance notice of changes, be patient."],"C":["C · Conscientiousness","Precise, follows procedures. With them: use numbers, reasons, written instructions."]}},"belbin":{"short":"Team Roles","name":"Team Roles (Belbin-style)","about":"Nine roles people tend to take on in a team. A good team needs all the roles, not everyone being the same.","dims":{"PL":["Plant","Comes up with new ideas when the team is stuck. Give them: new menu items, tough problems."],"RI":["Resource Investigator","Great at networking and spotting opportunities. Give them: finding partners, events, promotions."],"CO":["Coordinator","Matches the right task to the right person. Give them: scheduling shifts, shift lead."],"SH":["Shaper","Pushes the team to move fast. Give them: rush hours, urgent targets."],"ME":["Monitor Evaluator","Weighs things objectively. Give them: reviewing plans, choosing suppliers."],"TW":["Teamworker","Keeps the team getting along. Give them: mentoring new hires, smoothing conflicts."],"IMP":["Implementer","Turns ideas into workable tasks. Give them: procedures, opening/closing the shop."],"CF":["Completer Finisher","Catches mistakes others miss. Give them: inventory checks, quality checks."],"SP":["Specialist","Deep expertise in one area. Give them: head barista, head cook, technical work."]}},"situ":{"short":"Situational Lead","name":"Situational Leadership","about":"For managers and shift leads. Shows which leadership style you tend to use. Good leaders switch styles based on how ready each team member is.","dims":{"S1":["Directing","Spells out every step and checks closely. Best for new people who don't know the job yet."],"S2":["Coaching","Shows how, explains why, and encourages. Best for people still learning and unsure."],"S3":["Supporting","Asks for input, encourages, solves problems together. Best for skilled people who lack confidence."],"S4":["Delegating","Hands the work over and steps back. Best for skilled, self-motivated people."]}},"goleman":{"short":"6 Lead Styles","name":"6 Leadership Styles (Goleman)","about":"Six different ways to lead. Effective leaders can use many styles, especially Visionary, Affiliative, Democratic and Coaching.","dims":{"CH":["Commanding","Gives orders to be followed right away. Good in a crisis; used for too long, it kills team morale."],"DH":["Visionary","Sets the big goal and lets people choose how to get there. The most effective style in most situations."],"GK":["Affiliative","Puts people first and keeps team spirit up. Good after the team has been through a stressful time."],"DC":["Democratic","Asks the whole team for input. Good when you need buy-in and fresh ideas."],"TD":["Pacesetting","Leads by example with high standards. Works with a strong team; can easily burn people out."],"HL":["Coaching","Helps people grow over the long term. Good for people who want to improve."]}},"tki":{"short":"Conflict Styles","name":"Conflict Styles (Thomas-Kilmann style)","about":"Five ways people respond to disagreement. No style is always right; what matters is knowing which one you use most and when to switch.","dims":{"CT":["Competing","Stands their ground to the end. Good when a quick decision is needed; can easily upset people."],"HT":["Collaborating","Looks for a win-win. Best for important issues, but takes time."],"TH":["Compromising","Each side gives a little. Fast and fair, but no one is fully satisfied."],"NT":["Avoiding","Lets the issue cool down. Fine for small things; big issues will pile up."],"NB":["Accommodating","Goes along with others to keep the relationship. Good when you're wrong; overused, you lose out."]}},"strengths":{"short":"Strengths","name":"Four Strength Domains","about":"Based on the four strength domains Gallup uses. Shows the main way you add value.","dims":{"TT":["Executing","Gets things done, on time and to standard. The backbone of every shift."],"AH":["Influencing","Persuades, takes the lead, gets others on board. Good for sales and leading a team."],"QH":["Relationship Building","Brings people together, understands feelings. Good for customer care and mentoring new hires."],"CL":["Strategic Thinking","Analyzes, looks ahead, comes up with ideas. Good for planning and improving things."]}},"via":{"short":"Character","name":"Character Strengths (VIA-style)","about":"Six groups of positive traits used in positive psychology. Your top strength is the one you should use most every day.","dims":{"TR":["Wisdom","Curious, loves learning, often asked for advice."],"DG":["Courage","Speaks up for what's right, sticks with it to the end."],"NA":["Humanity","Kind, caring, keeps close relationships."],"CB":["Justice","Treats people fairly, a trusted member of the team."],"TĐ":["Temperance","Forgiving, self-controlled, not impulsive."],"SV":["Transcendence","Grateful, optimistic, finds meaning in their work."]}},"eq":{"short":"EQ","name":"Emotional Intelligence (EQ)","about":"Four emotional skills from Goleman's model. Unlike personality, EQ can be learned and practiced.","dims":{"SA":["Self-Awareness","Knows what they're feeling and why."],"SM":["Self-Management","Stays calm, doesn't let emotions get in the way of work."],"SO":["Social Awareness","Reads the feelings of customers and coworkers."],"RM":["Relationship Management","Gives feedback tactfully, resolves conflicts, works well in a team."]},"overall":"Overall EQ"},"grit":{"short":"Grit","name":"Grit","about":"Passion and perseverance for long-term goals, based on Angela Duckworth's research. Useful for knowing who will stick around and see hard work through.","dims":{"PA":["Lasting Passion","Sticks with one long-term goal, doesn't change direction easily."],"PE":["Perseverance","Doesn't give up when things get hard, finishes what they start."]},"overall":"Overall Grit"},"appr":{"short":"Appreciation","name":"5 Languages of Appreciation at Work","about":"Everyone feels appreciated in a different way. Praise them the wrong way and they won't feel praised at all.","dims":{"LK":["Words of Affirmation","Specific praise, thank-you texts, praise in front of the team if they like that."],"TG":["Quality Time","One-on-one chats, asking for their input, team meals."],"GD":["Acts of Service","Help them out when it's busy, roll up your sleeves and pitch in, get them better tools."],"QU":["Tangible Gifts","Bonuses, gift cards, drinks, a small gift that shows you know them."],"TX":["Friendly Touch","High-fives, a pat on the back, a congratulatory handshake, a fun vibe."]}},"riasec":{"short":"Career Interests","name":"Career Interests (Holland RIASEC)","about":"Six groups of career interests. Your top three letters make up your Holland code, which helps put people in the right role.","dims":{"R":["R · Realistic","Likes hands-on work and machines. Fits: kitchen, bar, maintenance."],"I":["I · Investigative","Likes figuring things out and analyzing. Fits: recipes, quality control, numbers."],"A":["A · Artistic","Likes creating and presenting. Fits: new menu items, decor, social media content."],"S":["S · Social","Likes serving and helping people. Fits: serving, customer care, training."],"E":["E · Enterprising","Likes selling and leading. Fits: shift management, sales, events."],"C":["C · Conventional","Likes order and numbers. Fits: cashier, inventory, bookkeeping."]}},"motiv":{"short":"Motivation","name":"What Motivates You","about":"Four kinds of motivation at work: achievement, affiliation, security and influence. Knowing your own and other people's motivation helps you communicate, persuade and delegate better.","dims":{"AC":["Achievement","Needs to do well, sets their own challenges and likes control over their own work."],"AF":["Affiliation","Needs good relationships with coworkers, very social, avoids conflict."],"SE":["Security","Needs to feel the job is stable, plays it safe, can take criticism hard."],"IN":["Influence","Wants respect and status, likes to lead, debate and compete."]}},"frazzle":{"short":"Stress","name":"Stress and Anger (Frazzle Factor)","about":"16 questions about the pressure you are under and how you react when angry. Rate each from 0 to 3 by how often it happens. Maximum total is 48.","overall":"Total score","dims":{"ST":["Stress","Pressure from work or school: quick decisions, not being asked, pay, bosses, paperwork."],"AN":["Anger","How you react when upset: telling people off, hurtful words, losing your temper."]}}}};
const INTERP={"mbti":{"vi":{"how":"Mỗi cặp chữ cho biết bạn nghiêng về phía nào, không phải bạn chỉ có một phía. Kết quả hữu ích để hiểu cách mỗi người làm việc và giao tiếp, không dùng để xếp chỗ hay chấm điểm.","dims":{"E":{"hi":"Hướng ngoại (E): bạn lấy năng lượng từ người khác, thích trò chuyện, nghĩ thành lời. Dễ hợp với quầy và khách, nhưng đôi khi nói trước nghĩ sau.","lo":"Hướng nội (I): bạn nạp năng lượng khi ở một mình, thích nghĩ kỹ rồi mới nói và làm tốt việc cần tập trung.","tip":"Với người E: cho họ trao đổi trực tiếp, nói cho ra ý. Với người I: báo trước nội dung họp và cho họ thời gian suy nghĩ trước khi hỏi ý kiến."},"S":{"hi":"Thực tế (S): bạn chú ý chi tiết, số liệu và những gì đang diễn ra. Làm đúng công thức, đúng quy trình, nhưng có thể ngại thay đổi chưa được thử.","lo":"Trực giác (N): bạn thích nhìn bức tranh lớn, ý tưởng và khả năng mới, đôi khi bỏ qua chi tiết nhỏ.","tip":"Với người S: hướng dẫn từng bước, đưa ví dụ cụ thể. Với người N: nói mục tiêu và lý do trước, để họ góp ý tưởng cải tiến."},"T":{"hi":"Lý trí (T): bạn quyết định dựa trên logic, công bằng và hiệu quả. Góp ý thẳng, rõ ràng, nhưng đôi khi làm người khác thấy bị chạm tự ái.","lo":"Cảm xúc (F): bạn quyết định có cân nhắc cảm xúc và giá trị của mọi người, giữ không khí hòa thuận trong nhóm.","tip":"Với người T: góp ý bằng lý lẽ và kết quả. Với người F: ghi nhận nỗ lực trước, góp ý nhẹ nhàng và riêng tư."},"J":{"hi":"Nguyên tắc (J): bạn thích kế hoạch, giờ giấc và làm xong việc sớm. Giữ ca làm gọn gàng, nhưng có thể căng thẳng khi kế hoạch bị đảo lộn.","lo":"Linh hoạt (P): bạn thích để ngỏ lựa chọn, ứng biến nhanh khi có việc bất ngờ, đôi khi để việc sát hạn mới làm.","tip":"Với người J: báo lịch và thay đổi càng sớm càng tốt. Với người P: chia việc thành mốc nhỏ có hạn rõ, cho họ tự do cách làm."}},"types":{"ISTJ":{"desc":"Người trầm, chắc chắn, có trách nhiệm. Bạn coi trọng quy trình, lời hứa và sự chính xác.","work":"Kiểm kho, mở và đóng ca, giữ tiền, theo dõi công thức và tiêu chuẩn vệ sinh.","watch":"Có thể cứng nhắc khi cần thay đổi cách làm; hãy thử lắng nghe lý do của cách mới."},"ISFJ":{"desc":"Người chu đáo, tận tụy, nhớ rõ chi tiết về người khác. Bạn âm thầm lo cho mọi thứ chạy ổn.","work":"Chăm sóc khách quen, chuẩn bị nguyên liệu kỹ lưỡng, hỗ trợ đồng nghiệp trong giờ cao điểm.","watch":"Dễ nhận quá nhiều việc và ngại nói không; hãy lên tiếng khi bạn bị quá tải."},"INFJ":{"desc":"Người sâu sắc, có lý tưởng, hiểu cảm xúc người khác. Bạn muốn công việc có ý nghĩa.","work":"Kèm cặp nhân viên mới, góp ý về trải nghiệm khách hàng, xây dựng văn hóa nhóm.","watch":"Có thể giữ trong lòng khi không đồng ý; hãy nói ra sớm trước khi mệt mỏi."},"INTJ":{"desc":"Người có tầm nhìn, độc lập, thích hệ thống hóa. Bạn luôn tìm cách làm tốt hơn.","work":"Cải tiến quy trình, lập kế hoạch nhập hàng, phân tích số liệu bán hàng.","watch":"Có thể thiếu kiên nhẫn với người chậm hơn; hãy giải thích lý do cho mọi người cùng hiểu."},"ISTP":{"desc":"Người bình tĩnh, thực tế, giỏi xử lý sự cố. Bạn học nhanh bằng cách bắt tay vào làm.","work":"Vận hành và sửa máy pha cà phê, xử lý tình huống gấp, việc cần tay nghề.","watch":"Có thể ít chia sẻ thông tin; hãy báo cho nhóm biết bạn đã làm gì."},"ISFP":{"desc":"Người nhẹ nhàng, tinh tế, có gu thẩm mỹ. Bạn làm tốt khi được thể hiện chất riêng.","work":"Trang trí đồ uống, bày món, decor quán, chụp ảnh sản phẩm.","watch":"Dễ né tránh mâu thuẫn; hãy nói nhu cầu của mình một cách rõ ràng."},"INFP":{"desc":"Người giàu cảm xúc, sống theo giá trị, sáng tạo. Bạn cần thấy công việc phù hợp với điều mình tin.","work":"Viết nội dung mạng xã hội, sáng tạo món mới, lắng nghe và xoa dịu khách.","watch":"Có thể để cảm xúc ảnh hưởng tiến độ; hãy đặt mốc nhỏ cho từng việc."},"INTP":{"desc":"Người thích phân tích, tò mò, suy nghĩ logic. Bạn thích hiểu vì sao mọi thứ vận hành.","work":"Thử nghiệm công thức, tìm nguyên nhân lỗi, cài đặt hệ thống đặt hàng và phần mềm.","watch":"Có thể bỏ dở khi hết hứng thú; hãy chốt việc đến cùng trước khi chuyển sang ý mới."},"ESTP":{"desc":"Người năng động, nhanh nhạy, thích hành động. Bạn xử lý tốt khi mọi thứ dồn dập.","work":"Giờ cao điểm, bán hàng tại quầy, sự kiện, xử lý tình huống ngay tại chỗ.","watch":"Có thể làm nhanh mà bỏ qua quy trình; hãy kiểm tra lại các bước quan trọng."},"ESFP":{"desc":"Người vui vẻ, thân thiện, mang năng lượng tích cực. Bạn thích làm việc cùng mọi người.","work":"Đón khách, giới thiệu món, tạo không khí vui cho ca làm, quay video ngắn.","watch":"Dễ bị phân tán bởi việc vui trước mắt; hãy dùng danh sách việc cần làm."},"ENFP":{"desc":"Người nhiệt huyết, nhiều ý tưởng, giỏi kết nối. Bạn truyền cảm hứng cho người xung quanh.","work":"Ý tưởng khuyến mãi, sự kiện, mạng xã hội, gắn kết khách hàng và đồng nghiệp.","watch":"Dễ bắt đầu nhiều việc cùng lúc; hãy chọn ít việc và làm cho xong."},"ENTP":{"desc":"Người lanh lợi, thích tranh luận và thử cái mới. Bạn nhìn ra cơ hội người khác bỏ qua.","work":"Ý tưởng sản phẩm mới, thương lượng với nhà cung cấp, giải quyết vấn đề khó.","watch":"Có thể tranh luận quá đà; hãy để ý khi người khác cần sự đồng thuận hơn là phản biện."},"ESTJ":{"desc":"Người quyết đoán, ngăn nắp, thích tổ chức. Bạn giúp nhóm chạy đúng giờ, đúng việc.","work":"Quản lý ca, phân công, kiểm tra tiêu chuẩn, giữ quán vận hành trơn tru.","watch":"Có thể ra lệnh quá thẳng; hãy hỏi ý kiến và ghi nhận nhân viên nhiều hơn."},"ESFJ":{"desc":"Người ấm áp, chu đáo, quan tâm đến cả nhóm. Bạn giữ cho mọi người gắn bó với nhau.","work":"Chăm sóc khách, đào tạo nhân viên mới, tổ chức hoạt động nhóm.","watch":"Dễ buồn khi không được ghi nhận; hãy nói rõ bạn cần gì thay vì chờ người khác đoán."},"ENFJ":{"desc":"Người truyền cảm hứng, giỏi động viên và thấu hiểu. Bạn muốn giúp người khác phát triển.","work":"Trưởng nhóm, đào tạo, xây dựng tinh thần đội ngũ, xử lý khách khó tính.","watch":"Có thể lo cho người khác mà quên bản thân; hãy chừa thời gian nghỉ cho mình."},"ENTJ":{"desc":"Người lãnh đạo tự nhiên, quyết đoán, nhìn xa. Bạn thích đặt mục tiêu và đạt được nó.","work":"Quản lý, mở rộng chi nhánh, lập kế hoạch kinh doanh, ra quyết định lớn.","watch":"Có thể quá tập trung vào kết quả mà bỏ qua cảm xúc người khác; hãy lắng nghe nhiều hơn."}}},"en":{"how":"Each letter pair shows which side you lean toward, not that you only have one side. Use it to understand how people work and communicate, not to rank or label anyone.","dims":{"E":{"hi":"Extraversion (E): you get energy from people, enjoy talking and think out loud. A natural fit for the counter and guests, but you may speak before thinking.","lo":"Introversion (I): you recharge alone, like to think before speaking, and do well at work that needs focus.","tip":"With E: let them talk things through face to face. With I: share the meeting topic ahead of time and give them time to think before asking for input."},"S":{"hi":"Sensing (S): you notice details, facts and what is happening now. You follow recipes and procedures well, but may resist untested changes.","lo":"Intuition (N): you like the big picture, ideas and new possibilities, and may sometimes miss small details.","tip":"With S: give step-by-step instructions and concrete examples. With N: explain the goal and the why first, and invite their ideas for improvement."},"T":{"hi":"Thinking (T): you decide based on logic, fairness and efficiency. Your feedback is clear and direct, but it can sometimes feel harsh to others.","lo":"Feeling (F): you weigh people's feelings and values when deciding, and help keep the team in harmony.","tip":"With T: give feedback with reasons and results. With F: recognize their effort first, then give feedback gently and in private."},"J":{"hi":"Judging (J): you like plans, schedules and finishing early. You keep shifts tidy, but can get stressed when plans change suddenly.","lo":"Perceiving (P): you like keeping options open and adapt fast to surprises, sometimes leaving things until close to the deadline.","tip":"With J: share schedules and changes as early as possible. With P: break work into small steps with clear deadlines, and let them choose how."}},"types":{"ISTJ":{"desc":"Quiet, steady and responsible. You value procedures, promises and accuracy.","work":"Inventory, opening and closing shifts, handling cash, keeping recipes and hygiene standards.","watch":"Can be rigid when things need to change; try to hear out the reasons for a new way."},"ISFJ":{"desc":"Caring, dedicated, and good at remembering details about people. You quietly keep things running.","work":"Looking after regulars, careful prep, backing up coworkers during the rush.","watch":"Tends to take on too much and avoid saying no; speak up when you are overloaded."},"INFJ":{"desc":"Thoughtful, idealistic, and tuned in to others' feelings. You want work that means something.","work":"Mentoring new staff, improving the guest experience, building team culture.","watch":"May keep disagreements inside; say them early before you get worn out."},"INTJ":{"desc":"Independent and strategic, you like to build systems. You always look for a better way.","work":"Improving processes, planning orders, analyzing sales numbers.","watch":"Can be impatient with slower people; explain your reasons so everyone is on board."},"ISTP":{"desc":"Calm, practical and good in a crisis. You learn fast by doing.","work":"Running and fixing the espresso machine, handling urgent problems, hands-on skilled tasks.","watch":"May not share much information; let the team know what you have done."},"ISFP":{"desc":"Gentle, sensitive, with a good eye for beauty. You do well when you can add your own touch.","work":"Drink garnishing, plating, shop decor, product photos.","watch":"Tends to avoid conflict; state your needs clearly."},"INFP":{"desc":"Warm, values-driven and creative. You need to feel your work fits what you believe in.","work":"Writing social media posts, creating new drinks, listening to and calming upset guests.","watch":"Feelings can slow your progress; set small milestones for each task."},"INTP":{"desc":"Analytical, curious and logical. You like to understand how things work.","work":"Testing recipes, finding the cause of problems, setting up ordering systems and software.","watch":"May drop things once interest fades; finish a task before jumping to the next idea."},"ESTP":{"desc":"Energetic, quick and action-oriented. You handle things well when it gets busy.","work":"Peak hours, counter sales, events, solving problems on the spot.","watch":"May move fast and skip steps; double-check the important ones."},"ESFP":{"desc":"Cheerful, friendly and full of positive energy. You love working with people.","work":"Greeting guests, recommending items, lifting the mood of the shift, short videos.","watch":"Easily pulled toward what is fun right now; use a to-do list."},"ENFP":{"desc":"Enthusiastic, full of ideas and good at connecting. You inspire people around you.","work":"Promo ideas, events, social media, building bonds with guests and coworkers.","watch":"Tends to start many things at once; pick a few and finish them."},"ENTP":{"desc":"Quick-witted, loves debate and trying new things. You spot chances others miss.","work":"New product ideas, negotiating with suppliers, solving tough problems.","watch":"Can push debates too far; notice when people need agreement more than pushback."},"ESTJ":{"desc":"Decisive, organized and good at running things. You keep the team on time and on task.","work":"Shift lead, assigning tasks, checking standards, keeping the shop running smoothly.","watch":"Can give orders too bluntly; ask for input and recognize staff more often."},"ESFJ":{"desc":"Warm, attentive and caring about the whole team. You keep people connected.","work":"Guest care, training new staff, organizing team activities.","watch":"Can feel hurt when not appreciated; say what you need instead of waiting for others to guess."},"ENFJ":{"desc":"Inspiring, encouraging and understanding. You want to help others grow.","work":"Team lead, training, building team spirit, handling difficult guests.","watch":"May care for others and forget yourself; make time to rest."},"ENTJ":{"desc":"A natural leader, decisive and forward-looking. You like setting goals and hitting them.","work":"Management, opening new branches, business planning, big decisions.","watch":"Can focus so hard on results that you miss people's feelings; listen more."}}}},"big5":{"vi":{"how":"Mỗi chiều là một thang liên tục, điểm cao hay thấp đều có mặt mạnh riêng. Dùng kết quả để hiểu bản thân, chọn việc hợp và biết mình cần rèn thêm điều gì.","dims":{"O":{"hi":"Bạn tò mò, thích ý tưởng mới và sáng tạo, hợp với việc thử món hay cải tiến. Đôi khi bạn dễ chán việc lặp lại hằng ngày.","lo":"Bạn thích cách làm quen thuộc, đã được chứng minh, và làm việc ổn định, thực tế.","tip":"Nếu cao: ghi ý tưởng lại và chọn một ý để làm đến cùng. Nếu thấp: mỗi tháng thử một thay đổi nhỏ, như một công thức hay cách bày mới."},"C":{"hi":"Bạn ngăn nắp, đáng tin, làm việc đến nơi đến chốn. Rủi ro là cầu toàn quá mức hoặc căng thẳng khi người khác làm không kỹ.","lo":"Bạn linh hoạt, thoải mái và dễ thích nghi, có thể cần thêm công cụ để nhớ việc và giữ giờ.","tip":"Nếu cao: chấp nhận \"đủ tốt\" với việc nhỏ. Nếu thấp: dùng danh sách kiểm tra đầu và cuối ca, đặt nhắc việc trên điện thoại."},"E":{"hi":"Bạn năng động, thích giao tiếp và dễ tạo không khí vui. Đôi khi bạn nói nhiều hoặc thấy khó chịu khi phải làm một mình lâu.","lo":"Bạn trầm, thích làm việc tập trung và lắng nghe tốt; giao tiếp nhiều có thể làm bạn mệt.","tip":"Nếu cao: tập lắng nghe hết ý người khác trước khi nói. Nếu thấp: chuẩn bị sẵn vài câu chào và giới thiệu món để tự tin hơn với khách."},"A":{"hi":"Bạn tốt bụng, hợp tác, sẵn lòng giúp đồng nghiệp và khách. Rủi ro là ngại nói không hoặc tránh góp ý thẳng.","lo":"Bạn thẳng thắn, dám tranh luận và bảo vệ quan điểm, có thể làm người khác thấy hơi cứng.","tip":"Nếu cao: tập nói \"không\" lịch sự khi đã quá tải. Nếu thấp: trước khi góp ý, nói một điều người kia làm tốt."},"N":{"hi":"Bạn nhạy cảm với cảm xúc, dễ nhận ra vấn đề sớm. Khi áp lực cao, bạn có thể lo lắng hoặc tâm trạng thay đổi nhanh.","lo":"Bạn điềm tĩnh, giữ bình tĩnh trong giờ đông khách và ít bị cuốn theo căng thẳng.","tip":"Nếu cao: khi căng thẳng, hít thở chậm vài nhịp và chia việc thành bước nhỏ. Nếu thấp: để ý xem đồng nghiệp có đang căng thẳng hơn bạn không."}}},"en":{"how":"Each trait is a scale, and both high and low scores have their own strengths. Use the result to understand yourself, find work that fits, and see what to develop.","dims":{"O":{"hi":"You are curious, creative and open to new ideas, great for testing drinks or improving things. You may get bored with daily routine.","lo":"You prefer familiar, proven ways of working and stay steady and practical.","tip":"If high: write ideas down and pick one to finish. If low: try one small change each month, like a new recipe or plating style."},"C":{"hi":"You are organized, reliable and follow through. The risk is perfectionism or stress when others are less careful.","lo":"You are flexible, relaxed and adaptable, and may need tools to remember tasks and stay on time.","tip":"If high: accept \"good enough\" on small tasks. If low: use opening and closing checklists and set phone reminders."},"E":{"hi":"You are energetic, sociable and lift the mood. You may talk a lot or find long stretches of solo work draining.","lo":"You are quiet, focused and a good listener; a lot of social contact can tire you out.","tip":"If high: practice listening fully before you reply. If low: prepare a few greetings and menu lines so you feel confident with guests."},"A":{"hi":"You are kind, cooperative and happy to help coworkers and guests. The risk is struggling to say no or avoiding honest feedback.","lo":"You are direct, willing to debate and stand your ground, which can sometimes come across as tough.","tip":"If high: practice a polite \"no\" when you are overloaded. If low: before giving feedback, name one thing the person did well."},"N":{"hi":"You are emotionally sensitive and often notice problems early. Under heavy pressure you may worry or have quick mood shifts.","lo":"You are calm, stay steady during the rush, and are rarely swept up by stress.","tip":"If high: when stressed, take a few slow breaths and break the work into small steps. If low: check whether coworkers are more stressed than you are."}}}},"hexaco":{"vi":{"how":"Điểm càng cao cho thấy bạn tự mô tả mình càng chân thành, công bằng và khiêm tốn. Đây là tự đánh giá, nên dùng để tự nhìn lại và trò chuyện, không phải để kết luận ai trung thực hay không.","dims":{"S":{"hi":"Bạn nói thật, không nịnh hay giả vờ để được việc, nên mọi người dễ tin bạn. Đôi khi sự thẳng thắn có thể làm người khác ngại.","lo":"Bạn khéo léo, biết nói cho vừa lòng người nghe và linh hoạt trong cách ứng xử.","tip":"Nếu cao: nói thật nhưng chọn lời nhẹ nhàng. Nếu thấp: tập nói rõ điều bạn thực sự nghĩ, kể cả khi không dễ nghe."},"F":{"hi":"Bạn làm đúng luật lệ dù không ai nhìn thấy, rất hợp với việc giữ tiền, chìa khóa, kho. Đôi khi bạn khắt khe với người khác.","lo":"Bạn thực dụng, linh động với quy định khi thấy có lợi cho việc chung.","tip":"Nếu cao: nhớ rằng người khác có thể sai vì sơ suất chứ không phải cố ý. Nếu thấp: trước khi làm, tự hỏi \"Nếu quản lý biết, có ổn không?\"."},"G":{"hi":"Bạn ít bị cuốn theo tiền bạc, đồ hiệu hay địa vị, sống giản dị. Đôi khi bạn quên đề xuất quyền lợi xứng đáng cho mình.","lo":"Bạn có động lực từ thu nhập, thưởng và địa vị, điều này giúp bạn phấn đấu.","tip":"Nếu cao: đừng ngại nói về lương thưởng khi bạn đã đóng góp tốt. Nếu thấp: đặt mục tiêu thu nhập gắn với việc làm tốt, minh bạch."},"M":{"hi":"Bạn khiêm tốn, không tự cho mình hơn người, dễ làm việc chung. Rủi ro là bạn ít khi kể thành tích nên dễ bị bỏ sót.","lo":"Bạn tự tin vào giá trị của mình và dám nhận vai trò nổi bật.","tip":"Nếu cao: ghi lại việc tốt bạn đã làm và chia sẻ khi đánh giá. Nếu thấp: dành lời ghi nhận cho đóng góp của đồng nghiệp."}}},"en":{"how":"A higher score means you describe yourself as more sincere, fair and modest. It is a self-report, so use it for reflection and conversation, not to decide whether someone is honest.","dims":{"S":{"hi":"You say what you mean and don't flatter or fake things to get ahead, so people trust you. Your directness can sometimes feel uncomfortable.","lo":"You are tactful, know how to say what people want to hear, and adapt how you act.","tip":"If high: stay honest but choose gentle words. If low: practice saying what you really think, even when it is not easy to hear."},"F":{"hi":"You follow the rules even when no one is watching, a great fit for cash, keys and stock. You may be strict with others.","lo":"You are pragmatic and will bend rules when you think it helps get things done.","tip":"If high: remember others may slip by mistake, not on purpose. If low: before acting, ask yourself \"Would this be OK if my manager knew?\""},"G":{"hi":"You are not easily driven by money, status or luxury, and live simply. You may forget to ask for the rewards you have earned.","lo":"You are motivated by income, bonuses and status, which can push you to work hard.","tip":"If high: don't be shy about discussing pay when you have done good work. If low: tie your income goals to clear, transparent performance."},"M":{"hi":"You are modest and easy to work with. The risk is that you rarely mention your wins, so they can go unnoticed.","lo":"You are confident in your value and comfortable taking a visible role.","tip":"If high: keep a note of your good work and share it at reviews. If low: make a point of giving credit to coworkers."}}}},"ennea":{"vi":{"how":"Kiểu có điểm cao nhất thường là động lực chính của bạn, kiểu thứ hai là nét phụ. Dùng kết quả để hiểu điều gì thúc đẩy mỗi người và cách động viên họ, không dùng để dán nhãn.","dims":{"1":{"hi":"Bạn có tiêu chuẩn cao, làm việc chỉn chu, đúng chuẩn và có trách nhiệm. Rủi ro là tự trách hoặc khó chịu khi người khác làm không đúng.","lo":"Nét cầu toàn không nổi bật; bạn dễ chấp nhận kết quả \"đủ tốt\" và thoải mái hơn với sai sót nhỏ.","tip":"Nói rõ tiêu chuẩn, khen sự chỉn chu cụ thể. Khi góp ý, tập trung vào cách làm, tránh phê bình con người."},"2":{"hi":"Bạn ấm áp, hay giúp đỡ và nhạy với nhu cầu của người khác. Rủi ro là quên bản thân hoặc buồn khi không được ghi nhận.","lo":"Nét giúp đỡ không nổi bật; bạn giữ ranh giới rõ và tập trung vào việc của mình.","tip":"Cảm ơn cụ thể khi họ giúp. Thỉnh thoảng hỏi \"Bạn có đang ổn không?\" và nhắc họ nghỉ ngơi."},"3":{"hi":"Bạn hướng mục tiêu, năng suất và muốn được công nhận. Rủi ro là quá chạy theo thành tích mà bỏ qua cảm xúc hay chất lượng.","lo":"Nét thành đạt không nổi bật; bạn ít cần sự công nhận bên ngoài để có động lực.","tip":"Đặt mục tiêu rõ, có số đo, và ghi nhận kết quả công khai. Nhắc nhẹ rằng chất lượng quan trọng ngang tốc độ."},"4":{"hi":"Bạn có cá tính, sáng tạo và cảm nhận sâu. Rủi ro là tâm trạng lên xuống hoặc thấy mình không được hiểu.","lo":"Nét cá tính không nổi bật; bạn thoải mái làm theo cách chung mà không cần dấu ấn riêng.","tip":"Giao việc cho phép họ thêm chất riêng, như trang trí hay sáng tạo món. Lắng nghe cảm nhận của họ trước khi đưa giải pháp."},"5":{"hi":"Bạn thích quan sát, tìm hiểu sâu và suy nghĩ độc lập. Rủi ro là rút lui hoặc ít chia sẻ khi bị quá tải.","lo":"Nét quan sát không nổi bật; bạn thường hành động trước, tìm hiểu sau và thoải mái khi ở giữa đám đông.","tip":"Đưa thông tin đầy đủ, bằng văn bản nếu được. Cho họ thời gian suy nghĩ, đừng ép trả lời ngay trước nhóm."},"6":{"hi":"Bạn trung thành, có trách nhiệm và giỏi lường trước rủi ro. Rủi ro là lo lắng nhiều hoặc nghi ngại khi thiếu thông tin.","lo":"Nét trung thành không nổi bật; bạn tự tin hành động mà không cần nhiều đảm bảo.","tip":"Giữ lời hứa, giải thích rõ lý do thay đổi và báo trước. Coi những lo ngại của họ là góp ý hữu ích."},"7":{"hi":"Bạn lạc quan, nhiều năng lượng và thích trải nghiệm mới. Rủi ro là dễ chán, né việc khó hoặc bỏ dở giữa chừng.","lo":"Nét vui vẻ không nổi bật; bạn kiên nhẫn với việc lặp lại và thích sự ổn định.","tip":"Đổi việc cho đa dạng, giữ không khí vui. Chia việc khó thành phần nhỏ và cùng họ chốt hạn hoàn thành."},"8":{"hi":"Bạn mạnh mẽ, quyết đoán và dám bảo vệ người khác. Rủi ro là quá áp đảo hoặc khó chấp nhận bị kiểm soát.","lo":"Nét thủ lĩnh không nổi bật; bạn thích hợp tác hơn là giành quyền quyết định.","tip":"Nói thẳng, đừng vòng vo. Giao cho họ quyền quyết trong một phạm vi rõ ràng và tôn trọng khi họ phản biện."},"9":{"hi":"Bạn điềm tĩnh, dễ chịu và giỏi giữ hòa khí trong nhóm. Rủi ro là né mâu thuẫn hoặc không nói ra ý kiến của mình.","lo":"Nét hòa giải không nổi bật; bạn sẵn sàng nêu quan điểm dù có thể gây tranh luận.","tip":"Chủ động hỏi ý kiến họ và đợi họ trả lời. Đưa thứ tự ưu tiên rõ ràng để họ không bị phân tán."}}},"en":{"how":"Your highest type is usually your main motivation; the second is a secondary trait. Use it to understand what drives each person and how to motivate them, not to label anyone.","dims":{"1":{"hi":"You have high standards and do careful, correct, responsible work. The risk is being hard on yourself or frustrated when others cut corners.","lo":"The perfectionist drive is not strong in you; you accept \"good enough\" and are relaxed about small mistakes.","tip":"Spell out the standard and praise specific careful work. When giving feedback, focus on the method, not the person."},"2":{"hi":"You are warm, helpful and tuned in to others' needs. The risk is neglecting yourself or feeling hurt when not appreciated.","lo":"The helper drive is not strong in you; you keep clear boundaries and focus on your own work.","tip":"Thank them specifically when they help. Now and then ask \"Are you doing OK?\" and remind them to take breaks."},"3":{"hi":"You are goal-driven, productive and want recognition. The risk is chasing results at the cost of feelings or quality.","lo":"The achiever drive is not strong in you; you need little outside recognition to stay motivated.","tip":"Set clear, measurable goals and recognize results openly. Gently remind them that quality matters as much as speed."},"4":{"hi":"You are expressive, creative and feel things deeply. The risk is mood swings or feeling misunderstood.","lo":"The individualist drive is not strong in you; you are fine following the shared way without a personal stamp.","tip":"Give tasks where they can add a personal touch, like decor or new drinks. Listen to how they feel before offering fixes."},"5":{"hi":"You like to observe, dig deep and think independently. The risk is withdrawing or sharing little when overloaded.","lo":"The observer drive is not strong in you; you tend to act first, learn as you go, and are at ease in a crowd.","tip":"Give complete information, in writing when possible. Give them time to think; don't push for an instant answer in front of the group."},"6":{"hi":"You are loyal, responsible and good at spotting risks early. The risk is worrying a lot or doubting when information is missing.","lo":"The loyalist drive is not strong in you; you act with confidence without needing much reassurance.","tip":"Keep your promises, explain the reasons for changes, and give notice. Treat their concerns as useful input."},"7":{"hi":"You are upbeat, energetic and love new experiences. The risk is getting bored, avoiding hard tasks or leaving things unfinished.","lo":"The enthusiast drive is not strong in you; you are patient with routine and like stability.","tip":"Rotate tasks for variety and keep the mood light. Break hard tasks into small parts and agree on a finish date together."},"8":{"hi":"You are strong, decisive and stand up for others. The risk is coming on too strong or resisting being controlled.","lo":"The challenger drive is not strong in you; you prefer working together over taking charge.","tip":"Talk straight, no beating around the bush. Give them authority within a clear scope and respect it when they push back."},"9":{"hi":"You are calm, easygoing and good at keeping the peace. The risk is avoiding conflict or not voicing your own view.","lo":"The peacemaker drive is not strong in you; you are willing to state your view even if it starts a debate.","tip":"Ask for their opinion directly and wait for the answer. Give clear priorities so they don't get pulled in many directions."}}}},"disc":{"vi":{"how":"Ai cũng có cả bốn phong cách, nhưng thường có một hoặc hai phong cách nổi bật. Biết phong cách của mình và đồng nghiệp giúp giao việc, góp ý và giải quyết mâu thuẫn dễ hơn.","dims":{"D":{"hi":"Bạn nhanh, thẳng thắn, thích thử thách và kết quả. Rủi ro là thiếu kiên nhẫn hoặc làm người khác thấy bị ép.","lo":"Phong cách D không nổi bật; bạn thích bàn bạc, cân nhắc và để người khác dẫn dắt khi cần.","tip":"Nói ngắn gọn, vào việc, nêu mục tiêu và đưa vài lựa chọn để họ tự quyết. Tránh giải thích dài dòng."},"I":{"hi":"Bạn nhiệt tình, vui vẻ và giỏi kết nối, làm khách và đồng nghiệp thấy thoải mái. Rủi ro là quên chi tiết hoặc hứa nhiều.","lo":"Phong cách I không nổi bật; bạn kiệm lời, tập trung vào việc hơn là giao lưu.","tip":"Mở đầu thân thiện, khen trước mọi người. Ghi lại các việc đã thống nhất để họ không quên chi tiết."},"S":{"hi":"Bạn điềm tĩnh, kiên nhẫn, đáng tin và hỗ trợ đồng đội. Rủi ro là ngại thay đổi hoặc không nói ra khi không đồng ý.","lo":"Phong cách S không nổi bật; bạn thích nhịp nhanh, thay đổi và việc đa dạng.","tip":"Báo trước thay đổi và giải thích lý do. Hỏi riêng ý kiến của họ, cho thời gian để quen dần."},"C":{"hi":"Bạn chính xác, cẩn thận và theo quy trình, giúp giữ chất lượng ổn định. Rủi ro là quá kỹ, chậm hoặc nặng về phê bình.","lo":"Phong cách C không nổi bật; bạn thoải mái quyết định nhanh dù chưa đủ mọi chi tiết.","tip":"Đưa số liệu, lý do và hướng dẫn bằng văn bản. Cho họ thời gian kiểm tra và nói rõ mức độ chi tiết cần thiết."}}},"en":{"how":"Everyone uses all four styles, but one or two usually stand out. Knowing your style and your coworkers' makes giving tasks, feedback and solving conflicts easier.","dims":{"D":{"hi":"You are fast, direct and love challenges and results. The risk is impatience or making others feel pushed.","lo":"D is not a main style for you; you like to discuss, weigh options and let others lead when needed.","tip":"Keep it short and to the point, state the goal, and offer a few options for them to choose. Skip long explanations."},"I":{"hi":"You are enthusiastic, cheerful and great at connecting, putting guests and coworkers at ease. The risk is missing details or overpromising.","lo":"I is not a main style for you; you talk less and focus on the task more than socializing.","tip":"Start friendly and praise them in front of others. Write down what you agreed on so details don't slip."},"S":{"hi":"You are calm, patient, dependable and supportive. The risk is resisting change or not speaking up when you disagree.","lo":"S is not a main style for you; you like a fast pace, change and variety.","tip":"Give advance notice of changes and explain why. Ask for their opinion privately and give them time to adjust."},"C":{"hi":"You are precise, careful and follow procedures, keeping quality consistent. The risk is being too detailed, slow or critical.","lo":"C is not a main style for you; you are comfortable deciding quickly without every detail.","tip":"Give numbers, reasons and written instructions. Allow time to check, and say clearly how much detail is needed."}}}},"belbin":{"vi":{"how":"Điểm cao cho thấy vai trò bạn tự nhiên hay nhận trong nhóm; hầu hết mọi người có 2–3 vai mạnh. Dùng kết quả để chia việc hợp người và xem nhóm đang thiếu vai nào.","dims":{"PL":{"hi":"Bạn hay nghĩ ra ý tưởng mới và cách giải khác thường khi nhóm bí. Rủi ro: mải nghĩ ý mới mà bỏ qua chi tiết thực tế hoặc khó nhận góp ý.","lo":"Bạn ít khi là người đưa ra ý tưởng mới, thường làm tốt hơn với những gì đã rõ ràng.","tip":"Giao việc thử công thức đồ uống mới, nghĩ món theo mùa, hoặc tìm cách giải một vấn đề lặp lại ở quầy. Ghép với người Hoàn thiện để ý tưởng thành thật."},"RI":{"hi":"Bạn giỏi kết nối, nói chuyện và nhìn ra cơ hội bên ngoài. Rủi ro: hào hứng lúc đầu rồi mất hứng, bỏ dở khi việc trở nên đều đều.","lo":"Bạn ít khi chủ động tìm mối quan hệ hay cơ hội bên ngoài nhóm.","tip":"Giao việc liên hệ đối tác, quán lân cận, sự kiện cộng đồng, hoặc hỏi khách quen về món họ muốn có. Nhờ người khác theo dõi phần làm tiếp."},"CO":{"hi":"Bạn biết ai hợp việc gì, giữ nhóm tập trung vào mục tiêu chung. Rủi ro: giao việc nhiều đến mức người khác thấy bạn đẩy hết việc cho họ.","lo":"Bạn ít khi đứng ra chia việc hay điều phối cả nhóm.","tip":"Giao vai trưởng ca, xếp lịch làm, hoặc chia vị trí quầy/bếp trước giờ đông. Nhắc bạn vẫn tự nhận một phần việc cụ thể."},"SH":{"hi":"Bạn có năng lượng, thích áp lực và đẩy nhóm vượt khó. Rủi ro: nóng vội, nói thẳng quá mức làm người khác tổn thương.","lo":"Bạn ít khi thúc ép nhóm, thường để nhịp độ tự nhiên.","tip":"Giao giờ cao điểm, ngày khai trương, đơn hàng lớn cần làm gấp. Sau ca bận, dành vài phút cảm ơn nhóm để giữ không khí."},"ME":{"hi":"Bạn bình tĩnh, cân nhắc mọi phương án và ít bị cảm xúc chi phối. Rủi ro: chậm quyết định, dễ bị xem là lạnh lùng hoặc hay chê.","lo":"Bạn ít khi đứng ra phân tích ưu nhược điểm trước khi nhóm quyết định.","tip":"Nhờ bạn so sánh nhà cung cấp, xem lại giá menu, hoặc góp ý kế hoạch khuyến mãi trước khi chạy. Không giao việc cần quyết ngay tại quầy."},"TW":{"hi":"Bạn lắng nghe, hỗ trợ và giữ nhóm hòa thuận. Rủi ro: ngại va chạm, khó đưa ra quyết định làm mất lòng người khác.","lo":"Bạn ít khi để ý đến không khí nhóm hay đứng ra hòa giải.","tip":"Giao kèm người mới trong tuần đầu, hoặc làm cầu nối khi hai bạn trong ca có chuyện. Cho bạn biết rằng nói thẳng vẫn có thể tử tế."},"IMP":{"hi":"Bạn đáng tin, có kỷ luật, biến kế hoạch thành việc làm cụ thể. Rủi ro: hơi cứng nhắc, chậm thích nghi khi có cách làm mới.","lo":"Bạn ít khi là người dựng quy trình hay biến ý tưởng thành các bước cụ thể.","tip":"Giao việc mở/đóng quán, viết checklist chuẩn bị nguyên liệu, hoặc đưa món mới vào quy trình bếp. Báo trước khi có thay đổi."},"CF":{"hi":"Bạn tỉ mỉ, bắt được lỗi người khác bỏ sót và làm đến nơi đến chốn. Rủi ro: lo lắng quá mức, khó giao việc cho người khác.","lo":"Bạn ít khi soát lại chi tiết cuối cùng, thường tin rằng mọi việc đã ổn.","tip":"Giao kiểm kho, kiểm hạn sử dụng, soát đơn online trước khi giao, hoặc kiểm vệ sinh cuối ca. Đặt rõ mức “đủ tốt” để bạn không quá căng."},"SP":{"hi":"Bạn có kiến thức sâu và tự hào về chuyên môn của mình. Rủi ro: chỉ quan tâm mảng của mình, ít để ý bức tranh chung.","lo":"Bạn có thể làm nhiều việc khác nhau hơn là đi sâu vào một mảng.","tip":"Giao vai pha chế chính, bếp chính, hoặc phụ trách máy móc, POS. Nhờ bạn dạy lại kỹ năng cho người khác để kiến thức không nằm ở một người."}}},"en":{"how":"High scores show the roles you naturally take in a team; most people have 2–3 strong ones. Use the result to match tasks to people and spot roles the team is missing.","dims":{"PL":{"hi":"You come up with new ideas and unusual solutions when the team is stuck. Risk: getting lost in ideas, ignoring practical details, or taking feedback poorly.","lo":"You rarely bring new ideas and tend to work best with what is already clear.","tip":"Give them new drink recipes, seasonal specials, or a recurring problem at the counter to solve. Pair them with a Completer Finisher to make ideas real."},"RI":{"hi":"You are good at connecting with people and spotting outside opportunities. Risk: starting with energy, then losing interest once the work gets routine.","lo":"You rarely reach outside the team for contacts or opportunities.","tip":"Give them partner outreach, neighborhood events, or asking regulars what they want on the menu. Have someone else handle the follow-through."},"CO":{"hi":"You see who fits which task and keep the team focused on a shared goal. Risk: delegating so much that others feel you are passing off all the work.","lo":"You rarely step up to divide tasks or coordinate the team.","tip":"Give them shift lead, scheduling, or assigning counter and kitchen stations before a rush. Remind them to also own a hands-on task."},"SH":{"hi":"You bring energy, like pressure, and push the team through obstacles. Risk: being impatient or blunt enough to hurt people.","lo":"You rarely push the team and tend to let the pace set itself.","tip":"Give them rush hours, opening days, and big urgent orders. After a busy shift, have them take a minute to thank the crew."},"ME":{"hi":"You stay calm, weigh every option, and are not easily swayed by emotion. Risk: slow decisions, and coming across as cold or overly critical.","lo":"You rarely lay out pros and cons before the team decides.","tip":"Ask them to compare suppliers, review menu prices, or check a promo plan before launch. Avoid giving them on-the-spot decisions at the counter."},"TW":{"hi":"You listen, support others, and keep the team getting along. Risk: avoiding friction and struggling with decisions that might upset someone.","lo":"You rarely pay attention to team mood or step in to smooth things over.","tip":"Have them buddy with new hires in their first week, or help when two coworkers clash. Let them know being direct can still be kind."},"IMP":{"hi":"You are reliable and disciplined, and turn plans into concrete action. Risk: being a bit rigid and slow to adapt to new ways of working.","lo":"You rarely build procedures or turn ideas into step-by-step tasks.","tip":"Give them opening/closing, prep checklists, or rolling a new item into the kitchen routine. Tell them about changes ahead of time."},"CF":{"hi":"You are thorough, catch mistakes others miss, and finish what you start. Risk: worrying too much and finding it hard to hand work to others.","lo":"You rarely do a final check on details and tend to trust things are fine.","tip":"Give them inventory, expiry-date checks, reviewing online orders before pickup, or end-of-shift cleaning checks. Define what “good enough” looks like."},"SP":{"hi":"You have deep know-how and take pride in your craft. Risk: focusing only on your own area and missing the bigger picture.","lo":"You likely cover many different tasks rather than going deep in one area.","tip":"Give them head barista, head cook, or ownership of equipment and the POS. Ask them to teach their skills so knowledge does not sit with one person."}}}},"situ":{"vi":{"how":"Người dẫn dắt giỏi đổi kiểu theo từng người và từng tình huống, không có kiểu nào luôn đúng. Nếu kiểu nào cũng cao, hãy xem kiểu nào thấp nhất và kiểu bạn hay quay về khi áp lực.","dims":{"S1":{"hi":"Bạn rõ ràng, chỉ việc cụ thể và kiểm tra sát, giúp người mới làm đúng ngay. Rủi ro: dùng với người đã giỏi sẽ làm họ thấy bị quản lý quá mức.","lo":"Bạn ít khi chỉ từng bước, có thể khiến người mới bị bỏ lơ khi chưa biết việc.","tip":"Dùng với nhân viên ngày đầu, hoặc khi dạy quy trình an toàn thực phẩm, máy POS. Giảm dần khi họ đã làm đúng vài ca liền."},"S2":{"hi":"Bạn vừa chỉ việc vừa giải thích lý do và động viên, giúp người đang học vững dần. Rủi ro: nói nhiều quá với người chỉ cần được để tự làm.","lo":"Bạn ít khi dành thời gian giải thích “tại sao”, người học có thể làm đúng mà không hiểu.","tip":"Dùng với người đã qua vài tuần nhưng còn lúng túng lúc đông khách. Sau ca, cùng xem lại một đơn khó và giải thích cách xử lý."},"S3":{"hi":"Bạn lắng nghe, hỏi ý kiến và khích lệ, giúp người có tay nghề tự tin hơn. Rủi ro: hỗ trợ quá lâu mà không trao hẳn trách nhiệm.","lo":"Bạn ít khi hỏi ý kiến nhân viên, có thể bỏ lỡ người giỏi nhưng chưa dám lên tiếng.","tip":"Dùng với nhân viên làm tốt nhưng ngại xử lý khách khó hay đứng quầy một mình. Hỏi “bạn định làm thế nào?” trước khi góp ý."},"S4":{"hi":"Bạn tin người, giao hẳn việc và ít can thiệp, giúp người giỏi chủ động. Rủi ro: giao cho người chưa sẵn sàng sẽ khiến họ chới với.","lo":"Bạn ít khi giao hẳn việc, có thể làm người giỏi thấy không được tin tưởng.","tip":"Dùng với người đã vững, như giao trọn việc mở quán hay đặt hàng tuần. Hẹn một lần kiểm tra ngắn thay vì theo dõi liên tục."}}},"en":{"how":"The best leaders switch styles to fit the person and the situation; no style is always right. If every style scores high, look at which ones are lowest and which one you fall back on under pressure.","dims":{"S1":{"hi":"You give clear, specific instructions and check closely, so new people get it right fast. Risk: using it on skilled people makes them feel micromanaged.","lo":"You rarely spell out steps, which can leave new people lost before they know the job.","tip":"Use it on someone's first day, or when teaching food safety or the POS. Ease off once they have done it right for a few shifts."},"S2":{"hi":"You show how, explain why, and encourage, helping learners grow steady. Risk: talking too much to someone who just needs room to do it.","lo":"You rarely take time to explain why, so learners may do it right without understanding.","tip":"Use it with someone a few weeks in who still struggles during rushes. After the shift, walk through one tricky order together."},"S3":{"hi":"You listen, ask for input, and encourage, helping skilled people gain confidence. Risk: supporting for too long without fully handing over responsibility.","lo":"You rarely ask staff for their input and may miss skilled people who are too shy to speak up.","tip":"Use it with someone capable who hesitates to handle difficult guests or run the counter alone. Ask “how would you do it?” before giving advice."},"S4":{"hi":"You trust people, hand work over, and step back, letting strong staff take ownership. Risk: delegating to someone not ready leaves them struggling.","lo":"You rarely hand work over fully, which can make skilled people feel untrusted.","tip":"Use it with proven staff, like owning opening or the weekly supply order. Set one short check-in instead of watching constantly."}}}},"goleman":{"vi":{"how":"Người lãnh đạo giỏi đổi kiểu theo người và tình huống. Nếu kiểu nào cũng cao, hãy chú ý kiểu thấp nhất và kiểu bạn hay quay về khi áp lực; dùng quá nhiều Chỉ huy hay Tốc độ thường làm tinh thần nhóm đi xuống.","dims":{"CH":{"hi":"Bạn quyết nhanh và dứt khoát, rất cần khi có sự cố. Rủi ro: dùng thường xuyên khiến nhóm thụ động, mất tinh thần và ngại góp ý.","lo":"Bạn ít khi ra lệnh thẳng, có thể chậm phản ứng khi tình huống cần quyết ngay.","tip":"Dùng khi có sự cố thật: cháy bếp, khách dị ứng, mất điện. Xong việc thì quay lại cách khác và giải thích vì sao lúc đó bạn phải ra lệnh."},"DH":{"hi":"Bạn cho nhóm thấy mục tiêu và lý do, rồi để họ tự chọn cách làm. Rủi ro: nói mục tiêu lớn với người giỏi hơn bạn có thể bị xem là lý thuyết suông.","lo":"Bạn ít khi nói về mục tiêu chung, nhóm có thể làm đúng việc mà không hiểu vì sao.","tip":"Dùng khi đổi menu, mở chi nhánh, hoặc đầu tuần: nói rõ mình muốn khách cảm thấy gì, rồi để nhóm đề xuất cách làm."},"GK":{"hi":"Bạn quan tâm con người, tạo sự gắn bó và hàn gắn khi nhóm căng thẳng. Rủi ro: chỉ khen mà ít góp ý thẳng, để việc kém kéo dài.","lo":"Bạn ít khi chú ý cảm xúc của nhóm, có thể bỏ lỡ dấu hiệu người đang mệt mỏi.","tip":"Dùng sau một ca quá tải, sau khi bị khách phàn nàn, hoặc khi có người mới. Kết hợp với góp ý cụ thể để không bỏ qua việc chưa tốt."},"DC":{"hi":"Bạn lắng nghe và hỏi ý kiến, giúp nhóm thấy mình có tiếng nói. Rủi ro: hỏi quá nhiều khiến việc chậm, nhất là khi cần quyết nhanh.","lo":"Bạn ít khi hỏi ý kiến cả nhóm, có thể bỏ lỡ ý hay từ người làm trực tiếp.","tip":"Dùng khi xếp lại quầy, chọn món mới hay đổi lịch ca: hỏi nhóm trước. Đừng dùng giữa giờ cao điểm."},"TD":{"hi":"Bạn đặt chuẩn cao và tự làm mẫu, hữu ích khi nhóm đã giỏi và cần kết quả nhanh. Rủi ro: dùng lâu dễ làm nhóm kiệt sức và mất tinh thần.","lo":"Bạn ít khi tự làm mẫu với chuẩn cao, nhóm có thể chưa rõ “tốt” trông như thế nào.","tip":"Dùng ngắn hạn với nhóm đã thạo việc, như ngày lễ đông khách. Tránh tự nhảy vào làm thay; hãy nói rõ chuẩn và cho họ thời gian."},"HL":{"hi":"Bạn đầu tư vào sự phát triển lâu dài của từng người. Rủi ro: không hiệu quả với người chưa muốn học, và tốn thời gian khi cần kết quả ngay.","lo":"Bạn ít khi giúp nhân viên đặt mục tiêu phát triển, người giỏi có thể thấy chững lại.","tip":"Dùng với người muốn lên trưởng ca hay học pha chế: hẹn 15 phút mỗi tháng để cùng xem tiến bộ và chọn một kỹ năng tiếp theo."}}},"en":{"how":"The best leaders switch styles to fit the person and situation. If every style scores high, look at which are lowest and which one you fall back on under pressure; overusing Commanding or Pacesetting tends to hurt team morale.","dims":{"CH":{"hi":"You decide fast and firmly, which matters in a real emergency. Risk: used often, it makes the team passive, drains morale, and stops people speaking up.","lo":"You rarely give direct orders and may react slowly when a moment needs an instant call.","tip":"Use it for real emergencies: kitchen fire, guest allergy, power outage. Afterward, switch back and explain why you had to give orders."},"DH":{"hi":"You show the team the goal and the reason, then let them choose how. Risk: big-picture talk can feel empty to people more expert than you.","lo":"You rarely talk about the shared goal, so the team may do the task without knowing why.","tip":"Use it for menu changes, a new branch, or the start of the week: say how you want guests to feel, then let the team suggest how."},"GK":{"hi":"You care about people, build bonds, and heal the team after stress. Risk: praising a lot but giving little direct feedback, so poor work goes unaddressed.","lo":"You rarely tune into team feelings and may miss signs someone is worn out.","tip":"Use it after a brutal shift, a guest complaint, or when someone is new. Pair it with specific feedback so problems still get fixed."},"DC":{"hi":"You listen and ask for input, so the team feels heard. Risk: too much consulting slows things down, especially when a fast call is needed.","lo":"You rarely ask the whole team and may miss good ideas from the people doing the work.","tip":"Use it when rearranging the counter, picking a new item, or changing shifts: ask the team first. Don't use it mid-rush."},"TD":{"hi":"You set high standards and lead by example, useful with a skilled team that needs fast results. Risk: used for long, it burns people out and lowers morale.","lo":"You rarely model a high standard yourself, so the team may not know what “great” looks like.","tip":"Use it briefly with an experienced crew, like a holiday rush. Avoid jumping in to do it for them; state the standard and give them time."},"HL":{"hi":"You invest in each person's long-term growth. Risk: it does little for people who don't want to learn, and takes time when you need results now.","lo":"You rarely help staff set growth goals, so strong people may feel stuck.","tip":"Use it with someone aiming for shift lead or barista skills: meet 15 minutes a month to review progress and pick the next skill."}}}},"tki":{"vi":{"how":"Kết quả cho thấy cách bạn hay phản ứng khi bất đồng. Không cách nào luôn đúng; điều có ích là biết mình hay dùng cách nào, cách nào ít dùng, và lúc nào nên đổi.","dims":{"CT":{"hi":"Bạn dám bảo vệ ý mình và quyết nhanh, hữu ích khi có việc quan trọng cần làm ngay. Rủi ro: dùng nhiều sẽ làm người khác thấy bị áp đặt và ngại lên tiếng.","lo":"Bạn ít khi giữ ý mình đến cùng, có thể nhường cả khi mình đúng.","tip":"Hợp nhất khi liên quan an toàn thực phẩm, vệ sinh hay quy định: giữ vững chuẩn, không thương lượng."},"HT":{"hi":"Bạn tìm cách để cả hai bên cùng được, giúp giải quyết tận gốc. Rủi ro: tốn thời gian và công sức, không đáng với chuyện nhỏ.","lo":"Bạn ít khi ngồi xuống tìm giải pháp chung, vấn đề có thể chỉ được giải quyết nửa vời.","tip":"Hợp nhất cho chuyện lâu dài như chia ca cuối tuần, phân việc giữa quầy và bếp: ngồi lại sau giờ làm, nghe đủ hai bên."},"TH":{"hi":"Bạn giúp hai bên gặp nhau ở giữa nhanh và công bằng. Rủi ro: dùng nhiều thì vấn đề gốc không được giải quyết và không ai thật sự hài lòng.","lo":"Bạn ít khi chọn cách mỗi bên nhường một chút, có thể khiến bất đồng kéo dài.","tip":"Hợp nhất khi cần chốt nhanh mà hai bên đều có lý, như đổi ca: mỗi người nhận một nửa số ca cuối tuần."},"NT":{"hi":"Bạn biết để chuyện nhỏ qua đi và chờ mọi người bình tĩnh. Rủi ro: chuyện lớn bị né sẽ tích tụ và bùng phát sau.","lo":"Bạn ít khi lùi lại, có thể làm lớn cả những chuyện không đáng.","tip":"Hợp nhất giữa giờ cao điểm khi hai người đang nóng: tạm gác lại, hẹn nói chuyện sau ca. Nhớ quay lại thật."},"NB":{"hi":"Bạn sẵn sàng nhường để giữ quan hệ, nhất là khi mình sai. Rủi ro: nhường quá nhiều khiến nhu cầu của bạn bị bỏ qua và dễ ấm ức.","lo":"Bạn ít khi nhường, có thể làm người khác thấy bạn cứng rắn ngay cả với chuyện nhỏ.","tip":"Hợp nhất khi khách phàn nàn chuyện nhỏ hoặc khi bạn nhận ra mình sai: nhận lỗi, sửa nhanh, giữ thiện cảm."}}},"en":{"how":"This shows how you tend to respond to disagreement. No mode is always right; what helps is knowing which one you use most, which you rarely use, and when to switch.","dims":{"CT":{"hi":"You stand up for your view and decide quickly, useful when something important must happen now. Risk: overused, people feel overruled and stop speaking up.","lo":"You rarely hold your ground and may give in even when you are right.","tip":"Works best for food safety, hygiene, or rules: hold the standard firmly and don't negotiate it."},"HT":{"hi":"You look for a solution where both sides win, fixing the root cause. Risk: it takes time and effort that small issues don't deserve.","lo":"You rarely sit down to find a shared solution, so issues may only get half-solved.","tip":"Works best for lasting issues like weekend shifts or splitting work between counter and kitchen: meet after the shift and hear both sides fully."},"TH":{"hi":"You help both sides meet in the middle, quickly and fairly. Risk: overused, the real problem stays unsolved and no one is fully happy.","lo":"You rarely split the difference, which can let disagreements drag on.","tip":"Works best when you need a quick deal and both sides have a point, like shift swaps: each person takes half the weekend shifts."},"NT":{"hi":"You let small things go and give people time to cool off. Risk: avoiding big issues lets them build up and blow up later.","lo":"You rarely step back and may turn small things into big ones.","tip":"Works best mid-rush when two people are heated: park it and agree to talk after the shift. Then actually follow up."},"NB":{"hi":"You are willing to give way to keep the relationship, especially when you are wrong. Risk: giving in too often means your needs get ignored and resentment builds.","lo":"You rarely give way and may seem stubborn even about small things.","tip":"Works best when a guest complains about something minor or you realize you were wrong: own it, fix it fast, keep the goodwill."}}}},"strengths":{"vi":{"how":"Nhóm điểm cao nhất cho thấy cách bạn tạo giá trị tự nhiên nhất; điểm thấp không phải điểm yếu, chỉ là cách bạn ít dùng. Dùng kết quả để giao việc hợp thế mạnh và ghép cặp bổ sung cho nhau.","dims":{"TT":{"hi":"Bạn làm việc chăm chỉ, đúng hạn, đúng chuẩn và mọi người tin cậy được. Rủi ro: ôm việc quá nhiều hoặc chỉ lo làm xong mà quên hỏi làm vậy có cần không.","lo":"Bạn ít dựa vào việc tự tay làm cho xong, thường tạo giá trị qua con người hoặc ý tưởng.","tip":"Giao việc chuẩn bị nguyên liệu, mở/đóng quán, kiểm kho, giữ đúng thời gian ra món lúc đông khách."},"AH":{"hi":"Bạn tự tin, nói chuyện thuyết phục và dễ kéo người khác theo. Rủi ro: lấn át người ít nói hoặc thúc ép khách quá mức.","lo":"Bạn ít khi đứng ra thuyết phục hay dẫn đầu, thường để người khác lên tiếng trước.","tip":"Giao việc giới thiệu món mới, gợi ý thêm món cho khách, quay video mạng xã hội, hoặc dẫn buổi họp đầu ca."},"QH":{"hi":"Bạn hiểu cảm xúc người khác, tạo sự tin tưởng và giữ nhóm gắn bó. Rủi ro: ôm cảm xúc của người khác, ngại nói điều khó nghe.","lo":"Bạn ít tập trung vào việc xây quan hệ, thường tạo giá trị qua công việc hoặc ý tưởng.","t
