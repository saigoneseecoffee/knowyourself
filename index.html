["qb08","QT","TN","Bạn dùng nhiệt kế hồng ngoại (súng bắn nhiệt) chĩa vào bình sữa. Con số đó cho biết gì?",["Chỉ nhiệt độ bề mặt bên ngoài, không phải bên trong sữa","Nhiệt độ chính xác ở ngay giữa bình sữa","Nhiệt độ trung bình của cả tủ lạnh nơi để sữa","Sữa còn trong hạn dùng hay đã hết hạn"],"You point an infrared thermometer at a jug of milk. What does the reading tell you?",["Only the outside surface temperature, not the milk inside","The exact temperature in the middle of the milk","The average temperature of the whole fridge it's in","Whether the milk is still within its date"],"Nhiệt kế hồng ngoại chỉ đo bề mặt, hợp để kiểm tra nhanh. Muốn biết nhiệt độ bên trong đồ ăn phải dùng nhiệt kế que (thermocouple, thermistor hoặc nhiệt kế kim loại có que) cắm vào.","Infrared thermometers only read the surface, which is fine for a quick check. To know the internal temperature you need a probe thermometer (thermocouple, thermistor or bimetallic stemmed) inserted into the food."],
["qb09","QT","TN","Ngoài cách dùng nước đá, bạn có thể kiểm tra nhiệt kế que bằng nước sôi. Ở gần mực nước biển như Weymouth, nhiệt kế đúng phải chỉ bao nhiêu?",["212°F (100°C)","165°F (74°C)","180°F (82°C)","250°F (121°C)"],"Besides the ice-point method, you can check a probe thermometer in boiling water. Near sea level, like in Weymouth, what should it read?",["212°F (100°C)","165°F (74°C)","180°F (82°C)","250°F (121°C)"],"Nước sôi ở mực nước biển là 212°F (100°C); lên cao thì điểm sôi thấp hơn. Nhiệt kế lệch thì chỉnh lại theo hướng dẫn hoặc thay cái khác.","Water boils at 212°F (100°C) at sea level, and lower at high altitude. If the thermometer is off, adjust it per the instructions or replace it."],
["qb10","QT","TN","Bạn vừa đo nhiệt độ gà sống, giờ cần đo hộp kem muối. Bạn làm gì với que nhiệt kế?",["Rửa sạch rồi khử trùng que (ví dụ lau cồn) trước khi đo","Lau khô bằng tạp dề rồi đo kem muối luôn","Rửa sơ qua bằng nước lạnh là đủ","Không cần làm gì, vì que chưa chạm tay hay mặt quầy"],"You just checked the temperature of raw chicken and now need to check the salted cream. What do you do with the thermometer probe?",["Clean and sanitize it (for example with an alcohol swab) before using it","Wipe it dry on your apron, then check the cream right away","Give it a quick rinse under cold water and that's enough","Nothing, since the probe never touched your hands or the counter"],"Que nhiệt kế đã cắm vào đồ sống sẽ mang vi khuẩn sang đồ ăn liền. Phải làm sạch và khử trùng que giữa mỗi lần đo các món khác nhau.","A probe that went into raw food will carry germs into ready-to-eat food. Clean and sanitize it between every different food you check."],
["qb11","QT","TN","Theo bài học ServSafe, đồ đang giữ lạnh hoặc giữ nóng phải được đo nhiệt độ ít nhất bao lâu một lần?",["Mỗi 4 giờ","Mỗi ngày một lần lúc mở cửa","Mỗi tuần một lần","Chỉ khi thấy tủ có vấn đề"],"According to ServSafe, how often at least should you check the temperature of food in cold or hot holding?",["Every 4 hours","Once a day at opening","Once a week","Only when the unit seems to have a problem"],"Đo ít nhất mỗi 4 giờ, vì đồ ở vùng nguy hiểm 4 giờ trở lên là phải bỏ. Đo mỗi 2 giờ thì còn kịp sửa trước khi phải bỏ.","Check at least every 4 hours, because food in the danger zone for 4 hours or more must be thrown away. Checking every 2 hours leaves time to fix a problem before food is lost."],
["qb12","QT","TN","Bạn đo tủ sữa ở quầy bar và thấy nhiệt độ cao hơn mức cho phép. Trên sổ ghi nhiệt độ (temp log), bạn cần ghi gì?",["Nhiệt độ, giờ đo, việc bạn đã làm để xử lý, và tên viết tắt của bạn","Chỉ ghi chữ \"OK\" và tên viết tắt cho nhanh","Để trống, đợi quản lý tới kiểm tra rồi tự ghi","Ghi 41°F cho đúng chuẩn rồi báo quản lý sau"],"You check the milk fridge at the bar and it's warmer than allowed. What do you write in the temperature log?",["The temperature, the time, what you did to fix it, and your initials","Just \"OK\" and your initials to save time","Leave it blank and let the manager fill it in after checking","Write 41°F so it matches the standard and tell the manager later"],"Sổ nhiệt độ phải ghi đúng số thật, giờ đo, người đo và hành động khắc phục (corrective action). Ghi sai số là che giấu vấn đề và có thể làm khách bị ngộ độc.","The log must show the real temperature, the time, who checked, and the corrective action taken. Writing a false number hides the problem and can make customers sick."],
["qb13","QT","TN","Tủ lạnh dưới quầy bar đang chỉ 47°F, sữa bên trong đo được 46°F. Lần đo trước cách đây 1 giờ vẫn là 40°F. Bạn làm gì?",["Chuyển sữa sang tủ khác đang chạy tốt, ghi sổ và báo quản lý","Cứ dùng sữa tiếp, qua đêm tủ sẽ tự lạnh lại","Bỏ thêm túi đá vào tủ rồi bán bình thường","Bật tủ lên mức lạnh nhất và không cần báo ai"],"The under-bar fridge reads 47°F and the milk inside is 46°F. An hour ago it read 40°F. What do you do?",["Move the milk to a working fridge, write it in the log and tell the manager","Keep using the milk, since the fridge will cool back down overnight","Put a bag of ice in the fridge and carry on serving as normal","Turn it to the coldest setting and don't bother telling anyone"],"Sữa mới ở trên 41°F chưa tới 4 giờ nên còn cứu được nếu làm lạnh lại về 41°F trở xuống ngay. Nếu không biết đã bao lâu hoặc quá 4 giờ thì bỏ. Tủ hỏng phải báo để sửa.","The milk has been above 41°F for less than 4 hours, so it can be saved by getting it back to 41°F or below right away. If you don't know how long, or it's 4 hours or more, throw it out. Report the broken fridge so it gets fixed."],
["qb14","QT","TN","Bạn cần làm nguội nhanh một nồi lớn nước dùng (hoặc chè) vừa nấu. Cách nào ĐÚNG?",["Chia ra nhiều khay nông và đặt vào bể nước đá, khuấy thường xuyên","Đậy nắp kín nguyên nồi rồi cho vào tủ lạnh","Để nguyên nồi trên bếp tắt lửa cho nguội từ từ","Để nồi ngoài cửa sau cho gió thổi"],"You need to cool a big pot of freshly cooked broth (or chè) quickly. Which is CORRECT?",["Divide it into shallow pans set in an ice bath and stir often","Cover the whole pot tightly and put it in the fridge","Leave the pot on the turned-off stove to cool slowly","Set the pot outside the back door in the breeze"],"Nồi lớn nguội rất chậm ở giữa. Chia nhỏ ra khay nông (sâu khoảng 2 inch), ngâm bể nước đá, khuấy, hoặc dùng que đá (ice wand) để nhiệt thoát nhanh.","A big pot cools very slowly in the center. Divide it into shallow pans (about 2 inches deep), use an ice bath, stir it, or use an ice wand so heat escapes fast."],
["qb15","QT","TN","Khay đồ ăn đang làm nguội trong tủ lạnh. Nên đậy thế nào?",["Đậy hờ hoặc để hở ở kệ trên cùng, đậy kín khi đã lạnh hẳn","Bọc màng kín thật chặt ngay khi còn nóng để giữ ẩm","Chồng sát lên các khay khác để tủ còn chỗ chứa thêm","Để ở kệ dưới cùng, dưới thịt sống, đậy nắp hờ"],"A pan of food is cooling in the fridge. How should it be covered?",["Loosely covered or uncovered on the top shelf, then covered tightly once cold","Wrapped tightly in plastic wrap while still hot to keep moisture in","Stacked right on top of other pans so the fridge has room for more","On the bottom shelf under the raw meat, with the lid set loosely on top"],"Đậy kín khi còn nóng sẽ giữ hơi nóng lại và làm nguội chậm. Đậy hờ (hoặc để hở ở kệ trên cùng để không bị gì rơi vào) cho nhiệt thoát ra, lạnh rồi mới đậy kín.","A tight cover traps heat and slows cooling. Cover loosely (or leave uncovered on the top shelf where nothing can drip on it) so heat can escape, then cover tightly once cold."],
["qb16","QT","TN","Nồi chè nấu xong, đo được 135°F lúc 1:00 chiều và bắt đầu làm nguội. Chậm nhất mấy giờ chè phải xuống tới 70°F?",["3:00 chiều","2:00 chiều","5:00 chiều","7:00 tối"],"A pot of chè is at 135°F at 1:00 pm when you start cooling it. By what time at the latest must it reach 70°F?",["3:00 pm","2:00 pm","5:00 pm","7:00 pm"],"Giai đoạn 1 của làm nguội: từ 135°F xuống 70°F trong vòng 2 giờ. 1:00 + 2 giờ = 3:00 chiều.","Stage one of cooling: from 135°F to 70°F within 2 hours. 1:00 + 2 hours = 3:00 pm."],
["qb17","QT","TN","Nồi nước dùng ở 135°F lúc 2:00 chiều, xuống 70°F đúng lúc 4:00 chiều. Chậm nhất mấy giờ phải xuống tới 41°F?",["8:00 tối","6:00 chiều","4:00 sáng hôm sau","10:00 tối"],"A pot of broth is at 135°F at 2:00 pm and reaches 70°F at exactly 4:00 pm. By what time at the latest must it reach 41°F?",["8:00 pm","6:00 pm","4:00 am the next day","10:00 pm"],"Sau khi xuống 70°F, phải xuống 41°F trong 4 giờ tiếp theo, tổng cộng không quá 6 giờ từ 135°F. 4:00 + 4 giờ = 8:00 tối.","After reaching 70°F, it must reach 41°F within the next 4 hours, for no more than 6 hours total from 135°F. 4:00 + 4 hours = 8:00 pm."],
["qb18","QT","TN","Bạn làm nguội một nồi nước dùng từ 135°F. Sau đúng 2 giờ đo lại vẫn còn 85°F. Bạn làm gì?",["Hâm lại lên 165°F rồi làm nguội lại từ đầu, hoặc bỏ","Cứ để làm nguội tiếp, vẫn còn 4 giờ nữa mới hết 6 giờ","Cho cả nồi vào tủ đông cho nhanh lạnh là xong","Ghi sổ là 70°F rồi tiếp tục làm nguội như bình thường"],"You're cooling broth from 135°F. After exactly 2 hours it still reads 85°F. What do you do?",["Reheat it to 165°F and start cooling again, or throw it out","Keep cooling it; there are still 4 hours left of the 6","Put the whole pot in the freezer to chill it fast, and you're done","Log it as 70°F and keep cooling as normal"],"Không xuống tới 70°F trong 2 giờ đầu là làm nguội thất bại. Phải hâm lại lên 165°F trong 15 giây rồi làm nguội lại từ đầu, hoặc bỏ đi.","Not reaching 70°F in the first 2 hours means cooling failed. Reheat to 165°F for 15 seconds and start the cooling over, or throw it out."],
["qb19","QT","TN","Bạn cần rã đông nhanh một gói nhân thịt bằng lò vi sóng. Điều kiện bắt buộc là gì?",["Nấu chín ngay sau khi rã đông","Rã xong cất lại tủ lạnh dùng ngày mai","Rã xong để ngoài quầy chờ đến giờ làm","Chỉ được rã đông nửa gói"],"You need to thaw a pack of meat filling quickly in the microwave. What is required?",["Cook it right away after thawing","Put it back in the fridge for tomorrow","Leave it on the counter until you need it","Only thaw half the pack"],"Rã đông bằng lò vi sóng làm một phần đồ ăn ấm lên vùng nguy hiểm, nên phải nấu ngay sau đó. Muốn để dành thì rã đông trong tủ lạnh.","Microwave thawing warms parts of the food into the danger zone, so it must be cooked immediately. If you need it later, thaw it in the fridge."],
["qb20","QT","TN","Khách gọi món có trứng chiên ốp la, làm xong đưa khách ăn liền. Trứng phải nấu tới nhiệt độ bên trong tối thiểu bao nhiêu?",["145°F (63°C) trong 15 giây","135°F (57°C) trong 15 giây","165°F (74°C) trong 1 phút","120°F (49°C) là đủ"],"A customer orders a fried egg cooked to order and served right away. What is the minimum internal cooking temperature?",["145°F (63°C) for 15 seconds","135°F (57°C) for 15 seconds","165°F (74°C) for 1 minute","120°F (49°C) is enough"],"Trứng sống đập ra nấu cho khách ăn ngay phải đạt 145°F trong 15 giây, giống thịt nguyên miếng và cá. Trứng có thể mang Salmonella.","Raw eggs cracked and cooked for immediate service must reach 145°F for 15 seconds, the same as whole cuts of meat and fish. Eggs can carry Salmonella."],
["qb21","QT","TN","Bếp hấp bắp hoặc rau củ để giữ nóng bán trong ngày. Phải nấu tới tối thiểu bao nhiêu trước khi đưa vào tủ giữ nóng?",["135°F (57°C)","100°F (38°C)","155°F (68°C) trong 17 giây","165°F (74°C) trong 2 phút"],"The kitchen steams corn or vegetables to hot-hold for sale during the day. What minimum temperature must they reach before going into hot holding?",["135°F (57°C)","100°F (38°C)","155°F (68°C) for 17 seconds","165°F (74°C) for 2 minutes"],"Rau củ, trái cây, đậu, cơm, mì nấu để giữ nóng phải đạt 135°F (57°C), rồi giữ ở 135°F trở lên.","Fruits, vegetables, beans, rice and noodles cooked for hot holding must reach 135°F (57°C), then be held at 135°F or above."],
["qb22","QT","TN","Hộp kem muối lấy ra quầy theo quy định 4 giờ đã được 3 giờ, còn dư khá nhiều. Bạn muốn cất lại vào tủ lạnh để mai dùng. Được không?",["Không, phải dùng hết hoặc bỏ khi tới giờ ghi trên nhãn","Được, miễn là chưa quá 4 giờ","Được, nếu cho vào tủ đông","Được, nếu đổi sang hộp mới và ghi ngày mới"],"A container of salted cream has been on the counter under the 4-hour rule for 3 hours, and a lot is left. You want to put it back in the fridge for tomorrow. Is that allowed?",["No, it must be used or thrown away by the time on its label","Yes, as long as it hasn't hit 4 hours","Yes, if you put it in the freezer","Yes, if you move it to a new container with a new date"],"Đồ đã dùng thời gian thay nhiệt độ (time as a public health control) thì không được đưa lại vào tủ lạnh. Phải bán hết hoặc bỏ khi hết 4 giờ.","Food held under time as a public health control can't go back into refrigeration. It must be used or thrown away when the 4 hours are up."],
["qb23","QT","TN","Thứ Năm bạn làm kem muối, dùng hộp kem tươi đã mở từ thứ Ba. Kem muối phải dùng hết hoặc bỏ chậm nhất ngày nào?",["Thứ Hai tuần sau","Thứ Tư tuần sau","Chủ Nhật tuần này","Thứ Năm tuần sau"],"On Thursday you make salted cream using heavy cream that was opened on Tuesday. What is the last day the salted cream can be used?",["The following Monday","The following Wednesday","This Sunday","The following Thursday"],"Đồ trộn từ nhiều nguyên liệu lấy theo ngày của nguyên liệu cũ nhất. Kem mở thứ Ba là ngày 1, nên ngày 7 là thứ Hai tuần sau.","A mixture takes the date of its oldest ingredient. The cream was opened Tuesday (day 1), so day 7 is the following Monday."],
["qb24","QT","TN","Bạn mở một bình sữa tươi mới vào thứ Hai và giữ trong tủ ở 41°F. Theo quy định 7 ngày, ngày cuối được dùng là ngày nào (nếu hạn in trên bình còn xa hơn)?",["Chủ Nhật","Thứ Bảy","Thứ Hai tuần sau","Thứ Ba tuần sau"],"You open a new jug of milk on Monday and keep it at 41°F. Under the 7-day rule, what is the last day it can be used (if the printed date is later)?",["Sunday","Saturday","The following Monday","The following Tuesday"],"Ngày mở bình là ngày 1, nên thứ Hai đến Chủ Nhật là đủ 7 ngày. Nếu hạn in trên bình đến sớm hơn thì theo hạn in.","The day it's opened is day 1, so Monday through Sunday is 7 days. If the printed use-by date comes first, follow that date."],
["qb25","QT","TN","Sáng thứ Hai hàng Odeko tới, bạn nhét hết sữa và kem vào tủ quầy bar cho đầy kín, sát vách tủ. Vấn đề là gì?",["Khí lạnh không lưu thông được, đồ bên trong có thể ấm hơn 41°F","Không sao, tủ càng chất đầy thì càng giữ lạnh tốt hơn","Chỉ là tủ tốn điện hơn một chút, không ảnh hưởng đồ ăn","Chỉ khó tìm đồ hơn thôi, không ảnh hưởng an toàn"],"On Monday the Odeko order arrives and you pack all the milk and cream into the bar fridge, filling it to the walls. What's the problem?",["Cold air can't circulate, so food inside may warm above 41°F","No problem; a fuller fridge stays colder than an empty one","It just uses a bit more electricity and doesn't affect food","It's only harder to find things, not a safety issue"],"Tủ chất quá đầy chặn đường khí lạnh nên đồ có thể vượt 41°F. Chừa khoảng trống giữa các món, và đừng để cửa tủ mở lâu khi đang lấy đồ.","An overloaded fridge blocks the cold air, so food can rise above 41°F. Leave space between items, and don't leave the door open while you work."],
["qb26","QT","TN","Tủ đông ở quán nên được giữ ở nhiệt độ nào hoặc thấp hơn?",["0°F (-18°C)","32°F (0°C)","20°F (-7°C)","41°F (5°C)"],"The café freezer should be kept at what temperature or lower?",["0°F (-18°C)","32°F (0°C)","20°F (-7°C)","41°F (5°C)"],"Tủ đông nên giữ ở 0°F (-18°C) hoặc thấp hơn để đồ đông lạnh luôn đông cứng. Đông lạnh chỉ làm vi khuẩn ngưng phát triển chứ không giết vi khuẩn.","Keep the freezer at 0°F (-18°C) or lower so food stays frozen solid. Freezing stops bacteria from growing but doesn't kill them."],
["qb27","QT","TN","Bạn giao một đơn catering gỏi cuốn tôm và sữa tươi cho văn phòng khách. Cách giữ nào ĐÚNG trên đường giao?",["Để trong thùng giữ lạnh có túi đá, giữ 41°F trở xuống","Để ở ghế sau xe cho thoáng","Để trong thùng chung với đồ nóng cho gọn","Không cần giữ lạnh vì chỉ đi 30 phút"],"You're delivering a catering order of shrimp spring rolls and fresh milk to a customer's office. How should it be kept on the way?",["In an insulated cooler with ice packs, at 41°F or below","Loose on the back seat so it gets air","In the same carrier as the hot food to save space","No need to keep it cold for a 30-minute trip"],"Đồ giao đi vẫn phải giữ đúng nhiệt độ: đồ lạnh 41°F trở xuống trong thùng giữ lạnh, đồ nóng 135°F trở lên trong thùng giữ nóng riêng. Nếu không giữ lạnh được thì phải dùng quy định 4 giờ và ghi giờ bỏ cho khách. Ở Massachusetts, quán chỉ được dùng quy định 4 giờ khi đã có quy trình viết sẵn nộp cho Sở Y tế địa phương (Board of Health).","Delivered food must stay in temperature control: cold food at 41°F or below in an insulated cooler, hot food at 135°F or above in a separate hot carrier. If it can't be kept cold, use the 4-hour rule and label the discard time for the customer. In Massachusetts, the café may use the 4-hour rule only with written procedures submitted to the local Board of Health."],
["qt26","QT","LN","Trong tủ lạnh, xếp từ kệ trên xuống kệ dưới thế nào là đúng?",["Đồ ăn sẵn ở trên cùng, thịt gà sống ở dưới cùng","Thịt gà sống trên cùng, đồ ăn sẵn ở dưới","Rau ở dưới cùng, thịt sống ở trên cùng","Chỗ nào trống thì để, miễn là có đậy"],"In the fridge, what is the correct order from the top shelf down?",["Ready-to-eat food on top, raw chicken on the bottom","Raw chicken on top, ready-to-eat food below it","Vegetables on the bottom, raw meat on the top","Wherever there's room, as long as it's covered"],"Xếp theo nhiệt độ nấu: đồ ăn sẵn trên cùng, rồi hải sản, thịt nguyên miếng, thịt xay, gia cầm dưới cùng. Như vậy nước từ đồ sống không nhỏ vào đồ ăn sẵn.","Store by cooking temperature: ready-to-eat on top, then seafood, whole cuts, ground meat, and poultry on the bottom, so raw juices can't drip onto ready-to-eat food."],
["qt27","QT","LN","Thùng hàng, hộp nguyên liệu trong kho phải đặt cách sàn tối thiểu bao nhiêu?",["6 inch (15 cm)","Để thẳng dưới sàn cũng được","1 inch (2,5 cm)","2 feet (60 cm)"],"How high off the floor must food boxes and containers be stored?",["At least 6 inches (15 cm)","On the floor is fine","1 inch (2.5 cm)","2 feet (60 cm)"],"Đồ ăn phải để trên kệ cách sàn ít nhất 6 inch, để dễ lau sàn và tránh nước bẩn, côn trùng.","Store food at least 6 inches off the floor so the floor can be cleaned and to keep away dirt, water and pests."],
["qt28","QT","LN","Lấy đá cho vào ly đồ uống, cách nào đúng?",["Dùng xẻng đá có tay cầm, cất xẻng ngoài thùng đá","Múc bằng ly uống sạch để lấy đúng lượng","Bốc bằng tay vừa rửa sạch rồi lau tay vào khăn","Dùng xẻng rồi vùi xẻng trong thùng đá cho lạnh"],"What is the correct way to get ice for a drink?",["Use an ice scoop with a handle and store it outside the ice","Scoop it with a clean drinking glass so you get the right amount","Grab it with freshly washed hands, then wipe your hands on a towel","Use the scoop, then leave it buried in the ice so it stays cold"],"Đá là đồ ăn. Dùng xẻng, không dùng ly (ly vỡ thì không thấy mảnh trong đá), và cất xẻng ở ngoài hoặc tay cầm hướng lên, không vùi trong đá.","Ice is food. Use a scoop, never a glass (broken glass is invisible in ice), and store the scoop outside the ice or handle-up, never buried."],
["qt29","QT","LN","Hóa chất tẩy rửa phải cất ở đâu?",["Khu riêng, thấp hơn và cách xa đồ ăn, dụng cụ","Kệ trên cùng phía trên đồ ăn, cho khỏi vướng","Cạnh hộp đường và siro ở quầy cho tiện lấy","Trong tủ lạnh ở kệ dưới cùng cho mát"],"Where should cleaning chemicals be stored?",["In a separate area, below and away from food and utensils","On the top shelf above the food, where they're out of the way","Next to the sugar and syrups at the bar for quick access","In the fridge on the bottom shelf, so they stay cool"],"Hóa chất để khu riêng, thấp hơn và xa đồ ăn, dụng cụ, đồ đóng gói. Chai xịt chia ra phải dán nhãn tên hóa chất.","Keep chemicals in a separate area, below and away from food, utensils and packaging. Label any spray bottles you fill."],
["qt30","QT","LN","Bạn vừa chia sữa từ bình lớn sang bình nhỏ để dùng trong ca. Bình nhỏ cần gì?",["Nhãn ghi tên và ngày","Không cần gì vì dùng hết trong ngày","Chỉ cần nắp","Chỉ cần ghi tên người chia"],"You poured milk from a big jug into a smaller bottle for the shift. What does the small bottle need?",["A label with the name and date","Nothing, it will be used today","Just a lid","Just the name of who poured it"],"Mọi đồ đã chia ra khỏi bao bì gốc phải dán nhãn tên. Quán mình ghi thêm ngày cho đồ TCS. Nếu giữ quá 24 giờ thì bắt buộc ghi ngày, và ngày bỏ không được trễ hơn hạn trên bình gốc.","Anything taken out of its original package must be labeled with its name. We also date TCS items. The date is required if they're kept more than 24 hours, and the discard date can't be later than the original jug's use-by date."],
["qt31","QT","LN","Một khách trả lại ly trà sữa chưa uống ngụm nào. Bạn làm gì với ly đó?",["Bỏ đi","Bán lại cho khách khác","Đổ ngược lại vào bình","Cho vào tủ dùng sau"],"A customer returns a milk tea without drinking any. What do you do with it?",["Throw it away","Sell it to another customer","Pour it back into the batch","Put it in the fridge for later"],"Đồ đã giao cho khách thì không bán lại hay dùng lại, trừ hàng đóng gói kín còn nguyên.","Food or drinks already served to a customer can't be re-served or reused, except unopened sealed packaged items."],
["qt32","QT","LN","Bạn vừa cắt thịt sống trên một thớt. Giờ cần cắt chanh. Bạn làm gì?",["Dùng thớt và dao khác, hoặc rửa, tráng, khử trùng thớt trước","Lau thớt bằng khăn sạch rồi cắt chanh trên đó luôn","Lật mặt thớt lại và cắt chanh trên mặt còn sạch","Tráng thớt dưới nước nóng vài giây rồi cắt chanh"],"You just cut raw meat on a cutting board. Now you need to slice lemons. What do you do?",["Use a different board and knife, or wash, rinse and sanitize the board first","Wipe the board with a clean towel, then slice the lemons on it right away","Flip the board over and slice the lemons on the side that's still clean","Rinse the board under hot water for a few seconds, then slice the lemons"],"Dụng cụ chạm đồ sống phải rửa, tráng và khử trùng trước khi dùng cho đồ ăn sẵn. Tốt nhất là có thớt riêng cho đồ sống.","Anything that touched raw meat must be washed, rinsed and sanitized before touching ready-to-eat food. Separate boards are best."],
["qt33","QT","LN","Khi nhập kho sữa, kem và nguyên liệu, nguyên tắc FIFO nghĩa là gì?",["Nhập trước, dùng trước: hàng cũ đưa ra trước, hàng mới để sau","Hàng mới dùng trước vì tươi và ngon hơn","Hàng nào gần tay trên kệ thì dùng cho nhanh","Hàng đắt dùng trước cho khỏi bị phí"],"What does FIFO mean when stocking milk, cream and ingredients?",["First in, first out: older stock in front, new stock behind","Use new stock first because it's fresher and tastes better","Use whatever is closest to you on the shelf to save time","Use the most expensive items first so they don't go to waste"],"FIFO giúp dùng hàng trước khi hết hạn và giảm hao hụt. Hàng mới xếp phía sau, hàng cũ đưa ra phía trước.","FIFO means using stock before it expires and wasting less. New stock goes behind, older stock moves to the front."],
["qc01","QT","LN","Đồ ăn có thể bị nhiễm bẩn theo 3 loại: sinh học, hóa học và vật lý. Một cái ghim bấm rơi vào hộp topping là loại nào?",["Vật lý","Sinh học","Hóa học","Không phải nhiễm bẩn"],"Food can be contaminated in 3 ways: biological, chemical and physical. A staple that falls into a topping container is which kind?",["Physical","Biological","Chemical","Not contamination"],"Vật lý là vật lạ như ghim, mảnh ly, tóc, hạt trái cây. Sinh học là vi khuẩn, virus, nấm mốc. Hóa học là nước tẩy, thuốc khử trùng, thuốc diệt côn trùng.","Physical means foreign objects like staples, glass, hair or fruit pits. Biological means bacteria, viruses and mold. Chemical means cleaners, sanitizers and pesticides."],
["qc02","QT","LN","Bạn chuẩn bị rửa dâu và lá bạc hà để trang trí ly. Cách nào đúng?",["Rửa dưới vòi nước chảy, không dùng xà phòng","Ngâm trong nước pha xà phòng rửa chén","Xịt nước khử trùng lau bàn lên rồi để khô","Không cần rửa vì nhìn đã sạch"],"You're about to wash strawberries and mint for drink garnishes. What is the right way?",["Rinse under running water, no soap","Soak them in water with dish soap","Spray them with the counter sanitizer and let dry","No need to wash, they look clean"],"Rau trái phải rửa kỹ dưới vòi nước chảy trước khi cắt hay dùng. Không dùng xà phòng hay nước khử trùng lau bàn vì hóa chất sẽ dính vào đồ ăn.","Rinse produce well under running water before cutting or serving. Never use soap or surface sanitizer, because the chemical stays on the food."],
["qc03","QT","LN","Bạn cần thêm một xô để chở đá từ máy đá ra quầy. Có được dùng cái xô trước đây từng đựng hóa chất tẩy rửa, đã rửa sạch không?",["Không. Chỉ dùng thùng chở đá chuyên dụng, chưa từng đựng hóa chất","Được, nếu đã rửa sạch và không còn mùi hóa chất","Được, nếu lót một túi nilon mới bên trong","Được, nếu tráng kỹ bằng nước thật nóng trước"],"You need another bucket to carry ice from the ice machine to the bar. Can you use a bucket that once held cleaning chemicals, if it's been washed?",["No. Only use a dedicated ice tote that has never held chemicals","Yes, if it's been washed and has no chemical smell left","Yes, if you line it with a new plastic bag first","Yes, if you rinse it well with very hot water first"],"Đồ từng đựng hóa chất không bao giờ được dùng để đựng đồ ăn hay đá, dù đã rửa. Dùng thùng chở đá chuyên dụng, sạch, chỉ dành cho đá.","Containers that held chemicals must never be used for food or ice, even after washing. Use a clean, dedicated ice tote used only for ice."],
["qc04","QT","LN","Bạn muốn pha một mẻ nước chanh dây (đồ uống có tính axit). Dụng cụ nào KHÔNG được dùng để đựng?",["Xô bằng thép mạ kẽm","Bình nhựa dùng cho thực phẩm","Hộp inox đựng thực phẩm","Hũ thủy tinh có nắp"],"You want to make a batch of passion fruit lemonade (an acidic drink). Which container must NOT be used to hold it?",["A galvanized (zinc-coated) steel bucket","A food-grade plastic beverage jug","A stainless steel food container","A clean glass jar with a tight lid"],"Đồ ăn uống có axit làm kim loại như kẽm (đồ mạ kẽm) hay đồng tan vào và gây ngộ độc. Chỉ dùng dụng cụ dành cho thực phẩm như inox, nhựa thực phẩm, thủy tinh.","Acidic food and drinks can pull metals like zinc (from galvanized items) or copper into the food and make people sick. Use only food-grade containers such as stainless steel, food-grade plastic or glass."],
["qc05","QT","LN","Nhiều bếp dùng thớt và dao có màu khác nhau (ví dụ đỏ cho thịt sống, xanh lá cho rau trái). Mục đích chính là gì?",["Để không dùng chung dụng cụ giữa đồ sống và đồ ăn sẵn","Để bếp nhìn đẹp và đồng bộ hơn khi khách nhìn vào","Để biết dao nào bén hơn và khi nào cần mài","Để thớt có màu khỏi phải rửa và khử trùng sau mỗi lần dùng"],"Many kitchens use color-coded boards and knives (for example red for raw meat, green for produce). What is the main purpose?",["To keep tools for raw food and ready-to-eat food separate","To make the kitchen look neat and matching for customers","To show which knives are sharper and when to sharpen them","So colored boards don't need washing and sanitizing after each use"],"Dụng cụ theo màu giúp không ai lấy nhầm thớt thịt sống để cắt trái cây. Thớt màu nào cũng vẫn phải rửa, tráng và khử trùng sau khi dùng.","Color coding keeps anyone from grabbing the raw-meat board to cut fruit. Every board still has to be washed, rinsed and sanitized after use."],
["qc06","QT","LN","Khách đi rồi, trên bàn còn mấy thứ. Thứ nào được phép đem ra phục vụ khách khác?",["Gói đường còn nguyên, kín, không dơ","Lát chanh trang trí chưa ai đụng","Chén sốt mở nắp còn đầy","Bánh quy tặng kèm để trần trên đĩa, khách chưa ăn"],"A customer has left and a few things are left on the table. Which one may be served to another customer?",["An unopened, sealed, clean sugar packet","A lemon garnish nobody touched","An open cup of sauce that's still full","The unwrapped free cookie left on the customer's plate"],"Đồ đã đưa ra cho khách thì không được dùng lại, kể cả đồ trang trí, sốt, bánh mì, bánh tặng. Chỉ có đồ đóng gói kín còn nguyên và sạch như gói đường mới được dùng lại.","Food already served to a customer can't be served again, including garnishes, open sauces, bread and free snacks. Only sealed, unopened, clean packaged items like sugar packets can be reused."],
["qc07","QT","LN","Khách đưa bình giữ nhiệt riêng và nhờ bạn pha cà phê vào đó. Cách nào đúng?",["Bình phải sạch, rót sao cho ca hay vòi không chạm miệng hoặc lòng bình","Dùng bình của khách múc đá thẳng trong thùng đá cho đỡ một bước","Nhúng bình của khách vào bình cốt cho đầy nhanh hơn","Tựa ca lên miệng bình để rót, rồi lấy ống hút của khách khuấy đều"],"A customer hands you their own tumbler and asks you to make coffee in it. What is the right way?",["The tumbler must be clean, and you pour so the pitcher or nozzle never touches the rim or inside","Scoop ice straight from the ice bin with the customer's tumbler to save a step","Dip the customer's tumbler into the coffee concentrate to fill it faster","Rest the pitcher on the tumbler's rim to pour, then stir with the customer's straw"],"Đồ của khách đã dùng có thể mang vi khuẩn. Không để nó chạm đá, cốt hay dụng cụ của quán. Rót từ trên xuống, không chạm miệng bình.","A customer's used container can carry germs. Never let it touch your ice, batches or tools. Pour from above without touching the rim."],
["qc08","QT","LN","Tủ bánh và quầy topping tự lấy có tấm kính chắn phía trên. Tấm kính đó để làm gì?",["Ngăn nước bọt khi khách ho, hắt hơi rơi vào đồ ăn","Giữ hơi ấm để bánh và topping lâu nguội hơn","Che bảng giá để khách hỏi nhân viên trước khi chọn","Chỉ để trang trí cho tủ bánh nhìn sang hơn"],"The pastry case and self-serve topping bar have a glass shield above the food. What is it for?",["It stops droplets from customers' coughs and sneezes from landing on food","It keeps heat in so pastries and toppings stay warm longer","It hides the price tags so customers ask staff first","It's only decoration to make the case look nicer"],"Kính chắn (sneeze guard) bảo vệ đồ ăn trưng bày khỏi nước bọt của khách. Khu tự phục vụ còn phải được nhân viên theo dõi, giữ đúng nhiệt độ và có dụng cụ gắp riêng.","A sneeze guard protects displayed food from customers' droplets. Self-serve areas also need staff watching them, correct temperatures and their own serving utensils."],
["qc09","QT","LN","Cuối ngày còn nhiều ly nhựa dùng một lần đã dùng nhưng nhìn sạch. Bạn làm gì?",["Bỏ đi, đồ dùng một lần không được rửa để dùng lại","Rửa qua bồn 3 ngăn rồi dùng tiếp","Tráng nước nóng rồi dùng cho đồ uống nóng","Dùng lại để đựng topping trong quầy"],"At the end of the day there are used single-use plastic cups that look clean. What do you do?",["Throw them away, single-use items are never washed and reused","Run them through the 3-compartment sink and reuse them","Rinse with hot water and use them for hot drinks","Reuse them to hold toppings at the bar"],"Ly, muỗng, ống hút dùng một lần chỉ được dùng một lần. Chúng không làm ra để rửa và khử trùng, nên dùng lại có thể làm nhiễm bẩn đồ ăn.","Single-use cups, spoons and straws are used once only. They aren't made to be washed and sanitized, so reusing them can contaminate food."],
["qc10","QT","LN","Bạn cắm muỗng nhựa vào ống đựng ở quầy cho khách tự lấy. Cắm thế nào là đúng?",["Cán hướng lên để khách chỉ chạm vào cán","Đầu muỗng hướng lên cho khách dễ thấy","Đổ cả nắm muỗng ra khay để mở","Cắm lẫn lộn cho nhanh"],"You're putting plastic spoons into the holder at the counter for customers. Which way is right?",["Handles up, so customers touch only the handles","Bowls up, so customers can see them easily","Dumped as a pile of spoons on an open tray","Mixed up any which way to save some time"],"Dụng cụ cho khách tự lấy phải đặt sao cho tay chỉ chạm vào cán, không chạm phần đưa vào miệng.","Self-serve utensils must be set out so hands touch only the handle, never the part that goes in the mouth."],
["qc11","QT","LN","Bạn mang cơm trưa và túi xách đi làm. Để ở đâu là đúng?",["Khu riêng cho đồ nhân viên, tách xa và không để trên đồ ăn của quán","Trong tủ lạnh, kệ trên cùng phía trên sữa, cho cơm luôn lạnh","Trên kệ nguyên liệu trong kho, chỗ còn trống","Trong nhà vệ sinh nhân viên cho kín đáo, khỏi vướng"],"You bring your lunch and bag to work. Where should they go?",["In a separate staff area, away from and never above the café's food","In the fridge on the top shelf above the milk, so lunch stays cold","On the ingredient shelves in the storage room, where there's space","In the staff restroom so they're out of sight and out of the way"],"Đồ cá nhân và đồ ăn của nhân viên để khu riêng, không để chung hay để trên đồ ăn của quán. Nhà vệ sinh không bao giờ được dùng để chứa đồ ăn hay nguyên liệu.","Personal items and staff food go in a separate area, never mixed with or above the café's food. Restrooms are never used to store food or supplies."],
["qc12","QT","LN","Chương trình A.L.E.R.T. của FDA giúp quán phòng ngừa điều gì?",["Người cố ý làm nhiễm bẩn đồ ăn","Đồ ăn bị cháy khi nấu","Khách quên lấy ly","Máy POS bị lỗi"],"The FDA's A.L.E.R.T. program helps a business guard against what?",["Someone contaminating food on purpose","Food burning while cooking","Customers forgetting their drinks","The POS going down"],"A.L.E.R.T. là phòng vệ thực phẩm: mua hàng nguồn an toàn, để ý hàng hóa, biết ai đang ở trong quán, ghi chép, và biết báo ai khi có đe dọa.","A.L.E.R.T. is food defense: Assure safe suppliers, Look after products, know your Employees and who is in the building, keep Reports, and know who to contact about a Threat."],
["qc13","QT","LN","Một người lạ không mặc đồng phục đi vào khu pha chế sau quầy và nói là \"bạn của chủ\". Bạn làm gì?",["Lịch sự mời họ ra khỏi khu sau quầy và báo quản lý","Để họ tự đi lại vì họ nói là quen chủ","Nhờ họ phụ pha cho xong mấy ly đang làm","Không nói gì, cứ làm tiếp để khỏi mất lòng"],"A stranger with no uniform walks into the drink-prep area behind the counter and says they're \"a friend of the owner.\" What do you do?",["Politely ask them to leave the behind-counter area and tell the manager","Let them walk around freely, since they say they know the owner","Ask them to help you finish the drinks while they're back there","Say nothing and keep working so you don't seem rude to them"],"Chỉ nhân viên làm việc mới được vào khu pha chế, kho. Người lạ trong khu này là rủi ro cố ý hay vô ý làm nhiễm bẩn đồ ăn, nên phải báo quản lý.","Only working staff belong in prep and storage areas. A stranger there is a risk of deliberate or accidental contamination, so tell the manager."],
["qc14","QT","LN","Bạn làm sinh tố có chà là và anh đào. Mối nguy vật lý cần chú ý là gì?",["Hạt còn sót lại trong trái","Trái chưa đủ ngọt","Màu sinh tố hơi sẫm","Trái quá lạnh"],"You're making a smoothie with dates and cherries. What physical hazard should you watch for?",["Pits left in the fruit","Fruit that isn't sweet enough","A slightly dark color","Fruit that is too cold"],"Hạt trái cây, xương, vỏ cứng là mối nguy vật lý tự nhiên. Chúng có thể làm gãy răng hay hóc. Kiểm tra và bỏ hạt trước khi xay.","Fruit pits, bones and hard shells are natural physical hazards that can break teeth or cause choking. Check and remove pits before blending."],
["qc15","QT","LN","Một chai siro đã dùng hết, sạch sẽ. Bạn có được dùng nó để đựng nước khử trùng không?",["Không, không bao giờ đựng hóa chất trong bao bì đồ ăn","Được, miễn là chai đã rửa sạch kỹ","Được, nếu ghi rõ tên hóa chất lên thân chai","Được, nếu cất chai ở kệ dưới cùng"],"A syrup bottle is empty and clean. Can you use it to hold sanitizer?",["No, never put chemicals in food containers","Yes, as long as it has been washed well","Yes, if you write the chemical name on it","Yes, if it's stored on the bottom shelf"],"Hóa chất đựng trong chai đồ ăn rất dễ bị nhầm thành đồ uống. Chỉ dùng chai xịt hay bình dành riêng cho hóa chất và dán nhãn tên hóa chất.","Chemicals in food bottles are easily mistaken for food. Use only containers made for chemicals and label them with the chemical's name."],
["qc16","QT","LN","Bạn cần xịt nước lau kính vào trong tủ trưng bày khi trong tủ đang có bánh tart trứng. Bạn làm gì trước?",["Lấy bánh ra hoặc che kín bánh rồi mới xịt","Xịt nhẹ thì không sao","Xịt nhanh rồi đóng tủ lại","Chỉ xịt vào kính phía trước bánh"],"You need to spray glass cleaner inside the display case while egg tarts are in it. What do you do first?",["Take the tarts out or cover them before spraying","A light spray is fine","Spray quickly and close the case","Only spray the glass in front of the tarts"],"Hóa chất xịt bay thành hạt nhỏ và rơi xuống đồ ăn. Khi lau dọn gần đồ ăn, phải lấy đồ ăn ra hoặc che kín trước.","Spray chemicals drift as fine droplets onto food. Remove or cover food before cleaning near it."],
["qc17","QT","LN","Bạn để hộp trân châu đã nấu vào tủ lạnh nhưng không đậy nắp. Có vấn đề gì?",["Có, đồ ăn để tủ phải đậy kín để không bị rơi, nhỏ giọt hay bụi vào","Không, để mở cho nhanh lạnh, như vậy quan trọng hơn","Không, trong tủ lạnh sạch nên không có gì rơi vào","Chỉ cần đậy nếu để qua đêm, vài tiếng thì để mở được"],"You put a container of cooked tapioca pearls in the fridge without a lid. Is that a problem?",["Yes, stored food must be covered so nothing drips, falls or blows into it","No, leaving it open helps it cool faster, and that matters more","No, the inside of the fridge is clean, so nothing can get in","Only if it stays in overnight; for a few hours it's fine open"],"Đồ ăn cất phải được đậy hoặc bọc kín, có nhãn, để tránh nước nhỏ giọt, bụi hay vật lạ rơi vào. Nếu đang làm nguội thì có thể hé nắp lúc đầu, sau đó đậy lại.","Stored food must be covered or wrapped and labeled to keep out drips, dust and debris. Food that is still cooling can be loosely covered at first, then closed."],
["qc18","QT","LN","Bạn đổ đường và muối (dùng làm kem muối) vào hai hộp giống nhau ở quầy bar. Cần làm gì?",["Dán nhãn tên trên từng hộp","Không cần vì nếm là biết","Chỉ cần để hai hộp xa nhau","Chỉ dán nhãn hộp muối"],"You pour sugar and salt (for salted cream) into two identical containers at the bar. What do you need to do?",["Label each container with its name","Nothing, you can taste to tell","Just keep the two apart","Label only the salt"],"Đồ đã chia ra khỏi bao bì gốc phải ghi tên, nhất là những thứ trông giống nhau như đường và muối, bột năng và bột mì, để không ai dùng nhầm.","Food moved out of its original package must be labeled with its name, especially look-alikes like sugar and salt, so no one grabs the wrong one."],
["qc19","QT","LN","Muỗng đong đường đang dùng trong ca nên để ở đâu giữa các lần múc?",["Trong hộp đường, cán quay lên và nằm ngoài đường","Vùi hết vào trong đường cho cán luôn sạch","Đặt trên khăn lau quầy cho khô giữa các lần múc","Ngâm trong ly nước ở nhiệt độ phòng cho đường khỏi dính"],"Where should the sugar scoop you're using during the shift be kept between uses?",["In the sugar container with the handle up and out of the sugar","Buried completely in the sugar so the handle stays clean","Lying on the counter towel so it stays dry between uses","In a cup of room-temperature water so sugar won't stick"],"Dụng cụ đang dùng có thể để trong đồ ăn nếu cán nằm ngoài, để tay không chạm vào đồ ăn. Không ngâm trong nước đứng ở nhiệt độ phòng, và không để trên khăn lau.","In-use utensils may be stored in the food with the handle sticking out, so hands don't touch the food. Never in standing room-temperature water or on a wiping cloth."],
["qc20","QT","LN","Bạn mở thùng hàng giấy để lấy ly, nắp và topping. Cách nào giúp tránh mối nguy vật lý?",["Mở thùng ở xa khu pha chế, gỡ sạch ghim và dây trước khi đem vào","Mở thùng ngay trên quầy pha chế để đồ lên kệ luôn cho tiện","Để thùng giấy trong tủ lạnh cạnh đồ ăn cho hàng luôn mát","Rạch thùng bằng dao đang cắt trái cây rồi lau dao lại"],"You open cardboard boxes of cups, lids and toppings. How do you avoid a physical hazard?",["Open boxes away from the prep area and remove staples and ties before bringing items in","Open boxes right on the prep counter so items go straight onto the shelf","Keep the cardboard boxes in the fridge next to food so supplies stay cool","Cut the boxes open with the knife you're using for fruit, then wipe it off"],"Ghim, dây buộc, mảnh giấy từ thùng hàng có thể rơi vào đồ ăn. Mở thùng ở khu riêng và không đem thùng giấy vào khu pha chế.","Staples, ties and bits of cardboard can fall into food. Open boxes away from prep areas and don't bring cardboard into the prep area."],
["qc21","QT","LN","Quán chỉ có một bàn sơ chế. Bạn cần đánh trứng sống làm nhân tart và cắt trái cây trang trí. Làm sao cho đúng?",["Cắt trái cây trước, hoặc rửa, tráng và khử trùng bàn và dụng cụ giữa hai việc","Làm cả hai cùng lúc ở hai đầu bàn cho nhanh","Làm trứng trước, rồi lau bàn bằng khăn khô trước khi cắt trái cây","Cắt trái cây ngay cạnh tô trứng, miễn là hai thứ không chạm nhau"],"There is only one prep table. You need to whisk raw eggs for tart filling and cut fruit for garnish. How do you do it safely?",["Cut the fruit first, or wash, rinse and sanitize the table and tools between the two jobs","Do both at the same time on opposite ends of the table to save time","Do the eggs first, then wipe the table with a dry towel before the fruit","Cut the fruit right beside the egg bowl, as long as the two don't touch"],"Nếu không có khu riêng, phải làm đồ sống và đồ ăn sẵn vào hai lúc khác nhau, và rửa, tráng, khử trùng bề mặt và dụng cụ ở giữa. Làm đồ ăn sẵn trước là an toàn nhất.","Without separate areas, prep raw food and ready-to-eat food at different times and wash, rinse and sanitize surfaces and tools in between. Doing the ready-to-eat food first is safest."],
["qc22","QT","LN","Bạn muốn để ống hút cho khách tự lấy ở quầy. Cách nào đúng?",["Dùng ống hút bọc giấy riêng từng cái, hoặc hộp lấy từng cái một","Cắm cả nắm ống hút trần vào ly mở cạnh máy tính tiền","Đổ ống hút trần ra khay cho khách bốc tùy ý","Để ống hút trần trong thùng đá cho mát và dễ lấy"],"You want to put straws out for customers to take at the counter. What is the right way?",["Use individually wrapped straws, or a dispenser that gives one at a time","Stand a bunch of bare straws upright in an open cup by the register","Pour bare straws onto a tray so customers can grab what they need","Keep bare straws in the ice bin so they're cold and easy to reach"],"Đồ dùng một lần cho khách tự lấy phải được bọc riêng hoặc để trong hộp chia từng cái, để tay khách không chạm vào phần đưa vào miệng của cái khác.","Single-use items for self-service must be wrapped or in a dispenser, so customers' hands don't touch the mouth end of other pieces."],
["qt34","QT","KT","\"Làm sạch\" và \"khử trùng\" khác nhau thế nào?",["Làm sạch là bỏ chất bẩn; khử trùng là giảm vi khuẩn tới mức an toàn","Hai việc là một, chỉ là hai cách gọi khác nhau","Khử trùng làm trước để diệt khuẩn, làm sạch làm sau để bỏ chất bẩn","Làm sạch bằng nước là đủ, nên không cần khử trùng"],"What is the difference between cleaning and sanitizing?",["Cleaning removes dirt; sanitizing reduces germs to safe levels","They are the same thing, just two different words","Sanitizing comes first to kill germs, then cleaning removes the dirt","Cleaning with plain water is enough, so no sanitizing is needed"],"Phải làm sạch trước (bỏ cặn, dầu, bẩn) rồi mới khử trùng, vì chất khử trùng không tác dụng tốt trên bề mặt còn bẩn.","Always clean first (remove food, grease and dirt), then sanitize, because sanitizer doesn't work well on dirty surfaces."],
["qt35","QT","KT","Bồn rửa 3 ngăn: thứ tự đúng là gì?",["Rửa, tráng, khử trùng, để khô tự nhiên","Tráng, rửa, lau khô bằng khăn","Khử trùng, rửa, tráng","Rửa, khử trùng, lau khô bằng khăn"],"For a three-compartment sink, what is the correct order?",["Wash, rinse, sanitize, air-dry","Rinse, wash, towel-dry","Sanitize, wash, rinse","Wash, sanitize, towel-dry"],"Cạo bỏ thức ăn, rồi rửa với xà phòng, tráng nước sạch, ngâm khử trùng đúng thời gian, và để khô tự nhiên. Không lau bằng khăn vì khăn làm dính lại vi khuẩn.","Scrape, wash in soapy water, rinse in clean water, sanitize for the required time, then air-dry. Don't towel-dry, which puts germs back."],
["qt36","QT","KT","Nước khử trùng pha từ thuốc tẩy (chlorine) nên có nồng độ khoảng bao nhiêu?",["50 đến 100 ppm","5 ppm","500 đến 1000 ppm","Càng đặc càng tốt"],"About what concentration should a chlorine (bleach) sanitizer be?",["50 to 100 ppm","5 ppm","500 to 1,000 ppm","The stronger the better"],"Chlorine khoảng 50 đến 100 ppm. Yếu quá không diệt khuẩn, đặc quá gây độc và hại bề mặt. Kiểm tra bằng que thử.","Chlorine sanitizer should be about 50 to 100 ppm. Too weak won't kill germs; too strong can be toxic and damage surfaces. Check with test strips."],
["qt37","QT","KT","Làm sao biết nước khử trùng trong xô đã pha đúng nồng độ?",["Dùng que thử nồng độ","Ngửi thấy mùi là được","Nhìn màu nước","Không cần kiểm tra"],"How do you know the sanitizer in the bucket is mixed correctly?",["Use a test strip","If you can smell it, it's fine","Look at the color","No need to check"],"Dùng que thử đúng loại hóa chất (chlorine hoặc quat) để đo ppm, và thay nước khi bẩn hoặc nồng độ xuống thấp.","Use test strips made for that chemical (chlorine or quat) to measure ppm, and change the water when it's dirty or too weak."],
["qt38","QT","KT","Khăn lau ướt dùng lau quầy trong ca phải cất ở đâu giữa các lần lau?",["Ngâm trong xô nước khử trùng","Vắt trên vai cho tiện lấy","Gấp gọn trên quầy pha chế","Nhét vào túi tạp dề"],"Where should a wet wiping cloth be kept between uses during a shift?",["In a bucket of sanitizer solution","Over your shoulder, ready to grab","Folded on the drink counter","Tucked into your apron pocket"],"Khăn lau ướt phải ngâm trong xô khử trùng giữa các lần dùng. Khăn để trên vai hay trên quầy làm lây vi khuẩn.","Wet wiping cloths must be kept in sanitizer solution between uses. A cloth on your shoulder or the counter spreads germs."],
["qt39","QT","KT","Dụng cụ dùng liên tục với đồ TCS (ví dụ ca đong sữa, muỗng) phải rửa và khử trùng ít nhất bao lâu một lần?",["Mỗi 4 giờ","Mỗi ngày một lần lúc đóng cửa","Mỗi tuần một lần","Chỉ khi nhìn thấy bẩn"],"Utensils in constant use with TCS food (like milk pitchers and spoons) must be cleaned and sanitized at least how often?",["Every 4 hours","Once a day at closing","Once a week","Only when they look dirty"],"Dụng cụ và bề mặt dùng liên tục phải rửa và khử trùng ít nhất mỗi 4 giờ, và mỗi khi đổi sang loại đồ ăn khác.","Equipment and surfaces in constant use must be cleaned and sanitized at least every 4 hours, and whenever you switch to a different food."],
["qd01","QT","KT","Nếu khử trùng bằng nhiệt ở bồn rửa (ngâm nước nóng), nước phải nóng ít nhất bao nhiêu và ngâm bao lâu?",["171°F (77°C), ngâm ít nhất 30 giây","135°F (57°C), ngâm ít nhất 30 giây","110°F (43°C), ngâm ít nhất 10 giây","212°F (100°C), nhúng qua 1 giây"],"If you sanitize with heat in a sink (soaking in hot water), how hot must the water be and for how long?",["171°F (77°C), soak at least 30 seconds","135°F (57°C), soak at least 30 seconds","110°F (43°C), soak at least 10 seconds","212°F (100°C), dip for 1 second"],"Khử trùng bằng nhiệt tay: nước ít nhất 171°F (77°C) và ngâm ít nhất 30 giây. Nước nóng vừa tay rửa (khoảng 110°F) chỉ để rửa, chưa đủ để khử trùng.","Manual heat sanitizing needs water at least 171°F (77°C) with at least 30 seconds of immersion. Hand-hot water (about 110°F) is for washing, not sanitizing."],
["qd02","QT","KT","Yếu tố nào KHÔNG ảnh hưởng đến việc nước khử trùng có diệt được vi khuẩn hay không?",["Màu của xô đựng nước khử trùng","Nồng độ hóa chất trong nước","Nhiệt độ của nước","Thời gian bề mặt tiếp xúc với nước khử trùng"],"Which factor does NOT affect whether a sanitizer solution kills germs?",["The color of the sanitizer bucket","The chemical concentration","The water temperature","How long the surface stays in contact"],"Hiệu quả khử trùng phụ thuộc nồng độ, nhiệt độ nước, thời gian tiếp xúc, độ cứng của nước và độ pH. Vì vậy phải pha đúng theo nhãn và kiểm tra bằng que thử.","Sanitizer works depending on concentration, water temperature, contact time, water hardness and pH. That's why you mix it by the label and check it with test strips."],
["qd03","QT","KT","Bạn xịt nước khử trùng lên quầy pha chế rồi lau khô ngay lập tức. Cách này sai ở đâu?",["Chưa để đủ thời gian tiếp xúc ghi trên nhãn","Xịt quá nhiều nước khử trùng","Phải lau khô trước rồi mới xịt","Không sai, lau khô ngay là đúng"],"You spray sanitizer on the drink counter and wipe it dry right away. What's wrong with that?",["It didn't stay on for the contact time on the label","You sprayed too much sanitizer","You should wipe dry first, then spray","Nothing, wiping dry right away is correct"],"Chất khử trùng cần một khoảng thời gian tiếp xúc nhất định (ghi trên nhãn) mới diệt được vi khuẩn. Để bề mặt ướt đủ thời gian rồi để khô tự nhiên.","Sanitizer needs a set contact time (on the label) to kill germs. Leave the surface wet for that time, then let it air-dry."],
["qd04","QT","KT","Que thử cho thấy xô nước khử trùng chlorine chỉ còn khoảng 10 ppm. Bạn làm gì?",["Đổ bỏ, pha lại cho đúng nồng độ rồi thử lại","Cứ dùng tiếp đến hết ca rồi mới pha lại","Thêm nước cho đầy xô lại","Đổ thêm thật nhiều thuốc tẩy cho thật chắc"],"A test strip shows the chlorine sanitizer bucket is down to about 10 ppm. What do you do?",["Dump it, remix to the right strength and test again","Keep using it until the shift ends, then remix","Top it up with water so the bucket is full again","Pour in lots of extra bleach to be extra safe"],"10 ppm quá yếu, không diệt được vi khuẩn. Pha lại đúng nồng độ (chlorine khoảng 50 đến 100 ppm) và thử lại. Pha quá đặc cũng sai vì gây độc và hại bề mặt.","10 ppm is too weak to kill germs. Remix to the right strength (chlorine about 50 to 100 ppm) and retest. Mixing it too strong is also wrong because it's toxic and damages surfaces."],
["qd05","QT","KT","Rửa và khử trùng xong một chồng ly nhựa, ly vẫn còn ướt. Bạn làm gì tiếp?",["Úp ngược ly trên giá sạch cho khô hẳn rồi mới xếp chồng","Xếp chồng ly ngay khi còn ướt cho gọn chỗ","Lau khô từng ly bằng khăn lau quầy rồi xếp chồng","Nhét giấy lau tay vào trong từng ly cho mau khô"],"You've just washed and sanitized a stack of plastic cups, and they're still wet. What do you do next?",["Set them upside down on a clean rack to dry completely before stacking","Stack them right away while still wet so they take up less space","Dry each cup by hand with the counter towel, then stack them","Stuff paper towels inside each cup to soak up the water faster"],"Đồ đã khử trùng phải để khô tự nhiên. Xếp chồng khi còn ướt sẽ giữ nước, vi khuẩn dễ phát triển. Lau bằng khăn lại làm dính vi khuẩn.","Sanitized items must air-dry. Stacking them wet traps water where germs can grow, and wiping with a towel puts germs back on."],
["qd06","QT","KT","Ở các quán có máy rửa chén nhiệt độ cao, nước tráng khử trùng cuối cùng thường phải nóng ít nhất bao nhiêu? (Tiệm mình rửa tay ở bồn 3 ngăn.)",["180°F (82°C)","135°F (57°C)","150°F (66°C)","110°F (43°C)"],"In places with a high-temperature dishwasher, how hot must the final sanitizing rinse usually be at least? (Our shop washes by hand in a three-compartment sink.)",["180°F (82°C)","135°F (57°C)","150°F (66°C)","110°F (43°C)"],"Theo FDA Food Code, đa số máy rửa chén nhiệt độ cao cần nước tráng khử trùng cuối ít nhất 180°F (82°C) (loại máy giá cố định một nhiệt độ là 165°F/74°C) và không quá 194°F (90°C). Tiệm mình không có máy rửa, nên luôn rửa, tráng, khử trùng ở bồn 3 ngăn.","Under the FDA Food Code, most high-temperature dishwashers need a final sanitizing rinse of at least 180°F (82°C) (165°F/74°C for stationary-rack single-temperature machines) and no more than 194°F (90°C). Our shop has no dishwasher, so we always wash, rinse and sanitize in the three-compartment sink."],
["qd07","QT","KT","Đến lịch vệ sinh máy làm đá. Bước đúng đầu tiên là gì?",["Bỏ hết đá trong máy, rồi làm sạch và khử trùng theo hướng dẫn của hãng","Xịt nước khử trùng lên đá đang có trong máy, rồi lau thành máy","Chỉ lau bên ngoài cửa máy và chỗ để xẻng bằng khăn ẩm","Để nguyên đá, cạo cặn trên thành máy cho cặn rơi xuống"],"It's time to clean the ice machine. What is the correct first step?",["Empty and throw out all the ice, then clean and sanitize per the maker's instructions","Spray sanitizer onto the ice already in the bin, then wipe the walls","Just wipe the outside of the door and the scoop holder with a damp cloth","Leave the ice in and scrape the inside walls so the buildup falls down"],"Đá là đồ ăn. Phải bỏ hết đá trước để hóa chất và cặn bẩn không dính vào, rồi làm sạch, khử trùng theo đúng hướng dẫn và lịch của hãng.","Ice is food. Throw out all the ice first so no chemicals or gunk get into it, then clean and sanitize following the maker's instructions and schedule."],
["qd08","QT","KT","Đánh sữa xong, bạn làm gì với vòi đánh sữa (steam wand)?",["Xả hơi ngay và lau bằng khăn ẩm riêng chỉ dùng cho vòi","Để đó, cuối ca lau kỹ một lần","Lau bằng khăn lau mặt quầy bar","Nhúng vòi vào xô nước khử trùng rồi để khô"],"After steaming milk, what do you do with the steam wand?",["Purge it right away and wipe it with a damp cloth used only for the wand","Leave it as is and give it one good wipe at the end of the shift","Wipe it with the same towel you use for the bar top","Dip it in the sanitizer bucket and let it air-dry"],"Sữa bám trên vòi sẽ khô lại rất nhanh và là chỗ vi khuẩn sinh sôi. Xả hơi trước và sau khi đánh, lau ngay bằng khăn riêng cho vòi, không dùng chung khăn lau quầy.","Milk on the wand dries fast and becomes a place for germs to grow. Purge before and after steaming and wipe right away with a cloth used only for the wand, not the counter towel."],
["qd09","QT","KT","Cuối ngày, bạn cho nước xà phòng vào cối xay sinh tố, chạy vài giây rồi tráng nước sạch. Cối đã sạch và an toàn chưa?",["Chưa, vẫn phải khử trùng rồi để khô tự nhiên","Rồi, xà phòng đã diệt hết vi khuẩn","Rồi, chỉ cần tráng nước nóng","Chưa, phải lau khô bằng khăn là xong"],"At closing you blend soapy water in the blender for a few seconds and rinse it. Is it clean and safe now?",["No, it still has to be sanitized and air-dried","Yes, the soap killed all the germs","Yes, a hot water rinse is all it needs","No, you just need to towel-dry it"],"Xà phòng chỉ làm sạch, không khử trùng. Sau khi rửa và tráng (tháo rời phần lưỡi nếu hãng hướng dẫn), vẫn phải khử trùng rồi để khô tự nhiên.","Soap cleans but doesn't sanitize. After washing and rinsing (taking the blade apart if the maker says to), you still have to sanitize and let it air-dry."],
["qd10","QT","KT","Lịch vệ sinh (cleaning schedule) của quán cần ghi rõ những gì?",["Vệ sinh cái gì, ai làm, khi nào và làm thế nào","Chỉ cần ghi tên người phụ trách là đủ","Chỉ ghi ngày đợt thanh tra sắp tới","Chỉ ghi giá tiền các loại hóa chất"],"What should the shop's cleaning schedule spell out?",["What to clean, who does it, when, and how","Only the name of the person in charge","Only the date of the next inspection","Only the price of each chemical used"],"Lịch vệ sinh tốt ghi rõ việc gì, ai phụ trách, bao lâu một lần, dùng hóa chất và dụng cụ nào, để không việc nào bị quên như máy đá hay vòi đánh sữa.","A good cleaning schedule says what to clean, who is responsible, how often, and which chemicals and tools to use, so nothing like the ice machine or steam wand gets forgotten."],
["qd11","QT","KT","Lau sàn xong, bạn đổ nước lau sàn bẩn ở đâu?",["Bồn lau nhà (service sink)","Bồn rửa ly","Bồn rửa tay","Bồn sơ chế trái cây"],"After mopping, where do you dump the dirty mop water?",["The mop (service) sink","The dish sink","The handwashing sink","The fruit prep sink"],"Nước lau sàn rất bẩn, chỉ được đổ ở bồn lau nhà, không bao giờ đổ vào bồn rửa ly, rửa tay hay sơ chế. Cây lau treo lên cho khô.","Mop water is very dirty and goes only in the service sink, never in dish, handwashing or prep sinks. Hang the mop up to dry."],
["qd12","QT","KT","Cách cất ly và muỗng sạch nào là đúng?",["Ly úp ngược, muỗng cắm cán hướng lên để cầm vào cán","Ly để ngửa cho dễ lấy, muỗng cắm đầu múc hướng lên","Ly và muỗng để chung trong thùng dưới sàn","Ly để cạnh xô hóa chất cho tiện"],"How should clean cups and spoons be stored?",["Cups upside down, spoons handles up so you grab the handle","Cups right side up for easy grabbing, spoons bowl side up","Cups and spoons together in a bin on the floor","Cups next to the chemical bucket for convenience"],"Úp ngược ly và cắm muỗng cán hướng lên để tay không chạm vào phần tiếp xúc đồ uống. Cất trên kệ sạch, cách sàn ít nhất 6 inch, xa hóa chất.","Store cups upside down and spoons handles up so hands don't touch the parts that touch drinks. Keep them on clean shelves at least 6 inches off the floor, away from chemicals."],
["qd13","QT","KT","Khăn khô dùng để lau giọt nước bên ngoài ly trước khi đưa khách phải thế nào?",["Khô, sạch và chỉ dùng cho việc đó","Dùng chung để lau tay và lau quầy","Có thể ẩm, miễn là chưa bẩn","Nhúng nước khử trùng rồi để ướt"],"A dry cloth used to wipe drips off the outside of cups before serving must be:",["Dry, clean and used only for that","Shared for drying hands and wiping counters","A little damp is fine as long as it's not dirty","Dipped in sanitizer and kept wet"],"Khăn khô phải luôn khô, không dính đồ ăn và chỉ dùng cho một việc. Khăn ướt thì ngâm trong xô khử trùng. Không dùng một khăn cho nhiều việc.","Dry cloths must stay dry, free of food bits, and used for one job only. Wet cloths are kept in sanitizer. Never use one cloth for several jobs."],
["qd14","QT","KT","Bạn định pha thuốc tẩy chung với một chai nước lau kính có amoniac cho \"mạnh hơn\". Điều gì đúng?",["Không bao giờ trộn, vì tạo ra khí độc","Trộn được, sạch nhanh gấp đôi","Trộn được nếu dùng nước nóng","Trộn được nếu mở cửa sổ"],"You're thinking of mixing bleach with an ammonia glass cleaner to make it \"stronger\". What's true?",["Never mix them, it makes a toxic gas","It's fine, it cleans twice as fast","It's fine if you use hot water","It's fine if a window is open"],"Thuốc tẩy trộn với amoniac tạo ra khí độc gây hại phổi. Không bao giờ trộn hóa chất với nhau, chỉ pha với nước theo đúng nhãn.","Bleach mixed with ammonia makes a toxic gas that harms your lungs. Never mix chemicals together; only dilute with water as the label says."],
["qd15","QT","KT","Bạn rót nước khử trùng từ can lớn sang một bình xịt nhỏ để dùng ở quầy. Bình xịt cần gì?",["Nhãn ghi rõ tên hóa chất","Không cần gì, ai cũng biết là nước khử trùng","Một ít nước chanh cho thơm","Để chung kệ với siro cho dễ lấy"],"You pour sanitizer from a big jug into a small spray bottle for the counter. What does the spray bottle need?",["A label with the chemical's name","Nothing, everyone knows it's sanitizer","A little lemon juice for the smell","To be kept on the syrup shelf for easy reach"],"Bình chứa hóa chất chia nhỏ phải dán nhãn tên hóa chất để không bị nhầm với đồ uống. Bảng SDS (Safety Data Sheet) của từng hóa chất cho biết nguy hiểm, đồ bảo hộ và cách sơ cứu.","Any smaller chemical container must be labeled with the chemical's name so no one mistakes it for a drink. Each chemical's SDS (Safety Data Sheet) explains its dangers, protective gear and first aid."],
["qd16","QT","KT","Thớt nhựa của quán bị trầy xước sâu nhiều đường. Nên làm gì?",["Thay thớt mới hoặc bào lại mặt thớt, vì vết xước sâu giữ vi khuẩn","Dùng tiếp, chỉ cần rửa kỹ hơn","Lật mặt kia dùng tiếp đến khi hỏng hẳn","Ngâm thớt trong nước khử trùng qua đêm rồi dùng tiếp"],"The café's plastic cutting board has many deep scratches. What should you do?",["Replace it or resurface it, because deep grooves hold bacteria","Keep using it and just wash it more","Flip it over and use the other side until it breaks","Soak it in sanitizer overnight and keep using it"],"Bề mặt tiếp xúc đồ ăn phải nhẵn và dễ làm sạch. Rãnh sâu giữ cặn và vi khuẩn mà rửa hay khử trùng không tới, nên phải thay hoặc bào lại.","Food-contact surfaces must be smooth and easy to clean. Deep grooves trap food and bacteria that washing and sanitizing can't reach, so replace or resurface the board."],
["qt40","QT","DU","Theo luật Mỹ hiện nay có 9 chất gây dị ứng chính. Chất nào sau đây NẰM TRONG danh sách đó?",["Mè (vừng)","Cà phê","Đường","Trà xanh"],"US law lists 9 major food allergens. Which of these IS one of them?",["Sesame","Coffee","Sugar","Green tea"],"9 chất gây dị ứng chính: sữa, trứng, cá, hải sản có vỏ (tôm, cua), các loại hạt cây (hạnh nhân, óc chó...), đậu phộng, lúa mì, đậu nành và mè.","The 9 major allergens: milk, eggs, fish, crustacean shellfish, tree nuts, peanuts, wheat, soy and sesame."],
["qt41","QT","DU","Khách dị ứng các loại hạt cây. Loại sữa thay thế nào chắc chắn KHÔNG được dùng cho khách đó?",["Sữa hạnh nhân","Sữa yến mạch không chứa hạt","Sữa tươi","Sữa đặc"],"A customer is allergic to tree nuts. Which milk alternative must you NOT use for them?",["Almond milk","Nut-free oat milk","Whole milk","Condensed milk"],"Hạnh nhân là hạt cây. Với khách dị ứng, kiểm tra nhãn từng thành phần, vì có loại sữa yến mạch làm chung dây chuyền với hạt.","Almonds are tree nuts. For allergic guests, check every ingredient label, since some oat milks are made on shared lines with nuts."],
["qt42","QT","DU","Khách hỏi món này có đậu phộng hay các loại hạt không vì bị dị ứng. Bạn không chắc. Bạn làm gì?",["Nói thật là chưa chắc, kiểm tra công thức hoặc hỏi quản lý rồi mới trả lời","Nói \"chắc là không có đâu\" cho khách yên tâm, vì đa số đồ uống không có hạt","Mời khách thử một ngụm nhỏ trước để tự xem có bị phản ứng không","Đoán dựa vào màu và mùi của món, rồi nói khách gọi được"],"A customer asks if a drink has peanuts or tree nuts because of an allergy. You're not sure. What do you do?",["Say you're not sure, check the recipe or ask the manager before answering","Say \"probably not\" so they feel at ease, since most drinks have no nuts","Offer them a small sip first so they can check for a reaction themselves","Guess from the drink's color and smell, then tell them it's safe to order"],"Không bao giờ đoán với khách dị ứng. Báo quản lý hoặc người giữ chứng chỉ, kiểm tra công thức và nhãn nguyên liệu, rồi trả lời chính xác.","Never guess about allergies. Tell the manager or certified person, check the recipe and labels, then answer accurately."],
["qt43","QT","DU","Vừa xay sinh tố có bơ đậu phộng. Khách tiếp theo dị ứng đậu phộng. Bạn làm gì với cối xay?",["Rửa, tráng và khử trùng cối xay, hoặc dùng cối khác","Tráng nước qua là đủ","Lau bằng khăn rồi xay luôn","Không cần làm gì vì món mới không có đậu phộng"],"You just blended a smoothie with peanut butter. The next customer is allergic to peanuts. What do you do with the blender?",["Wash, rinse and sanitize it, or use a different blender","A quick water rinse is enough","Wipe with a towel and blend","Nothing, since the new drink has no peanuts"],"Lượng nhỏ đậu phộng còn sót cũng gây phản ứng nặng (lây nhiễm chéo chất dị ứng). Phải rửa, tráng, khử trùng dụng cụ, hoặc dùng bộ riêng, và rửa tay, thay găng.","Even a trace of peanut can cause a severe reaction (allergen cross-contact). Wash, rinse and sanitize, or use separate equipment, and wash hands and change gloves."],
["qt44","QT","DU","Khách uống xong thì khó thở, sưng môi, nổi mẩn. Bạn làm gì trước tiên?",["Gọi 911 và báo quản lý ngay","Đưa khách ly nước rồi chờ xem","Bảo khách về nhà nằm nghỉ","Làm xong order khác rồi mới xem"],"After drinking, a customer has trouble breathing, swollen lips and hives. What do you do first?",["Call 911 and alert the manager right away","Give them a glass of water and wait","Tell them to go home and lie down","Finish the other orders, then check"],"Đây có thể là sốc phản vệ, rất nguy hiểm. Gọi 911 ngay. Nếu khách có bút tiêm epinephrine (EpiPen) thì giúp khách dùng theo hướng dẫn.","This may be anaphylaxis, which is life-threatening. Call 911 right away. If the guest has an epinephrine auto-injector (EpiPen), help them use it."],
["qt45","QT","DU","Ở Massachusetts, menu và bảng menu của quán phải có câu nhắc nào về dị ứng?",["\"Before placing your order, please inform your server if a person in your party has a food allergy.\" (Trước khi gọi món, xin báo nhân viên nếu trong nhóm có người dị ứng thực phẩm.)","\"Please be aware that our food may contain or come into contact with common allergens.\" (Xin lưu ý món ăn có thể chứa hoặc tiếp xúc với các chất gây dị ứng thường gặp.)","\"We cannot guarantee any item is allergen-free and are not responsible for reactions.\" (Quán không bảo đảm món nào hoàn toàn không có chất gây dị ứng và không chịu trách nhiệm.)","\"All items may contain nuts, dairy, wheat or soy. Ask us about our ingredients.\" (Mọi món đều có thể chứa hạt, sữa, lúa mì hoặc đậu nành. Hãy hỏi về nguyên liệu.)"],"In Massachusetts, what allergy notice must appear on menus and menu boards?",["\"Before placing your order, please inform your server if a person in your party has a food allergy.\"","\"Please be aware that our food may contain or come into contact with common allergens.\"","\"We cannot guarantee any item is allergen-free and are not responsible for reactions.\"","\"All items may contain nuts, dairy, wheat or soy. Ask us about our ingredients.\""],"Luật Massachusetts (105 CMR 590.011) bắt buộc câu này nguyên văn trên menu và bảng menu (hoặc dán cạnh bảng menu, tại quầy order), kèm poster về dị ứng ở khu nhân viên.","Massachusetts rules (105 CMR 590.011) require this exact sentence on menus and menu boards (or posted next to the board or at each ordering point), plus a food allergy poster in the staff area."],
["qt46","QT","DU","Ở Massachusetts, quán ăn phải có ít nhất một người giữ loại chứng chỉ nào?",["Chứng chỉ quản lý an toàn thực phẩm (Certified Food Protection Manager) kèm chứng nhận về dị ứng","Chỉ cần thẻ ServSafe Food Handler của nhân viên, không cần chứng chỉ quản lý","Chứng chỉ barista của Hiệp hội Cà phê Đặc sản (SCA) kèm chứng nhận sơ cứu","Không cần chứng chỉ nào, miễn quán qua được đợt kiểm tra hằng năm"],"In Massachusetts, a food establishment must have at least one person holding which certification?",["Certified Food Protection Manager, plus allergen awareness training","A ServSafe Food Handler card only, with no manager certificate needed","A Specialty Coffee Association barista certificate, plus first aid training","No certificate at all, as long as the café passes its yearly inspection"],"Massachusetts yêu cầu có người giữ chứng chỉ Certified Food Protection Manager (ví dụ ServSafe Manager) và đã học khóa Allergen Awareness. Chứng chỉ phải treo ở quán.","Massachusetts requires a Certified Food Protection Manager (for example ServSafe Manager) who has completed allergen awareness training, with certificates posted on site."],
["qd17","QT","DU","Nguyên liệu nào sau đây trong quán có chứa một trong 9 chất gây dị ứng chính?",["Sữa đặc","Cà phê phin pha đen","Đường cát trắng","Đá viên từ máy đá"],"Which of these ingredients in our shop contains one of the 9 major allergens?",["Sweetened condensed milk","Black phin-brewed coffee","Granulated white sugar","Ice from the ice machine"],"Sữa đặc làm từ sữa bò, nên chứa sữa (milk). Kem tươi, kem muối, whipped cream và sữa tươi cũng vậy. Cà phê nguyên chất không phải chất gây dị ứng chính.","Condensed milk is made from cow's milk, so it contains milk. So do cream, salted cream, whipped cream and dairy milk. Plain coffee is not a major allergen."],
["qd18","QT","DU","\"Lây nhiễm chéo chất dị ứng\" (cross-contact) là gì?",["Chất gây dị ứng từ món này dính sang món khác","Vi khuẩn từ thịt sống dính sang đồ ăn chín","Đồ ăn để quá lâu trong vùng nguy hiểm","Khách dị ứng chạm vào ly của khách khác"],"What is allergen \"cross-contact\"?",["An allergen from one food gets into another food","Bacteria from raw meat get onto cooked food","Food left too long in the danger zone","An allergic guest touching another guest's cup"],"Cross-contact là protein gây dị ứng dính sang món khác qua dụng cụ, tay hay bề mặt. Khác với cross-contamination là vi khuẩn lây lan. Nấu hay khử trùng không làm mất chất gây dị ứng.","Cross-contact is when an allergen protein gets into another food through tools, hands or surfaces. Cross-contamination is about germs spreading. Cooking or sanitizing doesn't remove allergens."],
["qd19","QT","DU","Bánh quy Lotus Biscoff (dùng làm vụn rắc topping) có chứa chất gây dị ứng nào theo nhãn?",["Lúa mì và đậu nành","Không có chất gây dị ứng nào","Chỉ có sữa","Đậu phộng và mè"],"According to the label, which allergens do Lotus Biscoff cookies (used as crumb topping) contain?",["Wheat and soy","No allergens at all","Only milk","Peanuts and sesame"],"Nhãn Biscoff ở Mỹ ghi \"Contains wheat and soy\" (có bột mì và bột đậu nành). Khách dị ứng lúa mì hoặc đậu nành thì không rắc vụn Biscoff. Luôn kiểm tra lại nhãn vì công thức có thể đổi.","The US Biscoff label says \"Contains wheat and soy\" (wheat flour and soy flour). Skip Biscoff crumbs for guests allergic to wheat or soy. Always recheck the label, since recipes can change."],
["qd20","QT","DU","Khách báo dị ứng trứng. Món nào trong quán bạn phải cảnh báo khách?",["Cà phê trứng","Cà phê đen đá","Trà đá","Nước cam ép"],"A customer says they're allergic to eggs. Which drink must you warn them about?",["Egg coffee","Iced black coffee","Iced tea","Fresh orange juice"],"Cà phê trứng làm từ lòng đỏ trứng đánh với sữa đặc, nên có cả trứng và sữa. Khách dị ứng trứng không được dùng, và phải dùng dụng cụ sạch cho món của khách.","Egg coffee is made with egg yolk whipped with condensed milk, so it has both egg and milk. Egg-allergic guests can't have it, and their drink needs clean tools."],
["qd21","QT","DU","Khách dị ứng lúa mì hỏi có ăn được bánh tart trứng không. Bạn trả lời thế nào?",["Không, vỏ bánh làm từ bột mì, nhân có trứng và sữa","Được, bánh tên là tart trứng nên chất dị ứng duy nhất là trứng","Được, miễn là chỉ ăn phần nhân và bỏ vỏ bánh","Được, nướng ở nhiệt cao làm mất chất dị ứng của lúa mì"],"A customer allergic to wheat asks if they can eat an egg tart. What do you say?",["No, the crust is made from wheat flour, and the filling has egg and milk","Yes, it's called an egg tart, so the only allergen is egg","Yes, as long as they only eat the filling and leave the crust","Yes, baking at high heat breaks down the wheat allergen"],"Tart trứng có lúa mì (vỏ bánh), trứng và sữa. Nướng chín không làm mất chất gây dị ứng, và ăn riêng phần nhân vẫn dính bột từ vỏ.","Egg tarts contain wheat (crust), egg and milk. Baking doesn't remove allergens, and the filling still touches the crust."],
["qd22","QT","DU","Khách dị ứng sữa (không phải chỉ không dung nạp lactose) gọi latte. Loại sữa nào KHÔNG được dùng?",["Sữa tươi lactose-free","Sữa yến mạch đã kiểm tra nhãn","Sữa dừa đã kiểm tra nhãn","Sữa đậu nành đã kiểm tra nhãn (nếu khách không dị ứng đậu nành)"],"A customer with a milk allergy (not just lactose intolerance) orders a latte. Which milk must you NOT use?",["Lactose-free dairy milk","Oat milk with a checked label","Coconut milk with a checked label","Soy milk with a checked label (if they're not allergic to soy)"],"Sữa lactose-free vẫn là sữa bò, chỉ bỏ đường lactose, còn nguyên protein sữa gây dị ứng. \"Lactose-free\" không phải \"dairy-free\".","Lactose-free milk is still cow's milk with the lactose sugar removed; the milk protein that causes allergies is still there. \"Lactose-free\" is not \"dairy-free\"."],
["qd23","QT","DU","Hộp creamer ghi \"non-dairy\" (không từ sữa). Khách dị ứng sữa dùng được chưa?",["Chưa chắc, phải đọc thành phần xem có casein, caseinate hay \"Contains: Milk\"","Chắc chắn được, vì trên hộp đã ghi rõ chữ non-dairy","Được, nếu khách chỉ cho một ít vào cà phê thôi","Được, vì creamer làm từ dầu thực vật nên không có sữa"],"A creamer carton says \"non-dairy\". Is it safe for a guest with a milk allergy?",["Not for sure, read the ingredients for casein, caseinate or \"Contains: Milk\"","Definitely, since the carton clearly says non-dairy","Yes, as long as they only add a small splash to their coffee","Yes, creamer is made from vegetable oil so it has no milk"],"Một số sản phẩm ghi \"non-dairy\" vẫn có protein sữa như sodium caseinate. Luôn đọc danh sách thành phần và dòng \"Contains\", không tin vào chữ quảng cáo.","Some \"non-dairy\" products still contain milk protein such as sodium caseinate. Always read the ingredient list and the \"Contains\" line, not the front of the package."],
["qd24","QT","DU","Khách dị ứng các loại hạt cây muốn latte siro hazelnut. Làm sao biết siro có chứa hạt hay không?",["Đọc danh sách thành phần và dòng \"Contains\" trên nhãn chai","Nhìn tên trên chai là biết có hạt thật hay không","Ngửi siro xem có mùi hạt không trước khi bơm","Hỏi khách khác đã uống mà có bị phản ứng không"],"A customer allergic to tree nuts wants a hazelnut syrup latte. How do you find out if the syrup contains nuts?",["Read the ingredient list and \"Contains\" line on the bottle label","The name on the bottle tells you whether it has real nuts","Smell the syrup for a nutty scent before you pump it","Ask other customers if they've had it without a reaction"],"Có siro hazelnut dùng hương liệu, có loại chứa hạt thật. Chỉ nhãn thành phần mới cho biết. Không rõ thì báo quản lý và không phục vụ món đó.","Some hazelnut syrups use flavoring, others contain real nuts. Only the ingredient label tells you. If it's unclear, tell the manager and don't serve it."],
["qd25","QT","DU","Nhãn một gói topping ghi \"May contain peanuts\" (có thể chứa đậu phộng). Với khách dị ứng đậu phộng, bạn làm gì?",["Báo khách là có thể chứa đậu phộng và không dùng topping đó cho món của khách","Coi như không có đậu phộng vì nhãn không ghi \"Contains\"","Dùng một ít thôi, vì nhãn chỉ ghi \"có thể chứa\"","Cứ dùng mà không nói gì với khách về cái nhãn"],"A topping package says \"May contain peanuts\". For a guest with a peanut allergy, what do you do?",["Tell the guest it may contain peanuts and leave that topping off their drink","Treat it as peanut-free, since the label doesn't say \"Contains\"","Use just a small amount, since the label only says \"may contain\"","Use it without saying anything to the guest about the label"],"\"May contain\" nghĩa là có nguy cơ dính đậu phộng khi sản xuất. Với khách dị ứng, coi như có và không dùng.","\"May contain\" means peanuts may have gotten in during production. For allergic guests, treat it as present and don't use it."],
["qd26","QT","DU","Khách đặt món và báo dị ứng sữa. Bạn xử lý order thế nào?",["Báo quản lý, ghi chú dị ứng rõ trên order và pha riêng bằng dụng cụ sạch","Chỉ nói miệng với người pha bên cạnh rồi pha như bình thường","Pha như bình thường vì khách đã chọn sữa yến mạch, không cần ghi chú","Pha chung mẻ với các ly khác cho nhanh, rồi tráng ca sau đó"],"A customer orders and tells you about a milk allergy. How do you handle the order?",["Tell the manager, mark the allergy clearly on the order, and make it separately with clean tools","Just mention it out loud to the person next to you and make the drink as usual","Make it as usual since they chose oat milk, so there's no need for any note","Make it in the same batch as the other drinks, then rinse the pitcher afterward"],"Đơn dị ứng phải được báo quản lý, ghi chú rõ trên order (ví dụ ghi chú trên POS và nhãn ly), pha riêng bằng dụng cụ sạch và giao tận tay khách.","Allergy orders must be reported to the manager, clearly marked on the order (for example a POS note and cup label), made separately with clean tools, and handed directly to the guest."],
["qd27","QT","DU","Khách dị ứng sữa gọi latte sữa yến mạch nóng. Ca đánh sữa và vòi đánh sữa vừa dùng cho sữa tươi. Bạn làm gì?",["Dùng ca đánh sữa sạch đã khử trùng, xả và lau kỹ vòi trước khi đánh","Dùng luôn ca đó, chỉ tráng nước qua rồi đánh như bình thường","Đánh luôn bằng ca cũ vì nhiệt độ cao sẽ diệt chất gây dị ứng","Đổ sữa yến mạch vào chung ca với sữa tươi còn dư cho đỡ phí"],"A milk-allergic guest orders a hot oat milk latte. The pitcher and steam wand were just used for dairy. What do you do?",["Use a clean, sanitized pitcher and purge and wipe the wand well before steaming","Use the same pitcher after a quick water rinse, then steam as usual","Steam right away in the same pitcher, since high heat destroys allergens","Add the oat milk to the leftover dairy in the pitcher to avoid waste"],"Sữa tươi còn dính trên ca và vòi là đủ gây phản ứng. Dùng ca sạch, xả hơi và lau kỹ vòi, và cho khách biết vòi dùng chung với sữa bò để khách quyết định.","Leftover dairy on the pitcher or wand is enough to cause a reaction. Use a clean pitcher, purge and wipe the wand well, and let the guest know the wand is shared with dairy so they can decide."],
["qd28","QT","DU","Bạn vừa rắc đậu phộng giã cho một ly. Order tiếp theo là của khách dị ứng đậu phộng, bạn đang đeo găng. Bạn làm gì?",["Tháo găng, rửa tay rồi đeo găng mới","Giữ nguyên găng vì găng nhìn vẫn sạch","Chùi găng vào tạp dề rồi làm ly tiếp theo","Đeo thêm một đôi găng chồng lên đôi đang đeo"],"You just sprinkled crushed peanuts on a drink. The next order is for a peanut-allergic guest, and you're wearing gloves. What do you do?",["Take off the gloves, wash your hands, then put on new gloves","Keep the same gloves on, since they still look clean","Wipe the gloves on your apron and start the next drink","Put a second pair of gloves on over the ones you have on"],"Bụi đậu phộng dính trên găng sẽ dính vào món của khách. Phải tháo găng, rửa tay và đeo găng mới trước khi làm món cho khách dị ứng.","Peanut dust on the gloves will get into the guest's drink. Remove the gloves, wash your hands and put on fresh gloves before making the allergy order."],
["qd29","QT","DU","Lau quầy bằng khăn nhúng nước khử trùng có loại bỏ được chất gây dị ứng không?",["Không, phải rửa sạch bằng xà phòng rồi mới khử trùng","Có, khử trùng diệt chất gây dị ứng như diệt vi khuẩn","Có, miễn là pha nước khử trùng thật đặc","Có, miễn là lau quầy ít nhất hai lần"],"Does wiping a counter with a sanitizer cloth remove allergens?",["No, it must be washed with soap first, then sanitized","Yes, sanitizer kills allergens the same way it kills germs","Yes, as long as the sanitizer is mixed extra strong","Yes, as long as you wipe the counter at least twice"],"Chất gây dị ứng là protein, không phải vi khuẩn, nên khử trùng không diệt được. Phải làm sạch (rửa xà phòng, tráng) để loại bỏ, rồi mới khử trùng.","Allergens are proteins, not germs, so sanitizer can't kill them. They must be cleaned off (washed and rinsed) first, then the surface is sanitized."],
["qd30","QT","DU","Khách bị phản ứng dị ứng, đã tự tiêm bút EpiPen và thấy đỡ hơn, nói không cần gọi cấp cứu. Bạn làm gì?",["Vẫn gọi 911 vì phản ứng có thể quay lại","Để khách về vì đã đỡ","Mời khách ly nước và ngồi nghỉ, không báo ai","Tiêm thêm một bút nữa cho chắc"],"A guest having an allergic reaction used their own EpiPen, feels better, and says no ambulance is needed. What do you do?",["Still call 911, since the reaction can come back","Let them leave since they feel better","Give them water and a seat, and tell no one","Give another injection to be safe"],"Sau khi tiêm epinephrine, khách vẫn cần cấp cứu vì thuốc có thể hết tác dụng và phản ứng có thể quay lại. Gọi 911, báo quản lý và ở cạnh khách.","After epinephrine the guest still needs emergency care, because the medicine can wear off and the reaction can return. Call 911, alert the manager and stay with the guest."],
