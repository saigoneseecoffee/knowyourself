<style>
/* Layout: one narrow column; sticky header with name + scrollable test chips; test card below; owner-only results sheet */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --ink:#17201c; --muted:#5d6a63; --line:#d9e0db;
  --jade:#1d6b57; --jade-soft:#e2efe9; --lacquer:#b23a2e; --gold:#a8771c; --gold-soft:#f6ecd8;
  --display:"Lora",Georgia,serif; --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#1a2320; --ink:#e7ede9; --muted:#9aa8a1; --line:#2c3833;
  --jade:#5fc2a4; --jade-soft:#1f3a32; --lacquer:#ef7b6d; --gold:#e0b25a; --gold-soft:#3a2f1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#1a2320; --ink:#e7ede9; --muted:#9aa8a1; --line:#2c3833;
  --jade:#5fc2a4; --jade-soft:#1f3a32; --lacquer:#ef7b6d; --gold:#e0b25a; --gold-soft:#3a2f1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font-family:var(--display);font-weight:600;font-size:1.35rem;margin:0;text-wrap:balance}
.brand span{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--jade);font-weight:600}
.who{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-top:8px}
.who input{width:100%;font:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.who input:focus,button:focus-visible,.opt:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:10px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font:inherit;font-size:.85rem;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--jade);border-color:var(--jade);color:var(--bg)}
.chip .ok{color:var(--jade);font-weight:700;margin-left:4px}
.chip.on .ok{color:var(--bg)}
.chip.res{border-color:var(--gold);color:var(--gold)}
.chip.res.on{background:var(--gold);color:var(--bg)}
.intro{margin:18px 0 6px}
.intro .num{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.intro h2{font-family:var(--display);font-weight:600;font-size:1.6rem;line-height:1.2;margin:2px 0 6px;text-wrap:balance}
.intro p{margin:0 0 6px;color:var(--muted);max-width:62ch}
.scale{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--muted);margin:10px 0 4px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:8px}
.q.miss{border-color:var(--lacquer)}
.q p{margin:0 0 8px;display:flex;gap:8px}
.q p b{color:var(--muted);font-weight:500;min-width:1.6em;font-variant-numeric:tabular-nums}
.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.opt{font:inherit;font-weight:600;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opt.on{background:var(--jade);border-color:var(--jade);color:var(--bg)}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.btn{font:inherit;font-weight:600;padding:11px 18px;border-radius:8px;border:1px solid var(--jade);background:var(--jade);color:var(--bg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--jade)}
.err{color:var(--lacquer);font-size:.9rem}
.result{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.result h3{font-family:var(--display);font-weight:600;font-size:1.25rem;margin:0 0 4px}
.big{font-family:var(--display);font-size:2.2rem;font-weight:600;color:var(--jade);line-height:1.1}
.bar{margin-top:12px}
.bar .lab{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:.95rem}
.bar .lab em{font-style:normal;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.track{height:8px;background:var(--jade-soft);border-radius:4px;margin:4px 0;overflow:hidden}
.fill{height:100%;background:var(--jade);border-radius:4px}
.bar.top .fill{background:var(--gold)}
.bar p{margin:0;font-size:.88rem;color:var(--muted)}
.status{font-size:.88rem;color:var(--muted);margin-top:12px}
.status.good{color:var(--jade)}
.note{font-size:.82rem;color:var(--muted);margin-top:20px;border-top:1px solid var(--line);padding-top:12px}
.sheetwrap{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;font-size:.85rem;min-width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg);position:sticky;top:0}
td:first-child,th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
th:first-child{background:var(--bg);z-index:2}
td.empty{color:var(--line)}
tr.person{cursor:pointer}
tr.person:hover td{background:var(--jade-soft)}
.pill{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:999px;background:var(--gold-soft);color:var(--gold);font-weight:600;margin-left:6px}
.detail{margin-top:14px}
.detail h4{margin:14px 0 2px;font-size:1rem}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.toolbar input{flex:1 1 160px;font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.empty-state{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px;margin-top:14px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .5s ease}}
@media (max-width:420px){.opt{height:44px}}
</style>
<style>
.who{grid-template-columns:minmax(0,1fr) auto}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.lang button{font:inherit;font-size:.85rem;font-weight:600;padding:0 12px;border:0;background:transparent;color:var(--muted);cursor:pointer;min-height:40px}
.lang button.on{background:var(--jade);color:var(--bg)}
</style>

  <header class="top">

      <input id="pname" autocomplete="name">

  <main id="main"></main>
</div>

<script>
/* GitHub Pages: dán URL Web App của Google Apps Script vào đây để kết quả tự lưu vào Google Sheet */
const SCRIPT_URL="";
const SHEET_ID="1MX9qsupqhNMaz96kVfq9sVZZ_8-OAXSma2sepQC0WMQ",SHEET_URL="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/edit";

const META={"vi":{"mbti":{"short":"16 kiểu","name":"16 kiểu tính cách","about":"Bạn lấy năng lượng từ đâu, tiếp nhận thông tin ra sao, quyết định bằng gì và thích làm việc có kế hoạch hay linh hoạt.","dims":{"E":["Hướng ngoại (E) – Hướng nội (I)"],"S":["Thực tế (S) – Trực giác (N)"],"T":["Lý trí (T) – Cảm xúc (F)"],"J":["Nguyên tắc (J) – Linh hoạt (P)"]}},"big5":{"short":"Big Five","name":"Big Five (OCEAN)","about":"Năm chiều tính cách được nghiên cứu nhiều nhất. Mỗi chiều là một thang, không có đúng hay sai.","dims":{"O":["Cởi mở","Thích cái mới, sáng tạo, tò mò. Thấp: thích cách làm quen thuộc, thực tế."],"C":["Tận tâm","Chuẩn bị kỹ, làm đến nơi đến chốn. Đây là chiều dự báo hiệu quả công việc tốt nhất."],"E":["Hướng ngoại","Năng động, thích giao tiếp. Thấp: trầm, làm tốt việc cần tập trung."],"A":["Dễ chịu","Cảm thông, hợp tác, sẵn lòng giúp. Thấp: thẳng thắn, cạnh tranh."],"N":["Nhạy cảm cảm xúc","Dễ lo lắng, tâm trạng thay đổi. Thấp: điềm tĩnh dưới áp lực."]}},"hexaco":{"short":"Trung thực","name":"Trung thực – Khiêm tốn (HEXACO)","about":"Chiều thứ sáu của mô hình HEXACO: mức độ chân thành, công bằng, không tham và khiêm tốn. Hữu ích với vị trí giữ tiền, giữ chìa khóa.","dims":{"S":["Chân thành","Không nịnh, không giả vờ để được việc."],"F":["Công bằng","Không lợi dụng, không gian lận dù không ai biết."],"G":["Không tham","Ít bị cuốn theo tiền bạc, địa vị, đồ sang."],"M":["Khiêm tốn","Không tự cho mình hơn người hay xứng đáng đặc quyền."]},"overall":"Trung thực – Khiêm tốn"},"ennea":{"short":"Enneagram","name":"Enneagram (9 kiểu)","about":"Chín kiểu người theo động lực và nỗi sợ sâu bên trong. Kiểu cao nhất là kiểu chính, kiểu thứ hai là nét phụ.","dims":{"1":["Số 1 · Người cầu toàn","Muốn mọi thứ đúng chuẩn. Cần: tiêu chuẩn rõ, được ghi nhận sự chỉn chu."],"2":["Số 2 · Người giúp đỡ","Muốn được cần đến. Cần: lời cảm ơn, được nhắc chăm sóc bản thân."],"3":["Số 3 · Người thành đạt","Muốn thành công, được công nhận. Cần: mục tiêu, bảng thành tích."],"4":["Số 4 · Người cá tính","Muốn được là chính mình. Cần: việc có chất riêng, được hiểu."],"5":["Số 5 · Người quan sát","Muốn hiểu sâu. Cần: thông tin đầy đủ, thời gian riêng."],"6":["Số 6 · Người trung thành","Muốn an toàn. Cần: sự ổn định, quản lý đáng tin."],"7":["Số 7 · Người vui vẻ","Muốn trải nghiệm. Cần: việc đa dạng, không khí vui."],"8":["Số 8 · Người thủ lĩnh","Muốn tự chủ, mạnh mẽ. Cần: quyền quyết, nói thẳng."],"9":["Số 9 · Người hòa giải","Muốn yên ổn. Cần: môi trường hòa thuận, được hỏi ý kiến."]}},"disc":{"short":"DISC","name":"DISC (phong cách giao tiếp)","about":"Bốn kiểu hành vi trong giao tiếp. Biết kiểu của mình và của người kia để nói chuyện cho trúng.","dims":{"D":["D · Quyết đoán","Nhanh, thẳng, hướng kết quả. Nói với họ: ngắn gọn, vào việc, đưa lựa chọn."],"I":["I · Lôi cuốn","Nhiệt tình, thích giao lưu. Nói với họ: thân thiện, khen trước mọi người."],"S":["S · Kiên định","Điềm tĩnh, chung thủy, cần ổn định. Nói với họ: báo trước thay đổi, kiên nhẫn."],"C":["C · Cẩn thận","Chính xác, theo quy trình. Nói với họ: số liệu, lý do, hướng dẫn bằng văn bản."]}},"belbin":{"short":"Vai trò nhóm","name":"Vai trò trong nhóm (kiểu Belbin)","about":"Chín vai trò một người hay đảm nhận khi làm việc nhóm. Nhóm tốt cần đủ các vai, không cần ai cũng giống nhau.","dims":{"PL":["Người sáng tạo","Nghĩ ra cách mới khi nhóm bí. Giao: món mới, giải vấn đề khó."],"RI":["Người tìm nguồn lực","Giỏi kết nối, tìm cơ hội. Giao: tìm đối tác, sự kiện, khuyến mãi."],"CO":["Người điều phối","Giao đúng việc, đúng người. Giao: xếp ca, trưởng ca."],"SH":["Người thúc đẩy","Kéo nhóm chạy nhanh. Giao: giờ cao điểm, mục tiêu gấp."],"ME":["Người đánh giá","Cân nhắc khách quan. Giao: xem xét kế hoạch, chọn nhà cung cấp."],"TW":["Người đồng đội","Giữ không khí hòa thuận. Giao: kèm người mới, hòa giải."],"IMP":["Người thực thi","Biến ý tưởng thành việc làm được. Giao: quy trình, mở/đóng quán."],"CF":["Người hoàn thiện","Bắt lỗi người khác bỏ sót. Giao: kiểm kho, kiểm chất lượng."],"SP":["Chuyên gia","Giỏi sâu một mảng. Giao: pha chế chính, bếp chính, kỹ thuật."]}},"situ":{"short":"Lãnh đạo tình huống","name":"Lãnh đạo theo tình huống","about":"Dành cho người quản lý hoặc trưởng ca. Cho biết bạn hay dẫn dắt theo kiểu nào. Người giỏi đổi kiểu theo độ sẵn sàng của từng nhân viên.","dims":{"S1":["Chỉ đạo","Chỉ rõ từng bước, kiểm tra sát. Hợp với người mới, chưa biết việc."],"S2":["Huấn luyện","Vừa chỉ vừa giải thích, động viên. Hợp với người đang học, còn lúng túng."],"S3":["Hỗ trợ","Hỏi ý kiến, khích lệ, cùng giải quyết. Hợp với người giỏi nhưng thiếu tự tin."],"S4":["Ủy quyền","Giao hẳn, ít can thiệp. Hợp với người giỏi và tự giác."]}},"goleman":{"short":"6 kiểu lãnh đạo","name":"6 phong cách lãnh đạo (Goleman)","about":"Sáu cách dẫn dắt khác nhau. Người lãnh đạo hiệu quả dùng được nhiều kiểu, nhất là Định hướng, Gắn kết, Dân chủ và Huấn luyện.","dims":{"CH":["Chỉ huy","Ra lệnh, làm ngay. Hợp lúc khủng hoảng; dùng lâu làm nhóm mất tinh thần."],"DH":["Định hướng","Vẽ mục tiêu lớn, để người khác tự chọn cách đi. Kiểu hiệu quả nhất trong đa số tình huống."],"GK":["Gắn kết","Đặt con người lên trước, giữ tinh thần nhóm. Hợp khi nhóm vừa trải qua căng thẳng."],"DC":["Dân chủ","Hỏi ý kiến cả nhóm. Hợp khi cần sự đồng thuận và ý tưởng mới."],"TD":["Dẫn đầu bằng tốc độ","Làm mẫu với chuẩn cao. Hợp với nhóm giỏi; dễ làm người khác kiệt sức."],"HL":["Huấn luyện","Giúp nhân viên phát triển lâu dài. Hợp với người muốn tiến bộ."]}},"tki":{"short":"Xử lý xung đột","name":"Cách xử lý xung đột (kiểu Thomas-Kilmann)","about":"Năm cách phản ứng khi bất đồng. Không cách nào luôn đúng; quan trọng là biết mình hay dùng cách nào và lúc nào nên đổi.","dims":{"CT":["Cạnh tranh","Bảo vệ ý mình đến cùng. Tốt khi cần quyết nhanh; dễ làm mất lòng."],"HT":["Hợp tác","Tìm cách cả hai cùng thắng. Tốt nhất cho chuyện quan trọng, nhưng tốn thời gian."],"TH":["Thỏa hiệp","Mỗi bên nhường một chút. Nhanh, công bằng, nhưng không ai thật sự hài lòng."],"NT":["Né tránh","Để vấn đề lắng xuống. Tốt với chuyện nhỏ; chuyện lớn sẽ tích tụ."],"NB":["Nhượng bộ","Chiều theo người khác để giữ quan hệ. Tốt khi mình sai; dùng nhiều sẽ bị thiệt."]}},"strengths":{"short":"Thế mạnh","name":"Bốn nhóm thế mạnh","about":"Dựa trên bốn nhóm thế mạnh mà Gallup dùng. Cho biết bạn tạo giá trị chủ yếu bằng cách nào.","dims":{"TT":["Thực thi","Làm cho việc xong, đúng hạn, đúng chuẩn. Là xương sống của ca làm."],"AH":["Ảnh hưởng","Thuyết phục, khởi xướng, kéo người khác theo. Hợp bán hàng, dẫn nhóm."],"QH":["Xây dựng quan hệ","Gắn kết mọi người, hiểu cảm xúc. Hợp chăm sóc khách, kèm người mới."],"CL":["Tư duy chiến lược","Phân tích, nhìn xa, nghĩ ý tưởng. Hợp lên kế hoạch, cải tiến."]}},"via":{"short":"Phẩm chất","name":"Phẩm chất nổi bật (kiểu VIA)","about":"Sáu nhóm phẩm chất tốt mà khoa học tâm lý tích cực dùng. Phẩm chất cao nhất là thứ bạn nên dùng nhiều nhất mỗi ngày.","dims":{"TR":["Trí tuệ","Tò mò, ham học, hay được hỏi lời khuyên."],"DG":["Dũng cảm","Dám nói điều đúng, kiên trì đến cùng."],"NA":["Nhân ái","Tử tế, biết yêu thương, giữ quan hệ thân thiết."],"CB":["Công bằng","Đối xử công bằng, là thành viên đáng tin của nhóm."],"TĐ":["Tiết độ","Biết tha thứ, tự kiểm soát, không bốc đồng."],"SV":["Hướng thượng","Biết ơn, lạc quan, thấy ý nghĩa trong việc mình làm."]}},"eq":{"short":"EQ","name":"Trí tuệ cảm xúc (EQ)","about":"Bốn kỹ năng cảm xúc theo mô hình của Goleman. EQ học được và luyện được, khác với tính cách.","dims":{"SA":["Tự nhận thức","Biết mình đang cảm thấy gì và vì sao."],"SM":["Tự quản lý","Giữ bình tĩnh, không để cảm xúc làm hỏng việc."],"SO":["Nhận thức xã hội","Đọc được cảm xúc của khách và đồng nghiệp."],"RM":["Quản lý quan hệ","Góp ý khéo, hòa giải, làm việc nhóm tốt."]},"overall":"EQ chung"},"grit":{"short":"Bền bỉ","name":"Độ bền bỉ (Grit)","about":"Đam mê và kiên trì với mục tiêu dài hạn, dựa trên nghiên cứu của Angela Duckworth. Hữu ích để biết ai sẽ gắn bó và theo được việc khó.","dims":{"PA":["Đam mê bền","Giữ một mục tiêu lâu dài, không dễ đổi hướng."],"PE":["Kiên trì","Không bỏ cuộc khi gặp khó, làm đến xong."]},"overall":"Grit chung"},"appr":{"short":"Ghi nhận","name":"5 ngôn ngữ ghi nhận ở nơi làm việc","about":"Mỗi người cảm thấy được trân trọng theo một cách khác nhau. Khen sai cách thì người nhận không thấy được khen.","dims":{"LK":["Lời khen","Khen cụ thể, nhắn tin cảm ơn, khen trước nhóm nếu họ thích."],"TG":["Thời gian riêng","Ngồi nói chuyện riêng, hỏi ý kiến, ăn cùng nhóm."],"GD":["Giúp một tay","Phụ họ lúc đông, xắn tay làm cùng, cho thêm công cụ."],"QU":["Quà nhỏ","Thưởng, phiếu quà, đồ uống, món quà hiểu ý họ."],"TX":["Thân thiện","Đập tay, vỗ vai, bắt tay chúc mừng, không khí vui."]}},"riasec":{"short":"Sở thích nghề","name":"Sở thích nghề nghiệp (Holland RIASEC)","about":"Sáu nhóm sở thích nghề. Ba chữ cao nhất tạo thành mã Holland của bạn, giúp xếp người vào đúng vị trí.","dims":{"R":["R · Kỹ thuật","Thích làm bằng tay, máy móc. Hợp: bếp, pha chế, bảo trì."],"I":["I · Nghiên cứu","Thích tìm hiểu, phân tích. Hợp: công thức, kiểm soát chất lượng, số liệu."],"A":["A · Nghệ thuật","Thích sáng tạo, trình bày. Hợp: món mới, trang trí, nội dung mạng xã hội."],"S":["S · Xã hội","Thích phục vụ, giúp người. Hợp: phục vụ, chăm sóc khách, đào tạo."],"E":["E · Kinh doanh","Thích bán, dẫn dắt. Hợp: quản lý ca, bán hàng, sự kiện."],"C":["C · Nghiệp vụ","Thích trật tự, con số. Hợp: thu ngân, kho, sổ sách."]}}},"en":{"mbti":{"short":"16 Types","name":"16 Personality Types","about":"Where you get your energy, how you take in information, how you make decisions, and whether you prefer to work with a plan or stay flexible.","dims":{"E":["Extraversion (E) – Introversion (I)"],"S":["Sensing (S) – Intuition (N)"],"T":["Thinking (T) – Feeling (F)"],"J":["Judging (J) – Perceiving (P)"]}},"big5":{"short":"Big Five","name":"Big Five (OCEAN)","about":"The five most widely researched personality traits. Each one is a scale, with no right or wrong answer.","dims":{"O":["Openness","Likes new things, creative, curious. Low: prefers familiar, practical ways of doing things."],"C":["Conscientiousness","Prepares well and follows through. This is the trait that best predicts job performance."],"E":["Extraversion","Energetic and sociable. Low: quiet, does well at work that needs focus."],"A":["Agreeableness","Caring, cooperative, happy to help. Low: blunt, competitive."],"N":["Emotional Sensitivity","Worries easily, moods shift. Low: stays calm under pressure."]}},"hexaco":{"short":"Honesty","name":"Honesty–Humility (HEXACO)","about":"The sixth trait in the HEXACO model: how sincere, fair, modest and free of greed someone is. Useful for roles that handle cash or hold the keys.","dims":{"S":["Sincerity","Doesn't flatter or fake things to get what they want."],"F":["Fairness","Doesn't take advantage or cheat, even when no one would know."],"G":["Greed Avoidance","Not easily driven by money, status or luxury."],"M":["Modesty","Doesn't see themselves as better than others or entitled to special treatment."]},"overall":"Honesty–Humility"},"ennea":{"short":"Enneagram","name":"Enneagram (9 types)","about":"Nine types of people based on their deepest motivations and fears. Your highest score is your main type; the second highest is a secondary trait.","dims":{"1":["Type 1 · The Perfectionist","Wants things done right. Needs: clear standards, recognition for careful work."],"2":["Type 2 · The Helper","Wants to be needed. Needs: thanks, and reminders to take care of themselves."],"3":["Type 3 · The Achiever","Wants success and recognition. Needs: goals, a scoreboard."],"4":["Type 4 · The Individualist","Wants to be true to themselves. Needs: work with a personal touch, to be understood."],"5":["Type 5 · The Observer","Wants to understand deeply. Needs: complete information, time alone."],"6":["Type 6 · The Loyalist","Wants to feel safe. Needs: stability, a manager they can trust."],"7":["Type 7 · The Enthusiast","Wants new experiences. Needs: variety, a fun atmosphere."],"8":["Type 8 · The Challenger","Wants independence and strength. Needs: authority to decide, straight talk."],"9":["Type 9 · The Peacemaker","Wants peace. Needs: a harmonious workplace, to be asked for their opinion."]}},"disc":{"short":"DISC","name":"DISC (communication style)","about":"Four styles of behavior when communicating. Know your style and the other person's so your message lands.","dims":{"D":["D · Dominance","Fast, direct, results-focused. With them: keep it short, get to the point, give options."],"I":["I · Influence","Enthusiastic and social. With them: be friendly, praise them in front of others."],"S":["S · Steadiness","Calm, loyal, needs stability. With them: give advance notice of changes, be patient."],"C":["C · Conscientiousness","Precise, follows procedures. With them: use numbers, reasons, written instructions."]}},"belbin":{"short":"Team Roles","name":"Team Roles (Belbin-style)","about":"Nine roles people tend to take on in a team. A good team needs all the roles, not everyone being the same.","dims":{"PL":["Plant","Comes up with new ideas when the team is stuck. Give them: new menu items, tough problems."],"RI":["Resource Investigator","Great at networking and spotting opportunities. Give them: finding partners, events, promotions."],"CO":["Coordinator","Matches the right task to the right person. Give them: scheduling shifts, shift lead."],"SH":["Shaper","Pushes the team to move fast. Give them: rush hours, urgent targets."],"ME":["Monitor Evaluator","Weighs things objectively. Give them: reviewing plans, choosing suppliers."],"TW":["Teamworker","Keeps the team getting along. Give them: mentoring new hires, smoothing conflicts."],"IMP":["Implementer","Turns ideas into workable tasks. Give them: procedures, opening/closing the shop."],"CF":["Completer Finisher","Catches mistakes others miss. Give them: inventory checks, quality checks."],"SP":["Specialist","Deep expertise in one area. Give them: head barista, head cook, technical work."]}},"situ":{"short":"Situational Lead","name":"Situational Leadership","about":"For managers and shift leads. Shows which leadership style you tend to use. Good leaders switch styles based on how ready each team member is.","dims":{"S1":["Directing","Spells out every step and checks closely. Best for new people who don't know the job yet."],"S2":["Coaching","Shows how, explains why, and encourages. Best for people still learning and unsure."],"S3":["Supporting","Asks for input, encourages, solves problems together. Best for skilled people who lack confidence."],"S4":["Delegating","Hands the work over and steps back. Best for skilled, self-motivated people."]}},"goleman":{"short":"6 Lead Styles","name":"6 Leadership Styles (Goleman)","about":"Six different ways to lead. Effective leaders can use many styles, especially Visionary, Affiliative, Democratic and Coaching.","dims":{"CH":["Commanding","Gives orders to be followed right away. Good in a crisis; used for too long, it kills team morale."],"DH":["Visionary","Sets the big goal and lets people choose how to get there. The most effective style in most situations."],"GK":["Affiliative","Puts people first and keeps team spirit up. Good after the team has been through a stressful time."],"DC":["Democratic","Asks the whole team for input. Good when you need buy-in and fresh ideas."],"TD":["Pacesetting","Leads by example with high standards. Works with a strong team; can easily burn people out."],"HL":["Coaching","Helps people grow over the long term. Good for people who want to improve."]}},"tki":{"short":"Conflict Styles","name":"Conflict Styles (Thomas-Kilmann style)","about":"Five ways people respond to disagreement. No style is always right; what matters is knowing which one you use most and when to switch.","dims":{"CT":["Competing","Stands their ground to the end. Good when a quick decision is needed; can easily upset people."],"HT":["Collaborating","Looks for a win-win. Best for important issues, but takes time."],"TH":["Compromising","Each side gives a little. Fast and fair, but no one is fully satisfied."],"NT":["Avoiding","Lets the issue cool down. Fine for small things; big issues will pile up."],"NB":["Accommodating","Goes along with others to keep the relationship. Good when you're wrong; overused, you lose out."]}},"strengths":{"short":"Strengths","name":"Four Strength Domains","about":"Based on the four strength domains Gallup uses. Shows the main way you add value.","dims":{"TT":["Executing","Gets things done, on time and to standard. The backbone of every shift."],"AH":["Influencing","Persuades, takes the lead, gets others on board. Good for sales and leading a team."],"QH":["Relationship Building","Brings people together, understands feelings. Good for customer care and mentoring new hires."],"CL":["Strategic Thinking","Analyzes, looks ahead, comes up with ideas. Good for planning and improving things."]}},"via":{"short":"Character","name":"Character Strengths (VIA-style)","about":"Six groups of positive traits used in positive psychology. Your top strength is the one you should use most every day.","dims":{"TR":["Wisdom","Curious, loves learning, often asked for advice."],"DG":["Courage","Speaks up for what's right, sticks with it to the end."],"NA":["Humanity","Kind, caring, keeps close relationships."],"CB":["Justice","Treats people fairly, a trusted member of the team."],"TĐ":["Temperance","Forgiving, self-controlled, not impulsive."],"SV":["Transcendence","Grateful, optimistic, finds meaning in their work."]}},"eq":{"short":"EQ","name":"Emotional Intelligence (EQ)","about":"Four emotional skills from Goleman's model. Unlike personality, EQ can be learned and practiced.","dims":{"SA":["Self-Awareness","Knows what they're feeling and why."],"SM":["Self-Management","Stays calm, doesn't let emotions get in the way of work."],"SO":["Social Awareness","Reads the feelings of customers and coworkers."],"RM":["Relationship Management","Gives feedback tactfully, resolves conflicts, works well in a team."]},"overall":"Overall EQ"},"grit":{"short":"Grit","name":"Grit","about":"Passion and perseverance for long-term goals, based on Angela Duckworth's research. Useful for knowing who will stick around and see hard work through.","dims":{"PA":["Lasting Passion","Sticks with one long-term goal, doesn't change direction easily."],"PE":["Perseverance","Doesn't give up when things get hard, finishes what they start."]},"overall":"Overall Grit"},"appr":{"short":"Appreciation","name":"5 Languages of Appreciation at Work","about":"Everyone feels appreciated in a different way. Praise them the wrong way and they won't feel praised at all.","dims":{"LK":["Words of Affirmation","Specific praise, thank-you texts, praise in front of the team if they like that."],"TG":["Quality Time","One-on-one chats, asking for their input, team meals."],"GD":["Acts of Service","Help them out when it's busy, roll up your sleeves and pitch in, get them better tools."],"QU":["Tangible Gifts","Bonuses, gift cards, drinks, a small gift that shows you know them."],"TX":["Friendly Touch","High-fives, a pat on the back, a congratulatory handshake, a fun vibe."]}},"riasec":{"short":"Career Interests","name":"Career Interests (Holland RIASEC)","about":"Six groups of career interests. Your top three letters make up your Holland code, which helps put people in the right role.","dims":{"R":["R · Realistic","Likes hands-on work and machines. Fits: kitchen, bar, maintenance."],"I":["I · Investigative","Likes figuring things out and analyzing. Fits: recipes, quality control, numbers."],"A":["A · Artistic","Likes creating and presenting. Fits: new menu items, decor, social media content."],"S":["S · Social","Likes serving and helping people. Fits: serving, customer care, training."],"E":["E · Enterprising","Likes selling and leading. Fits: shift management, sales, events."],"C":["C · Conventional","Likes order and numbers. Fits: cashier, inventory, bookkeeping."]}}}};

ổi.","S"],["Tôi kiên nhẫn và biết lắng nghe.","S"],["Tôi giúp đồng đội một cách lặng lẽ.","S"],["Tôi cần thời gian để quen với thay đổi.","S"],["Tôi kiểm tra kỹ chi tiết trước khi xong việc.","C"],["Tôi thích làm theo quy trình rõ ràng.","C"],["Tôi cần dữ liệu và lý do trước khi quyết định.","C"],["Tôi khó chịu khi việc làm cẩu thả.","C"],["Tôi thích được giao trách nhiệm và tự quyết.","D"],["Khi có sự cố, tôi xử lý ngay thay vì chờ.","D"],["Tôi không ngại tranh luận để bảo vệ quan điểm của mình.","D"],["Tôi thích mục tiêu khó và kết quả rõ ràng.","D"],["Tôi sốt ruột khi mọi việc diễn ra quá chậm.","D"],["Khi nhóm lúng túng, tôi thường là người đứng ra cầm trịch.","D"],["Tôi dễ bắt chuyện với khách lạ.","I"],["Tôi thích làm việc cùng mọi người hơn làm một mình.","I"],["Tôi hay kể chuyện vui để cả nhóm cười.","I"],["Tôi lạc quan, thường nhìn mặt tích cực của vấn đề.","I"],["Tôi thích những ca đông vui, nhiều người qua lại.","I"],["Tôi hay rủ đồng nghiệp đi ăn uống sau giờ làm.","I"],["Tôi thích làm việc lâu dài với một nhóm quen thuộc.","S"],["Tôi giữ được bình tĩnh khi gặp khách khó tính.","S"],["Tôi làm việc đều tay, ổn định từ đầu đến cuối ca.","S"],["Tôi thích biết trước lịch làm để sắp xếp cuộc sống.","S"],["Tôi sẵn lòng nhận thêm việc để đồng đội đỡ vất vả.","S"],["Tôi ngại làm mất lòng người khác.","S"],["Tôi thích có hướng dẫn bằng văn bản rõ ràng.","C"],["Tôi đo, cân, đếm cẩn thận để mọi thứ chính xác.","C"],["Tôi đặt nhiều câu hỏi để hiểu đúng yêu cầu.","C"],["Tôi thích làm một việc thật đúng hơn làm nhiều việc vội vàng.","C"],["Tôi để ý những lỗi nhỏ mà người khác bỏ qua.","C"],["Tôi suy nghĩ kỹ và lên kế hoạch trước khi bắt tay vào làm.","C"]],"belbin":[["Tôi hay nghĩ ra cách làm mới khi nhóm bị bí.","PL"],["Tôi thích giải những vấn đề khó, không theo lối mòn.","PL"],["Tôi giỏi tìm người, tìm mối, tìm cơ hội bên ngoài.","RI"],["Tôi nhiệt tình nhất lúc khởi đầu một việc mới.","RI"],["Tôi giỏi giao đúng việc cho đúng người.","CO"],["Tôi giúp nhóm thống nhất   T().forEach(t=>{const r=tests[t.id];if(!r)return;
    const keys=t.kind==="profile"||t.kind==="mbti"?Object.keys(t.dims):Object.keys(t.dims).sort((a,b)=>(r.sc[b]||0)-(r.sc[a]||0));
    h+=`<h4>${esc(t.name)}: <span style="color:var(--jade)">${esc(r.s)}</span></h4>`+keys.map(d=>`<div class="bar"><div class="lab"><span style="font-weight:500">${esc(t.dims[d][0])}</span><em>${r.sc[d]??0}%</em></div><div class="track"><div class="fill" style="width:${r.sc[d]??0}%"></div></div></div>`).join("");
  });
  if(!Object.keys(tests).length)h+=`<p>${S.none}</p>`;
  box.innerHTML=h+`</div>`;box.scrollIntoView({behavior:"smooth",block:"start"});
}
function tables(){
  const V=TT.vi,day=ts=>ts?new Date(ts).toLocaleDateString("vi-VN"):"",list=allPeople();
  const sum=[["Tên","Nguồn","Cập nhật","Đã làm",...V.map(t=>t.name)]],det=[["Tên","Nguồn","Bài","Kết quả","Chiều đo","Điểm (%)"]];
  list.forEach(p=>{const tests=p.tests||{};
    sum.push([p.name||"",p.src,day(p.updatedAt),Object.keys(tests).length+"/"+V.length,...V.map(t=>tests[t.id]?tests[t.id].s:"")]);
    V.forEach(t=>{const r=tests[t.id];if(r)Object.keys(t.dims).forEach(d=>det.push([p.name||"",p.src,t.name,r.s,t.dims[d][0],r.sc[d]??0]))})});
  return {sum,det,count:list.length};
}
async function downloadCsv(){
  const q=s=>'"'+String(s??"").replace(/"/g,'""')+'"';const {sum}=tables();
  try{const dl=await claude.use("downloads");if(!dl)throw 0;await dl.save({filename:"ho-so-nhan-su.csv",data:new Blob(["﻿"+sum.map(r=>r.map(q).join(",")).join("\n")],{type:"text/csv"})})}catch(e){}
}
async function syncSheet(){
  const S=t$(),msg=$("#syncmsg"),btn=$("#sync");const say=(t,g)=>{msg.textContent=t;msg.className="status"+(g?" good":"")};
  const {sum,det,count}=tables();if(!count){say(S.empty);return}
  btn.disabled=true;say(S.saving);
  try{
    const mcp=await claude.use("mcp");if(!mcp)throw{code:"unavailable"};
    await mcp.callTool("Google Sheets","batch_clear_values",{spreadsheetId:SHEET_ID,ranges:["Tong hop!A1:Z2000","Chi tiet!A1:G20000"]});
    await mcp.callTool("Google Sheets","update_values",{spreadsheetId:SHEET_ID,range:"Tong hop!A1",values:sum});
    await mcp.callTool("Google Sheets","update_values",{spreadsheetId:SHEET_ID,range:"Chi tiet!A1",values:det});
    msg.className="status good";msg.innerHTML=`✓ ${count} · <a href="${SHEET_URL}" target="_blank" rel="noopener" style="color:var(--jade)">Google Sheet</a>`;
  }catch(e){const c=e&&e.code;
    say(c==="server_not_connected"||c==="needs_reauth"?"Google Sheets: Settings → Connectors":"Google Sheets: "+(e&&e.message||c||"error"));
  }finally{btn.disabled=false}
}

document.addEventListener("click",e=>{
  const lg=e.target.closest("[data-lang]");if(lg){lang=lg.dataset.lang;ls.set("hs_lang",lang);render();return}
  const tab=e.target.closest("[data-tab]");
  if(tab){cur=tab.dataset.tab;ls.set("hs_tab",cur);openPerson=null;render();window.scrollTo({top:0});return}
  const o=e.target.closest(".opt");
  if(o){const t=T().find(x=>x.id===cur);const q=+o.dataset.q,v=+o.dataset.v;(answers[t.id]=answers[t.id]||{})[q]=v;ls.set("hs2_ans",answers);
    o.parentNode.querySelectorAll(".opt").forEach(b=>b.classList.toggle("on",b===o));$("#q"+q).classList.remove("miss");$("#err").textContent="";
    $("#cnt").textContent=fmt(t$().answered,{a:Object.keys(answers[t.id]).length,n:t.items.length});return}
  if(e.target.id==="submit"){const S=t$(),t=T().find(x=>x.id===cur),a=answers[t.id]||{};
    if(!$("#pname").value.trim()){$("#err").textContent=S.needName;$("#pname").focus();return}
    const miss=t.items.map((_,i)=>i).filter(i=>!a[i]);
    if(miss.length){miss.forEach(i=>$("#q"+i).classList.add("miss"));$("#err").textContent=fmt(S.missing,{n:miss.length});$("#q"+miss[0]).scrollIntoView({behavior:"smooth",block:"center"});return}
    done[t.id]=1;ls.set("hs2_done",done);chips();showResult(t,true);$("#res").scrollIntoView({behavior:"smooth",block:"start"});return}
  if(e.target.id==="copy"){copyText();return}
  if(e.target.id==="csv"){downloadCsv();return}
  if(e.target.id==="sync"){syncSheet();return}
  const pr=e.target.closest("[data-person]");if(pr)showPerson(pr.dataset.person);
});
document.addEventListener("input",e=>{
  if(e.target.id==="pname")ls.set("hs_who",{n:$("#pname").value});
  if(e.target.id==="filter"){ls.set("hs_filter",e.target.value);const pos=e.target.selectionStart;renderResults();const f=$("#filter");f.focus();f.setSelectionRange(pos,pos)}
});
$("#pname").addEventListener("change",()=>{
  const w=ls.get("hs_lastname",""),n=$("#pname").value.trim();
  if(w&&n&&w!==n){answers={};done={};ls.set("hs2_ans",answers);ls.set("hs2_done",done);render()}
  ls.set("hs_lastname",n);
});
$("#pname").value=(ls.get("hs_who",{})||{}).n||"";
render();

if(window.claude&&window.claude.use)(async()=>{
  try{
    [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(user){isOwn=await user.isOwner().catch(()=>false);isAdmin=isOwn||await user.canEdit().catch(()=>false)}
    if(db){
      if(isAdmin)mode="admin";
      else{uid=user?await user.id().catch(()=>null):null;const cw=user?await user.can("data.write").catch(()=>null):null;mode=uid&&cw!==false?"self":"none"}
    }
    if(db&&isAdmin){
      db.collection("people").onSnapshot(s=>{people={};s.docs.forEach(d=>people[d.id]=d.data());if(cur==="results")renderResults()},()=>{});
      if(isOwn)db.collection("subs").onSnapshot(s=>{subs={};s.docs.forEach(d=>subs[d.id]=d.data());if(cur==="results")renderResults()},()=>{});
    }
    if(!isAdmin&&cur==="results")cur="mbti";
    render();
  }catch(e){}
})();
</script>
