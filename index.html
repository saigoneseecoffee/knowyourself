est when you need a quick deal and both sides have a point, like shift swaps: each person takes half the weekend shifts."},"NT":{"hi":"You let small things go and give people time to cool off. Risk: avoiding big issues lets them build up and blow up later.","lo":"You rarely step back and may turn small things into big ones.","tip":"Works best mid-rush when two people are heated: park it and agree to talk after the shift. Then actually follow up."},"NB":{"hi":"You are willing to give way to keep the relationship, especially when you are wrong. Risk: giving in too often means your needs get ignored and resentment builds.","lo":"You rarely give way and may seem stubborn even about small things.","tip":"Works best when a guest complains about something minor or you realize you were wrong: own it, fix it fast, keep the goodwill."}}}},"strengths":{"vi":{"how":"Nhóm điểm cao nhất cho thấy cách bạn tạo giá trị tự nhiên nhất; điểm thấp không phải điểm yếu, chỉ là cách bạn ít dùng. Dùng kết quả để giao việc hợp thế mạnh và ghép cặp bổ sung cho nhau.","dims":{"TT":{"hi":"Bạn làm việc chăm chỉ, đúng hạn, đúng chuẩn và mọi người tin cậy được. Rủi ro: ôm việc quá nhiều hoặc chỉ lo làm xong mà quên hỏi làm vậy có cần không.","lo":"Bạn ít dựa vào việc tự tay làm cho xong, thường tạo giá trị qua con người hoặc ý tưởng.","tip":"Giao việc chuẩn bị nguyên liệu, mở/đóng quán, kiểm kho, giữ đúng thời gian ra món lúc đông khách."},"AH":{"hi":"Bạn tự tin, nói chuyện thuyết phục và dễ kéo người khác theo. Rủi ro: lấn át người ít nói hoặc thúc ép khách quá mức.","lo":"Bạn ít khi đứng ra thuyết phục hay dẫn đầu, thường để người khác lên tiếng trước.","tip":"Giao việc giới thiệu món mới, gợi ý thêm món cho khách, quay video mạng xã hội, hoặc dẫn buổi họp đầu ca."},"QH":{"hi":"Bạn hiểu cảm xúc người khác, tạo sự tin tưởng và giữ nhóm gắn bó. Rủi ro: ôm cảm xúc của người khác, ngại nói điều khó nghe.","lo":"Bạn ít tập trung vào việc xây quan hệ, thường tạo giá trị qua công việc hoặc ý tưởng.","tip":"Giao việc chăm sóc khách quen, xử lý khách không hài lòng, kèm người mới, hoặc giữ tinh thần nhóm sau ca khó."},"CL":{"hi":"Bạn phân tích tốt, nhìn xa và hay nghĩ ra cách làm tốt hơn. Rủi ro: nghĩ nhiều mà làm chậm, hoặc chê ý tưởng trước khi thử.","lo":"Bạn ít dành thời gian phân tích hay lên kế hoạch dài, thường tập trung vào việc trước mắt.","tip":"Giao việc xem số liệu bán hàng, đề xuất cải tiến quy trình, lên kế hoạch khuyến mãi, hoặc góp ý món theo mùa."}}},"en":{"how":"Your highest domain shows the way you most naturally add value; a low score is not a weakness, just a way you use less. Use it to match tasks to strengths and pair people who complement each other.","dims":{"TT":{"hi":"You work hard, on time and to standard, and people can count on you. Risk: taking on too much, or focusing on finishing without asking if it is needed.","lo":"You rely less on getting tasks done yourself and tend to add value through people or ideas.","tip":"Give them prep, opening/closing, inventory, and keeping ticket times on track during rushes."},"AH":{"hi":"You are confident, persuasive, and get others on board. Risk: talking over quieter people or pushing guests too hard.","lo":"You rarely step up to persuade or lead and tend to let others speak first.","tip":"Give them introducing new items, suggesting add-ons to guests, filming social media videos, or running the pre-shift huddle."},"QH":{"hi":"You read people's feelings, build trust, and hold the team together. Risk: carrying others' emotions and avoiding hard conversations.","lo":"You focus less on building relationships and tend to add value through tasks or ideas.","tip":"Give them regulars, unhappy guests, mentoring new hires, or lifting team spirit after a tough shift."},"CL":{"hi":"You analyze well, look ahead, and think of better ways to do things. Risk: overthinking and acting slowly, or dismissing ideas before trying them.","lo":"You spend less time on analysis or long-term plans and tend to focus on what is in front of you.","tip":"Give them sales numbers to review, process improvements, promo planning, or input on seasonal items."}}}},"via":{"vi":{"how":"Nhóm phẩm chất có điểm cao nhất là thế mạnh tự nhiên của bạn. Hãy tìm cách dùng nó mỗi ca làm; điểm thấp không phải điểm yếu, chỉ là phẩm chất bạn ít dùng hơn.","dims":{"TR":{"hi":"Bạn tò mò, học nhanh và hay nghĩ ra cách làm tốt hơn; đồng nghiệp hay hỏi ý bạn. Rủi ro: nghĩ nhiều, góp ý dài khi ca đang bận.","lo":"Bạn thích làm theo cách đã quen và ít khi tự đi tìm cái mới để học.","tip":"Mỗi tuần học một điều mới về món hoặc đồ uống (một loại hạt cà phê, một công thức) và chia sẻ ngắn với nhóm."},"DG":{"hi":"Bạn dám nói thẳng khi thấy sai và theo việc khó đến cùng. Rủi ro: nói quá thẳng, làm người khác thấy bị chê.","lo":"Bạn thường chọn im lặng hoặc nhường người khác lên tiếng khi có chuyện khó.","tip":"Lần tới thấy một việc chưa ổn (vệ sinh, quy trình), hãy nói với quản lý ca kèm một gợi ý sửa cụ thể."},"NA":{"hi":"Bạn tử tế, quan tâm khách và đồng nghiệp, tạo không khí ấm áp. Rủi ro: ôm việc giúp người khác đến mức kiệt sức.","lo":"Bạn tập trung vào công việc nhiều hơn là chăm chút quan hệ với mọi người.","tip":"Mỗi ca, chủ động hỏi thăm một đồng nghiệp hoặc nhớ tên, món quen của một khách quen."},"CB":{"hi":"Bạn công bằng, giữ lời và là người nhóm tin cậy. Rủi ro: khó chịu khi quy tắc bị linh động, dù có lý do chính đáng.","lo":"Bạn ít để ý đến chuyện chia việc, chia công có đều hay không.","tip":"Khi chia việc dọn dẹp hay nhận tip chung, hãy đề xuất một cách chia rõ ràng để cả nhóm cùng thấy hợp lý."},"TĐ":{"hi":"Bạn bình tĩnh, biết tha thứ và kiểm soát được bản thân, ít khi bốc đồng. Rủi ro: quá dè dặt, chậm ra quyết định khi cần nhanh.","lo":"Bạn phản ứng nhanh theo cảm xúc và đôi khi làm trước nghĩ sau.","tip":"Khi bực với khách hoặc đồng nghiệp, hít sâu ba hơi và đếm đến năm trước khi trả lời."},"SV":{"hi":"Bạn biết ơn, lạc quan và thấy ý nghĩa trong việc phục vụ, giúp cả nhóm có tinh thần. Rủi ro: dễ bỏ qua vấn đề thật vì muốn nhìn mặt tích cực.","lo":"Bạn nhìn công việc thực tế, chủ yếu là việc cần làm hơn là ý nghĩa đằng sau.","tip":"Cuối mỗi ca, ghi lại một khoảnh khắc tốt (một khách cảm ơn, một ly làm đẹp) để thấy giá trị việc mình làm."}}},"en":{"how":"Your highest group is your natural strength. Look for ways to use it every shift; a low score is not a weakness, just a strength you use less often.","dims":{"TR":{"hi":"You are curious, learn fast and spot better ways of doing things; coworkers ask your opinion. Risk: overthinking or giving long input when the shift is busy.","lo":"You prefer familiar ways of working and rarely go looking for new things to learn.","tip":"Learn one new thing about the menu each week (a coffee bean, a recipe) and share it briefly with the team."},"DG":{"hi":"You speak up when something is wrong and see hard tasks through. Risk: being so blunt that others feel criticized.","lo":"You usually stay quiet or let others speak up when things get difficult.","tip":"Next time something isn't right (cleanliness, a process), tell the shift lead along with one concrete fix."},"NA":{"hi":"You are kind, care about guests and coworkers, and create a warm vibe. Risk: taking on so much for others that you burn out.","lo":"You focus more on the work itself than on building relationships.","tip":"Each shift, check in with one coworker, or remember a regular's name and usual order."},"CB":{"hi":"You are fair, keep your word, and the team trusts you. Risk: getting frustrated when rules bend, even for good reasons.","lo":"You pay less attention to whether work and credit are shared evenly.","tip":"When splitting closing duties or shared tips, suggest a clear system so everyone sees it as fair."},"TĐ":{"hi":"You are calm, forgiving and self-controlled, rarely impulsive. Risk: being too cautious and slow to decide when speed matters.","lo":"You react quickly on feeling and sometimes act before thinking.","tip":"When a guest or coworker annoys you, take three deep breaths and count to five before you answer."},"SV":{"hi":"You are grateful, optimistic and find meaning in serving people, which lifts team spirit. Risk: glossing over real problems to stay positive.","lo":"You see work practically, mostly as tasks to get done rather than something with deeper meaning.","tip":"At the end of each shift, note one good moment (a guest's thanks, a drink you nailed) to see the value of your work."}}}},"eq":{"vi":{"how":"Mỗi kỹ năng cho biết bạn đang dùng cảm xúc tốt đến đâu khi làm việc với khách và đồng nghiệp. EQ luyện được, nên hãy chọn kỹ năng thấp nhất để tập trước.","dims":{"SA":{"hi":"Bạn biết rõ mình đang vui, mệt hay căng thẳng và vì sao, nên ít bị cảm xúc dắt đi. Rủi ro: hiểu mình nhưng chưa chắc đã nói ra hay xử lý.","lo":"Bạn thường chỉ nhận ra cảm xúc của mình sau khi nó đã ảnh hưởng đến việc làm.","tip":"Giữa ca, tự hỏi nhanh: \"Mình đang cảm thấy gì, mức 1 đến 10?\" và đặt tên cho cảm xúc đó."},"SM":{"hi":"Bạn giữ bình tĩnh khi quán đông hay khách khó tính, làm việc đều tay. Rủi ro: nén cảm xúc quá lâu rồi mệt mỏi.","lo":"Khi áp lực, cảm xúc của bạn dễ lộ ra qua lời nói hoặc cách làm việc.","tip":"Chọn một câu \"nút dừng\" như \"Để em kiểm tra lại cho anh/chị\" để có vài giây bình tĩnh trước khi xử lý."},"SO":{"hi":"Bạn đọc được tâm trạng khách và đồng nghiệp qua nét mặt, giọng nói. Rủi ro: để tâm trạng người khác ảnh hưởng mình quá nhiều.","lo":"Bạn tập trung vào việc trước mắt và đôi khi không để ý người khác đang khó chịu hay vội.","tip":"Khi khách bước vào, quan sát ba giây: họ đang vội, đang thư giãn hay đang bực? Rồi điều chỉnh cách chào."},"RM":{"hi":"Bạn góp ý khéo, hòa giải tốt và giúp nhóm làm việc ăn ý. Rủi ro: né va chạm, ngại nói điều khó nghe.","lo":"Bạn thấy khó khi phải góp ý hoặc gỡ rối mâu thuẫn trong nhóm.","tip":"Khi góp ý, dùng công thức: khen một điều cụ thể, nêu một điều cần sửa, rồi cùng đề xuất cách làm."}}},"en":{"how":"Each skill shows how well you use emotions when working with guests and coworkers. EQ can be trained, so start practicing your lowest skill first.","dims":{"SA":{"hi":"You know when you're happy, tired or stressed and why, so emotions rarely steer you. Risk: understanding yourself but not acting on it or saying it.","lo":"You tend to notice your feelings only after they have already affected your work.","tip":"Mid-shift, ask yourself: \"What am I feeling, 1 to 10?\" and give the feeling a name."},"SM":{"hi":"You stay calm during rushes and with difficult guests, and keep a steady pace. Risk: holding feelings in too long and wearing yourself out.","lo":"Under pressure, your feelings tend to show in your words or the way you work.","tip":"Pick a \"pause line\" like \"Let me double-check that for you\" to buy a few calm seconds before you respond."},"SO":{"hi":"You read guests' and coworkers' moods from faces and tone. Risk: letting other people's moods affect you too much.","lo":"You focus on the task in front of you and sometimes miss that someone is upset or in a hurry.","tip":"When a guest walks in, watch for three seconds: rushed, relaxed or annoyed? Then adjust your greeting."},"RM":{"hi":"You give feedback tactfully, smooth over conflicts and help the team click. Risk: avoiding conflict and holding back hard truths.","lo":"Giving feedback or sorting out team conflicts feels hard for you.","tip":"When giving feedback: praise one specific thing, name one thing to fix, then agree on how to do it together."}}}},"grit":{"vi":{"how":"Grit gồm đam mê bền (giữ một hướng lâu dài) và kiên trì (không bỏ cuộc khi khó). Điểm này giúp biết bạn hợp với việc cần gắn bó lâu, như học pha chế hay lên vị trí quản lý.","dims":{"PA":{"hi":"Bạn giữ một mục tiêu lâu dài và không dễ đổi hướng, như theo nghề pha chế nhiều năm. Rủi ro: bám mục tiêu cũ dù hoàn cảnh đã đổi.","lo":"Bạn thích thử nhiều thứ và hứng thú dễ chuyển sang điều mới.","tip":"Viết ra một mục tiêu 6 tháng ở quán (ví dụ: làm được latte art, lên trưởng ca) và xem lại mỗi tháng."},"PE":{"hi":"Bạn không bỏ cuộc khi gặp khó, làm việc đến xong dù ca dài hay việc lặp lại. Rủi ro: cố quá sức, ngại xin giúp.","lo":"Khi việc khó hoặc kéo dài, bạn dễ nản và muốn chuyển sang việc khác.","tip":"Chia việc khó thành bước nhỏ (ví dụ học 5 món mỗi tuần) và đánh dấu từng bước đã xong."}}},"en":{"how":"Grit combines lasting passion (keeping one direction long-term) and perseverance (not quitting when it's hard). It shows how well you fit work that takes time, like mastering the bar or growing into a lead role.","dims":{"PA":{"hi":"You keep one long-term goal and don't switch easily, like building a barista career over years. Risk: holding on to an old goal after things change.","lo":"You like trying many things, and your interest moves easily to something new.","tip":"Write down one 6-month goal at the café (e.g. pour latte art, become shift lead) and review it every month."},"PE":{"hi":"You don't give up when things get hard and finish the job, even on long shifts or repetitive tasks. Risk: pushing too hard and not asking for help.","lo":"When a task is hard or drags on, you lose steam and want to move on.","tip":"Break hard tasks into small steps (e.g. learn 5 drinks a week) and check off each one as you go."}}}},"appr":{"vi":{"how":"Điểm cao nhất là cách bạn thấy mình được trân trọng nhất (theo mô hình của Chapman và White). Quản lý nên ghi nhận bạn bằng 1–2 ngôn ngữ cao nhất, vì cách khác có thể không chạm tới bạn.","dims":{"LK":{"hi":"Bạn thấy được trân trọng nhất qua lời khen cụ thể và lời cảm ơn. Rủi ro: dễ nản khi làm tốt mà không ai nói gì.","lo":"Lời khen với bạn là dễ chịu, nhưng không phải điều làm bạn thấy được ghi nhận nhất.","tip":"Khen đích danh trong group chat của quán: \"Cảm ơn An đã xử lý khéo bàn khách khó tối qua\". Nói rõ việc gì, đừng chỉ \"giỏi lắm\"."},"TG":{"hi":"Bạn thấy được trân trọng khi quản lý dành thời gian riêng, lắng nghe và hỏi ý bạn. Rủi ro: thấy bị bỏ rơi khi quản lý quá bận.","lo":"Bạn không cần nhiều thời gian riêng với quản lý để thấy mình được coi trọng.","tip":"Hẹn 10 phút cà phê riêng sau ca, hỏi bạn ấy nghĩ gì về menu hay quy trình, và thật sự lắng nghe."},"GD":{"hi":"Bạn thấy được trân trọng khi có người xắn tay phụ lúc bận. Rủi ro: thấy khó chịu khi người khác chỉ nói mà không làm.","lo":"Bạn quen tự xoay xở và không coi việc được phụ giúp là cách ghi nhận chính.","tip":"Giờ cao điểm, vào quầy rửa ly hay ra món cùng bạn ấy, hoặc nhận đổi ca giúp khi bạn ấy có việc riêng."},"QU":{"hi":"Bạn thấy được trân trọng qua món quà nhỏ hiểu ý mình. Điều quan trọng là sự chu đáo, không phải giá trị món quà.","lo":"Quà cáp không phải điều làm bạn thấy mình được ghi nhận nhất.","tip":"Tặng ly đồ uống bạn ấy thích nhất sau ca dài, hoặc một phiếu quà nhỏ kèm vài chữ cảm ơn viết tay."},"TX":{"hi":"Bạn thấy được trân trọng qua cử chỉ thân thiện như đập tay, vỗ vai và không khí vui. Rủi ro: thấy xa cách ở nơi làm việc quá nghiêm.","lo":"Bạn thích giữ khoảng cách và không cần cử chỉ thân thiện để thấy được ghi nhận.","tip":"Đập tay hay giơ ngón cái khi bạn ấy xử lý xong lượt khách đông. Chỉ dùng cử chỉ bạn ấy thoải mái, luôn tôn trọng ranh giới."}}},"en":{"how":"Your highest score is how you feel most appreciated (based on Chapman and White's model). A manager should recognize you in your top 1–2 languages, since other ways may not land.","dims":{"LK":{"hi":"You feel most valued through specific praise and thanks. Risk: losing motivation when good work goes unmentioned.","lo":"Praise is nice for you, but it is not what makes you feel most recognized.","tip":"Praise them by name in the team group chat: \"Thanks An for handling that tough table so well last night.\" Say what they did, not just \"good job\"."},"TG":{"hi":"You feel valued when your manager gives you one-on-one time, listens and asks your opinion. Risk: feeling ignored when the manager is too busy.","lo":"You don't need much one-on-one time with your manager to feel valued.","tip":"Set up a 10-minute coffee chat after their shift, ask what they think about the menu or a process, and really listen."},"GD":{"hi":"You feel valued when someone rolls up their sleeves and helps during a rush. Risk: getting frustrated by people who talk but don't pitch in.","lo":"You are used to handling things yourself and don't see help as the main form of recognition.","tip":"During a rush, jump in to wash cups or run food with them, or cover their shift when they have something personal."},"QU":{"hi":"You feel valued through a small gift that shows someone knows you. It's the thought that counts, not the price.","lo":"Gifts are not what makes you feel most recognized.","tip":"Give them their favorite drink on the house after a long shift, or a small gift card with a handwritten thank-you."},"TX":{"hi":"You feel valued through friendly gestures like high-fives, a pat on the back and a fun vibe. Risk: feeling distant in a very formal workplace.","lo":"You prefer some personal space and don't need friendly gestures to feel recognized.","tip":"High-five or give a thumbs-up after they get through a big rush. Only use gestures they are comfortable with, and always respect boundaries."}}}},"riasec":{"vi":{"how":"Ba chữ có điểm cao nhất, xếp từ mạnh nhất, là mã Holland của bạn (ví dụ SEA: Xã hội, Kinh doanh, Nghệ thuật). Chữ đầu nói nhiều nhất về việc bạn thích; dùng mã này để chọn vị trí hợp trong quán.","dims":{"R":{"hi":"Bạn thích làm bằng tay, với máy móc và dụng cụ, thấy kết quả cụ thể. Rủi ro: thấy chán với việc giấy tờ hoặc nói chuyện nhiều.","lo":"Bạn ít hứng thú với việc tay chân, máy móc hơn là các loại việc khác.","tip":"Hợp: bếp, pha chế, vận hành và vệ sinh máy espresso, bảo trì thiết bị, chuẩn bị nguyên liệu."},"I":{"hi":"Bạn thích tìm hiểu vì sao, phân tích và thử nghiệm. Rủi ro: mải tìm hiểu mà chậm việc khi quán đông.","lo":"Bạn thích làm ngay hơn là ngồi phân tích hay nghiên cứu.","tip":"Hợp: thử và chuẩn hóa công thức, kiểm soát chất lượng, theo dõi số liệu bán hàng, tìm nguồn nguyên liệu."},"A":{"hi":"Bạn thích sáng tạo, trình bày đẹp và có cá tính riêng. Rủi ro: thấy gò bó với công thức và quy trình cố định.","lo":"Bạn thoải mái làm theo cách có sẵn hơn là tự sáng tạo cái mới.","tip":"Hợp: sáng tạo món mới, latte art, trình bày món, trang trí quầy, chụp ảnh và làm nội dung mạng xã hội."},"S":{"hi":"Bạn thích phục vụ, giúp đỡ và hướng dẫn người khác. Rủi ro: khó từ chối, dễ mệt vì lo cho mọi người.","lo":"Bạn thích tập trung vào việc của mình hơn là giao tiếp với khách liên tục.","tip":"Hợp: phục vụ bàn, đón khách, chăm sóc khách quen, đào tạo nhân viên mới."},"E":{"hi":"Bạn thích thuyết phục, dẫn dắt và đạt mục tiêu bán hàng. Rủi ro: muốn làm nhanh mà bỏ qua chi tiết hoặc ý kiến người khác.","lo":"Bạn ít thích việc bán hàng, thuyết phục hay dẫn dắt người khác.","tip":"Hợp: trưởng ca, gợi ý món và bán thêm, tổ chức sự kiện, làm việc với đối tác giao hàng."},"C":{"hi":"Bạn thích trật tự, con số rõ ràng và làm đúng quy trình. Rủi ro: lúng túng khi phải xoay xở việc bất ngờ.","lo":"Bạn thấy bó buộc với việc sổ sách, số liệu và quy trình chi tiết.","tip":"Hợp: thu ngân, kiểm kho và đặt hàng, đối soát doanh thu cuối ngày, lập lịch ca, giữ checklist mở và đóng quán."}}},"en":{"how":"Your three highest letters, strongest first, form your Holland code (e.g. SEA: Social, Enterprising, Artistic). The first letter says the most about what you enjoy; use the code to find roles that fit at the café.","dims":{"R":{"hi":"You like hands-on work with tools and machines and seeing concrete results. Risk: getting bored with paperwork or lots of talking.","lo":"Hands-on and mechanical work interests you less than other kinds of work.","tip":"Fits: kitchen, bar, running and cleaning the espresso machine, equipment upkeep, prep work."},"I":{"hi":"You like figuring out why, analyzing and experimenting. Risk: digging into details and slowing down during a rush.","lo":"You prefer jumping in to analyzing or researching.","tip":"Fits: testing and standardizing recipes, quality control, tracking sales numbers, sourcing ingredients."},"A":{"hi":"You like creating, presenting things beautifully and adding your own style. Risk: feeling boxed in by fixed recipes and routines.","lo":"You are comfortable following set ways rather than creating something new.","tip":"Fits: new menu items, latte art, plating, counter decor, photos and social media content."},"S":{"hi":"You like serving, helping and teaching others. Risk: finding it hard to say no and getting worn out caring for everyone.","lo":"You prefer focusing on your own tasks over constant guest interaction.","tip":"Fits: serving tables, greeting guests, looking after regulars, training new staff."},"E":{"hi":"You like persuading, leading and hitting sales goals. Risk: moving fast and skipping details or others' input.","lo":"Selling, persuading or leading others appeals to you less.","tip":"Fits: shift lead, recommending and upselling items, running events, working with delivery partners."},"C":{"hi":"You like order, clear numbers and following the process. Risk: feeling thrown when things change unexpectedly.","lo":"Bookkeeping, numbers and detailed procedures feel confining to you.","tip":"Fits: cashier, inventory and ordering, end-of-day cash reconciliation, shift scheduling, opening and closing checklists."}}}},"motiv":{"vi":{"how":"Chiều cao nhất là động lực chính của bạn; đa số người là kết hợp của hai chiều. Khi cần thuyết phục ai, hãy nói theo động lực của họ, không phải của bạn.","dims":{"AC":{"hi":"Bạn có động lực khi tự đặt mục tiêu và thấy việc xong tốt. Rủi ro: sốt ruột khi người khác chậm, khó giao việc.","lo":"Bạn ít bị thúc đẩy bởi thử thách cá nhân; điều khác quan trọng với bạn hơn.","tip":"Với người này: giao mục tiêu rõ, để họ tự chọn cách làm, cho họ thấy kết quả bằng con số."},"AF":{"hi":"Bạn cần không khí thân thiện và quan hệ tốt; bạn kết nối cả nhóm. Rủi ro: né góp ý thẳng để giữ hòa khí.","lo":"Bạn làm tốt một mình và không cần nhiều giao lưu ở chỗ làm.","tip":"Với người này: hỏi thăm trước khi vào việc, góp ý riêng và nhẹ nhàng, cho làm việc theo cặp hoặc nhóm."},"SE":{"hi":"Bạn cần sự ổn định và rõ ràng; bạn làm chắc tay, ít sai sót. Rủi ro: ngại thay đổi, dễ chạnh lòng khi bị phê bình.","lo":"Bạn khá tự tin, chịu được thay đổi và góp ý.","tip":"Với người này: báo trước thay đổi, chia việc thành bước nhỏ, khen kỹ năng của họ và góp ý riêng."},"IN":{"hi":"Bạn thích dẫn dắt, được nể trọng và thuyết phục người khác. Rủi ro: lấn át người khác, quá coi trọng vị thế.","lo":"Bạn không cần đứng đầu hay nổi bật để thấy có động lực.","tip":"Với người này: giao vai trò trưởng ca hoặc phụ trách, cho trình bày ý tưởng, ghi công trước nhóm."}}},"en":{"how":"Your highest area is your main motivation; most people are a mix of two. When you need to persuade someone, speak to their motivation, not yours.","dims":{"AC":{"hi":"You are driven by setting your own goals and seeing work done well. Risk: impatience when others are slow, trouble delegating.","lo":"Personal challenge is not your main driver; other things matter more to you.","tip":"With this person: give clear goals, let them choose how, and show results in numbers."},"AF":{"hi":"You need a friendly atmosphere and good relationships; you bring the team together. Risk: avoiding direct feedback to keep the peace.","lo":"You work well on your own and don't need much socializing at work.","tip":"With this person: check in before getting to work, give feedback privately and gently, pair them with others."},"SE":{"hi":"You need stability and clear expectations; you are careful and make few mistakes. Risk: resisting change, taking criticism hard.","lo":"You are fairly confident and handle change and feedback well.","tip":"With this person: announce changes early, break work into small steps, praise their skills and give feedback privately."},"IN":{"hi":"You like to lead, be respected and persuade others. Risk: talking over others, caring too much about status.","lo":"You don't need to lead or stand out to feel motivated.","tip":"With this person: give a shift-lead or ownership role, let them present ideas, credit them in front of the team."}}}},"frazzle":{"vi":{"how":"Cộng hai phần để có tổng điểm. 0–9: rất thoải mái. 10–29: bình thường, thỉnh thoảng giận nhưng thường có lý do. 30–39: cờ vàng, căng thẳng và nóng giận đang cao. 40–48: cờ đỏ, nên tìm người tư vấn hoặc người đáng tin để nói chuyện sớm. Đây là bài tự đánh giá để tham khảo, không phải chẩn đoán.","dims":{"ST":{"hi":"Bạn đang chịu nhiều áp lực từ môi trường: quyết định gấp, ít được hỏi ý kiến, lương, cấp trên hoặc giấy tờ.","lo":"Môi trường hiện tại không gây nhiều áp lực cho bạn.","tip":"Ghi ra 1–2 nguồn áp lực lớn nhất và nói chuyện với quản lý về điều có thể thay đổi được."},"AN":{"hi":"Khi bực, bạn dễ phản ứng ra ngoài: nói thẳng, mắng lại hoặc mất bình tĩnh.","lo":"Bạn giữ được bình tĩnh và ít khi phản ứng gay gắt.","tip":"Khi thấy nóng lên, tạm rời quầy vài phút, hít thở rồi mới nói; góp ý lỗi của người khác ở chỗ riêng."}}},"en":{"how":"Add both parts for your total. 0–9: very relaxed. 10–29: normal, you get angry sometimes but usually for a reason. 30–39: yellow flag, stress and anger are running high. 40–48: red flag, talk to a counselor or someone you trust soon. This is a self-check for reflection, not a diagnosis.","dims":{"ST":{"hi":"You are under a lot of pressure from your environment: quick decisions, not being asked, pay, bosses or paperwork.","lo":"Your current environment is not putting much pressure on you.","tip":"Write down your 1–2 biggest sources of pressure and talk with your manager about what can change."},"AN":{"hi":"When upset, you tend to react outwardly: speaking sharply, telling people off or losing your temper.","lo":"You stay calm and rarely react harshly.","tip":"When you feel heated, step away for a few minutes and breathe before speaking; point out others' mistakes in private."}}}}};

ổi.","S"],["Tôi kiên nhẫn và biết lắng nghe.","S"],["Tôi giúp đồng đội một cách lặng lẽ.","S"],["Tôi cần thời gian để quen với thay đổi.","S"],["Tôi kiểm tra kỹ chi tiết trước khi xong việc.","C"],["Tôi thích làm theo quy trình rõ ràng.","C"],["Tôi cần dữ liệu và lý do trước khi quyết định.","C"],["Tôi khó chịu khi việc làm cẩu thả.","C"],["Tôi thích được giao trách nhiệm và tự quyết.","D"],["Khi có sự cố, tôi xử lý ngay thay vì chờ.","D"],["Tôi không ngại tranh luận để bảo vệ quan điểm của mình.","D"],["Tôi thích mục tiêu khó và kết quả rõ ràng.","D"],["Tôi sốt ruột khi mọi việc diễn ra quá chậm.","D"],["Khi nhóm lúng túng, tôi thường là người đứng ra cầm trịch.","D"],["Tôi dễ bắt chuyện với khách lạ.","I"],["Tôi thích làm việc cùng mọi người hơn làm một mình.","I"],["Tôi hay kể chuyện vui để cả nhóm cười.","I"],["Tôi lạc quan, thường nhìn mặt tích cực của vấn đề.","I"],["Tôi thích những ca đông vui, nhiều người qua lại.","I"],["Tôi hay rủ đồng nghiệp đi ăn uống sau giờ làm.","I"],["Tôi thích làm việc lâu dài với một nhóm quen thuộc.","S"],["Tôi giữ được bình tĩnh khi gặp khách khó tính.","S"],["Tôi làm việc đều tay, ổn định từ đầu đến cuối ca.","S"],["Tôi thích biết trước lịch làm để sắp xếp cuộc sống.","S"],["Tôi sẵn lòng nhận thêm việc để đồng đội đỡ vất vả.","S"],["Tôi ngại làm mất lòng người khác.","S"],["Tôi thích có hướng dẫn bằng văn bản rõ ràng.","C"],["Tôi đo, cân, đếm cẩn thận để mọi thứ chính xác.","C"],["Tôi đặt nhiều câu hỏi để hiểu đúng yêu cầu.","C"],["Tôi thích làm một việc thật đúng hơn làm nhiều việc vội vàng.","C"],["Tôi để ý những lỗi nhỏ mà người khác bỏ qua.","C"],["Tôi suy nghĩ kỹ và lên kế hoạch trước khi bắt tay vào làm.","C"]],"belbin":[["Tôi hay nghĩ ra cách làm mới khi nhóm bị bí.","PL"],["Tôi thích giải những vấn đề khó, không theo lối mòn.","PL"],["Tôi giỏi tìm người, tìm mối, tìm cơ hội bên ngoài.","RI"],["Tôi nhiệt tình nhất lúc khởi đầu một việc mới.","RI"],["Tôi giỏi giao đúng việc cho đúng người.","CO"],["Tôi giúp nhóm thống nhất ["qt01","QT","VS","Khi rửa tay với xà phòng, toàn bộ quá trình rửa phải kéo dài ít nhất bao lâu?",["20 giây","5 giây","10 giây","2 phút"],"When washing your hands with soap, how long should the whole process take at least?",["20 seconds","5 seconds","10 seconds","2 minutes"],"Rửa tay tổng cộng ít nhất 20 giây, trong đó chà xà phòng 10 đến 15 giây, rồi xả nước ấm và lau bằng khăn giấy.","Wash for at least 20 seconds in total, scrubbing with soap for 10 to 15 of them, then rinse in warm water and dry with a paper towel."],
["qt02","QT","VS","Bạn được rửa tay ở đâu trong quán?",["Chỉ ở bồn rửa tay riêng","Bồn rửa ly","Bồn sơ chế rau","Bất kỳ bồn nào có nước ấm"],"Where are you allowed to wash your hands at work?",["Only at the handwashing sink","The dish sink","The prep sink","Any sink with warm water"],"Bồn rửa tay chỉ để rửa tay, và bồn rửa ly hay bồn sơ chế không được dùng để rửa tay, vì vi khuẩn từ tay sẽ dính vào đồ ăn và dụng cụ.","The handwashing sink is only for hands, and hands are never washed in dish or prep sinks, because germs from hands can get onto food and utensils."],
["qt03","QT","VS","Lúc nào bạn PHẢI rửa tay?",["Sau khi cầm điện thoại, rồi mới quay lại pha chế","Chỉ khi tay nhìn thấy bẩn, còn lại đeo găng là đủ","Chỉ lúc mới vào ca, trước khi chấm công","Chỉ sau khi đi vệ sinh, không cần sau việc khác"],"When MUST you wash your hands?",["After touching your phone, before going back to making drinks","Only when your hands look dirty, otherwise gloves are enough","Only at the start of your shift, right before you clock in","Only after using the restroom, not after any other task"],"Phải rửa tay khi vào ca, sau vệ sinh, sau khi chạm điện thoại, mặt, tóc, tiền, rác, đồ sống, sau khi ăn uống, và mỗi khi đổi việc.","Wash at the start of a shift, after the restroom, after touching your phone, face, hair, money, trash or raw food, after eating or drinking, and whenever you switch tasks."],
["qt04","QT","VS","Trước khi đeo găng tay mới, bạn phải làm gì?",["Rửa tay","Không cần làm gì, găng đã sạch","Xịt nước sát khuẩn lên găng","Lau tay vào tạp dề"],"What must you do before putting on new gloves?",["Wash your hands","Nothing, gloves are already clean","Spray sanitizer on the gloves","Wipe your hands on your apron"],"Găng tay không thay cho rửa tay. Rửa tay trước khi đeo găng, và thay găng khi rách, khi bẩn, khi đổi việc, hoặc sau tối đa 4 giờ dùng liên tục.","Gloves do not replace handwashing. Wash before putting gloves on, and change them when torn, dirty, when switching tasks, or after at most 4 hours of continuous use."],
["qt05","QT","VS","Khi đặt lát chanh hay lá bạc hà (đồ ăn sẵn, không nấu nữa) lên ly, bạn nên làm thế nào?",["Dùng kẹp, găng tay hoặc dụng cụ, không chạm tay trần","Dùng tay trần, miễn là vừa mới rửa tay xong","Dùng tay trần, vì lượng lấy rất ít thôi","Lau tay vào khăn cho sạch rồi lấy bằng tay"],"How should you put a lemon slice or mint leaves (ready-to-eat food) on a drink?",["With tongs, gloves or a utensil, not bare hands","With bare hands if you just washed them","With bare hands since it's a small amount","Wipe your hands on a towel, then use your hands"],"Đồ ăn sẵn (không nấu lại) không được chạm tay trần. Dùng kẹp, muỗng, giấy gói hoặc găng tay dùng một lần.","Ready-to-eat food must not be touched with bare hands. Use tongs, spoons, deli tissue or single-use gloves."],
["qt06","QT","VS","Khi pha chế, trang sức nào được phép đeo trên tay?",["Chỉ một nhẫn trơn (nhẫn cưới)","Đồng hồ và lắc tay","Nhẫn có đá nếu đeo găng","Bất kỳ trang sức nào nếu rửa tay kỹ"],"Which jewelry may you wear on your hands and arms while preparing food or drinks?",["Only a plain band ring","A watch and bracelets","A stone ring if you wear gloves","Any jewelry if you wash well"],"Chỉ được đeo một nhẫn trơn. Đồng hồ, lắc tay và nhẫn có đá giữ vi khuẩn và có thể rơi vào đồ uống.","Only a plain band ring is allowed. Watches, bracelets and stone rings trap germs and can fall into food."],
["qt07","QT","VS","Bạn muốn uống nước trong ca. Cách nào đúng?",["Ly có nắp và ống hút, để xa khu pha chế","Ly mở để ngay trên quầy pha chế cho tiện","Uống thẳng từ vòi ở bồn sơ chế khi khát","Không được uống nước ở bất kỳ đâu trong ca"],"You want to drink water during your shift. Which is correct?",["A cup with a lid and straw, kept away from the prep area","An open cup on the drink-making counter, within reach","Straight from the tap at the prep sink when you're thirsty","Not at all; no drinking is allowed anywhere during a shift"],"Được uống nước bằng ly có nắp và ống hút, để xa đồ ăn, dụng cụ và khu pha chế. Ăn uống xong thì rửa tay.","A covered cup with a straw, kept away from food, utensils and prep areas, is allowed. Wash your hands after eating or drinking."],
["qt08","QT","VS","Tóc dài khi làm việc ở khu pha chế phải thế nào?",["Buộc gọn và đội mũ hoặc dùng lưới tóc","Để xõa nếu tóc sạch","Chỉ cần vén gọn ra sau tai","Không cần gì, miễn đừng chạm tóc"],"What should you do with long hair while working at the drink bar?",["Tie it back and wear a hat or hair net","Leave it down as long as it's clean","Just tuck it neatly behind your ears","Nothing, as long as you don't touch it"],"Phải giữ tóc gọn bằng mũ, lưới hoặc băng đô, để tóc không rơi vào đồ uống và tay không chạm tóc.","Hair must be restrained with a hat, net or headband so it doesn't fall into food and you don't touch it."],
["qa01","QT","VS","Bạn vừa đổ rác xong, quầy đang đông. Xịt nước rửa tay khô (hand sanitizer) rồi pha nước tiếp được không?",["Không, phải rửa tay bằng xà phòng và nước ở bồn rửa tay","Được, nước rửa tay khô sạch không kém rửa bằng xà phòng","Được, miễn là xoa đủ hai lần xịt nước rửa tay khô","Được, miễn là đeo găng mới ngay sau đó"],"You just took out the trash and the bar is busy. Can you use hand sanitizer and go back to making drinks?",["No, you must wash with soap and water at the handwashing sink","Yes, hand sanitizer works just as well as soap and water","Yes, as long as you rub in two full pumps of sanitizer","Yes, as long as you put on fresh gloves right afterward"],"Nước rửa tay khô không thay được việc rửa tay. Nếu dùng thì chỉ dùng SAU khi đã rửa tay bằng xà phòng và nước.","Hand antiseptic never replaces handwashing. If you use it at all, use it only AFTER washing with soap and water."],
["qa02","QT","VS","Rửa tay xong, bạn làm khô tay bằng gì?",["Khăn giấy dùng một lần hoặc máy sấy tay","Tạp dề đang mặc","Khăn lau quầy","Vẩy tay cho khô rồi làm tiếp"],"After washing your hands, how do you dry them?",["A single-use paper towel or a hand dryer","The apron you're wearing","The counter wiping cloth","Shake them dry and keep working"],"Lau bằng khăn giấy dùng một lần hoặc máy sấy tay. Tạp dề và khăn lau có vi khuẩn sẽ làm bẩn lại tay vừa rửa. Dùng khăn giấy để khóa vòi nước.","Use a single-use paper towel or a hand dryer. Aprons and wiping cloths carry germs and recontaminate clean hands. Use the paper towel to turn off the faucet."],
["qa03","QT","VS","Bạn đang đeo găng cắt trái cây thì găng bị rách. Bạn làm gì?",["Tháo găng, rửa tay, rồi đeo găng mới","Đeo thêm một găng mới chồng lên găng rách rồi cắt tiếp","Lấy băng keo dán chỗ rách cho găng khỏi tuột","Cắt xong trái cây rồi mới thay găng"],"You're wearing gloves cutting fruit and a glove tears. What do you do?",["Take the gloves off, wash your hands, then put on new gloves","Put a new glove on over the torn one and keep cutting","Tape over the tear so the glove stays on your hand","Finish cutting the fruit first, then change your gloves"],"Găng rách thì không còn bảo vệ thực phẩm. Phải tháo ra, rửa tay, rồi đeo đôi mới. Găng chỉ dùng một lần, không rửa lại.","A torn glove no longer protects the food. Remove it, wash your hands and put on a new pair. Gloves are single-use and never washed and reused."],
["qa04","QT","VS","Bạn làm liên tục một việc (ví dụ cắt bánh mì) cả buổi. Theo ServSafe, nên thay găng ít nhất bao lâu một lần?",["Mỗi 4 giờ","Mỗi 8 giờ","Mỗi 12 giờ","Chỉ khi hết ca"],"You do the same task (for example cutting bánh mì) all morning. According to ServSafe, how often should you change gloves at least?",["Every 4 hours","Every 8 hours","Every 12 hours","Only at the end of the shift"],"ServSafe dạy: làm liên tục một việc thì thay găng ít nhất mỗi 4 giờ (FDA Food Code không ghi số giờ; đây là chuẩn ServSafe và quy định của quán). Ngoài ra phải thay ngay khi găng bẩn, rách, hoặc khi đổi việc.","ServSafe teaches changing gloves at least every 4 hours of continuous use on one task (the FDA Food Code sets no hour limit; this is the ServSafe standard and house rule). Also change them right away when they get dirty or torn, or when you switch tasks."],
["qa05","QT","VS","Bạn vừa nhận tiền mặt của khách, giờ cần bỏ bánh tart trứng vào túi. Cách nào đúng?",["Rửa tay, rồi gắp bánh bằng kẹp hoặc giấy gói","Lau tay vào tạp dề rồi bốc bánh bằng tay","Xịt nước rửa tay khô thay cho rửa tay rồi bốc bánh","Bốc luôn, vì tiền chưa hề chạm vào đồ ăn"],"You just took cash from a customer and now need to bag an egg tart. Which is correct?",["Wash your hands, then pick up the tart with tongs or bakery tissue","Wipe your hands on your apron, then grab the tart by hand","Use hand sanitizer instead of washing, then grab the tart","Grab it right away, since the cash never touched any food"],"Tiền rất bẩn. Sau khi cầm tiền phải rửa tay trước khi đụng đồ ăn, và bánh ăn liền phải gắp bằng kẹp, giấy hoặc găng, không bốc tay trần.","Money is very dirty. Wash your hands after handling it before touching food, and pick up ready-to-eat items with tongs, tissue or gloves, never bare hands."],
["qa06","QT","VS","Một bạn mới vào làm có móng tay dài, sơn gel. Quy định đúng là gì?",["Móng phải ngắn, sạch; có sơn hoặc móng giả thì phải đeo găng khi làm đồ ăn","Được để vì sơn gel bịt kín hoàn toàn, không bong như sơn thường","Được để, chỉ cần rửa tay kỹ hơn và lâu hơn mỗi lần vào làm","Chỉ cấm khi móng dài quá 2 inch; ngắn hơn thì không cần găng"],"A new staff member has long nails with gel polish. What is the rule?",["Nails must be short and clean; with polish or fake nails you must wear gloves when handling food","It's fine because gel seals the nail completely and doesn't chip like regular polish","It's fine; just wash your hands longer and more carefully each time you start work","It's only banned over 2 inches long; shorter nails like these don't need any gloves"],"Móng phải cắt ngắn, giữ sạch. Sơn móng và móng giả có thể bong vào đồ ăn và giấu vi khuẩn, nên chỉ được làm đồ ăn khi đeo găng còn nguyên.","Nails must be short and clean. Polish and fake nails can chip into food and hide germs, so they are only allowed when you wear intact gloves."],
["qa07","QT","VS","Bạn muốn nếm thử mẻ kem muối mới đánh. Cách nếm nào đúng?",["Múc ra chén nhỏ bằng muỗng sạch, nếm bằng muỗng riêng dùng một lần","Nếm thẳng từ cây phới đang đánh rồi đánh tiếp mẻ kem","Chấm ngón tay sạch vừa rửa vào kem để nếm một chút","Nếm bằng muỗng sạch rồi bỏ lại muỗng đó vào hộp để khuấy"],"You want to taste a new batch of salted cream. Which way is correct?",["Put some in a small dish with a clean spoon and taste with a separate single-use spoon","Taste straight from the whisk you're using, then keep whipping the batch","Dip a clean, freshly washed finger into the cream to taste a little","Taste with a clean spoon, then put that spoon back in the container to stir"],"Nếm bằng muỗng riêng, dùng một lần rồi bỏ đi rửa. Không nếm từ dụng cụ đang làm, không dùng tay, không cho muỗng đã nếm quay lại đồ ăn.","Taste with a separate spoon that is used once and then washed or tossed. Never taste from the mixing utensil, never use fingers, and never put a used spoon back in the food."],
["qa08","QT","VS","Bạn cần đi vệ sinh giữa ca. Trước khi vào nhà vệ sinh, bạn làm gì với tạp dề?",["Cởi tạp dề ra, để ở chỗ riêng","Cứ mặc vì vào nhanh thôi","Lộn trái tạp dề rồi mặc","Lấy tạp dề lau tay sau khi đi xong"],"You need to use the restroom during your shift. What do you do with your apron before going in?",["Take it off and leave it in its spot","Keep it on since you'll be quick","Turn it inside out and keep it on","Use your apron to dry your hands afterward"],"Tạp dề phải cởi ra trước khi vào nhà vệ sinh hoặc đi đổ rác, để không mang vi khuẩn về quầy. Đi xong rửa tay rồi mới mặc lại.","Take your apron off before using the restroom or taking out trash so you don't bring germs back to the bar. Wash your hands, then put it back on."],
["qa09","QT","VS","Tạp dề của bạn bị dính đầy sữa đổ và vết bẩn giữa ca. Bạn làm gì?",["Thay tạp dề sạch","Lau sơ bằng khăn lau quầy rồi mặc tiếp","Mặc tiếp đến hết ca","Xịt nước sát khuẩn lên tạp dề"],"Your apron is covered in spilled milk and stains mid-shift. What do you do?",["Change into a clean apron","Wipe it with the counter cloth and keep wearing it","Keep wearing it until the end of the shift","Spray sanitizer on it"],"Quần áo và tạp dề bẩn mang vi khuẩn và có thể làm bẩn ly, đồ ăn. Đi làm mặc đồ sạch và thay tạp dề ngay khi nó bẩn.","Dirty clothes and aprons carry germs that can get onto cups and food. Come to work in clean clothes and change your apron as soon as it gets dirty."],
["qa10","QT","VS","Bạn muốn hút vape lúc nghỉ giữa ca. Cách nào đúng?",["Chỉ ở khu nghỉ được chỉ định xa đồ ăn, và rửa tay trước khi quay lại làm","Ở cửa sau ngay cạnh kho đồ khô, vì khói đằng nào cũng bay ra ngoài","Sau quầy bar khi không có khách, rồi xịt nước rửa tay khô","Trong nhà vệ sinh nhân viên, vì ở đó không có đồ ăn và có quạt hút"],"You want to vape on your break. Which is correct?",["Only in the designated break area away from food, and wash your hands before going back to work","At the back door right next to dry storage, since the smoke goes outside anyway","Behind the bar when no customers are around, then use some hand sanitizer","In the staff restroom, since there's no food in there and it has a fan"],"Hút thuốc, vape, ăn uống chỉ được ở khu chỉ định, xa đồ ăn và dụng cụ (ngoại lệ: được uống nước trong ly có nắp và ống hút, để xa đồ ăn). Tay chạm miệng mang nước bọt và vi khuẩn, nên phải rửa tay trước khi làm lại.","Smoking, vaping, eating and drinking are only allowed in a designated area away from food and equipment (exception: you may drink from a closed cup with a lid and straw, kept away from food). Touching your mouth spreads saliva and germs, so wash your hands before returning to work."],
["qa11","QT","VS","Bạn nhai kẹo cao su lúc đứng quầy pha chế được không?",["Không, chỉ được nhai ở khu nghỉ","Được, vì kẹo không phải đồ ăn","Được, nếu không nói chuyện","Được, nếu đeo khẩu trang"],"Can you chew gum while working at the drink bar?",["No, only in the break area","Yes, because gum isn't food","Yes, if you don't talk","Yes, if you wear a mask"],"Nhai kẹo cao su cũng là ăn uống, nên không được ở khu pha chế. Nước bọt có thể bắn vào đồ uống và tay dễ chạm miệng.","Chewing gum counts as eating, so it's not allowed in prep areas. Saliva can get into drinks and your hands touch your mouth."],
["qa12","QT","VS","Bạn sắp hắt hơi khi đang đứng trước ly cà phê vừa pha. Bạn làm gì?",["Quay đi xa đồ uống, hắt hơi vào khăn giấy hoặc khuỷu tay, rồi rửa tay","Hắt hơi vào lòng bàn tay, lau tay vào tạp dề rồi làm tiếp","Cúi xuống hắt hơi dưới quầy cho khỏi bắn vào ly, rồi làm tiếp","Nín lại, đưa ly cho khách xong rồi mới đi rửa tay"],"You're about to sneeze while standing over a coffee you just made. What do you do?",["Turn away from the drinks, sneeze into a tissue or your elbow, then wash your hands","Sneeze into your hands, wipe them on your apron and keep working","Duck below the counter so it doesn't hit the cup, then keep working","Hold it in, hand over the drink, then go wash your hands"],"Hắt hơi, ho bắn vi khuẩn rất xa. Quay đi xa đồ ăn, che bằng khăn giấy hoặc khuỷu tay, rồi rửa tay trước khi chạm lại đồ uống.","Sneezes and coughs spray germs far. Turn away from food, cover with a tissue or your elbow, then wash your hands before touching drinks again."],
["qa13","QT","VS","Vào ca, bạn để túi xách, áo khoác và điện thoại ở đâu?",["Ở chỗ để đồ riêng cho nhân viên, xa đồ ăn và dụng cụ","Trên kệ để sữa và ly, chỗ cao ráo sạch sẽ","Dưới quầy pha chế cho tiện nghe điện thoại khi cần","Trên bàn sơ chế phía sau, miễn là lúc đó không có đồ ăn"],"When your shift starts, where do you put your bag, jacket and phone?",["In the staff storage area, away from food and equipment","On the shelf with the milk and cups, where it's clean and dry","Under the drink bar so you can grab your phone when needed","On the back prep table, as long as no food is on it right then"],"Đồ cá nhân mang vi khuẩn từ bên ngoài vào. Phải để ở khu riêng cho nhân viên, không để gần đồ ăn, ly, dụng cụ hay khu pha chế.","Personal items bring germs in from outside. Keep them in a separate staff area, never near food, cups, utensils or the bar."],
["qa14","QT","VS","Tủ lạnh quầy đầy, bạn muốn vùi hộp sữa vào thùng đá dùng cho đồ uống để giữ lạnh. Được không?",["Không, đá dùng để ướp lạnh đồ thì không được dùng cho đồ uống","Được, miễn là hộp sữa còn đóng kín chưa mở nắp","Được, nếu lau sạch bên ngoài hộp sữa trước khi vùi","Được, miễn là không để hộp trong đá quá 4 giờ"],"The bar fridge is full, so you want to bury a milk carton in the ice bin used for drinks to keep it cold. Is that OK?",["No, ice used to chill containers may not be used in drinks","Yes, as long as the carton is still sealed and unopened","Yes, if you wipe the outside of the carton before burying it","Yes, as long as the carton stays in the ice under 4 hours"],"Đá cho vào ly là thực phẩm. Đá dùng để ướp lạnh hộp, chai hay đồ ăn thì không được cho vào đồ uống, vì bên ngoài hộp bẩn.","Ice that goes in drinks is food. Ice used to chill cartons, bottles or food can never be served, because the outside of containers is dirty."],
["qa15","QT","VS","Một cái ly thủy tinh bị vỡ ngay trên thùng đá. Bạn làm gì?",["Ngưng dùng thùng đá, bỏ hết đá, rửa sạch thùng rồi mới lấy đá mới","Nhặt hết mảnh vỡ thấy được ra rồi dùng tiếp","Lọc đá qua rây hoặc vợt rồi dùng tiếp","Chỉ bỏ phần đá chỗ ly vỡ, dùng phần đá bên kia"],"A glass breaks right over the ice bin. What do you do?",["Stop using the bin, throw out all the ice, clean the bin, then refill","Pick out all the pieces you can see and keep using it","Strain the ice through a sieve and keep using it","Throw out the ice where the glass broke and use the other side"],"Mảnh thủy tinh nhỏ không nhìn thấy được trong đá. Phải bỏ hết đá (đổ nước nóng cho tan), rửa sạch thùng rồi mới lấy đá mới. Không múc đá bằng ly thủy tinh.","Tiny glass pieces can't be seen in ice. Throw out all the ice (melt it with hot water), clean the bin, then refill. Never scoop ice with a glass."],
["qa16","QT","VS","Khi đưa đồ uống cho khách, bạn cầm ly thế nào?",["Cầm phía dưới hoặc thân ly, không chạm miệng ly","Cầm miệng ly cho chắc","Cầm bất kỳ chỗ nào nếu tay sạch","Ngón tay vào trong miệng ly để không rơi"],"When handing a drink to a customer, how do you hold the cup?",["By the bottom or the side, never touching the rim","By the rim so it's secure","Anywhere, as long as your hands are clean","With a finger inside the rim so it won't slip"],"Miệng ly là chỗ khách đặt môi. Cầm ly ở phía dưới hoặc thân ly, cầm ống hút qua vỏ giấy, không chạm vào miệng ly hay mặt trong nắp.","The rim is where the customer's mouth goes. Hold cups by the bottom or side, hold straws by the wrapper, and never touch the rim or inside of lids."],
["qa17","QT","VS","Một bạn nhân viên nam có râu dài làm ở khu sơ chế đồ ăn. Bạn ấy cần làm gì?",["Đeo lưới bọc râu, ngoài nón hoặc lưới tóc","Chỉ cần đội nón","Không cần gì vì râu ngắn hơn tóc","Chỉ cần rửa mặt trước ca"],"A male staff member with a long beard works in the food prep area. What does he need?",["Wear a beard net as well as a hat or hair net","Just wear a hat","Nothing, because a beard is shorter than hair","Just wash his face before the shift"],"Tóc và râu có thể rơi vào đồ ăn. Nhân viên làm đồ ăn phải đội nón hoặc lưới tóc, và người có râu thì đeo thêm lưới bọc râu.","Hair and beard hair can fall into food. Food handlers wear a hat or hair net, and staff with facial hair also wear a beard restraint."],
["qt09","QT","BE","Sáng nay bạn bị ói và tiêu chảy. Bạn phải làm gì?",["Báo quản lý và không đi làm","Đi làm nhưng đeo găng","Đi làm nhưng chỉ đứng thu ngân","Uống thuốc rồi đi làm bình thường"],"You vomited and had diarrhea this morning. What must you do?",["Tell your manager and stay home","Come to work but wear gloves","Come to work but only run the register","Take medicine and work as usual"],"Ói và tiêu chảy là triệu chứng phải nghỉ làm. Chỉ quay lại khi hết triệu chứng ít nhất 24 giờ. Nếu bác sĩ xác định bị norovirus thì ở Massachusetts phải nghỉ việc đụng đồ ăn ít nhất 72 giờ sau khi hết triệu chứng. Với viêm gan A, Salmonella, Shigella hay E. coli thì phải chờ cơ quan y tế cho phép.","Vomiting and diarrhea mean you must not work. Return only after you've been symptom-free for at least 24 hours. If you're diagnosed with norovirus, Massachusetts keeps you away from food for at least 72 hours after symptoms end. For hepatitis A, Salmonella, Shigella or E. coli, you need health department approval."],
["qt10","QT","BE","Triệu chứng nào bắt buộc phải báo ngay cho quản lý?",["Vàng da hoặc vàng mắt","Hơi mệt vì ngủ ít","Đau lưng","Mỏi chân sau ca dài"],"Which symptom must you report to your manager right away?",["Yellow skin or eyes (jaundice)","Feeling tired from little sleep","Back pain","Sore feet after a long shift"],"Vàng da có thể là viêm gan A, một bệnh lây qua đồ ăn. Phải báo các triệu chứng: ói, tiêu chảy, vàng da, đau họng kèm sốt, và vết thương có mủ.","Jaundice can be a sign of hepatitis A, which spreads through food. Report vomiting, diarrhea, jaundice, sore throat with fever, and infected wounds."],
["qt11","QT","BE","Tay bạn có vết cắt nhỏ. Bạn làm việc thế nào?",["Băng kín vết cắt rồi đeo găng tay lên trên","Để hở cho mau khô","Chỉ cần rửa tay nhiều lần hơn","Dán băng keo rồi làm bằng tay trần"],"You have a small cut on your hand. How do you work?",["Cover it with a bandage and wear a glove over it","Leave it uncovered so it dries out faster","Just wash your hands more often than usual","Use a bandage and work bare-handed over it"],"Vết thương ở tay phải được băng kín bằng băng chống thấm và đeo găng lên trên, để vi khuẩn không dính vào đồ ăn.","A wound on the hand must be covered with a waterproof bandage and a single-use glove so germs don't reach the food."],
["qt12","QT","BE","Virus nào là nguyên nhân phổ biến nhất gây ngộ độc thực phẩm từ người làm bếp bị bệnh?",["Norovirus","Virus cúm","Virus cảm lạnh thông thường","HIV"],"Which virus most often causes foodborne illness spread by sick food workers?",["Norovirus","Influenza","The common cold","HIV"],"Norovirus lây rất mạnh qua tay và đồ ăn. Đây là lý do người bị ói hoặc tiêu chảy không được đi làm và phải rửa tay kỹ.","Norovirus spreads easily through hands and food. That's why workers with vomiting or diarrhea must stay home and hands must be washed well."],
["qa18","QT","BE","Nhóm \"Big 6\" là các mầm bệnh dễ lây qua đồ ăn, nhân viên bị chẩn đoán phải báo quản lý. Cái nào thuộc Big 6?",["Viêm gan A (Hepatitis A)","Listeria","Clostridium perfringens","Bacillus cereus"],"The \"Big 6\" are pathogens easily spread through food; staff diagnosed with one must tell the manager. Which is one of the Big 6?",["Hepatitis A","Listeria","Clostridium perfringens","Bacillus cereus"],"Big 6 gồm: Norovirus, viêm gan A, Shigella, Salmonella Typhi, Salmonella không thương hàn và E. coli sinh độc tố Shiga. Chúng lây rất dễ từ người bệnh qua đồ ăn.","The Big 6 are Norovirus, Hepatitis A, Shigella, Salmonella Typhi, nontyphoidal Salmonella and Shiga toxin-producing E. coli. They spread very easily from sick workers through food."],
["qa19","QT","BE","\"Hạn chế\" (restriction) và \"loại trừ\" (exclusion) nhân viên khác nhau thế nào?",["Hạn chế: vẫn làm nhưng không đụng đồ ăn hở và dụng cụ sạch; loại trừ: không được vào làm","Hạn chế: nghỉ ở nhà 1 ngày; loại trừ: nghỉ ở nhà trọn 1 tuần rồi mới quay lại","Hạn chế: chỉ làm ca sáng; loại trừ: chỉ làm ca chiều khi ít khách","Hai từ giống nhau, chỉ là mỗi bang gọi cùng một quy định theo một kiểu"],"What is the difference between \"restricting\" and \"excluding\" a staff member?",["Restricted: may work but not with exposed food or clean utensils; excluded: may not come to work","Restricted: stay home for 1 day; excluded: stay home for 1 full week, then come back","Restricted: work morning shifts only; excluded: work afternoon shifts only, when it's quieter","They mean the same thing; different states just use different names for the same rule"],"Bị hạn chế thì vẫn làm được việc như dọn bàn, đổ rác, nhưng không làm đồ ăn hở hay đụng ly, dụng cụ sạch. Bị loại trừ thì không được có mặt làm việc ở quán.","A restricted worker can still do jobs like busing or trash but not handle exposed food, clean cups or utensils. An excluded worker may not work in the establishment at all."],
["qa20","QT","BE","Nhóm triệu chứng nào nhân viên PHẢI báo cho quản lý?",["Ói, tiêu chảy, vàng da, đau họng kèm sốt, vết thương có mủ","Ói, đau đầu, mệt, ho nhẹ, sổ mũi do dị ứng","Tiêu chảy, đau lưng, mất ngủ, đau răng, mỏi mắt","Sốt, cảm lạnh, nổi mụn, đau chân, chóng mặt"],"Which group of symptoms MUST a staff member report to the manager?",["Vomiting, diarrhea, jaundice, sore throat with fever, infected wound","Vomiting, headache, tiredness, mild cough, allergy runny nose","Diarrhea, back pain, poor sleep, toothache, tired eyes","Fever, common cold, pimples, sore feet, dizziness"],"Năm triệu chứng phải báo: ói, tiêu chảy, vàng da (vàng mắt), đau họng kèm sốt, và vết thương hở có mủ ở tay, cổ tay hoặc chỗ lộ ra ngoài.","Five symptoms must be reported: vomiting, diarrhea, jaundice (yellow skin or eyes), sore throat with fever, and an infected, pus-filled wound on the hands, wrists or exposed skin."],
["qa21","QT","BE","Bác sĩ báo bạn nhiễm Shigella nhưng bạn thấy khỏe, không có triệu chứng. Bạn làm gì?",["Vẫn phải báo quản lý vì đây là bệnh trong Big 6","Đi làm bình thường vì không có triệu chứng gì","Chỉ báo nếu bắt đầu bị tiêu chảy","Tự uống thuốc và không báo ai ở quán"],"Your doctor says you have Shigella, but you feel fine with no symptoms. What do you do?",["Still tell your manager, because it is one of the Big 6","Work as usual, since you have no symptoms at all","Only report it if you start having diarrhea","Take your medicine and don't tell anyone at work"],"Bị chẩn đoán nhiễm một bệnh trong Big 6 thì PHẢI báo quản lý, dù không có triệu chứng. Người không triệu chứng vẫn có thể lây bệnh qua đồ ăn. Quản lý sẽ báo sở y tế địa phương.","A Big 6 diagnosis MUST be reported to the manager even without symptoms, because people without symptoms can still spread it through food. The manager notifies the local health department."],
["qa22","QT","BE","Con bạn ở nhà vừa được chẩn đoán viêm gan A. Bạn vẫn khỏe. Bạn làm gì?",["Báo cho quản lý biết trước khi vào ca","Không cần báo vì người bệnh là con, không phải bạn","Chỉ báo nếu bạn bị vàng da","Đi làm và đeo găng là đủ"],"Your child at home was just diagnosed with hepatitis A. You feel fine. What do you do?",["Tell your manager before your shift","Nothing, because your child is sick, not you","Only report it if you get jaundice","Go to work and just wear gloves"],"Sống chung nhà với người bị chẩn đoán norovirus, viêm gan A, Shigella, E. coli sinh độc tố Shiga hoặc thương hàn (Salmonella Typhi) là bị phơi nhiễm, phải báo quản lý. Bạn có thể đã nhiễm mà chưa có triệu chứng.","Living with someone diagnosed with norovirus, hepatitis A, Shigella, Shiga toxin-producing E. coli or typhoid fever (Salmonella Typhi) is an exposure and must be reported to the manager. You could be infected before symptoms appear."],
["qa23","QT","BE","Sáng nay bạn bị đau họng và sốt. Quán phục vụ khách bình thường (không phải bệnh viện hay nhà dưỡng lão). Quản lý xử lý thế nào?",["Hạn chế: không làm đồ ăn hở, ly và dụng cụ sạch","Cho làm bình thường nếu đeo khẩu trang","Cho làm bình thường nếu uống thuốc hạ sốt","Không cần làm gì vì chỉ là cảm"],"This morning you have a sore throat and a fever. The café serves the general public (not a hospital or nursing home). What does the manager do?",["Restrict you from exposed food, clean cups and utensils","Let you work normally if you wear a mask","Let you work normally if you take fever medicine","Nothing, since it's just a cold"],"Đau họng kèm sốt thì bị hạn chế, không làm việc với đồ ăn hở. Nếu quán chủ yếu phục vụ người dễ bị bệnh (bệnh viện, nhà dưỡng lão) thì bị loại trừ.","A sore throat with fever means restriction from working with exposed food. If the place mainly serves a highly susceptible population (hospital, nursing home), the worker is excluded."],
["qa24","QT","BE","Bạn có một mụn nhọt sưng có mủ ở cẳng tay. Bạn làm gì trước khi vào ca?",["Báo quản lý và băng kín bằng băng không thấm nước","Nặn mủ ra ở nhà rồi đi làm như bình thường","Để hở cho vết thương mau khô và lành","Xịt nước rửa tay khô lên trước khi vào ca là đủ"],"You have a swollen boil with pus on your forearm. What do you do before your shift?",["Tell your manager and cover it with a waterproof bandage","Squeeze out the pus at home, then go to work as usual","Leave it uncovered so it can dry out and heal faster","Just spray hand sanitizer on it before you start work"],"Vết thương có mủ chứa vi khuẩn Staph có thể làm bệnh qua đồ ăn. Phải báo quản lý và băng kín bằng băng không thấm nước; nếu ở tay thì băng rồi đeo găng.","Pus contains Staph bacteria that can make people sick through food. Report it and cover it with a waterproof bandage; on the hand, bandage it and wear a glove."],
["qa25","QT","BE","Theo FDA Food Code, nhân viên bị ói hoặc tiêu chảy (không có chẩn đoán bệnh cụ thể) được quay lại làm khi nào?",["Khi hết triệu chứng ít nhất 24 giờ","Ngay khi thấy đỡ","Sau 2 giờ không ói","Khi đã uống thuốc cầm tiêu chảy"],"Under the FDA Food Code, when can a worker who had vomiting or diarrhea (with no specific diagnosis) come back to work?",["After being symptom-free for at least 24 hours","As soon as they feel better","After 2 hours without vomiting","Once they have taken anti-diarrhea medicine"],"Phải hết ói và tiêu chảy ít nhất 24 giờ, hoặc có giấy bác sĩ xác nhận triệu chứng không phải do bệnh lây, mới quay lại. Thuốc cầm tiêu chảy chỉ che triệu chứng, không làm hết lây. Nếu sau đó được chẩn đoán norovirus thì ở Massachusetts phải nghỉ 72 giờ.","The worker must be free of vomiting and diarrhea for at least 24 hours, or have a doctor's note saying the symptoms come from a non-infectious condition, before returning. Anti-diarrhea medicine hides symptoms but doesn't stop the spread. If norovirus is later diagnosed, Massachusetts requires 72 hours."],
["qa26","QT","BE","Ở Massachusetts, nhân viên được chẩn đoán nhiễm norovirus phải nghỉ ít nhất bao lâu?",["72 giờ sau khi hết triệu chứng","24 giờ sau khi hết triệu chứng","48 giờ kể từ lúc bắt đầu bệnh","Đến khi thấy khỏe"],"In Massachusetts, how long must a worker diagnosed with norovirus stay out at least?",["72 hours after symptoms end","24 hours after symptoms end","48 hours from when the illness started","Until they feel well"],"Massachusetts nghiêm hơn FDA: nhân viên xét nghiệm dương tính norovirus bị loại trừ khỏi việc làm đồ ăn 72 giờ sau khi hết triệu chứng, hoặc 72 giờ sau ngày lấy mẫu xét nghiệm, tính theo mốc nào đến sau. Người vừa khỏi vẫn còn thải virus.","Massachusetts is stricter than the FDA: a worker who tests positive for norovirus is excluded from food handling for 72 hours after symptoms end or 72 hours after the positive sample was given, whichever is later. People keep shedding the virus after they feel better."],
["qa27","QT","BE","Một khách bị ói ngay trong khu ngồi của quán. Việc đầu tiên bạn làm là gì?",["Cho mọi người tránh xa khu đó và báo quản lý","Lấy khăn lau quầy lau sạch ngay lập tức","Lấy cây lau nhà ra lau sạch ngay lập tức","Rải một lớp đá lên trên cho bớt mùi"],"A customer vomits in the café's seating area. What do you do first?",["Keep everyone away from the area and alert the manager","Wipe it up right away with the counter cloth","Get the mop out and clean it up right away","Cover it with a layer of ice to cut the smell"],"Chất ói có thể chứa norovirus và bắn ra xa. Trước hết chặn khu vực, không cho ai lại gần, báo quản lý, rồi dọn theo quy trình bằng bộ dụng cụ xử lý chất ói.","Vomit may carry norovirus and spreads widely. First block off the area so no one goes near, alert the manager, then clean it up following the plan with the cleanup kit."],
["qa28","QT","BE","Khi dọn chất ói hoặc tiêu chảy trong quán, bạn dùng gì từ bộ dụng cụ xử lý (cleanup kit)?",["Găng dùng một lần, khẩu trang, tạp dề dùng một lần, bột thấm hút và túi rác kín","Chỉ cần găng cao su rửa chén và khăn giấy, rồi bỏ khăn vào thùng rác","Khăn lau quầy và xô nước sát khuẩn đang dùng ở quầy bar","Cây lau nhà thường và xô nước xà phòng, lau đi lau lại nhiều lần"],"When cleaning up vomit or diarrhea in the café, what do you use from the cleanup kit?",["Disposable gloves, a mask, a disposable apron, absorbent powder and a sealable trash bag","Just the dishwashing gloves and paper towels, then toss the towels in the trash","A counter cloth and the sanitizer bucket already in use at the bar","The regular mop and a bucket of soapy water, mopping several times"],"Mặc đồ bảo hộ dùng một lần, rắc bột thấm hút, xúc bỏ vào túi kín, rồi khử trùng. Không dùng khăn lau quầy hay cây lau nhà thường vì sẽ lan virus ra chỗ khác.","Wear disposable protective gear, cover it with absorbent powder, scoop it into a sealed bag, then disinfect. Never use counter cloths or the regular mop, which spread the virus elsewhere."],
["qa29","QT","BE","Sau khi xúc chất ói đi, sao không dùng nước sát khuẩn trong xô lau quầy để xử lý chỗ đó?",["Nồng độ đó quá yếu để diệt norovirus; phải dùng chất khử trùng của bộ kit","Vì nước sát khuẩn làm hỏng sàn, phải dùng nước xà phòng thay vào","Vì nước sát khuẩn để lại mùi, khách sẽ ngửi thấy","Thật ra dùng được, chỉ cần lau hai lần rồi để khô tự nhiên"],"After scooping up vomit, why not use the sanitizer from the counter bucket on that spot?",["It's too weak to kill norovirus; use the kit's stronger disinfectant","Sanitizer damages the floor, so use soapy water instead","Sanitizer leaves a smell that customers will notice","You actually can; just wipe twice and let it air-dry"],"Nước sát khuẩn cho bề mặt tiếp xúc đồ ăn (ví dụ clo 50–100 ppm, hoặc quat theo nhãn) không đủ diệt norovirus. Phải dùng chất khử trùng diệt được norovirus (ví dụ clo khoảng 1000–5000 ppm, hoặc sản phẩm trong danh sách EPA List G), pha và để đúng thời gian ghi trên nhãn.","Food-contact sanitizer (e.g. chlorine at 50–100 ppm, or quat per its label) is not strong enough for norovirus. Use a disinfectant that kills norovirus (e.g. chlorine at about 1000–5000 ppm, or a product on EPA List G), mixed and left on for the time the label says."],
["qa30","QT","BE","Khách bị ói ở bàn gần quầy bánh đang bày bánh tart trứng không đậy. Bánh đó xử lý thế nào?",["Bỏ hết bánh để hở gần khu đó","Bán tiếp vì khách ói ở bàn, không ói vào bánh","Lau mặt bánh rồi bán","Cất vào tủ lạnh, mai bán"],"A customer vomits at a table near the pastry case where egg tarts sit uncovered. What do you do with those tarts?",["Throw out all exposed food near that area","Keep selling them, since the vomit didn't land on them","Wipe the tops and sell them","Put them in the fridge and sell them tomorrow"],"Chất ói bắn thành giọt nhỏ bay xa, có thể dính vào đồ ăn mà mắt không thấy. Đồ ăn để hở gần khu đó phải bỏ.","Vomit spreads as tiny droplets that can land on food without being seen. Exposed food near the area must be thrown away."],
["qa31","QT","BE","Một khách gọi điện nói họ bị đau bụng, ói sau khi uống đồ ở quán hôm qua. Bạn làm gì?",["Lịch sự ghi lại tên, số điện thoại, món, giờ mua, triệu chứng rồi báo quản lý","Giải thích lịch sự rằng quán mình chưa bao giờ làm khách bị bệnh","Xin lỗi, hứa hoàn tiền và xác nhận chắc chắn là do đồ uống của quán","Khuyên khách đi khám bác sĩ, không cần ghi lại thông tin gì"],"A customer calls saying they got stomach pain and vomited after a drink from the café yesterday. What do you do?",["Politely note their name, phone, item, time bought and symptoms, then tell the manager","Politely explain that the café has never made anyone sick","Apologize, promise a refund and confirm it was definitely the café's drink","Advise them to see a doctor; no need to write anything down"],"Không cãi và cũng không nhận lỗi. Ghi đủ thông tin và báo quản lý ngay để kiểm tra món đó, nhân viên và báo sở y tế nếu cần.","Don't argue and don't admit fault. Record the details and tell the manager right away so they can check the item and staff and contact the health department if needed."],
["qt13","QT","TN","\"Vùng nguy hiểm\" nhiệt độ, nơi vi khuẩn dễ sinh sôi, là khoảng nào?",["41°F đến 135°F (5°C đến 57°C)","0°F đến 32°F (-18°C đến 0°C)","32°F đến 41°F (0°C đến 5°C)","135°F đến 212°F (57°C đến 100°C)"],"What is the temperature danger zone, where bacteria grow well?",["41°F to 135°F (5°C to 57°C)","0°F to 32°F (-18°C to 0°C)","32°F to 41°F (0°C to 5°C)","135°F to 212°F (57°C to 100°C)"],"Vi khuẩn sinh sôi trong khoảng 41°F đến 135°F, nhanh nhất là từ 70°F đến 125°F. Đồ lạnh giữ ở 41°F trở xuống, đồ nóng giữ ở 135°F trở lên.","Bacteria grow between 41°F and 135°F, fastest between 70°F and 125°F. Keep cold food at 41°F or below and hot food at 135°F or above."],
["qt14","QT","TN","Sữa, kem tươi và kem muối phải giữ lạnh ở nhiệt độ tối đa bao nhiêu?",["41°F (5°C)","32°F (0°C)","50°F (10°C)","60°F (16°C)"],"What is the warmest temperature milk, cream and salted cream can be kept at?",["41°F (5°C)","32°F (0°C)","50°F (10°C)","60°F (16°C)"],"Đồ lạnh cần kiểm soát nhiệt độ (TCS) phải giữ ở 41°F (5°C) trở xuống.","Cold TCS foods must be held at 41°F (5°C) or below."],
["qt15","QT","TN","Đồ ăn giữ nóng (ví dụ nồi nước dùng) phải ở nhiệt độ tối thiểu bao nhiêu?",["135°F (57°C)","100°F (38°C)","120°F (49°C)","110°F (43°C)"],"What is the minimum temperature for hot-held food, like a pot of broth?",["135°F (57°C)","100°F (38°C)","120°F (49°C)","110°F (43°C)"],"Theo FDA Food Code, đồ nóng phải giữ ở 135°F (57°C) trở lên.","Under the FDA Food Code, hot food must be held at 135°F (57°C) or above."],
["qt16","QT","TN","Một hộp kem muối lấy từ tủ lạnh (41°F) ra quầy, có ghi giờ lấy ra, và không có đá hay tủ lạnh. Để ngoài tối đa bao lâu thì phải bỏ?",["4 giờ","30 phút","8 giờ","Hết ngày vẫn dùng được"],"A container of salted cream was taken out of the fridge at 41°F and marked with the time, then kept on the counter with no ice or fridge. What is the longest it can sit out before it must be thrown away?",["4 hours","30 minutes","8 hours","It's fine until the end of the day"],"Đồ TCS để ngoài không kiểm soát nhiệt độ quá 4 giờ phải bỏ. Nếu không biết đã để bao lâu thì cũng bỏ.","TCS food left out without temperature control must be thrown away after 4 hours. If you don't know how long it's been out, throw it away."],
["qt17","QT","TN","Nấu xong nồi nước dùng cần làm nguội. Quy định làm nguội 2 giai đoạn là gì?",["135°F xuống 70°F trong 2 giờ, rồi 70°F xuống 41°F trong 4 giờ tiếp theo","Để nguội tự nhiên trên quầy qua đêm rồi mới cất tủ","135°F xuống 41°F trong tổng cộng 12 giờ, nhanh chậm tùy ý","Cho nguyên nồi nóng vào tủ lạnh ngay, không cần theo dõi"],"You need to cool a pot of broth. What is the two-stage cooling rule?",["135°F to 70°F within 2 hours, then 70°F to 41°F within the next 4 hours","Let it cool on the counter overnight, then move it into the fridge","135°F to 41°F within 12 hours in total, at any pace","Put the whole hot pot in the fridge right away and don't check it"],"Làm nguội từ 135°F xuống 70°F trong 2 giờ đầu, rồi xuống 41°F trong 4 giờ tiếp theo. Chia nhỏ ra khay nông hoặc dùng bể nước đá để nguội nhanh.","Cool from 135°F to 70°F within 2 hours, then to 41°F within the next 4 hours. Use shallow pans or an ice bath to cool faster."],
["qt18","QT","TN","Hâm lại đồ ăn đã nấu và làm lạnh để giữ nóng, phải đạt nhiệt độ nào?",["165°F (74°C) trong vòng 2 giờ","135°F trong vòng 6 giờ","120°F là đủ","Chỉ cần ấm tay"],"When reheating cooked and chilled food for hot holding, what temperature must it reach?",["165°F (74°C) within 2 hours","135°F within 6 hours","120°F is enough","Just warm to the touch"],"Hâm lại để giữ nóng phải đạt 165°F trong 15 giây, trong vòng 2 giờ. Không dùng nồi giữ nóng hay tủ hâm để hâm lại.","Reheat for hot holding to 165°F for 15 seconds within 2 hours. Don't use hot-holding equipment to reheat."],
["qt19","QT","TN","Đồ TCS pha sẵn (ví dụ kem muối) giữ ở 41°F được dùng tối đa bao nhiêu ngày, tính cả ngày làm?",["7 ngày","3 ngày","14 ngày","30 ngày"],"Ready-to-eat TCS food made in house and held at 41°F can be kept for at most how many days, counting the day it was made?",["7 days","3 days","14 days","30 days"],"Đồ ăn sẵn TCS giữ ở 41°F được dùng tối đa 7 ngày, ngày làm tính là ngày 1. Phải dán nhãn tên món và ngày.","Ready-to-eat TCS food held at 41°F can be kept up to 7 days, with the day it was made as day 1. Label it with the name and date."],
["qt20","QT","TN","Cách nào ĐÚNG để rã đông đồ đông lạnh?",["Trong tủ lạnh","Để trên quầy ở nhiệt độ phòng","Ngâm trong nước ấm","Để ngoài trời"],"Which is a CORRECT way to thaw frozen food?",["In the refrigerator","On the counter at room temperature","Soaking in warm water","Outside"],"Rã đông trong tủ lạnh, dưới vòi nước lạnh chảy (70°F trở xuống), trong lò vi sóng nếu nấu ngay, hoặc rã trong lúc nấu. Không rã đông ở nhiệt độ phòng.","Thaw in the fridge, under cold running water (70°F or below), in the microwave if cooked right away, or as part of cooking. Never at room temperature."],
["qt21","QT","TN","Để kiểm tra nhiệt kế que có chính xác không, bạn cắm vào ly nước đá. Nhiệt kế đúng phải chỉ bao nhiêu?",["32°F (0°C)","41°F (5°C)","0°F (-18°C)","50°F (10°C)"],"To check a probe thermometer, you put it in a cup of ice water. What should it read?",["32°F (0°C)","41°F (5°C)","0°F (-18°C)","50°F (10°C)"],"Nước đá đang tan ở 32°F (0°C). Nếu nhiệt kế lệch thì chỉnh lại (hiệu chuẩn) trước khi dùng.","Ice water is 32°F (0°C). If the thermometer is off, calibrate it before use."],
["qt22","QT","TN","Đo nhiệt độ một khay đồ ăn, bạn cắm nhiệt kế vào đâu?",["Phần dày nhất, ở giữa","Sát mép khay, chỗ mỏng","Chỉ chạm bề mặt trên","Đo không khí phía trên"],"Where do you put the thermometer to check a pan of food?",["Into the thickest part, in the center","Right at the thin edge of the pan","Just touching the top of the food","In the air just above the food"],"Phần dày nhất, ở giữa thường là chỗ nguội nhất (khi nấu) hoặc ấm nhất (khi làm lạnh), nên đo ở đó mới chính xác.","The thickest center part changes temperature last, so it gives the true reading."],
["qt23","QT","TN","Món nào sau đây là đồ cần kiểm soát thời gian và nhiệt độ (TCS)?",["Sữa tươi","Đường cát","Cà phê hạt khô","Bánh quy đóng gói"],"Which of these is a TCS (time/temperature control for safety) food?",["Fresh milk","Granulated sugar","Dry coffee beans","Packaged cookies"],"Đồ TCS là đồ ẩm, nhiều đạm, dễ sinh vi khuẩn: sữa, kem, trứng, thịt, cơm chín, giá, rau lá đã cắt, dưa cắt, cà chua cắt.","TCS foods are moist, protein-rich foods where bacteria grow: milk, cream, eggs, meat, cooked rice, sprouts, cut leafy greens, cut melon and cut tomatoes."],
["qt24","QT","TN","Thịt gà phải nấu đến nhiệt độ bên trong tối thiểu là bao nhiêu?",["165°F (74°C)","135°F (57°C)","145°F (63°C)","120°F (49°C)"],"What is the minimum internal cooking temperature for chicken?",["165°F (74°C)","135°F (57°C)","145°F (63°C)","120°F (49°C)"],"Gia cầm nấu tới 165°F (74°C), chỉ cần đạt nhiệt độ là đủ (dưới 1 giây). Thịt xay 155°F trong 17 giây. Thịt nguyên miếng và cá 145°F trong 15 giây.","Poultry: 165°F (74°C), instantaneous (less than 1 second). Ground meat: 155°F for 17 seconds. Whole cuts of meat and fish: 145°F for 15 seconds."],
["qt25","QT","TN","Thịt heo hoặc bò xay (ví dụ làm nhân) phải nấu tới nhiệt độ bên trong tối thiểu bao nhiêu?",["155°F (68°C)","135°F (57°C)","165°F (74°C)","125°F (52°C)"],"What is the minimum internal cooking temperature for ground pork or beef?",["155°F (68°C)","135°F (57°C)","165°F (74°C)","125°F (52°C)"],"Thịt xay nấu tới 155°F (68°C) trong 17 giây, vì khi xay vi khuẩn từ bề mặt trộn vào bên trong.","Ground meat is cooked to 155°F (68°C) for 17 seconds, because grinding mixes surface bacteria into the meat."],
["qb01","QT","TN","Bạn cắt sẵn mấy loại trái cây để trang trí ly. Loại nào sau khi cắt PHẢI giữ lạnh ở 41°F (5°C) trở xuống?",["Dưa hấu cắt miếng","Chuối còn nguyên vỏ","Xoài sấy dẻo","Dưa hấu nguyên trái chưa cắt"],"You prep fruit to garnish drinks. Which one MUST be kept at 41°F (5°C) or below once prepped?",["Cut watermelon","Whole bananas in the peel","Dried mango","A whole, uncut watermelon"],"Dưa cắt (dưa hấu, dưa lưới) là đồ TCS vì ruột ẩm, ít axit, vi khuẩn từ vỏ dễ dính vào khi cắt. Trái nguyên chưa cắt và trái sấy khô thì không phải TCS.","Cut melons like watermelon are TCS: the flesh is moist and low in acid, and germs from the rind get in when you cut. Whole uncut fruit and dried fruit are not TCS."],
["qb02","QT","TN","Bếp làm một hũ tỏi ngâm dầu (tỏi sống trộn dầu) để dùng dần. Bảo quản thế nào?",["Đậy kín, dán nhãn và giữ tủ lạnh ở 41°F trở xuống","Để trên kệ vì dầu không cho vi khuẩn sống","Để gần bếp cho dầu khỏi đông","Để ngoài quầy, mỗi tuần làm mới một lần"],"The kitchen makes a jar of garlic in oil (raw garlic mixed with oil) to use over several days. How is it stored?",["Covered, labeled and refrigerated at 41°F or below","On the shelf, because oil stops bacteria from growing","Next to the stove so the oil doesn't harden","On the counter, made fresh once a week"],"Tỏi ngâm dầu là đồ TCS: dầu bịt kín không khí nên vi khuẩn gây ngộ độc botulism (C. botulinum) có thể phát triển nếu để ở nhiệt độ phòng. Phải giữ ở 41°F trở xuống.","Garlic in oil is a TCS food: the oil shuts out air, so the bacteria that cause botulism (C. botulinum) can grow at room temperature. Keep it at 41°F or below."],
["qb03","QT","TN","Bạn nấu xong nồi trân châu (boba) lúc 9:30 sáng, vớt ra để ở quầy bar không giữ nóng, không giữ lạnh, dùng theo quy định thời gian 4 giờ. Lúc nào phải bỏ phần còn lại?",["1:30 chiều","11:30 sáng","5:30 chiều","Hết ca tối mới bỏ"],"You finish cooking a pot of boba at 9:30 am and keep it at the bar with no heating or cooling, using the 4-hour time rule. When must the rest be thrown away?",["1:30 pm","11:30 am","5:30 pm","At the end of the night shift"],"Dùng thời gian thay nhiệt độ (time as a public health control) thì tối đa 4 giờ tính từ lúc đồ ra khỏi nhiệt độ kiểm soát: 9:30 + 4 giờ = 1:30 chiều. Ghi giờ bỏ lên hộp, quá giờ là bỏ. Ở Massachusetts, quán chỉ được dùng quy định 4 giờ khi đã có quy trình viết sẵn nộp cho Sở Y tế địa phương (Board of Health).","Using time as a public health control allows at most 4 hours from when the food leaves temperature control: 9:30 + 4 hours = 1:30 pm. Write the discard time on the container and throw it out when the time is up. In Massachusetts, the café may use the 4-hour rule only with written procedures submitted to the local Board of Health."],
["qb04","QT","TN","Bánh tart trứng nướng mỗi sáng có nhân trứng sữa. Cách bày bán nào ĐÚNG?",["Giữ tủ mát 41°F trở xuống, hoặc để ngoài tối đa 4 giờ có ghi giờ bỏ","Bánh đã nướng chín nên để ngoài cả ngày cũng được","Để ngoài đến tối, bánh nào còn thì cho vào tủ bán hôm sau","Để trong tủ kính có đèn cho ấm là đủ"],"Egg tarts are baked every morning and have an egg-and-milk custard filling. Which way of displaying them is CORRECT?",["Keep them chilled at 41°F or below, or out for at most 4 hours with a discard time","They're fully baked, so they can sit out all day","Leave them out until evening, then refrigerate leftovers for tomorrow","A lit display case keeping them warm is enough"],"Nhân trứng sữa ẩm và nhiều đạm nên bánh tart trứng là đồ TCS. Hoặc giữ lạnh 41°F trở xuống (hay nóng 135°F trở lên), hoặc dùng quy định 4 giờ có ghi giờ bỏ, và không được cất lại vào tủ. Ở Massachusetts, quán chỉ được dùng quy định 4 giờ khi đã có quy trình viết sẵn nộp cho Sở Y tế địa phương (Board of Health).","The moist egg-and-milk custard makes egg tarts a TCS food. Either hold them at 41°F or below (or 135°F or above), or use the 4-hour time rule with a written discard time and never put them back in the fridge. In Massachusetts, the café may use the 4-hour rule only with written procedures submitted to the local Board of Health."],
["qb05","QT","TN","Bạn ủ xong một mẻ cold brew (cà phê ủ lạnh) để bán trong tuần. Bảo quản thế nào là đúng?",["Đậy kín, dán nhãn ngày làm, giữ tủ lạnh 41°F trở xuống","Để trên quầy bar ở nhiệt độ phòng cho tiện rót","Để trong thùng đá chung với đá pha nước cho lạnh","Cho vào bình không nắp trong tủ lạnh để cà phê thở"],"You just finished a batch of cold brew to sell this week. How should it be stored?",["Covered, labeled with the date made, in the fridge at 41°F or below","On the bar counter at room temperature so it's easy to pour","Sitting in the ice bin with the drink ice so it stays cold","In an open pitcher in the fridge so the coffee can breathe"],"Cold brew và cốt cà phê pha sẵn nên giữ lạnh, đậy kín và ghi ngày để dùng trước hết (FIFO). Không bao giờ để đồ ăn uống trong thùng đá dùng cho khách.","Cold brew and coffee concentrate should be kept cold, covered and dated so the oldest is used first (FIFO). Never put food or containers in the ice used for drinks."],
["qb06","QT","TN","Giá đỗ (giá sống) dùng kèm món ăn thuộc loại nào?",["Đồ TCS, phải giữ lạnh 41°F trở xuống","Rau củ khô, để kệ được","Chỉ cần rửa sạch là để ngoài được","Chỉ cần giữ lạnh khi đã nấu chín"],"Raw bean sprouts served with dishes are which kind of food?",["TCS food that must be kept at 41°F or below","A dry vegetable that can be shelved","Fine at room temperature once washed","Only needs to be chilled after cooking"],"Giá sống là đồ TCS: hạt nảy mầm trong môi trường ấm và ẩm nên vi khuẩn như Salmonella, E. coli dễ phát triển. Rau lá đã cắt (xà lách cắt) cũng vậy.","Raw sprouts are TCS: seeds sprout in warm, moist conditions where bacteria like Salmonella and E. coli grow. Cut leafy greens like cut lettuce are TCS too."],
["qb07","QT","TN","Nồi cơm đang để chế độ giữ ấm. Lúc 12 giờ đo được 150°F, đến 2 giờ chiều đo chỉ còn 118°F. Bạn làm gì?",["Báo quản lý, hâm lại lên 165°F trong 15 giây rồi giữ nóng từ 135°F trở lên","Cứ bán tiếp vì cơm vẫn còn ấm và mới nấu sáng nay","Cho thêm cơm mới nấu vào nồi cho cả nồi nóng lên lại","Tắt nồi, để nguội trên quầy rồi cất vào tủ lạnh"],"The rice cooker is on keep-warm. At 12:00 it read 150°F; at 2:00 pm it reads only 118°F. What do you do?",["Tell the manager, reheat it to 165°F for 15 seconds, then hold it at 135°F or above","Keep serving it; the rice is still warm and was only cooked this morning","Add freshly cooked rice so the whole pot heats back up","Turn it off, let it cool on the counter, then refrigerate it"],"Cơm chín là đồ TCS (vi khuẩn Bacillus cereus). Dưới 135°F là vào vùng nguy hiểm; vì lần đo trước chỉ cách 2 giờ nên còn hâm lại được: lên 165°F trong 15 giây. Không biết để bao lâu hoặc đã quá 4 giờ thì bỏ.","Cooked rice is TCS (Bacillus cereus). Below 135°F it's in the danger zone; since the last good check was only 2 hours ago, it can be reheated to 165°F for 15 seconds. If you don't know how long, or it's been 4 hours or more, throw it out."],
